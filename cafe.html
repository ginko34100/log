<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5A3E2B">
<title>파도와 열매</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
body {
  font-family:'Jua', sans-serif;
  background: linear-gradient(180deg, #FFE9C7 0%, #FBDCB0 45%, #F3CD9A 100%);
  color:#4A2E1B;
  touch-action: manipulation;
  position: fixed; top:0; left:0; width:100%;
  /* 인앱 브라우저(인스타 등)에서 100%가 실제 화면보다 커지는 문제 방지:
     지원되는 가장 안전한 단위가 마지막에 적용됨 (svh = 항상 보이는 최소 영역) */
  height: 100vh;
  height: 100dvh;
  height: 100svh;
  height: var(--vh, 100svh); /* JS가 실측한 픽셀값이 최우선 */
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
/* 게임 본체 래퍼 — 셰이크는 여기에만 적용 (fixed 좌표계 오염 방지) */
#app {
  height:100%;
  display:flex; flex-direction:column;
}
#app.shake { animation: shake .35s; }
@keyframes shake {
  0%,100%{transform:none}
  20%{transform:translate(-5px,2px)}
  40%{transform:translate(4px,-3px)}
  60%{transform:translate(-3px,2px)}
  80%{transform:translate(2px,-1px)}
}

/* SVG 아이콘 공통 */
.ic { width:1em; height:1em; display:inline-block; vertical-align:-0.12em; }
.ic-lg { width:1.25em; height:1.25em; vertical-align:-0.2em; }

/* ───────── 상단 HUD ───────── */
#hud {
  display:flex; align-items:center; gap:8px;
  padding: 10px 12px 6px;
}
.pill {
  background:#fff;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 15px;
  box-shadow: 0 3px 0 rgba(90,62,43,.25);
  display:flex; align-items:center; gap:5px;
  white-space:nowrap;
}
.pill .num { color:#B0672C; }
#lives { display:flex; gap:3px; }
#lives .ic { width:17px; height:17px; }
.heart-on { fill:#F2685C; stroke:#C6483E; }
.heart-off { fill:#DCC9AB; stroke:#C4AE8D; }
#bookBtn, #sndBtn {
  background: linear-gradient(180deg,#FFD98E,#F5B85C);
  border:none; border-radius: 14px;
  width:44px; height:40px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 4px 0 #C68A3B;
  cursor:pointer;
}
#sndBtn { margin-left:auto; }
#bookBtn .ic, #sndBtn .ic { width:22px; height:22px; }
#bookBtn:active, #sndBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #C68A3B; }

/* ───────── 손님 카드 ───────── */
#customerArea {
  margin: 2px 12px 0;
  background: linear-gradient(180deg, #FFF7EA, #FFEFD8);
  border-radius: 22px;
  box-shadow: 0 5px 0 rgba(90,62,43,.18), inset 0 -8px 0 rgba(198,138,59,.12);
  padding: 10px 14px 12px;
  display:flex; align-items:center; gap:12px;
  min-height: 118px;
  position:relative;
}
#charSlot { width:86px; height:96px; flex:none; position:relative; }

.char { position:absolute; inset:0; animation: bob 2.2s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
.char.enter { animation: slideIn .45s cubic-bezier(.2,1.4,.4,1) both, bob 2.2s ease-in-out .5s infinite; }
@keyframes slideIn { from { transform: translateX(-70px); opacity:0 } to { transform:none; opacity:1 } }
.char.leave { animation: slideOut .4s ease-in both; }
@keyframes slideOut { to { transform: translateX(-80px) rotate(-8deg); opacity:0 } }
.char .body {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:64px; height:46px;
  border-radius: 26px 26px 18px 18px;
}
.char .head {
  position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
  width:56px; height:52px; border-radius: 46%;
}
.char .hair { position:absolute; border-radius:50%; }
.char .eye {
  position:absolute; width:7px; height:9px; border-radius:50%;
  background:#3A2417; bottom:52px;
}
.char .eye.l { left:24px; } .char .eye.r { left:44px; }
.char .cheek {
  position:absolute; width:9px; height:6px; border-radius:50%;
  background:rgba(255,120,110,.45); bottom:47px;
}
.char .cheek.l { left:19px; } .char .cheek.r { left:50px; }
.char .mouth {
  position:absolute; width:12px; height:6px; left:32px; bottom:44px;
  border:2.5px solid #3A2417; border-top:none; border-radius:0 0 12px 12px;
}
.char.angry .mouth { border-radius:12px 12px 0 0; border-bottom:none; border-top:2.5px solid #3A2417; height:5px; bottom:43px; }
.char.angry .eye { height:5px; border-radius:3px; }

#bubbleWrap { flex:1; min-width:0; }
#bubble {
  background:#fff; border-radius:18px;
  padding: 8px 12px;
  box-shadow: 0 3px 0 rgba(90,62,43,.15);
  position:relative;
  animation: pop .3s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes pop { from{ transform:scale(.6); opacity:0 } to{ transform:scale(1); opacity:1 } }
#bubble::before {
  content:''; position:absolute; left:-8px; top:50%;
  border: 8px solid transparent; border-right-color:#fff;
  transform: translateY(-50%);
}
#orderName { font-size:19px; color:#7A4A1E; line-height:1.15; }
#orderType {
  display:inline-block;
  font-size:16px; color:#fff;
  padding: 3px 14px; border-radius:999px;
  margin-bottom:5px;
  text-shadow: 0 1px 0 rgba(0,0,0,.15);
  box-shadow: 0 3px 0 rgba(0,0,0,.14);
  animation: pop .35s cubic-bezier(.2,1.6,.4,1) both;
}
#orderType:empty { display:none; }
#orderType.dinein { background: linear-gradient(180deg,#6FD8A0,#45BE7C); }
#orderType.togo { background: linear-gradient(180deg,#FF9C8F,#F2685C); }
#orderHint { font-size:12.5px; color:#B08A64; margin-top:2px; display:flex; align-items:center; gap:3px; }

#patienceBar {
  height:12px; border-radius:999px; background:#EAD9BF;
  margin-top:8px; overflow:hidden;
  box-shadow: inset 0 2px 2px rgba(90,62,43,.2);
}
#patienceFill {
  height:100%; width:100%;
  border-radius:999px;
  background: linear-gradient(90deg,#7ED9A7,#5BC98B);
  transition: width .15s linear, background .3s;
}
#patienceFill.warn { background: linear-gradient(90deg,#FFC56E,#F5A742); }
#patienceFill.danger { background: linear-gradient(90deg,#FF8B7E,#F2685C); }

/* ───────── 제조 스테이지 ───────── */
#stage {
  flex:1; min-height:0;
  display:flex; align-items:center; justify-content:center;
  position:relative;
  overflow:hidden;
}
#stage::after {
  content:''; position:absolute; left:0; right:0; bottom:0; height:34%;
  background: linear-gradient(180deg,#C08A57 0 14px, #A9744F 14px);
  border-radius: 26px 26px 0 0;
  box-shadow: inset 0 6px 8px rgba(255,255,255,.25);
}

/* ───────── 매대 데코 (백카운터) ───────── */
#deco { position:absolute; inset:0; z-index:1; pointer-events:none; }

/* 컵 뒤 따뜻한 스포트라이트 */
#deco .glow {
  position:absolute; left:50%; bottom: calc(31% - 40px);
  width:230px; height:230px;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(255,214,150,.5), rgba(255,214,150,.18) 45%, transparent 68%);
}

/* 제주 바다 창문 (와이드, 모래사장 포함) */
.window {
  position:absolute; top:6px; left:10px; right:10px;
  height:128px;
  background:#5A3A22; border-radius:18px;
  box-shadow: 0 5px 0 rgba(90,62,43,.28), inset 0 2px 0 rgba(255,255,255,.15);
}
.window .view {
  position:absolute; inset:7px; border-radius:12px; overflow:hidden;
  background: linear-gradient(180deg,
    #C9E9F7 0%, #E2F3FB 34%,
    #58AECB 34%, #3E8FB0 58%,
    #6BBFD9 58%, #57B2CE 72%,
    #F5E6C4 72%, #EFD9AC 100%);
}
/* 모래사장 조개/자갈 점 + 물거품 경계 */
.view .sand {
  position:absolute; left:0; right:0; bottom:0; height:28%;
  background:
    radial-gradient(circle at 12px 8px, rgba(255,255,255,.8) 1.6px, transparent 2.2px) 0 0/34px 16px,
    radial-gradient(circle at 5px 4px, rgba(198,160,110,.5) 1.3px, transparent 1.8px) 10px 6px/28px 14px;
}
.view .foam {
  position:absolute; left:-12px; right:-12px; top:69%; height:9px;
  background: radial-gradient(circle at 9px 0, rgba(255,255,255,.92) 6px, transparent 7px) 0 0/18px 9px repeat-x;
  animation: foamMove 5s ease-in-out infinite;
}
@keyframes foamMove { 0%,100% { transform:translateY(0); } 50% { transform:translateY(3px); } }
/* 모래 위 파라솔 */
.view .parasol { position:absolute; right:9%; bottom:6%; }
.view .parasol .pPole { position:absolute; left:12px; bottom:0; width:3px; height:22px; background:#A9744F; }
.view .parasol .pTop {
  position:absolute; left:0; bottom:18px; width:28px; height:13px;
  background: repeating-linear-gradient(90deg, #F2685C 0 6px, #FFFDF6 6px 12px);
  border-radius: 28px 28px 0 0 / 26px 26px 0 0;
}
.view .sun {
  position:absolute; top:9%; right:12%;
  width:18px; height:18px; border-radius:50%;
  background:#FFE9A8;
  box-shadow: 0 0 12px 4px rgba(255,233,168,.75);
}
.view .isle {
  position:absolute; top:26%; left:5%;
  width:70px; height:16px;
  background: linear-gradient(180deg,#9EC3A6,#7FA88B);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  opacity:.85;
}
.view .cloud {
  position:absolute; width:32px; height:9px;
  background:#FFFDF6; border-radius:10px;
  top:12%; left:-40px; opacity:.95;
  animation: cloudMove 24s linear infinite;
}
.view .cloud::before {
  content:''; position:absolute; width:15px; height:11px;
  background:#FFFDF6; border-radius:50%; top:-6px; left:7px;
}
.view .cloud.c2 { top:24%; animation-duration:34s; animation-delay:-14s; transform:scale(.75); }
@keyframes cloudMove { from { transform:translateX(0); } to { transform:translateX(300px); } }
.view .wave {
  position:absolute; left:-40px; right:-40px; height:3px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.7) 0 13px, transparent 13px 30px);
  border-radius:3px;
  animation: waveMove 6s linear infinite;
}
.view .wave.w1 { top:44%; }
.view .wave.w2 { top:56%; animation-duration:8.5s; animation-delay:-3s; opacity:.7; }
.view .wave.w3 { top:64%; animation-duration:7s; animation-delay:-1s; opacity:.5; }
@keyframes waveMove { from { transform:translateX(0); } to { transform:translateX(30px); } }
.view .boat {
  position:absolute; top:36%; left:56%;
  animation: boatBob 3.2s ease-in-out infinite;
}
@keyframes boatBob { 0%,100% { transform:translateY(0) rotate(-2deg); } 50% { transform:translateY(-2.5px) rotate(2deg); } }
.boat .hull { width:20px; height:7px; background:#A9744F; clip-path: polygon(0 0,100% 0,82% 100%,18% 100%); border-radius:2px; }
.boat .sail {
  position:absolute; bottom:7px; left:9px;
  width:11px; height:13px; background:#FFFDF6;
  clip-path: polygon(0 100%, 0 0, 100% 100%);
}
.window .barV {
  position:absolute; top:7px; bottom:7px; width:6px;
  background:#5A3A22; border-radius:3px; z-index:2;
}
.window .barV.v1 { left:33%; }
.window .barV.v2 { left:66%; }

/* 뒷줄 카운터 (장비가 올라가는 단) */
#deco .backBar {
  position:absolute; left:0; right:0; bottom:31%;
  height:12px;
  background: linear-gradient(180deg,#B67F4E,#8F6038);
  box-shadow: 0 4px 0 rgba(90,62,43,.22);
}

/* 에스프레소 머신 — 컵보다 크게 (가장 큰 장비) */
.machine { position:absolute; left:1%; bottom:calc(31% + 10px); width:92px; height:144px; }
.machine .mBody {
  position:absolute; inset:0 0 16px 0;
  background: linear-gradient(180deg,#D9D2C6,#AFA69A);
  border-radius: 16px 16px 8px 8px;
  box-shadow: inset 0 6px 0 rgba(255,255,255,.55), inset 0 -5px 0 rgba(90,62,43,.18);
}
.machine .mTop {
  position:absolute; top:10px; left:10px; right:10px; height:24px;
  background:#8C8478; border-radius:9px;
  box-shadow: inset 0 3px 0 rgba(255,255,255,.25);
}
.machine .mGauge {
  position:absolute; top:46px; left:11px; width:23px; height:23px;
  background:#FFF7EA; border:4px solid #8C8478; border-radius:50%;
}
.machine .mGauge::before {
  content:''; position:absolute; top:3px; left:9px; width:3px; height:9px;
  background:#C6483E; transform: rotate(35deg);
}
.machine .mHead {
  position:absolute; top:48px; right:13px; width:30px; height:26px;
  background:#8C8478; border-radius:6px 6px 9px 9px;
}
.machine .mHead::after {
  content:''; position:absolute; bottom:-12px; left:12px; width:10px; height:12px;
  background:#6E675D; border-radius:0 0 4px 4px;
}
.machine .mCup {
  position:absolute; bottom:20px; right:19px; width:28px; height:19px;
  background:#FFF7EA; border-radius: 3px 3px 11px 11px;
  box-shadow: inset 0 -4px 0 rgba(198,138,59,.35);
}
.machine .mTray {
  position:absolute; bottom:0; left:6px; right:6px; height:14px;
  background:#6E675D; border-radius: 5px;
  box-shadow: inset 0 3px 0 rgba(0,0,0,.2);
}

/* 그라인더 — 컵보다 크게 */
.grinder { position:absolute; left:calc(1% + 96px); bottom:calc(31% + 10px); width:48px; height:132px; }
.grinder .gHopper {
  position:absolute; top:0; left:6px; width:36px; height:34px;
  background: rgba(225,242,250,.55);
  border: 3px solid rgba(255,255,255,.78);
  border-radius: 10px 10px 15px 15px;
  overflow:hidden;
}
.grinder .gHopper::before {
  content:''; position:absolute; bottom:0; left:0; right:0; height:58%;
  background:#4A2C18;
  border-radius: 0 0 10px 10px;
}
.grinder .gBody {
  position:absolute; top:30px; left:0; width:48px; height:56px;
  background: linear-gradient(180deg,#8C8478,#6E675D);
  border-radius: 12px;
  box-shadow: inset 0 4px 0 rgba(255,255,255,.25);
}
.grinder .gBody::after {
  content:''; position:absolute; top:20px; right:8px; width:14px; height:14px;
  background:#5C564C; border:3px solid #AFA69A; border-radius:50%;
}
.grinder .gCup {
  position:absolute; bottom:14px; left:10px; width:28px; height:24px;
  background:#FFF7EA; border-radius: 4px 4px 9px 9px;
  box-shadow: inset 0 -4px 0 rgba(198,138,59,.35);
}
.grinder .gBase {
  position:absolute; bottom:0; left:3px; right:3px; height:12px;
  background:#5C564C; border-radius: 4px;
}

/* 원두통 — 컵과 비슷한 덩치 */
.canister { position:absolute; right:calc(1% + 58px); bottom:calc(31% + 10px); width:64px; height:100px; }
.canister .cBody {
  position:absolute; bottom:0; left:0; width:76px; height:92px;
  background: linear-gradient(180deg,#B96A4C,#96502F);
  border-radius: 14px;
  box-shadow: inset 0 6px 0 rgba(255,255,255,.25), inset -7px 0 0 rgba(0,0,0,.12);
}
.canister .cBand {
  position:absolute; bottom:30px; left:6px; right:6px; height:26px;
  background: rgba(255,250,240,.88);
  border-radius: 5px;
  font-size:13px; color:#96502F; text-align:center; line-height:26px;
  letter-spacing:1px;
}
.canister .cLid {
  position:absolute; top:4px; left:7px; width:62px; height:20px;
  background:#6B4526; border-radius: 10px 10px 5px 5px;
}
.canister .cLid::after {
  content:''; position:absolute; top:-9px; left:24px; width:14px; height:10px;
  background:#4A2A12; border-radius: 5px;
}

/* 소스 펌프병 3종 (작은 소품은 작아도 자연스러움) */
.pumps { position:absolute; right:1%; bottom:calc(31% + 10px); width:56px; height:62px; }
.pump {
  position:absolute; bottom:0; width:18px; height:46px;
  border-radius: 5px 5px 6px 6px;
  box-shadow: inset -3px 0 0 rgba(0,0,0,.14), inset 2px 2px 0 rgba(255,255,255,.3);
}
.pump::before {
  content:''; position:absolute; top:-8px; left:5px; width:8px; height:9px;
  background:#D9D2C6; border-radius: 2px 2px 0 0;
}
.pump::after {
  content:''; position:absolute; top:-14px; left:5px; width:14px; height:7px;
  background:#8C8478; border-radius: 2px 5px 2px 2px;
}
.pump .pLab {
  position:absolute; top:11px; left:2px; right:2px; height:14px;
  background: rgba(255,250,240,.85); border-radius: 3px;
}

/* ── 앞 카운터 카페 데코 ── */
/* 원목 간판 */
.sign {
  position:absolute; left:50%; bottom:9%;
  transform: translateX(-50%);
  background: linear-gradient(180deg,#8A5C38,#6E4426);
  border:3px solid #5A3A22; border-radius:10px;
  padding: 4px 14px;
  color:#F3DDBE; font-size:13.5px; letter-spacing:1.5px;
  box-shadow: 0 3px 0 rgba(0,0,0,.28);
}
.sign::before, .sign::after {
  content:''; position:absolute; top:-9px; width:3px; height:9px;
  background:#5A3A22;
}
.sign::before { left:22%; } .sign::after { right:22%; }
/* 카운터 모서리 꼬마전구 */
.fairy {
  position:absolute; left:4%; right:4%; bottom: calc(34% - 4px);
  height:8px; display:flex; justify-content:space-between;
  pointer-events:none;
}
.fairy i {
  width:7px; height:7px; border-radius:50%;
  background:#FFE9A8;
  box-shadow: 0 0 6px 2px rgba(255,233,168,.65);
  animation: twinkle 2.2s ease-in-out infinite;
}
.fairy i:nth-child(2n) { animation-delay: 1.1s; background:#FFD9C4; }
.fairy i:nth-child(3n) { animation-delay: .5s; }
@keyframes twinkle { 0%,100% { opacity:1; } 50% { opacity:.45; } }

/* 치즈 고양이 */
.cat { position:absolute; left:6%; bottom:2.5%; width:66px; height:60px; }
.cat .ctBody {
  position:absolute; bottom:0; left:10px; width:52px; height:32px;
  background:#F2B26B; border-radius:24px 24px 13px 13px;
  box-shadow: inset -5px -4px 0 rgba(190,120,50,.28);
}
.cat .ctStripe { position:absolute; width:5px; height:11px; background:#D98F42; border-radius:3px; bottom:14px; }
.cat .ctStripe.s1 { left:34px; } .cat .ctStripe.s2 { left:43px; }
.cat .ctHead {
  position:absolute; bottom:22px; left:0; width:40px; height:34px;
  background:#F2B26B; border-radius:46%;
  box-shadow: inset -4px -4px 0 rgba(190,120,50,.22);
}
.cat .ctEar {
  position:absolute; width:13px; height:12px; background:#F2B26B;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  bottom:52px;
}
.cat .ctEar.eL2 { left:3px; } .cat .ctEar.eR2 { left:24px; }
.cat .ctEar::after {
  content:''; position:absolute; left:3.5px; bottom:0;
  width:6px; height:6px; background:#F2A9C4;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}
.cat .ctEye {
  position:absolute; width:7px; height:4px; bottom:36px;
  border-bottom: 2.5px solid #3A2417; border-radius:0 0 8px 8px;
}
.cat .ctEye.eyL { left:8px; } .cat .ctEye.eyR { left:23px; }
.cat .ctNose {
  position:absolute; left:17px; bottom:32px;
  width:6px; height:4px; background:#E28B84;
  clip-path: polygon(50% 100%, 0 0, 100% 0);
  border-radius:2px;
}
.cat .ctTail {
  position:absolute; right:-8px; bottom:4px;
  width:26px; height:22px;
  border:6px solid #F2B26B; border-left:none; border-bottom:none;
  border-radius: 0 16px 0 0;
  transform-origin: left bottom;
  animation: tailWag 2.8s ease-in-out infinite;
}
@keyframes tailWag { 0%,100% { transform:rotate(0); } 50% { transform:rotate(-16deg); } }

/* 하얀 말티즈 */
.malt {
  position:absolute; right:6%; bottom:2.5%; width:60px; height:52px;
  animation: puppyBob 2.3s ease-in-out infinite;
}
@keyframes puppyBob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-2.5px); } }
.malt .mtBody {
  position:absolute; bottom:0; left:12px; width:46px; height:27px;
  background:#FFFDF6; border-radius:20px;
  box-shadow: inset -5px -4px 0 rgba(214,204,184,.5);
}
.malt .mtHead {
  position:absolute; bottom:16px; left:0; width:38px; height:33px;
  background:#FFFDF6; border-radius:50%;
  box-shadow: inset -4px -4px 0 rgba(214,204,184,.4);
}
.malt .mtEar {
  position:absolute; width:13px; height:19px; background:#F2EBDD;
  border-radius:50% 50% 60% 60%;
  bottom:24px;
}
.malt .mtEar.mL { left:-4px; transform:rotate(14deg); }
.malt .mtEar.mR { left:29px; transform:rotate(-14deg); }
.malt .mtTuft {
  position:absolute; left:11px; bottom:44px;
  width:16px; height:10px; background:#FFFDF6;
  border-radius:50% 50% 20% 20%;
}
.malt .mtEye { position:absolute; width:5px; height:6px; border-radius:50%; background:#3A2417; bottom:31px; }
.malt .mtEye.eyL { left:9px; } .malt .mtEye.eyR { left:24px; }
.malt .mtNose { position:absolute; left:16px; bottom:25px; width:7px; height:5px; background:#3A2417; border-radius:50%; }
.malt .mtTongue {
  position:absolute; left:18px; bottom:20px;
  width:5px; height:6px; background:#F2A9C4;
  border-radius:0 0 5px 5px;
}
.malt .mtTail {
  position:absolute; right:-5px; bottom:18px;
  width:14px; height:13px; background:#FFFDF6;
  border-radius:50% 50% 50% 20%;
  transform-origin: left bottom;
  animation: mtWag .6s ease-in-out infinite;
}
@keyframes mtWag { 0%,100% { transform:rotate(-8deg); } 50% { transform:rotate(14deg); } }

/* 좁은 화면에서는 장비 살짝 축소 (그래도 컵보다 크게 유지) */
@media (max-width: 385px) {
  .machine, .grinder { transform: scale(.8); transform-origin: left bottom; }
  .canister, .pumps { transform: scale(.8); transform-origin: right bottom; }
}

#cupWrap {
  position:relative; z-index:2;
  width: 96px; height: 130px;
  filter: drop-shadow(0 10px 8px rgba(74,46,27,.28));
}
/* 테이크아웃 컵: 뚜껑+빨대, 손잡이 없음 */
#lid {
  position:absolute; left:-5px; right:-5px; top:-12px; height:16px;
  background: linear-gradient(180deg,#FFFDF6,#E8DFC9);
  border-radius: 8px 8px 4px 4px;
  box-shadow: inset 0 -3px 0 rgba(150,130,100,.25);
  display:none; z-index:4;
}
#lid::after {
  content:''; position:absolute; top:-7px; left:50%; margin-left:-11px;
  width:22px; height:8px; background:#E8DFC9; border-radius:4px 4px 0 0;
}
#straw {
  position:absolute; left:58%; top:-46px;
  width:11px; height:44px;
  background: repeating-linear-gradient(45deg,#F2685C 0 6px,#FFF 6px 12px);
  border-radius: 5px;
  transform: rotate(8deg);
  display:none; z-index:5;
}
#cupWrap.togo #lid, #cupWrap.togo #straw { display:block; }
#cupWrap.togo #handle { display:none; }
#cupWrap.togo #whip { display:none; } /* 뚜껑 위 휘핑 방지 — 휘핑은 뚜껑 없이 */
#cupWrap.togo.hasWhip #lid, #cupWrap.togo.hasWhip #straw { display:none; }
#cupWrap.togo.hasWhip #whip { display:block; }
#whip {
  position:absolute; left:50%; transform:translateX(-50%);
  bottom: calc(100% - 24px);
  width: 86px; height: 50px;
  opacity:0; transition: opacity .25s, transform .25s;
  z-index:3; pointer-events:none;
}
#whip.on { opacity:1; }
#whip .blob { position:absolute; background:#FFFDF6; border-radius:50%; box-shadow: inset -4px -5px 0 rgba(210,190,160,.35); }
#whip .b1 { width:78px; height:31px; bottom:0; left:4px; }
#whip .b2 { width:50px; height:25px; bottom:16px; left:18px; }
#whip .b3 { width:26px; height:18px; bottom:32px; left:30px; }
#whip .cherry { width:13px; height:13px; background:#F2685C; border-radius:50%; position:absolute; bottom:43px; left:37px; box-shadow: inset -2px -3px 0 rgba(0,0,0,.12); }

#glass {
  position:absolute; inset:0;
  background: var(--cupBg, linear-gradient(105deg, rgba(255,255,255,.55), rgba(255,255,255,.18) 40%, rgba(255,255,255,.05) 60%, rgba(255,255,255,.3)));
  border: 4px solid var(--cupB, rgba(255,255,255,.85));
  border-top-width: 3px;
  border-radius: 14px 14px 30px 30px;
  clip-path: polygon(0 0, 100% 0, 92% 100%, 8% 100%);
  overflow:hidden;
  z-index:2;
}
#liquid {
  position:absolute; left:0; right:0; bottom:0;
  display:flex; flex-direction:column-reverse;
  transition: height .3s;
}
.layer {
  width:100%;
  transition: height .35s cubic-bezier(.3,1.3,.5,1);
  position:relative;
}
.layer::before {
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background: rgba(255,255,255,.22);
}
#foamLayer {
  position:absolute; left:0; right:0;
  height:0; transition: height .35s, bottom .35s;
  background: linear-gradient(180deg,#FFFDF4,#F6EBD2);
  border-radius: 0 0 40% 40% / 0 0 30% 30%;
}
.ice {
  position:absolute; width:30px; height:30px;
  background: linear-gradient(135deg, rgba(230,248,255,.95), rgba(180,225,245,.8));
  border-radius: 9px;
  box-shadow: inset 2px 3px 0 rgba(255,255,255,.9), inset -2px -3px 0 rgba(140,190,215,.5);
  animation: iceIn .4s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes iceIn { from { transform: translateY(-90px) rotate(-30deg); } }
#handle {
  position:absolute; right:-20px; top:26px;
  width:24px; height:44px;
  border: 7px solid var(--cupB, rgba(255,255,255,.85));
  border-left:none;
  border-radius: 0 26px 26px 0;
  z-index:1;
}
#cupLabel {
  position:absolute; top:100%; left:50%; transform:translateX(-50%);
  margin-top:14px; white-space:nowrap;
  font-size:13px; color:#8A5E38;
  background:rgba(255,255,255,.7); border-radius:999px; padding:2px 12px;
}

/* 재료가 버튼에서 컵으로 날아가는 볼 */
.flyBall {
  position:fixed; z-index:18;
  width:28px; height:28px; border-radius:50%;
  box-shadow:
    inset -3px -4px 0 rgba(0,0,0,.15),
    inset 2px 3px 0 rgba(255,255,255,.45),
    0 4px 8px rgba(74,46,27,.3);
  pointer-events:none;
}

.coinPop {
  position:absolute; z-index:6; font-size:22px; color:#B0672C;
  display:flex; align-items:center; gap:4px;
  text-shadow: 0 2px 0 rgba(255,255,255,.8);
  animation: coinUp 1s ease-out forwards; pointer-events:none;
  white-space:nowrap;
}
.coinPop .ic { width:22px; height:22px; filter: drop-shadow(0 2px 0 rgba(255,255,255,.8)); }
@keyframes coinUp { from{ transform:translate(-50%,0); opacity:1 } to{ transform:translate(-50%,-56px); opacity:0 } }

/* ───────── 하단 조작부 ───────── */
#controls {
  background:#FFF7EA;
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -5px 12px rgba(90,62,43,.15);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
}
/* 컵 자리 — 그라인더 옆 매대 빈자리. 위치는 래퍼가 담당(내부 애니메이션과 분리) */
#cupSpot {
  position:absolute; left:50%; bottom: calc(31% + 12px);
  transform: translateX(-50%);
  z-index:3; /* 장비와 겹쳐도 컵이 항상 앞 */
}

/* 하단 패널: 컵 고르기 ↔ 재료 만들기 전환 */
.hidden2 { display:none !important; }
#controls { min-height: 208px; display:flex; flex-direction:column; justify-content:flex-end; }
#pickPanel {
  display:flex; flex-direction:column; align-items:center; gap:10px;
  padding-bottom: 6px;
}
#brewPanel { animation: panelUp .28s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes panelUp { from { transform: translateY(30px); opacity:0 } to { transform:none; opacity:1 } }
.rackTitle {
  background:rgba(255,239,216,.9); border-radius:999px;
  padding:5px 16px; font-size:14px; color:#7A4A1E;
  box-shadow: 0 3px 0 rgba(90,62,43,.12);
}
/* 원목 컵 진열장 */
#cabinet {
  width:100%;
  background: linear-gradient(180deg,#8A5C38,#6E4426);
  border: 4px solid #5A3A22;
  border-radius: 16px;
  padding: 6px 6px 8px;
  box-shadow: inset 0 4px 10px rgba(0,0,0,.3), 0 4px 0 rgba(58,36,23,.4);
}
.shelfRow {
  display:flex; gap:4px; justify-content:center; align-items:flex-end;
  position:relative;
  padding: 8px 2px 12px;
}
.shelfRow::after {
  content:''; position:absolute; left:2px; right:2px; bottom:2px; height:9px;
  background: linear-gradient(180deg,#B67F4E,#8F6038);
  border-radius:4px;
  box-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.rackCup {
  font-family:inherit; border:none; cursor:pointer;
  background:transparent; border-radius:10px;
  padding: 4px 3px 0;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:10px; color:#F3DDBE;
  position:relative; z-index:1;
}
.rackCup:active { transform:translateY(2px); }
.rackCup.rare {
  animation: rareGlow 1.4s ease-in-out infinite;
  border-radius:12px;
}
@keyframes rareGlow {
  0%,100% { filter: drop-shadow(0 0 3px rgba(255,220,120,.7)); }
  50% { filter: drop-shadow(0 0 9px rgba(255,220,120,1)); }
}
.rackCup.rare .rareTag {
  position:absolute; top:-7px; right:-4px;
  background: linear-gradient(180deg,#FFE9A8,#E8B84B);
  color:#6B4526; font-size:9px;
  border-radius:999px; padding:1px 6px;
  box-shadow: 0 2px 0 rgba(90,62,43,.3);
  z-index:2;
}

/* 진열대 미니 컵 그래픽 */
.mini { position:relative; width:34px; height:42px; display:block; }
.mini .mBody2 {
  position:absolute; inset:5px 3px 0 3px;
  border:2.5px solid rgba(180,200,215,.95);
  border-radius:5px 5px 9px 9px;
  clip-path: polygon(0 0,100% 0,88% 100%,12% 100%);
  background: linear-gradient(105deg, rgba(255,255,255,.7), rgba(255,255,255,.2));
}
.mini .mHandle {
  position:absolute; right:-4px; top:13px; width:9px; height:14px;
  border:3px solid rgba(180,200,215,.95); border-left:none;
  border-radius:0 8px 8px 0;
}
.mini.togo .mBody2 {
  clip-path: polygon(4% 0,96% 0,86% 100%,14% 100%);
}
.mini.ms-tall .mBody2 { inset:3px 6px 0 6px; clip-path: polygon(2% 0,98% 0,86% 100%,14% 100%); }
.mini.ms-round .mBody2 { clip-path:none; border-radius: 8px 8px 13px 13px; }
.mini .mEars { position:absolute; top:-2px; left:0; right:0; height:10px; display:none; }
.mini.ms-cat .mEars, .mini.ms-bear .mEars, .mini.ms-frog .mEars { display:block; }
.mini .mEars i { position:absolute; width:10px; height:9px; }
.mini.ms-cat .mEars i { clip-path: polygon(50% 0,100% 100%,0 100%); }
.mini.ms-bear .mEars i, .mini.ms-frog .mEars i { border-radius:50%; }
.mini .mEars i:first-child { left:4px; }
.mini .mEars i:last-child { right:4px; }
.mini .mFace { position:absolute; top:17px; left:0; right:0; display:none; }
.mini.ms-cat .mFace, .mini.ms-bear .mFace, .mini.ms-frog .mFace { display:block; }
.mini .mFace b { position:absolute; width:3.5px; height:4.5px; border-radius:50%; background:#3A2417; }
.mini .mFace b.l { left:10px; } .mini .mFace b.r { right:10px; }
.mini.togo .mLid2 { position:absolute; top:0; left:1px; right:1px; height:7px; background:#E8DFC9; border-radius:3px; box-shadow: inset 0 -2px 0 rgba(150,130,100,.25); }
.mini.togo .mStraw2 {
  position:absolute; top:-7px; left:55%; width:5px; height:13px;
  background: repeating-linear-gradient(45deg,#F2685C 0 3px,#FFF 3px 6px);
  border-radius:2px; transform:rotate(8deg);
}
.ghostCup { position:fixed; z-index:19; pointer-events:none; margin:0; }

/* 컵 디자인은 --cupB/--cupBg 변수로 주입 */
#cupWrap.waiting { opacity:0; pointer-events:none; }
#cupWrap.togo #glass { border-radius: 8px 8px 18px 18px; }

/* ── 컵 모양 변형 ── */
#cupWrap.shape-tall #glass { inset:0 9px; clip-path: polygon(2% 0,98% 0,86% 100%,14% 100%); border-radius:10px 10px 20px 20px; }
#cupWrap.shape-tall #handle { top:38px; height:34px; }
#cupWrap.shape-round #glass { clip-path:none; border-radius: 22px 22px 38px 38px; }

/* ── 캐릭터 컵: 귀 ── */
#cupEars { position:absolute; left:0; right:0; top:-16px; height:24px; display:none; z-index:3; pointer-events:none; }
#cupEars i { position:absolute; width:26px; height:22px; background: var(--cupB); }
#cupEars i.eL { left:8px; } #cupEars i.eR { right:8px; }
#cupWrap.shape-cat #cupEars { display:block; }
#cupWrap.shape-cat #cupEars i { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
#cupWrap.shape-bear #cupEars { display:block; top:-14px; }
#cupWrap.shape-bear #cupEars i { border-radius:50%; width:24px; height:24px; }
#cupWrap.shape-frog #cupEars { display:block; top:-18px; }
#cupWrap.shape-frog #cupEars i {
  border-radius:50%; width:24px; height:24px;
  background:#FFFDF6; border:3.5px solid var(--cupB);
}
#cupWrap.shape-frog #cupEars i::after {
  content:''; position:absolute; width:8px; height:9px;
  background:#3A2417; border-radius:50%; left:7px; top:8px;
}

/* ── 캐릭터 컵: 얼굴 ── */
#cupFace { display:none; position:absolute; top:34%; left:0; right:0; height:30px; z-index:3; pointer-events:none; }
#cupWrap.hasFace #cupFace { display:block; }
#cupFace .fe { position:absolute; width:7px; height:9px; border-radius:50%; background:#3A2417; top:0; }
#cupFace .fe.l { left:31%; } #cupFace .fe.r { right:31%; }
#cupFace .fm {
  position:absolute; top:13px; left:50%; width:11px; height:5px; margin-left:-5.5px;
  border:2.5px solid #3A2417; border-top:none; border-radius:0 0 10px 10px;
}
#cupFace .fc { position:absolute; width:8px; height:5px; border-radius:50%; background:rgba(255,120,110,.5); top:9px; }
#cupFace .fc.l { left:20%; } #cupFace .fc.r { right:20%; }
/* 고양이 수염 */
#cupWrap.shape-cat #cupFace::before, #cupWrap.shape-cat #cupFace::after {
  content:''; position:absolute; top:6px; width:15px; height:2px;
  background:#3A2417; box-shadow: 0 6px 0 #3A2417;
}
#cupWrap.shape-cat #cupFace::before { left:2px; transform:rotate(6deg); }
#cupWrap.shape-cat #cupFace::after { right:2px; transform:rotate(-6deg); }
/* 곰 주둥이 */
#cupWrap.shape-bear #cupFace .fm { border-color:transparent; }
#cupWrap.shape-bear #cupFace::before {
  content:''; position:absolute; top:9px; left:50%; margin-left:-9px;
  width:18px; height:13px; background:#F6E8D2; border-radius:50%;
}
#cupWrap.shape-bear #cupFace::after {
  content:''; position:absolute; top:12px; left:50%; margin-left:-3px;
  width:6px; height:5px; background:#3A2417; border-radius:50%;
  z-index:1;
}

#ingredients {
  display:grid; grid-template-columns: repeat(5, 1fr);
  gap:8px; margin-bottom:10px;
}
.ing-btn {
  font-family:inherit; border:none; cursor:pointer;
  background:#fff; border-radius:16px;
  padding: 7px 2px 6px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  box-shadow: 0 4px 0 #E3CBA8;
  font-size:12px; color:#6B4526;
}
.ing-btn:active { transform:translateY(3px); box-shadow: 0 1px 0 #E3CBA8; }
.ing-icon {
  width:30px; height:30px; border-radius:50%;
  box-shadow: inset -3px -4px 0 rgba(0,0,0,.12), inset 2px 3px 0 rgba(255,255,255,.45);
}
#actions { display:flex; gap:10px; }
.act {
  font-family:inherit; border:none; cursor:pointer;
  border-radius:18px; font-size:19px; padding: 13px 0;
  color:#fff; text-shadow: 0 2px 0 rgba(0,0,0,.15);
}
#serveBtn {
  flex:2.2;
  background: linear-gradient(180deg,#6FD8A0,#45BE7C);
  box-shadow: 0 5px 0 #2E9560;
}
#trashBtn {
  flex:1;
  background: linear-gradient(180deg,#FF9C8F,#F2685C);
  box-shadow: 0 5px 0 #C6483E;
}
.act:active { transform:translateY(4px); box-shadow:none !important; }

/* 콤보 (리듬게임 이펙트) */
.comboPop {
  position:absolute; left:50%; top:26%;
  transform: translateX(-50%);
  z-index:7; pointer-events:none;
  font-size:30px; letter-spacing:1px;
  color:#57B2CE;
  text-shadow: 0 3px 0 rgba(255,255,255,.9), 0 5px 8px rgba(74,46,27,.25);
  animation: comboPunch .8s cubic-bezier(.2,1.5,.4,1) both;
  white-space:nowrap;
}
.comboPop.t2 { color:#E8A23C; font-size:34px; }
.comboPop.t3 {
  font-size:38px;
  background: linear-gradient(90deg,#F2685C,#F5B85C,#6FD8A0,#7FA8D9,#B58AD9);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:none;
  filter: drop-shadow(0 3px 0 rgba(255,255,255,.9)) drop-shadow(0 5px 8px rgba(74,46,27,.3));
}
@keyframes comboPunch {
  0% { transform: translateX(-50%) scale(.3) rotate(-6deg); opacity:0; }
  45% { transform: translateX(-50%) scale(1.22) rotate(2deg); opacity:1; }
  65% { transform: translateX(-50%) scale(1); }
  100% { transform: translateX(-50%) scale(1) translateY(-14px); opacity:0; }
}
.hitRing {
  position:absolute; z-index:6; pointer-events:none;
  border-radius:50%;
  border:4px solid rgba(245,184,92,.9);
  animation: ringOut .55s ease-out both;
}
.hitRing.gold { border-color:rgba(255,220,120,1); border-width:5px; }
@keyframes ringOut {
  from { width:30px; height:30px; margin:-15px; opacity:1; }
  to { width:150px; height:150px; margin:-75px; opacity:0; }
}

#toast {
  position:absolute; left:50%; top:12px; transform:translateX(-50%) scale(.8);
  background:rgba(74,46,27,.92); color:#FFEFD8;
  padding: 8px 18px; border-radius:999px; font-size:14.5px;
  opacity:0; transition: .25s; pointer-events:none; z-index:8;
  white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis;
}
#toast.show { opacity:1; transform:translateX(-50%) scale(1); }
#toast.good { background:rgba(46,149,96,.94); }
#toast.bad { background:rgba(198,72,62,.94); }

/* ───────── 파티클 캔버스 ───────── */
#fx {
  position:fixed; inset:0; z-index:15;
  pointer-events:none;
  width:100%; height:100%;
}

/* ───────── 레시피북 / 오버레이 ───────── */
.sheetBack {
  position:fixed; inset:0; background:rgba(58,36,23,.55);
  z-index:20; opacity:0; pointer-events:none; transition:.25s;
}
.sheetBack.open { opacity:1; pointer-events:auto; }
#recipeSheet {
  position:fixed; left:0; right:0; bottom:0; z-index:21;
  background:#FFF7EA; border-radius:26px 26px 0 0;
  padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .3s cubic-bezier(.3,1,.4,1);
  max-height: 72%; display:flex; flex-direction:column;
}
#recipeSheet.open { transform:none; }
#recipeSheet h3 { font-size:20px; color:#7A4A1E; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
#recipeList { overflow-y:auto; -webkit-overflow-scrolling:touch; }
.recipe {
  display:flex; align-items:center; gap:10px;
  padding:9px 4px; border-bottom:2px dashed #EAD9BF;
}
.recipe .dotRow { display:flex; gap:4px; flex:none; }
.recipe .dot { width:18px; height:18px; border-radius:50%; box-shadow: inset -2px -2px 0 rgba(0,0,0,.12); }
.recipe .info { flex:1; min-width:0; }
.recipe .rname { font-size:16px; color:#6B4526; }
.recipe .rIngs { font-size:12px; color:#B08A64; }
.recipe .pay { color:#B0672C; font-size:15px; flex:none; display:flex; align-items:center; gap:3px; }
.recipe.locked { opacity:.4; }

#overlay {
  position:fixed; inset:0; z-index:30;
  background: linear-gradient(180deg,#5A3E2B,#3A2417);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; text-align:center; padding:24px; color:#FFEFD8;
  transition: opacity .35s;
  overflow:hidden;
}
#overlay.hidden { opacity:0; pointer-events:none; }

/* 배경 영상 — 흐림/딤 처리 없이 원본 그대로 */
#bgVideo {
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit: cover;
  z-index:0;
  opacity:0;
  transition: opacity .8s ease;
}
#bgVideo.ready { opacity:1; }
/* 선명도 보정 — 대비/채도만 살짝, 블러 아님 */
#bgVideo { filter: contrast(1.08) saturate(1.12); }
/* 영상은 손대지 않고, 글자 쪽에만 외곽 그림자로 가독성 확보 */

}

    sizeArr = new Float32Array(MAXP);
    alpArr  = new Float32Array(MAXP);
    geo3.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    geo3.setAttribute('pcolor',   new THREE.BufferAttribute(colArr, 3));
    geo3.setAttribute('psize',    new THREE.BufferAttribute(sizeArr, 1));
    geo3.setAttribute('palpha',   new THREE.BufferAttribute(alpArr, 1));

    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthTest: false,
      depthWrite: false,
      vertexShader: `
        attribute vec3 pcolor;
        attribute float psize;
        attribute float palpha;
        varying vec3 vC;
        varying float vA;
        void main() {
          vC = pcolor;
          vA = palpha;
          gl_PointSize = psize;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        varying vec3 vC;
        varying float vA;
        void main() {
          gl_FragColor = vec4(vC, vA); // 사각 포인트 그대로 → 픽셀 느낌
        }`,
    });
    scene3.add(new THREE.Points(geo3, mat));
    glOK = true;
  } catch (e) {
    glOK = false;
  }
  return glOK;
}

function fxResize() {
  const r = fx.getBoundingClientRect();
  W = r.width; H = r.height;
  if (glOK) {
    renderer3.setSize(W, H, false);
    cam3.left = 0; cam3.right = W;
    cam3.top = 0;  cam3.bottom = H;
    cam3.updateProjectionMatrix();
  } else if (ctx2d) {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    fx.width = W * d; fx.height = H * d;
    ctx2d.setTransform(d,0,0,d,0,0);
    ctx2d.imageSmoothingEnabled = false;
  }
}

/* 파티클 생성 */
function emit(x, y, o) {
  if (reduceMotion) return;
  const n = o.count || 14;
  for (let i=0; i<n && P.length < MAXP; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (o.speed || 120) * (0.4 + Math.random() * 0.9);
    P.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp - (o.up || 0),
      g: o.g !== undefined ? o.g : 340,
      s: o.sizes ? rand(o.sizes) : 4 + Math.floor(Math.random()*4),
      rgb: hexToRGB(rand(o.colors)),
      baseA: o.baseA !== undefined ? o.baseA : 1,
      life: 0,
      max: (o.life || 0.7) * (0.7 + Math.random()*0.6),
      wob: o.wob || 0,
    });
  }
}

/* 메인 파티클 루프 */
const GS = 2; // 픽셀 그리드 스냅
let fxLast = performance.now();
function fxLoop(t) {
  const dt = Math.min((t - fxLast)/1000, .05);
  fxLast = t;

  // 따뜻한 음료 김
  if (!reduceMotion && state && state.running && state.cup.includes('shot') && !state.cup.includes('ice')) {
    steamAcc += dt;
    if (steamAcc > .22 && P.length < MAXP) {
      steamAcc = 0;
      const r = cupRect();
      P.push({
        x: r.left + r.width/2 + (Math.random()-.5)*34,
        y: liquidSurfaceY() - 8,
        vx: 0, vy: -26 - Math.random()*14,
        g: -8, s: 4, rgb: [1, .98, .94], baseA: .75,
        life: 0, max: 1.4, wob: 3,
      });
    }
  }

  // 물리 업데이트
  P = P.filter(p => {
    p.life += dt;
    if (p.life > p.max) return false;
    p.vy += p.g * dt;
    p.x += p.vx * dt + (p.wob ? Math.sin(p.life*6) * p.wob * dt * 30 : 0);
    p.y += p.vy * dt;
    return true;
  });

  // 렌더
  if (glOK) {
    const pr = renderer3.getPixelRatio();
    for (let i=0; i<P.length; i++) {
      const p = P[i];
      posArr[i*3]   = Math.round(p.x/GS)*GS;
      posArr[i*3+1] = Math.round(p.y/GS)*GS;
      posArr[i*3+2] = 0;
      colArr[i*3] = p.rgb[0]; colArr[i*3+1] = p.rgb[1]; colArr[i*3+2] = p.rgb[2];
      sizeArr[i] = p.s * pr;
      alpArr[i]  = Math.max(1 - p.life/p.max, 0) * p.baseA;
    }
    geo3.setDrawRange(0, P.length);
    geo3.attributes.position.needsUpdate = true;
    geo3.attributes.pcolor.needsUpdate = true;
    geo3.attributes.psize.needsUpdate = true;
    geo3.attributes.palpha.needsUpdate = true;
    renderer3.render(scene3, cam3);
  } else if (ctx2d) {
    ctx2d.clearRect(0, 0, W, H);
    P.forEach(p => {
      ctx2d.globalAlpha = Math.max(1 - p.life/p.max, 0) * p.baseA;
      ctx2d.fillStyle = `rgb(${p.rgb[0]*255|0},${p.rgb[1]*255|0},${p.rgb[2]*255|0})`;
      ctx2d.fillRect(Math.round(p.x/GS)*GS, Math.round(p.y/GS)*GS, p.s, p.s);
    });
    ctx2d.globalAlpha = 1;
  }
  requestAnimationFrame(fxLoop);
}

if (!initGL()) ctx2d = fx.getContext('2d');

/* ============ 사운드 (WebAudio 합성, 파일 불필요) ============ */
let AC = null, sfxOn = true;
function ac() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch(e) { /* 오디오 미지원 환경 — 무음으로 진행 */ }
  return AC;
}
function tone(f, d, type='sine', v=.18, f2) {
  if (!sfxOn) return;
  try {
    const c = ac();
    if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, c.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + d);
    g.gain.setValueAtTime(v, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + d);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime + d);
  } catch(e) {}
}
function noiseSfx(d=.15, ff=1200, v=.22) {
  if (!sfxOn) return;
  try {
    const c = ac();
    if (!c) return;
    const n = Math.floor(c.sampleRate * d);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i=0; i<n; i++) ch[i] = (Math.random()*2-1) * (1 - i/n);
    const s = c.createBufferSource(); s.buffer = buf;
    const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = ff;
    const g = c.createGain(); g.gain.value = v;
    s.connect(fl).connect(g).connect(c.destination);
    s.start();
  } catch(e) {}
}
const sfx = {
  tap()     { tone(520, .07, 'square', .1, 760); },                       // 재료 버튼
  land()    { noiseSfx(.13, 900, .28); tone(300, .1, 'sine', .13, 180); }, // 컵 착지 (퐁당)
  pop()     { tone(660, .06, 'triangle', .14, 880); },                     // 컵 선택
  trash()   { noiseSfx(.22, 550, .2); },                                   // 버리기 (쏴아)
  bell()    { tone(880, .28, 'sine', .14); setTimeout(()=>tone(1174, .34, 'sine', .11), 90); }, // 손님 등장 (딸랑)
  success(combo = 0) {
    const t = Math.pow(2, Math.min(combo, 9) / 12); // 콤보당 반음씩 상승
    const notes = combo >= 4 ? [523,659,784,1046] : [523,659,784];
    notes.forEach((f,i)=>setTimeout(()=>tone(f*t, .13, 'triangle', .17), i*80));
  },
  level()   { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f, .15, 'triangle', .17), i*90)); },
  fail()    { tone(220, .28, 'sawtooth', .13, 130); },
  warn()    { tone(330, .1, 'square', .1, 300); },                          // 안내 (컵 먼저 등)
};

  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

  const liquids = state.cup.filter(k => ING[k].liquid);

  const glassH = $('glass').clientHeight;
  const usable = glassH - 18;

  { id:'tiger',  name:'호랑이컵', type:'mug',  shape:'mug',  rare:true, bonus:3, b:'#E88B3A', bg:'repeating-linear-gradient(115deg,#F2A95C 0 7px,#7A4A2A 7px 11px)' },
  { id:'frog',   name:'개구리컵', type:'mug',  shape:'frog', rare:true, bonus:3, b:'#7CB08A', bg:'linear-gradient(180deg,#DFF0E0,#BFDDC4)' },
];
const RARE_CHANCE = 0.22; // 손님마다 22% 확률로 레어컵 1종 진열
const CUPS = CUP_POOL; // (테스트 호환)

function cupCardHTML(c) {
  const shape = c.shape || (c.type === 'togo' ? 'togo' : 'mug');
  const isChar = shape === 'cat' || shape === 'bear' || shape === 'frog';
  let ears = '';
  if (isChar) {
    const earStyle = shape === 'frog'
      ? `background:#FFFDF6;border:2px solid ${c.b}`
      : `background:${c.b}`;
    ears = `<span class="mEars"><i style="${earStyle}"></i><i style="${earStyle}"></i></span>
            <span class="mFace"><b class="l"></b><b class="r"></b></span>`;
  }
  return `<span class="mini ${c.type === 'togo' ? 'togo' : ''} ms-${shape}">
      <span class="mBody2" style="border-color:${c.b}; background:${c.bg}"></span>
      ${c.type === 'mug'
        ? `<span class="mHandle" style="border-color:${c.b}"></span>`
        : '<span class="mLid2"></span><span class="mStraw2"></span>'}
      ${ears}
    </span>${c.name}`;
}
function renderRack() {
  const r1 = $('shelfRow1'), r2 = $('shelfRow2');
  r1.innerHTML = ''; r2.innerHTML = '';
  const items = [...CUP_POOL];
  if (Math.random() < RARE_CHANCE) {
    items.push(rand(RARE_POOL)); // 레어템 등장!
  }
  items.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'rackCup' + (c.rare ? ' rare' : '');
    b.innerHTML = cupCardHTML(c) + (c.rare ? '<span class="rareTag">RARE</span>' : '');
    b.onclick = () => pickCup(c, b);
    (i < Math.ceil(items.length/2) ? r1 : r2).appendChild(b);
  });
}
function setPhase(brew) {
  // brew=false: 하단에 컵 고르기 / brew=true: 하단에 재료 패널
  $('pickPanel').classList.toggle('hidden2', brew);
  $('brewPanel').classList.toggle('hidden2', !brew);
  if (!brew) renderRack(); // 손님마다 진열장 갱신 (레어 확률 재추첨)
}
function pickCup(c, btn) {
  if (!state.running || state.cupType) return;
  state.cupType = c.type;
  state.cupDef = c;
  sfx.pop();
  if (navigator.vibrate) navigator.vibrate(6);

  const wrap = $('cupWrap');
  wrap.classList.remove('togo','shape-tall','shape-round','shape-cat','shape-bear','shape-frog','hasFace');
  wrap.style.setProperty('--cupB', c.b);
  wrap.style.setProperty('--cupBg', c.bg);
  if (c.type === 'togo') wrap.classList.add('togo');
  const shape = c.shape || 'mug';
  if (shape !== 'mug' && shape !== 'togo') wrap.classList.add('shape-' + shape);
  if (shape === 'cat' || shape === 'bear' || shape === 'frog') wrap.classList.add('hasFace');

  let revealed = false;
  const reveal = () => {
    if (revealed) return;
    revealed = true;
    wrap.classList.remove('waiting');
    if (wrap.animate) {
      wrap.animate([
        { transform:'scale(1.15)' },
        { transform:'scale(.96)', offset:.6 },
        { transform:'scale(1)' },
      ], { duration:260, easing:'ease-out' });
    }
    setPhase(true); // 하단 패널: 컵 고르기 → 재료
    renderCup();
    sfx.land();
  };

  if (reduceMotion || !btn || !btn.querySelector) { reveal(); return; }
  // 고른 미니 컵이 카운터로 날아가 커지는 연출
  try {
    const mini = btn.querySelector('.mini');
    const mR = mini.getBoundingClientRect();
    const tR = wrap.getBoundingClientRect();
    const ghost = mini.cloneNode(true);
    ghost.classList.add('ghostCup');
    ghost.style.left = mR.left + 'px';
    ghost.style.top = mR.top + 'px';
    document.body.appendChild(ghost);
    const dx = tR.left + tR.width/2 - (mR.left + mR.width/2);
    const dy = tR.top + tR.height/2 - (mR.top + mR.height/2);
    if (!ghost.animate) { ghost.remove(); reveal(); return; }
    const a = ghost.animate([
      { transform:'translate(0,0) scale(1)', opacity:1 },
      { transform:`translate(${dx}px,${dy}px) scale(2.1)`, opacity:.85 },
    ], { duration:340, easing:'cubic-bezier(.3,.6,.4,1)' });
    a.onfinish = () => { ghost.remove(); reveal(); };
    setTimeout(() => { ghost.remove(); reveal(); }, 500); // 이벤트 누락 보험
  } catch (e) {
    reveal(); // 어떤 경우에도 진행은 보장
  }
}
function resetCup() {
  state.cup = [];
  state.cupType = null;
  state.cupDef = null;
  const wrap = $('cupWrap');
  wrap.classList.add('waiting');
  wrap.classList.remove('togo','hasWhip','shape-tall','shape-round','shape-cat','shape-bear','shape-frog','hasFace');
  wrap.style.removeProperty('--cupB');
  wrap.style.removeProperty('--cupBg');
  renderCup();
  setPhase(false);
}

/* ============ 게임 로직 ============ */
function flyIngredient(k, btn) {
  let landed = false;
  const land = () => {
    if (landed) return;
    landed = true;
    renderCup();
    fxSplash(ING[k].flat);
    sfx.land();
    if ($('cupWrap').animate) {
      $('cupWrap').animate([
        { transform: 'scale(1,1)' },
        { transform: 'scale(1.06,.94)', offset: .4 },
        { transform: 'scale(.98,1.03)', offset: .7 },
        { transform: 'scale(1,1)' },
      ], { duration: 300, easing: 'ease-out' });
    }
    if (navigator.vibrate) navigator.vibrate(10);
  };
  try {
    const bR = btn.getBoundingClientRect();
    const cR = cupRect();
    const sx = bR.left + bR.width/2 - 14;
    const sy = bR.top - 4;
    const ex = cR.left + cR.width/2 - 14;
    const ey = cR.top + 4; // 컵 입구
    const dx = ex - sx, dy = ey - sy;

    const ball = document.createElement('div');
    ball.className = 'flyBall';
    ball.style.background = ING[k].color;
    ball.style.left = sx + 'px';
    ball.style.top = sy + 'px';
    document.body.appendChild(ball);
    if (!ball.animate) { ball.remove(); land(); return; }

    // 포물선 비행 (중간 지점을 목표보다 높게)
    const anim = ball.animate([
      { transform: 'translate(0,0) scale(1)' },
      { transform: `translate(${dx*0.5}px, ${dy - 120}px) scale(.92)`, offset: .55 },
      { transform: `translate(${dx}px, ${dy}px) scale(.55)` },
    ], { duration: 460, easing: 'cubic-bezier(.35,.15,.55,1)' });

    // 비행 중 파티클 꼬리
    const trail = () => {
      if (anim.playState !== 'running') return;
      const r = ball.getBoundingClientRect();
      emit(r.left + r.width/2, r.top + r.height/2,
        { colors:[ING[k].flat], count:1, speed:18, g:80, life:.32, sizes:[3,4] });
      requestAnimationFrame(trail);
    };
    requestAnimationFrame(trail);

    anim.onfinish = () => { ball.remove(); land(); };
    setTimeout(() => { ball.remove(); land(); }, 650); // 이벤트 누락 보험
  } catch (e) {
    land();
  }
}

function addIngredient(k, btn) {
  if (!state.running) return;
  if (!state.cupType) { toast('진열대에서 컵부터 골라주세요!', 'bad'); sfx.warn(); return; }
  if (state.cup.length >= MAX_ITEMS) { toast('컵이 가득 찼어요!', 'bad'); sfx.warn(); return; }
  state.cup.push(k);
  sfx.tap();
  if (reduceMotion || !btn) { renderCup(); return; }
  flyIngredient(k, btn);
  if (navigator.vibrate) navigator.vibrate(8);
}

function sameRecipe(cup, ing) {
  if (cup.length !== ing.length) return false;
  const a=[...cup].sort(), b=[...ing].sort();
  return a.every((v,i)=>v===b[i]);
}
function unlockedRecipes() { return RECIPES.filter(r => r.unlock <= state.level); }

function spawnCustomer() {
  const recipe = rand(unlockedRecipes());
  const base = Math.max(26 - state.level*2, 12);
  const togo = Math.random() < 0.5;
  state.customer = { recipe, togo, maxPatience:base, patience:base };
  const slot = $('charSlot');
  slot.innerHTML = '';
  slot.appendChild(spawnCharDOM());
  const ot = $('orderType');
  ot.textContent = togo ? '포장할게요!' : '먹고 갈게요!';
  ot.className = togo ? 'togo' : 'dinein';
  ot.style.animation = 'none';
  requestAnimationFrame(()=> ot.style.animation = '');
  $('orderName').textContent = recipe.name + ' 주세요!';
  $('orderHint').innerHTML = '재료 ' + recipe.ing.length + '개 · +' + recipe.pay + ' ' + icon('i-coin');
  $('bubble').style.animation = 'none';
  requestAnimationFrame(()=> $('bubble').style.animation = '');
  sfx.bell();
}

function customerLeaves(angry=false) {
  const ch = $('charSlot').querySelector('.char');
  if (ch) {
    if (angry) ch.classList.add('angry');
    ch.classList.remove('enter');
    ch.classList.add('leave');
  }
  state.customer = null;
  $('orderType').textContent = '';
  $('orderName').textContent = '...';
  $('orderHint').textContent = '';
}

function serve() {
  if (!state.running || !state.customer) return;
  if (!state.cupType) { toast('컵부터 골라주세요!', 'bad'); sfx.warn(); return; }
  if (state.cup.length === 0) { toast('컵이 비어있어요!', 'bad'); sfx.warn(); return; }
  const cu = state.customer;
  const cupOK = state.cupType === (cu.togo ? 'togo' : 'mug');
  const recipeOK = sameRecipe(state.cup, cu.recipe.ing);
  if (cupOK && recipeOK) {
    state.combo++;
    const tip = Math.floor((cu.patience / cu.maxPatience) * 2);
    const rareBonus = (state.cupDef && state.cupDef.rare) ? state.cupDef.bonus : 0;
    const comboBonus = Math.min(Math.floor(state.combo / 3), 3); // 3콤보마다 +1 (최대 +3)
    const total = cu.recipe.pay + tip + rareBonus + comboBonus;
    state.coins += total;
    state.served++;
    coinPop(total);
    toast(cu.recipe.name + ' 성공!'
      + (tip>0 ? ' (팁 +'+tip+')' : '')
      + (comboBonus>0 ? ' (콤보 +'+comboBonus+')' : '')
      + (rareBonus>0 ? ' [' + state.cupDef.name + ' 보너스 +' + rareBonus + '!]' : ''), 'good');
    fxSuccess(state.combo);
    sfx.success(state.combo);
    comboFx(state.combo);
    if (navigator.vibrate) navigator.vibrate([12,40,12]);
    customerLeaves(false);
    const newLevel = Math.min(Math.floor(state.served/3)+1, MAX_LEVEL);
    if (newLevel > state.level) {
      state.level = newLevel;
      renderRecipes();
      setTimeout(()=>{ toast('레벨 '+newLevel+' 달성! 새 레시피 해금!', 'good'); fxConfetti(); sfx.level(); }, 900);
    }
  } else {
    state.lives--;
    state.combo = 0;
    if (!cupOK) {
      toast('컵이 달라요! 손님은 ' + (cu.togo ? '테이크아웃' : '매장컵') + ' 주문!', 'bad');
    } else {
      toast('주문과 달라요! (' + cu.recipe.ing.map(k=>ING[k].name).join('+') + ')', 'bad');
    }
    fxFail();
    sfx.fail();
    if (navigator.vibrate) navigator.vibrate(80);
    customerLeaves(true);
  }
  resetCup();
  renderHUD();
  if (state.lives <= 0) return gameOver();
  setTimeout(()=>{ if (state.running) spawnCustomer(); }, 1000);
}

function trash() {
  if (!state.running || (state.cup.length===0 && !state.cupType)) return;
  resetCup();
  sfx.trash();
  toast('컵을 비웠어요');
}

function tick(t) {
  if (!state.running) return;
  const dt = (t - state.lastTime)/1000;
  state.lastTime = t;
  const cu = state.customer;
  if (cu) {
    cu.patience -= dt;
    const ratio = Math.max(cu.patience / cu.maxPatience, 0);
    const fill = $('patienceFill');
    fill.style.width = (ratio*100) + '%';
    fill.className = ratio > .5 ? '' : ratio > .25 ? 'warn' : 'danger';
    if (cu.patience <= 0) {
      state.lives--;
      state.combo = 0;
      toast('손님이 화나서 떠났어요...', 'bad');
      fxFail();
      sfx.fail();
      customerLeaves(true);
      resetCup();
      renderHUD();
      if (state.lives <= 0) return gameOver();
      setTimeout(()=>{ if (state.running) spawnCustomer(); }, 1000);
    }
  } else {
    $('patienceFill').style.width = '0%';
  }
  requestAnimationFrame(tick);
}

function gameOver() {
  state.running = false;
  $('ovTitle').textContent = '영업 종료...';
  $('ovText').innerHTML =
    '오늘의 결과<br><br>' +
    icon('i-coin') + ' ' + state.coins + ' 코인<br>' +
    icon('i-cup')  + ' ' + state.served + '잔 서빙<br>' +
    icon('i-star') + ' 레벨 ' + state.level;
  $('startBtn').textContent = '다시 도전!';
  $('overlay').classList.remove('hidden');
  setBgVideo(true);
}

/* ============ 배경 영상 + 음악 프리로드 (통합 로딩바) ============ */
const VIDEO_SRC = 'coffee.mp4';
const MUSIC_SRC = 'music.mp3';
const bgVideo = $('bgVideo');
const loader  = $('loader');
let loaderDone = false;

// 배경음악
const bgm = new Audio();
bgm.loop = true;
bgm.volume = 0.35;
function tryPlayBgm() {
  if (!sfxOn || !bgm.src) return;
  bgm.play().catch(() => {
    const kick = () => { if (sfxOn && bgm.src) bgm.play().catch(()=>{}); };
    addEventListener('touchstart', kick, { once:true, passive:true });
    addEventListener('click', kick, { once:true });
  });
}

const TIPS = [
  '원두를 갈고 있어요...',
  '머신을 예열하는 중...',
  '우유를 스티밍하는 중...',
  '배경음악을 트는 중...',
  '잔을 데우고 있어요...',
];
let tipIdx = 0;
const tipTimer = setInterval(() => {
  tipIdx = (tipIdx + 1) % TIPS.length;
  $('loadTip').textContent = TIPS[tipIdx];
}, 1500);

let shownPct = 0;
function setProgress(pct) {
  pct = Math.max(0, Math.min(100, pct));
  if (pct < shownPct) return;   // 뒤로 가지 않게
  shownPct = pct;
  $('barFill').style.width = pct + '%';
  $('barPct').textContent = Math.round(pct) + '%';
}

function finishLoading() {
  if (loaderDone) return;
  loaderDone = true;
  clearInterval(tipTimer);
  clearTimeout(hardTimeout);
  setProgress(100);
  $('loadTip').textContent = '준비 완료!';
  setTimeout(() => {
    document.body.classList.remove('loading'); // 이제서야 화면 공개
    loader.classList.add('done');
    if (bgVideo && bgVideo.src) {
      bgVideo.play().then(()=>bgVideo.classList.add('ready')).catch(()=>{
        bgVideo.classList.add('ready');
        const kick = () => bgVideo.play().catch(()=>{});
        addEventListener('touchstart', kick, { once:true, passive:true });
        addEventListener('click', kick, { once:true });
      });
    }
    tryPlayBgm();
    setTimeout(()=>loader.remove(), 600);
  }, 420);
}

// 네트워크가 느려도 무한 대기하지 않도록 안전장치
const hardTimeout = setTimeout(() => {
  if (!loaderDone) {
    if (bgVideo && !bgVideo.src) bgVideo.remove();
    finishLoading();
  }
}, 15000);

// blob 세팅 후 디코딩 완료 대기 — 이벤트가 안 와도 짧게 기다렸다 진행
function waitDecodeThenFinish() {
  setProgress(98);
  const done = () => finishLoading();
  bgVideo.addEventListener('loadeddata', done, { once:true });
  bgVideo.addEventListener('canplay', done, { once:true });
  bgVideo.load();
  setTimeout(done, 1800);
}

// 에셋별 다운로드 진행률을 합산해 하나의 로딩바로 표시
const prog = new Map(); // url -> { rec, tot }
function updateCombined() {
  let rec = 0, tot = 0;
  prog.forEach(p => { rec += p.rec; tot += p.tot > 0 ? p.tot : p.rec * 2; });
  if (tot > 0) setProgress((rec / tot) * 96);
}
async function fetchWithProgress(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + ' ' + res.status);
  const tot = Number(res.headers.get('content-length')) || 0;
  const p = { rec:0, tot };
  prog.set(url, p);
  if (!res.body) {
    const blob = await res.blob();
    p.rec = p.tot = blob.size;
    updateCombined();
    return blob;
  }
  const reader = res.body.getReader();
  const chunks = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    p.rec += value.length;
    updateCombined();
  }
  if (!p.tot) p.tot = p.rec;
  updateCombined();
  return new Blob(chunks, { type: res.headers.get('content-type') || '' });
}

async function preloadAssets() {
  setProgress(2);
  const [vid, mus] = await Promise.allSettled([
    fetchWithProgress(VIDEO_SRC),
    fetchWithProgress(MUSIC_SRC),
  ]);
  if (mus.status === 'fulfilled') {
    bgm.src = URL.createObjectURL(mus.value);
  } // 음악 실패는 치명적이지 않음 — 음악 없이 진행
  if (vid.status === 'fulfilled') {
    bgVideo.src = URL.createObjectURL(vid.value);
    waitDecodeThenFinish();
  } else {
    // fetch가 안 되는 환경(file:// 로컬 등)이면 직접 연결 시도
    try {
      setProgress(70);
      bgVideo.src = VIDEO_SRC;
      bgVideo.addEventListener('loadeddata', finishLoading, { once:true });
      bgVideo.addEventListener('error', () => { bgVideo.remove(); finishLoading(); }, { once:true });
      bgVideo.load();
      if (!bgm.src) { bgm.src = MUSIC_SRC; }
      setTimeout(finishLoading, 4000);
    } catch (e) {
      if (bgVideo) bgVideo.remove();
      finishLoading();
    }
  }
}

if (bgVideo) {
  preloadAssets();
  // 백그라운드 전환 시 배터리 절약
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      bgVideo.pause();
      bgm.pause();
    } else {
      if (!$('overlay').classList.contains('hidden')) bgVideo.play().catch(()=>{});
      if (sfxOn) bgm.play().catch(()=>{});
    }
  });
} else {
  finishLoading();
}

function setBgVideo(playing) {
  if (!bgVideo || !bgVideo.isConnected) return;
  if (playing) bgVideo.play().catch(()=>{});
  else bgVideo.pause();
}

function startGame() {
  state = newState();
  state.running = true;
  state.lastTime = performance.now();
  ac(); // 사용자 제스처 시점에 오디오 활성화
  $('overlay').classList.add('hidden');
  setTimeout(()=>setBgVideo(false), 400); // 게임 중엔 영상 정지 (GPU/배터리 절약)
  renderHUD(); renderRecipes(); resetCup();
  spawnCustomer();
  requestAnimationFrame(tick);
}

function toggleSheet(open) {
  $('recipeSheet').classList.toggle('open', open);
  $('sheetBack').classList.toggle('open', open);
}
$('bookBtn').onclick = ()=>toggleSheet(true);
$('sheetBack').onclick = ()=>toggleSheet(false);
$('startBtn').onclick = startGame;
$('serveBtn').onclick = serve;
$('trashBtn').onclick = trash;

state = newState();
renderHUD(); renderRecipes(); renderIngredients(); renderRack(); renderCup();
</script>
