  el('busychip').classList.remove('on');
  el('loadbar').classList.remove('on','indet');
  el('loadfill').style.width='0%';
}
function busyOn(label, determinate){
  busyDepth++;
  if(el('busychip').classList.contains('on')){
    el('busytxt').textContent=label||'기다리는 중';
    return;
  }
  clearTimeout(busyShowTimer);
  busyShowTimer=setTimeout(()=>{
    if(busyDepth>0) busyPaint(label, determinate);
  }, BUSY_DELAY);
}
function busyStep(p){
  el('loadbar').classList.remove('indet');
  el('loadfill').style.width=Math.round(Math.max(0,Math.min(1,p))*100)+'%';
}
function busyOff(){
  busyDepth=Math.max(0,busyDepth-1);
  if(busyDepth>0) return;
  clearTimeout(busyShowTimer);
  const shown=el('busychip').classList.contains('on');
  if(!shown){                                  // 뜨기도 전에 끝났다
    el('loadbar').classList.remove('on','indet');
    return;
  }
  const wait=Math.max(0, BUSY_MIN-(performance.now()-busyShownAt));
  setTimeout(()=>{
    if(busyDepth>0) return;
    const lb=el('loadbar');
    el('loadfill').style.width='100%';
    el('busychip').classList.remove('on');
    setTimeout(()=>{
      if(busyDepth>0) return;
      lb.classList.remove('on','indet');
      setTimeout(()=>{ if(busyDepth===0) el('loadfill').style.width='0%'; }, 260);
    }, 200);
  }, wait);
}

const GOURD_MOUTH_X=0.439;    // 그림 가로 기준, 병의 중심축

/* 호리병을 그리고, 빨려드는 지점(아가리)을 돌려준다 */
function drawGourd(g, cx0, baseY, height, rise, flare){
  // 병의 중심축을 화면 중앙에 맞춘다 (그림 중앙과 다르다)
  const axis = (gourdImg && gourdIsPhoto) ? GOURD_MOUTH_X : 0.5;
  const ar0 = gourdImg && gourdIsPhoto
    ? (gourdImg.naturalWidth||gourdImg.width)/(gourdImg.naturalHeight||gourdImg.height)
    : (200/300);
  const h=height, w=height*ar0;
  const cx=cx0+w*(0.5-axis);        // 축 보정
  const lift=(1-rise)*h*0.30;
  const y=baseY-h+lift;
  const mx = gourdIsPhoto ? GOURD_MOUTH_X : 0.5;
  const my = gourdIsPhoto ? GOURD_MOUTH_Y : (15/300);
  const mouth={ x:(cx-w/2)+w*mx, y:y+h*my };

  g.save();
  g.globalAlpha=Math.min(1,rise);

  // 아가리에서 번지는 빛
  if(flare>0){
    const gr=g.createRadialGradient(mouth.x, mouth.y, 2, mouth.x, mouth.y, h*0.75);
    gr.addColorStop(0, `rgba(214,238,190,${0.55*flare})`);
    gr.addColorStop(0.35, `rgba(120,170,110,${0.20*flare})`);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;
    g.fillRect(mouth.x-h, mouth.y-h, h*2, h*2);
  }

  // 바닥 그림자
  if(!gourdIsPhoto){
    const sh=g.createRadialGradient(cx0, baseY, 2, cx0, baseY, w*0.7);
    sh.addColorStop(0,'rgba(0,0,0,.55)'); sh.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=sh;
    g.beginPath(); g.ellipse(cx0, baseY, w*0.55, h*0.045, 0, 0, 7); g.fill();
  }

  if(gourdImg){
    g.imageSmoothingEnabled=true;
    g.drawImage(gourdImg, Math.round(cx-w/2), Math.round(y), Math.round(w), Math.round(h));
  }else if(false){
    g.fillStyle='#3f4d3c';
    g.beginPath(); g.ellipse(cx, y+h*0.75, w*0.44, h*0.24, 0,0,7); g.fill();
    g.beginPath(); g.ellipse(cx, y+h*0.28, w*0.24, h*0.13, 0,0,7); g.fill();
  }

  // 아가리 위로 스미는 빛 (테두리 없는 부드러운 번짐만)
  if(flare>0){
    g.globalCompositeOperation='lighter';
    const mg=g.createRadialGradient(mouth.x, mouth.y, 0, mouth.x, mouth.y, w*0.30);
    mg.addColorStop(0, `rgba(226,246,200,${0.55*flare})`);
    mg.addColorStop(0.45, `rgba(180,215,160,${0.16*flare})`);
    mg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=mg;
    g.fillRect(mouth.x-w*0.35, mouth.y-w*0.35, w*0.70, w*0.70);
    g.globalCompositeOperation='source-over';
  }
  g.restore();
  return mouth;
}

function suckIntoArchive(card){
  return new Promise(res=>{
    if(!suckCtx || !glOK){ SFX.absorb(); res(); return; }
    const face=faceCanvas(card).face;
    const rect=cardScreenRect();
    const glow=TYPES[card.type].glow;
    // 화면 정중앙에 세운다
    const gH=Math.min(innerHeight*0.56, innerWidth*1.25, 520);
    const gBase=Math.round(innerHeight/2 + gH/2);
    const gx=Math.round(innerWidth/2);

    if(REDUCED){ SFX.absorb(); res(); return; }

    fitSuck();
    suckCv.classList.add('on');

    const COLS=20, ROWS=30;
    const sw=face.width/COLS, sh=face.height/ROWS;
    const tw=rect.w/COLS, th=rect.h/ROWS;
    const ccx=rect.x+rect.w/2, ccy=rect.y+rect.h/2;
    const bits=[];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const x0=rect.x+c*tw, y0=rect.y+r*th;
      const ang=Math.atan2((y0+th/2)-ccy, (x0+tw/2)-ccx);
      bits.push({
        sx:c*sw, sy:r*sh, x0, y0,
        bx:Math.cos(ang)*(60+Math.random()*150),   // 터져 나가는 방향
        by:Math.sin(ang)*(40+Math.random()*110)-40,
        delay:Math.random()*0.16,
        spin:(Math.random()-0.5)*7,
        swirl:(Math.random()-0.5)*180
      });
    }
    const sparks=[];
    for(let i=0;i<240;i++){
      const a=Math.random()*Math.PI*2;
      sparks.push({
        x:rect.x+Math.random()*rect.w, y:rect.y+Math.random()*rect.h,
        bx:Math.cos(a)*(80+Math.random()*220), by:Math.sin(a)*(60+Math.random()*180)-50,
        s:(1+Math.floor(Math.random()*3))*2,
        delay:Math.random()*0.22, swirl:(Math.random()-0.5)*240
      });
    }

    const RISE=0.42, FLY=0.95, TOTAL=RISE+FLY+0.55;
    const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
    const t0=performance.now();
    let rumbled=false, boomed=false;
    SFX.book();

    // 조각의 t 시점 위치 — 터져 나갔다가 아가리로 빨려든다
    function posAt(p, t, mouth){
      const k=Math.max(0,Math.min(1,t));
      const out=Math.sin(Math.min(k,0.30)/0.30*Math.PI*0.5);   // 초반 폭발
      const pull=Math.pow(k,2.6);                              // 후반 가속 흡입
      const sx0=p.x0+p.bx*out*(1-pull);
      const sy0=p.y0+p.by*out*(1-pull);
      const swirl=Math.sin(k*Math.PI)*p.swirl*(1-pull);
      return {
        x: sx0+(mouth.x-sx0)*pull + swirl,
        y: sy0+(mouth.y-sy0)*pull,
        s: Math.max(0.10, (1-k*0.92))*(1-out*0.30)
      };
    }

    function frame(now){
      const t=(now-t0)/1000;
      suckCtx.clearRect(0,0,innerWidth,innerHeight);

      const rise=ease(Math.min(t/RISE,1));
      const ft=(t-RISE)/FLY;
      const flare=ft>0 ? Math.min(1.4, 0.25+ft*1.15) : 0;
      const mouth=drawGourd(suckCtx, gx, gBase, gH, rise, flare);

      if(t>RISE && !rumbled){
        rumbled=true;
        appEl.classList.remove('rumble'); void appEl.offsetWidth; appEl.classList.add('rumble');
        SFX.suck();
        myUnit.group.visible=false;         // 카드는 이 순간 사라진다
      }

      let alive=false;
      suckCtx.imageSmoothingEnabled=false;
      for(const p of bits){
        const k=(t-RISE-p.delay)/FLY;
        if(k<=0||k>=1) { if(k<=0 && t>RISE) alive=true; continue; }
        alive=true;
        const a=posAt(p,k,mouth);
        const w=Math.max(1,Math.round(tw*a.s)), h=Math.max(1,Math.round(th*a.s));
        // 잔상
        for(let g2=2;g2>=1;g2--){
          const b=posAt(p, k-g2*0.045, mouth);
          if(b.s<=0) continue;
          suckCtx.globalAlpha=(1-k)*0.16*(3-g2)/2;
          suckCtx.drawImage(face, p.sx,p.sy,sw,sh,
            Math.round(b.x), Math.round(b.y), Math.max(1,Math.round(tw*b.s)), Math.max(1,Math.round(th*b.s)));
        }
        suckCtx.save();
        suckCtx.globalAlpha=1-Math.pow(k,3.4);
        suckCtx.translate(Math.round(a.x+w/2), Math.round(a.y+h/2));
        suckCtx.rotate(p.spin*k);
        suckCtx.drawImage(face, p.sx,p.sy,sw,sh, -(w>>1), -(h>>1), w, h);
        suckCtx.restore();
      }

      suckCtx.fillStyle=glow;
      for(const q of sparks){
        const k=(t-RISE-q.delay)/(FLY*0.9);
        if(k<=0||k>=1) continue;
        alive=true;
        const a=posAt(q,k,mouth);
        suckCtx.globalAlpha=(1-k)*0.95;
        suckCtx.fillRect(Math.round(a.x), Math.round(a.y), q.s, q.s);
      }
      suckCtx.globalAlpha=1;

      if(!alive && !boomed && t>RISE+0.2){
        boomed=true; SFX.absorb();
        appEl.classList.remove('rumble'); void appEl.offsetWidth; appEl.classList.add('shkB');
      }

      if(t<TOTAL){ requestAnimationFrame(frame); }
      else{
        suckCtx.clearRect(0,0,innerWidth,innerHeight);
        suckCv.classList.remove('on');
        appEl.classList.remove('shkB');
        res();
      }
    }
    requestAnimationFrame(frame);
  });
}

/* ═══ 결정론적 전투 시뮬레이션 ═══════════════
   양쪽 클라이언트가 같은 (cardA, cardB, seed)로
   같은 결과를 계산한다. 서버 판정 불필요.       */
/* ═══ 판정 — 세 판 두 선승. 양쪽이 같은 씨앗으로 같은 결과를 낸다 ═══ */
function calcDmg(a, d, rnd){
  const mult=multiplier(a.type, d.type);
  const statF=Math.min(1.35, Math.max(0.75, a.atk/d.atk));
  const frac=0.34*statF*mult*(0.9+rnd()*0.2);
  return { dmg:Math.max(8, Math.round(d.hp*frac)), mult };
}
function applyPassive(hit, atkP, defP, n){
  let d=hit.dmg, blocked=false;
  if(atkP && atkP.kind==='doubleFirst' && n===1) d=Math.round(d*1.8);
  if(defP && defP.kind==='cut')  d=Math.round(d*(1-defP.v));
  if(defP && defP.kind==='firstBlock' && n===1){ d=0; blocked=true; }
  return { dmg:d, mult:hit.mult, blocked };
}
/* 한 판(局) — 카드 대 카드 */
function duel(A, B, seed){
  const sa=statOf(A.card, A.lv), sb2=statOf(B.card, B.lv);
  const ua={ atk:sa.atk, hp:sa.hp, type:A.card.type };
  const ub={ atk:sb2.atk, hp:sb2.hp, type:B.card.type };
  const rnd=mulberry32(seed>>>0);
  const pA=PASSIVES[A.card.id], pB=PASSIVES[B.card.id];
  let hpA=ua.hp, hpB=ub.hp;
  const rounds=[];
  for(let n=1;n<=4 && hpA>0 && hpB>0;n++){
    const rawA=calcDmg(ua, ub, rnd);
    const rawB=calcDmg(ub, ua, rnd);
    const dA=applyPassive(rawA, pA, pB, n);
    const dB=applyPassive(rawB, pB, pA, n);
    hpB-=dA.dmg; hpA-=dB.dmg;
    if(pB && pB.kind==='reflect' && dA.dmg>0) hpA-=Math.round(dA.dmg*pB.v);
    if(pA && pA.kind==='reflect' && dB.dmg>0) hpB-=Math.round(dB.dmg*pA.v);
    if(pA && pA.kind==='poison') hpB-=pA.v;
    if(pB && pB.kind==='poison') hpA-=pB.v;
    rounds.push({ n, dA, dB, hpA, hpB });
  }
  let winner;
  if(hpA<=0 && hpB<=0) winner=(hpA/ua.hp >= hpB/ub.hp)?'a':'b';
  else if(hpB<=0) winner='a';
  else if(hpA<=0) winner='b';
  else winner=(hpA/ua.hp >= hpB/ub.hp)?'a':'b';
  return { rounds, winner, maxA:ua.hp, maxB:ub.hp };
}
/* 세 판 — 두 판 먼저 이기면 끝 */
function simulateMatch(deckA, deckB, seed){
  const duels=[]; let wa=0, wb=0;
  for(let i=0;i<3 && wa<2 && wb<2;i++){
    const d=duel(deckA[i], deckB[i], (seed + i*7919)>>>0);
    if(d.winner==='a') wa++; else wb++;
    duels.push({ i, ...d });
  }
  return { duels, wa, wb, winner: wa>wb?'a':'b' };
}

async function playRound(r, iAmA, myCard, foeCard, maxMine, maxFoe){
  roundMark(`제${['일','이','삼','사'][r.n-1]||r.n}합`);
  const mg=myUnit.group, fg=foeUnit.group;
  const mx=myUnit.home.x, fx=foeUnit.home.x;

    tween(0.13,p=>{

      fg.position.x=fx+(-0.32-fx)*p*0.82;

    },res,t=>t*t);
  });
  const toFoe = iAmA ? r.dA : r.dB;
  const toMe  = iAmA ? r.dB : r.dA;
  const myHp  = iAmA ? r.hpA : r.hpB;
  const foeHp = iAmA ? r.hpB : r.hpA;

  });
  hudHp('L',myHp,maxMine);
  hudHp('R',foeHp,maxFoe);
  floater(toMe.blocked?'막았다':'-'+toMe.dmg, 27, toMe.blocked?'small':(toMe.mult>1?'big':(toMe.mult<1?'small':'')));
  floater(toFoe.blocked?'막혔다':'-'+toFoe.dmg, 73, toFoe.blocked?'small':(toFoe.mult>1?'big':(toFoe.mult<1?'small':'')));
  if(toMe.blocked || toFoe.blocked){
    const who = toMe.blocked ? myCard : foeCard;
    showBattleMsg('패시브 발동', `${who.name} — ${PASSIVES[who.id].text}`);
  }
  else if(toFoe.mult>1 && toMe.mult<1) showBattleMsg('상극 우위!', `${TYPES[myCard.type].hanja}이(가) ${TYPES[foeCard.type].hanja}을(를) 꿰뚫는다`);
  else if(toMe.mult>1 && toFoe.mult<1) showBattleMsg('상극 열세…', `${TYPES[foeCard.type].hanja}이(가) ${TYPES[myCard.type].hanja}을(를) 짓누른다`);
  else showBattleMsg(`제${r.n}합`, '칼날이 맞부딪친다');
  await new Promise(res=>{
    tween(0.22,p=>{
      mg.position.x=0.32*0.82+(mx-0.32*0.82)*p;
      fg.position.x=-0.32*0.82+(fx+0.32*0.82)*p;
      mg.rotation.z=-0.10*(1-p); fg.rotation.z=0.10*(1-p);
    },res);
  });
  await sleep(340);
}

/* 한 판 진행 */
async function playDuel(d, iAmA, mine, foe, scoreTxt){
  const myCard=mine.card, foeCard=foe.card;
  const maxMine = iAmA ? d.maxA : d.maxB;
  const maxFoe  = iAmA ? d.maxB : d.maxA;
  if(!glOK){                                   // 3D 없이도 결과는 진행된다
    hudSet('L', myCard, mine.lv, maxMine, scoreTxt.me);
    hudSet('R', foeCard, foe.lv, maxFoe, scoreTxt.foe);
    combatHud.classList.add('on');
    showBattleMsg(scoreTxt.title, `${myCard.name} 對 ${foeCard.name}`);
    await sleep(700);
    combatHud.classList.remove('on');
    return (d.winner==='a')===iAmA;
  }
  setUnitCard(myUnit, myCard); setUnitCard(foeUnit, foeCard);
  const SC=0.74, X=1.55;
  myUnit.home={x:-X,y:0,s:SC,ry:0.24};
  foeUnit.home={x:X,y:0,s:SC,ry:-0.24};
  myUnit.group.position.set(-X,0,0); myUnit.group.scale.setScalar(SC);
  myUnit.group.rotation.set(0,0.24,0);
  foeUnit.group.position.set(X,0,0); foeUnit.group.scale.setScalar(SC);
  foeUnit.group.rotation.set(0,-0.24,0);
  myUnit.front.material.uniforms.uReveal.value=0;
  foeUnit.front.material.uniforms.uReveal.value=0;
  myUnit.group.visible=true; foeUnit.group.visible=true;
  emit(burst, TYPES[foeCard.type].glow, X, 0, 1.8, 2.4);
  emit(burst, TYPES[myCard.type].glow, -X, 0, 1.8, 2.4);
  await new Promise(res=>{
    tween(0.45,p=>{
      myUnit.front.material.uniforms.uReveal.value=p;
      foeUnit.front.material.uniforms.uReveal.value=p;
    },res);
  });
  hudSet('L', myCard, mine.lv, maxMine, scoreTxt.me);
  hudSet('R', foeCard, foe.lv, maxFoe, scoreTxt.foe);
  combatHud.classList.add('on');
  roundMark(scoreTxt.title);
  const m=multiplier(myCard.type,foeCard.type);
  showBattleMsg(scoreTxt.title,
    `${myCard.name} 對 ${foeCard.name}`,
    m>1?'상극이 유리하다':(m<1?'상극이 불리하다':'상극은 대등하다'));
  await sleep(900);
  for(const r of d.rounds) await playRound(r, iAmA, myCard, foeCard, maxMine, maxFoe);
  const iWon = (d.winner==='a')===iAmA;
  const loser = iWon?foeUnit:myUnit;
  emit(burst, TYPES[loser.card.type].glow, loser.home.x, 0, 3, 3);
  await splitCard(loser);
  combatHud.classList.remove('on');
  const winner = iWon?myUnit:foeUnit;
  await new Promise(res=>{
    tween(0.35,p=>{ winner.group.scale.setScalar(SC*(1-p)); },res);
  });
  winner.group.visible=false;
  return iWon;
}

/* ═══ 세 판 대결 ═══ */
async function runMatch(deckA, deckB, seed, opts){
  opts=opts||{};
  const iAmA = opts.role!=='b';
  const myDeck = iAmA?deckA:deckB;
  const foeDeck= iAmA?deckB:deckA;
  const sim = simulateMatch(deckA, deckB, seed);
  const won = (sim.winner==='a')===iAmA;

  battle=true; busy=true; setControls(false); summonAnim=null;
  camTo();
  let myW=0, foeW=0;

  for(const d of sim.duels){
    const mine = iAmA?deckA[d.i]:deckB[d.i];
    const foe  = iAmA?deckB[d.i]:deckA[d.i];
    const iWon = await playDuel(d, iAmA, mine, foe, {
      title:`제${['일','이','삼'][d.i]}국  ${myW} : ${foeW}`,
      me:`${opts.myName||'나'}  ${myW}승`,
      foe:`${opts.foeName||'상대'}  ${foeW}승`
    });
    if(iWon) myW++; else foeW++;
    showBattleMsg(iWon?'한 판 이겼다':'한 판 졌다', `${myW} : ${foeW}`);
    await sleep(900);
  }

  battle=null; camTo();
  if(won) SFX.win(); else SFX.lose();
  gainSouls(won?WIN_SOULS:LOSE_SOULS);

  if(opts.online){
    saveResult(won);
    trackMe('idle');
    lastFoe={ id:opts.oppId, name:opts.foeName };
    if(opts.role==='a'){
      logMatch({
        id:opts.matchId, player_a:opts.idA, player_b:opts.idB,
        card_a:deckA[0].card.id, card_b:deckB[0].card.id, seed,
        winner: sim.winner==='a'?opts.idA:opts.idB,
        name_a: iAmA?opts.myName:opts.foeName,
        name_b: iAmA?opts.foeName:opts.myName,
        deck_a: deckA.map(x=>x.card.id).join(','),
        deck_b: deckB.map(x=>x.card.id).join(','),
        score: `${sim.wa}:${sim.wb}`
      });
    }
  }

  showBattleMsg(won?'승(勝)':'패(敗)', `${myW} : ${foeW}`,
    won?`혼백 ${WIN_SOULS}을 얻었다`:`혼백 ${LOSE_SOULS}을 얻었다`);
  await sleep(1200);
  if(champion){
    showDossier(champion, won?`${myW} : ${foeW} 로 이겼다`:`${myW} : ${foeW} 로 졌다`);
    summonSolo(champion, null, true);
  }
  busy=false; setControls(true);
  setOpponent(null);
  if(opts.online) openLobbyView();
}

  if(document.visibilityState==='visible' && online() && !lobby && !joiningLobby){
    netTrouble('다시 잇는 중'); scheduleRejoin();
  }
});

async function connectLobby(){
  if(!online() || lobby || joiningLobby) return;
  joiningLobby=true;
  busyOn('대전청에 드는 중');

  lobby = sb.channel('lobby:jonhonrok', {
    config:{ presence:{ key:me }, broadcast:{ self:false } }
  });

  lobby.on('presence', { event:'sync' }, ()=>{ renderLobby(); renderPresence(); });
  lobby.on('presence', { event:'leave' }, ({ leftPresences })=>{
    // 상태를 갱신해도 leave 가 함께 오므로, 정말 사라졌는지 다시 확인한다
    const ids=(leftPresences||[]).map(p=>p.id);
    const stillHere=id=>lobbyPlayers().some(p=>p.id===id);
    setTimeout(()=>{
      if(pendingOut && ids.includes(pendingOut.to) && !stillHere(pendingOut.to)){
        cancelOutgoing();
        showBattleMsg('상대가 자리를 떴다','');
        busy=false; setControls(true);
      }
      if(pendingIn && ids.includes(pendingIn.from) && !stillHere(pendingIn.from)) closeChallenge();
      if(match && ids.includes(match.oppId) && !stillHere(match.oppId)){
        abortMatch('상대가 자리를 떴다');
      }
      renderLobby(); renderPresence();
    }, 900);   // 재등록이 끝날 시간을 준다
  });

  lobby.on('broadcast', { event:'challenge' }, ({ payload })=>{
    if(payload.to!==me || busy) return;
    // 서로 동시에 청한 경우: id 가 작은 쪽이 도전자
    if(pendingOut && pendingOut.to===payload.from){
      if(me < payload.from) return;      // 내 청이 유효 — 상대 것은 무시
      cancelOutgoing();                  // 상대 청을 받는다
    }
    if(pendingIn) return;                // 이미 다른 청을 검토 중
    openChallenge(payload);
  });

  lobby.on('broadcast', { event:'accept' }, ({ payload })=>{
    if(payload.to!==me) return;
    if(match && match.matchId===payload.matchId) return;       // 재전송 — 이미 들어와 있다
    if(!pendingOut || pendingOut.to!==payload.from) return;
    clearTimeout(outTimerId); pendingOut=null;
    showSeeking(false); closeDrawer();
    trackMe('busy');
    openPicker({ matchId:payload.matchId, seed:payload.seed, role:'a',
                 oppId:payload.from, oppName:payload.fromName });
  });

  lobby.on('broadcast', { event:'takeover' }, ({ payload })=>{
    if(payload.user!==me || payload.sid===SESSION_ID) return;
    kickOut('다른 곳에서 접속했다. 이곳의 연결을 끊는다.');
  });

  lobby.on('broadcast', { event:'joined' }, ({ payload })=>{
    if(payload.to!==me) return;
    joinedMatches.add(payload.match);
    if(match && match.matchId===payload.match && !match.sent){
      el('pkOpp').innerHTML=`맞설 상대<b>${escapeHTML(match.oppName)}</b>`;
    }
  });

  lobby.on('broadcast', { event:'taunt' }, ({ payload })=>{
    if(payload.to!==me) return;
    onTaunt(payload);
  });

  lobby.on('broadcast', { event:'needpick' }, ({ payload })=>{
    if(payload.to!==me) return;
    const rec=sentDecks.get(payload.match);
    if(rec) sendMatch('pick', { match:payload.match, to:rec.to, deck:rec.deck });
  });

  lobby.on('broadcast', { event:'pick' }, ({ payload })=>{
    if(payload.to!==me) return;
    if(!match || match.matchId!==payload.match){
      earlyPicks.set(payload.match, payload);   // 아직 선택창이 없다 — 보관
      return;
    }
    onOpponentPick(payload);
  });

  lobby.on('broadcast', { event:'abort' }, ({ payload })=>{
    if(payload.to!==me || !match || payload.match!==match.matchId) return;
    const nm=match.oppName;
    match=null;
    clearTimeout(pkTimer);
    busyOff();
    el('picker').classList.remove('on','waiting');
    el('pkWait').classList.remove('on');
    setOpponent(null);
    trackMe('idle');
    showBattleMsg('겨룸이 깨졌다', `${nm}이(가) 물러났다.`);
    busy=false; setControls(true);
    openLobbyView();
  });

  lobby.on('broadcast', { event:'decline' }, ({ payload })=>{
    if(payload.to!==me) return;
    if(!pendingOut || pendingOut.to!==payload.from) return;
    const nm=pendingOut.name;
    cancelOutgoing();
    showBattleMsg('거절당했다', `${nm}이(가) 청을 피했다.`);
    busy=false; setControls(true);
    openLobbyView();
  });

  await lobby.subscribe(async status=>{
    if(status==='SUBSCRIBED'){
      inLobby=true; rejoinTries=0;
      if(joiningLobby){ joiningLobby=false; busyOff(); }
      netOk();
      // 같은 계정의 다른 접속을 밀어낸다
      sendMatch('takeover', { user:me, sid:SESSION_ID, to:'*' });
      await trackMe('idle'); renderLobby(); renderPresence();
    }else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
      inLobby=false;
      if(joiningLobby){ joiningLobby=false; busyOff(); }
      netTrouble('다시 잇는 중');
      scheduleRejoin();
    }else if(status==='CLOSED'){
      inLobby=false;
      if(closingLobby) return;               // 우리가 끊은 것 — 무시
      if(joiningLobby){ joiningLobby=false; busyOff(); }
      netTrouble('다시 잇는 중');
      scheduleRejoin();
    }
  });
}
async function trackMe(status){
  if(!lobby) return;
  try{
    await lobby.track({
      id:me, name:myProfile.nickname, has:found.size>=3, owned:found.size,
      wins:myProfile.wins, losses:myProfile.losses,
      status, ts:Date.now()
    });
  }catch(e){}
}
async function leaveLobby(){
  inLobby=false;
  cancelOutgoing(); closeChallenge();
  closingLobby=true;
  if(lobby){ try{ await lobby.unsubscribe(); }catch(e){} lobby=null; }
  closingLobby=false;
}
addEventListener('beforeunload', ()=>{ if(lobby) lobby.unsubscribe(); });

/* ── 접속자 목록 ── */
function lobbyPlayers(){
  if(!lobby) return [];
  const state=lobby.presenceState();
  return Object.values(state).flat()
    .filter(p=>p && p.id)
    .sort((a,b)=>(b.wins||0)-(a.wins||0));
}
function renderPresence(){
  const others=lobbyPlayers().filter(p=>p.id!==me);
  const ready=others.filter(p=>p.has && p.status!=='busy').length;
  const tag=el('warCount');
  if(tag) tag.textContent = others.length ? `${others.length}인` : '對戰';
  const btn=el('battleBtn');
  if(btn) btn.classList.toggle('alive', ready>0);
  const hdr=el('presTxt');
  if(hdr) hdr.textContent = others.length ? `· 대전청 ${others.length}인` : '';
}
function openLobbyView(){
  drawer.classList.add('open'); scrim.classList.add('open');
  pickMode=false; drawer.classList.remove('pick');
  el('drawerTitle').textContent='대전청';
  switchTab('lobby');
}
function renderLobby(){
  const pane=el('lobbyPane');
  if(!el('lobbyPane').classList.contains('on')) { /* 갱신은 계속 */ }
  if(!inLobby){ pane.innerHTML='<div class="hint">대전청에 들지 않았습니다.</div>'; return; }
  const all=lobbyPlayers();
  const others=all.filter(p=>p.id!==me);
  const mine=`<div class="rank me"><span class="no">我</span>`+
    `<span class="nm">${escapeHTML(myProfile.nickname)} <small style="color:var(--paper-dim)">· 잔혼 ${found.size}종</small></span>`+
    `<span class="wl">${myProfile.wins}승 ${myProfile.losses}패</span></div>`;
  if(!others.length){
    pane.innerHTML = mine +
      '<div class="hint">지금 이 자리에 다른 술사가 없습니다.<br>' +
      '누군가 들어오면 아래 대전 단추에 불이 들어옵니다.</div>' +
      '<div style="text-align:center"><button class="chg out" id="leaveLobbyBtn">닫기</button></div>';
  }else{
    pane.innerHTML = mine + others.map(p=>{
      const busyP = p.status==='busy';
      return `<div class="rank">`+
        `<span class="no" style="color:${p.has?'var(--moss)':'var(--paper-dim)'}">${p.has?'士':'―'}</span>`+
        `<span class="nm">${escapeHTML(p.name||'무명객')}<br>`+
        `<small style="color:var(--paper-dim);font-size:11px">잔혼 ${p.owned||0}종 · ${p.wins||0}승 ${p.losses||0}패</small></span>`+
        (busyP ? `<span class="wl">대전 중</span>`
         : !p.has ? `<span class="wl">준비 안 됨</span>`
         : `<button class="chg" data-id="${p.id}" data-name="${escapeHTML(p.name||'무명객')}">도전</button>`)+
      `</div>`;
    }).join('') + '<div style="text-align:center"><button class="chg out" id="leaveLobbyBtn">닫기</button></div>';
  }
}
el('lobbyPane').addEventListener('click', async e=>{
  if(e.target.id==='leaveLobbyBtn'){ closeDrawer(); return; }
  const b=e.target.closest('button.chg');
  if(!b || !b.dataset.id) return;
  sendChallenge(b.dataset.id, b.dataset.name);
});

/* ── 도전 보내기 ── */
function sendChallenge(toId, toName){
  if(!lobby || pendingOut || busy) return;
  if(found.size<3){ flashMsg('잔혼이 모자라다','대전에는 서로 다른 잔혼 3종이 필요하다.'); return; }
  pendingOut={ to:toId, name:toName, at:Date.now() };
  busy=true; setControls(false);
  closeDrawer();
  showSeeking(true, '청을 보냈다', `${toName}의 응답을 기다립니다`);
  lobby.send({ type:'broadcast', event:'challenge', payload:{
    from:me, to:toId, fromName:myProfile.nickname
  }});
  outTimerId=setTimeout(()=>{
    if(!pendingOut) return;
    const nm=pendingOut.name;
    cancelOutgoing();
    showBattleMsg('응답이 없다', `${nm}이(가) 답하지 않았다.`);
    busy=false; setControls(true);
    openLobbyView();
  }, 25000);
}
function cancelOutgoing(){
  clearTimeout(outTimerId); outTimerId=null;
  pendingOut=null;
  showSeeking(false);
}

/* ── 도전 받기 ── */
let titleFlashId=null;
const BASE_TITLE=document.title;
function alertUser(msg){
  try{ if(navigator.vibrate) navigator.vibrate([90,60,90]); }catch(e){}
  clearInterval(titleFlashId);
  let on=false;
  titleFlashId=setInterval(()=>{
    on=!on;
    document.title = on ? msg : BASE_TITLE;
    if(document.visibilityState==='visible'){
      clearInterval(titleFlashId); document.title=BASE_TITLE;
    }
  }, 700);
}
function stopAlert(){ clearInterval(titleFlashId); document.title=BASE_TITLE; }
addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') stopAlert(); });

function openChallenge(payload){
  SFX.challenge();
  if(document.visibilityState!=='visible') alertUser('전서가 왔다!');
  pendingIn={ from:payload.from, name:payload.fromName };
  el('chbox').style.setProperty('--type', 'var(--cinnabar)');
  el('chTitle').textContent=`${payload.fromName}이(가) 청한다`;
  el('chSub').innerHTML='받으면 각자 잔혼을 고른 뒤 겨룬다.';
  el('challenge').classList.add('on');
  let left=20;
  el('chTimer').textContent=`${left}초 안에 답하라`;
  clearInterval(chTimerId);
  chTimerId=setInterval(()=>{
    left--;
    el('chTimer').textContent=`${left}초 안에 답하라`;
    if(left<=0) declineChallenge();
  },1000);
}
function closeChallenge(){
  stopAlert();
  clearInterval(chTimerId); chTimerId=null;
  pendingIn=null;
  el('challenge').classList.remove('on');
}
function declineChallenge(){
  if(!pendingIn) return;
  const from=pendingIn.from;
  closeChallenge();
  if(lobby) lobby.send({ type:'broadcast', event:'decline', payload:{ from:me, to:from }});
}
function acceptChallenge(){
  if(!pendingIn) return;
  const p=pendingIn;
  closeChallenge();
  const matchId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
  const seed=(Math.random()*2**31)|0;
  const payload={ to:p.from, matchId, seed, fromName:myProfile.nickname };
  sendMatch('accept', payload);
  // 상대가 들어올 때까지 몇 번 더 알린다 (신호 유실 대비)
  clearInterval(acceptResendId);
  let n=0;
  acceptResendId=setInterval(()=>{
    if(joinedMatches.has(matchId) || !match || n++>5){ clearInterval(acceptResendId); return; }
    sendMatch('accept', payload);
  }, 1500);
  closeDrawer();
  trackMe('busy');
  openPicker({ matchId, seed, role:'b', oppId:p.from, oppName:p.name });
}

/* ═══ 정형 문구 — 자유 채팅 대신 정해진 말만 오간다 ═══ */
const TAUNTS = [
  { k:'t1', s:'겨뤄 볼 만하겠군.' },
  { k:'t2', s:'그 정도로 되겠는가.' },
  { k:'t3', s:'손이 떨리는가?' },
  { k:'t4', s:'봐줄 생각은 없다.' },
  { k:'t5', s:'재미있군.' },
  { k:'t6', s:'끝이 보인다.' },
  { k:'t7', s:'운이 좋았을 뿐.' },
  { k:'t8', s:'이만 물러가라.' },
  { k:'t9', s:'잘 싸웠다.' },
  { k:'t10', s:'훌륭하다.' },
  { k:'t11', s:'다시 겨루자.' },
  { k:'t12', s:'미안하군.' },
];
const TAUNT_BY_KEY = Object.fromEntries(TAUNTS.map(t=>[t.k,t.s]));
let currentOpp=null;          // { id, name } — 지금 겨루는 상대
let lastTauntAt=0;
let tauntMuted=false;
const tauntSeen=new Map();    // 상대별 최근 수신 시각 (도배 차단)

function setOpponent(o){
  currentOpp=o;
  el('tauntBtn').style.display = o ? 'grid' : 'none';
  if(!o) closeTauntSheet();
}
function openTauntSheet(){
  if(!currentOpp) return;
  const list=el('tsList');
  if(!list.children.length){
    TAUNTS.forEach(t=>{
      const b=document.createElement('button');
      b.type='button'; b.dataset.k=t.k; b.textContent=t.s;
      b.addEventListener('click', ()=>sendTaunt(t.k));
      list.appendChild(b);
    });
  }
  el('tsMute').checked=tauntMuted;
  el('tauntSheet').classList.add('on');
  SFX.open();
}
function closeTauntSheet(){ el('tauntSheet').classList.remove('on'); }

function sendTaunt(k){
  if(!currentOpp || !TAUNT_BY_KEY[k]) return;
  const now=Date.now();
  if(now-lastTauntAt < 4000){          // 도배 방지
    el('tsList').querySelectorAll('button').forEach(b=>b.disabled=true);
    setTimeout(()=>el('tsList').querySelectorAll('button').forEach(b=>b.disabled=false), 4000-(now-lastTauntAt));
    return;
  }
  lastTauntAt=now;
  sendMatch('taunt', { to:currentOpp.id, name:myProfile.nickname, k });
  showBubble(myProfile.nickname, TAUNT_BY_KEY[k], true);
  closeTauntSheet();
  SFX.tap();
}
let bubbleId=null;
function showBubble(who, text, mine){
  const b=el('bubble');
  el('bubWho').textContent=who;
  el('bubTxt').textContent=text;
  b.classList.toggle('mine', !!mine);
  b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
  clearTimeout(bubbleId);
  bubbleId=setTimeout(()=>b.classList.remove('on'), 3400);
}
function onTaunt(payload){
  if(tauntMuted) return;
  if(!currentOpp || payload.from!==currentOpp.id) return;   // 겨루는 상대의 말만 받는다
  const last=tauntSeen.get(payload.from)||0;
  if(Date.now()-last < 3000) return;
  tauntSeen.set(payload.from, Date.now());
  const line=TAUNT_BY_KEY[payload.k];
  if(!line) return;
  showBubble(payload.name||'상대', line, false);
  SFX.challenge();
}
el('tauntBtn').addEventListener('click', openTauntSheet);
el('tsClose').addEventListener('click', closeTauntSheet);
el('tauntSheet').addEventListener('click', e=>{ if(e.target.id==='tauntSheet') closeTauntSheet(); });
el('tsMute').addEventListener('change', e=>{ tauntMuted=e.target.checked; });

/* ═══ 카드 상세 · 강화 ═══ */
let sheetCard=null;
function openCardSheet(card){
  sheetCard=card;
  const st=statOf(card), P=PASSIVES[card.id], T=TYPES[card.type];
  const echo=found.get(card.id)||0;
  el('csName').textContent=card.name+(st.L?`  +${st.L}`:'');
  el('csSub').textContent=`${T.hanja} ${T.name} · ${TIERS[card.tier].name} · 잔향 ${echo}`;
  el('csStat').innerHTML=`<b>攻 ${st.atk}</b> · <b>血 ${st.hp}</b>`
    + (P?`<br><span style="color:#e0655a">${escapeHTML(P.text)}</span>`:'');
  const cv=el('csArt');
  cv.width=192; cv.height=288;
  cv.getContext('2d').drawImage(faceCanvas(card).face,0,0,192,288);
  const can = st.L<UP_MAX && echo>UP_ECHO && souls()>=UP_COST;
  el('csUp').disabled=!can;
  el('csUpHint').textContent = st.L>=UP_MAX ? '더 오를 곳이 없다'
    : `강화 — 잔향 ${UP_ECHO} · 혼백 ${UP_COST}  (보유 잔향 ${echo-1}, 혼백 ${souls()})`;
  el('cardsheet').classList.add('on');
}
function closeCardSheet(){ el('cardsheet').classList.remove('on'); sheetCard=null; }
async function upgradeCard(){
  const card=sheetCard; if(!card) return;
  const echo=found.get(card.id)||0, L=lv(card.id);
  if(L>=UP_MAX || echo<=UP_ECHO || souls()<UP_COST) return;
  found.set(card.id, echo-UP_ECHO);
  levels.set(card.id, L+1);
  spendSouls(UP_COST);
  saveCard(card.id, echo-UP_ECHO);
  SFX.absorb();
  renderSlot(card, false);
  openCardSheet(card);
  showDossier(card, `${card.name} 강화 +${L+1}`);
}
function chooseAsChampion(){
  const card=sheetCard; if(!card) return;
  closeCardSheet(); closeDrawer();
  setChampion(card, true);
  busy=true; setControls(false);
  showDossier(card, `${card.name}을(를) 대표로 삼았다`);
  summonSolo(card, ()=>{ busy=false; setControls(true); });
  if(!glOK){ busy=false; setControls(true); }
}
el('csClose').addEventListener('click', closeCardSheet);
el('csUp').addEventListener('click', upgradeCard);
el('csChamp').addEventListener('click', chooseAsChampion);

/* ═══ 카드 선택 단계 — 둘 다 완료해야 시작한다 ═══ */
let match=null;   // { matchId, seed, role, oppId, oppName, myCard, oppCard, sent }
let pkTimer=null, pkCountId=null, acceptResendId=null;
const earlyPicks=new Map();   // 선택창보다 먼저 온 상대의 선택
const joinedMatches=new Set();
const sentDecks=new Map();    // 내가 보낸 덱 — 재요청에 답하기 위해 남긴다

const DECK_SIZE=3;
function openPicker(m){
  match={ ...m, myDeck:[], oppDeck:null, sent:false };
  setOpponent({ id:m.oppId, name:m.oppName });
  busy=true; setControls(false);
  showSeeking(false);
  el('pkTitle').textContent='세 잔혼을 고르라';
  el('pkOpp').innerHTML=`맞설 상대<b>${escapeHTML(m.oppName)}</b>`;
  el('pkSel').textContent=`고른 순서대로 세 판을 겨룬다 (0/${DECK_SIZE})`;
  el('pkDone').disabled=true;
  el('pkWait').classList.remove('on');
  el('picker').classList.remove('waiting');
  el('picker').classList.add('on');
  SFX.open();
  buildPickerGrid();

  // 내가 들어왔음을 알린다 (수락 신호 재전송을 멈추게 한다)
  sendMatch('joined', { match:m.matchId, to:m.oppId });

  // 선택창보다 먼저 도착해 있던 상대의 선택을 회수한다
  const early=earlyPicks.get(m.matchId);
  if(early){ earlyPicks.delete(m.matchId); onOpponentPick(early); }

  clearTimeout(pkTimer);
  let left=60;
  el('pkOpp').innerHTML=`맞설 상대<b>${escapeHTML(m.oppName)}</b>`;
  clearInterval(pkCountId);
  pkCountId=setInterval(()=>{
    left--;
    if(!match){ clearInterval(pkCountId); return; }
    if(!match.sent) el('pkSel').dataset.left=left;
    if(left<=0){ clearInterval(pkCountId); abortMatch('시간이 다했다'); }
  },1000);
  pkTimer=setTimeout(()=>{ if(match) abortMatch('시간이 다했다'); }, 62000);
}
/* 브로드캐스트 전송 — 실패해도 게임이 멈추지 않게 감싼다 */
function sendMatch(event, payload){
  if(!lobby) return;
  try{
    const r=lobby.send({ type:'broadcast', event, payload:{ from:me, ...payload }});
    if(r && r.catch) r.catch(e=>console.warn('전송 실패', event, e));
  }catch(e){ console.warn('전송 오류', event, e); }
}
async function buildPickerGrid(){
  const g=el('pkGrid');
  g.innerHTML='';
  const owned=CARDS.filter(c=>found.has(c.id))
    .sort((a,b)=>TIER_ORDER.indexOf(b.tier)-TIER_ORDER.indexOf(a.tier));
  const mine=match ? match.matchId : null;
  for(let i=0;i<owned.length;i++){
    if(match && match.matchId!==mine) return;      // 그 사이 취소됐다
    const card=owned[i];
    const b=document.createElement('button');
    b.className='pk-card'; b.type='button'; b.dataset.id=card.id;
    const cv=document.createElement('canvas');
    cv.width=128; cv.height=192;
    b.appendChild(cv);
    const L=lv(card.id);
    if(L>0){ const g=document.createElement('span'); g.className='lvb'; g.textContent='+'+L; b.appendChild(g); }
    b.addEventListener('click', ()=>selectPick(card));
    g.appendChild(b);
    try{ cv.getContext('2d').drawImage(faceCanvas(card).face,0,0,128,192); }
    catch(e){ console.warn('축소판 실패', card.id, e); }
    if(i%3===2) await new Promise(r=>requestAnimationFrame(()=>r()));
  }
}
function selectPick(card){
  if(!match || match.sent) return;
  const d=match.myDeck;
  const at=d.findIndex(x=>x.id===card.id);
  if(at>=0) d.splice(at,1);
  else if(d.length<DECK_SIZE) d.push(card);
  else { d.shift(); d.push(card); }
  SFX.tap();
  renderDeckState();
}
function renderDeckState(){
  const d=match?match.myDeck:[];
  [...el('pkGrid').children].forEach(b=>{
    const i=d.findIndex(x=>x.id===b.dataset.id);
    b.classList.toggle('sel', i>=0);
    let o=b.querySelector('.ord');
    if(i>=0){
      if(!o){ o=document.createElement('span'); o.className='ord'; b.appendChild(o); }
      o.textContent=['一','二','三'][i]||(i+1);
    }else if(o) o.remove();
  });
  if(!d.length){
    el('pkSel').textContent=`고른 순서대로 세 판을 겨룬다 (0/${DECK_SIZE})`;
  }else{
    el('pkSel').innerHTML=d.map((c,i)=>{
      const st=statOf(c);
      return `<b>${['一','二','三'][i]} ${escapeHTML(c.name)}</b> <span style="color:var(--paper-dim)">攻 ${st.atk}</span>`;
    }).join(' &nbsp;·&nbsp; ') + `  (${d.length}/${DECK_SIZE})`;
  }
  el('pkDone').disabled = d.length!==DECK_SIZE;
}
function confirmPick(){
  if(!match || match.myDeck.length!==DECK_SIZE || match.sent) return;
  match.sent=true;
  el('picker').classList.add('waiting');
  el('pkWait').classList.add('on');
  el('pkWaitTxt').textContent=`${match.oppName}이(가) 고르는 중…`;
  el('pkTitle').textContent='상대를 기다린다';
  busyOn('상대가 고르는 중');
  SFX.tap();
  const deck=match.myDeck.map(c=>({ id:c.id, lv:lv(c.id) }));
  const mid=match.matchId, oppId=match.oppId;
  sentDecks.set(mid, { deck, to:oppId });
  sendMatch('pick', { match:mid, to:oppId, deck });
  let n=0;
  const rid=setInterval(()=>{
    if(!match || match.oppDeck || n++>6){ clearInterval(rid); return; }
    sendMatch('pick', { match:mid, to:oppId, deck });
    if(n>2) sendMatch('needpick', { match:mid, to:oppId });   // 상대에게 다시 보내달라 청한다
  }, 1500);
  tryStartMatch();
}
function onOpponentPick(payload){
  if(!match || payload.match!==match.matchId) return;
  const raw=payload.deck||[];
  const deck=raw.map(x=>({ card:CARD_BY_ID[x.id], lv:x.lv||0 })).filter(x=>x.card);
  if(deck.length!==DECK_SIZE) return;
  match.oppDeck=deck;
  if(!match.sent){
    el('pkWait').classList.add('on');
    el('pkWaitTxt').textContent=`${match.oppName}은(는) 골랐다 — 그대 차례`;
  }
  tryStartMatch();
}
function tryStartMatch(){
  if(!match || !match.sent) return;                 // 완료를 누르지 않았으면 시작하지 않는다
  if(match.myDeck.length!==DECK_SIZE || !match.oppDeck) return;
  const m=match;
  match=null;
  clearTimeout(pkTimer); clearInterval(pkCountId); clearInterval(acceptResendId);
  busyOff();
  el('picker').classList.remove('on','waiting');
  el('pkWait').classList.remove('on');
  const myDeck=m.myDeck.map(c=>({ card:c, lv:lv(c.id) }));
  const A = m.role==='a' ? myDeck : m.oppDeck;
  const B = m.role==='a' ? m.oppDeck : myDeck;
  showSeeking(true, '겨룸이 시작된다', '세 판 두 선승');
  busyOn('전장을 여는 중');
  setTimeout(()=>{
    showSeeking(false);
    busyOff();
    runMatch(A, B, m.seed, {
      online:true, role:m.role, matchId:m.matchId,
      idA: m.role==='a' ? me : m.oppId,
      idB: m.role==='a' ? m.oppId : me,
      oppId:m.oppId,
      myName:myProfile.nickname, foeName:m.oppName
    });
  }, 1100);
}
function abortMatch(reason){
  if(!match) return;
  const m=match; match=null;
  setOpponent(null);
  clearTimeout(pkTimer); clearInterval(pkCountId); clearInterval(acceptResendId);
  busyOff();
  el('picker').classList.remove('on','waiting');
  el('pkWait').classList.remove('on');
  sendMatch('abort', { match:m.matchId, to:m.oppId });
  trackMe('idle');
  showBattleMsg('겨룸이 깨졌다', reason||'');
  busy=false; setControls(true);
  openLobbyView();
}
el('pkDone').addEventListener('click', confirmPick);
el('pkCancel').addEventListener('click', ()=>abortMatch('그대가 물러났다'));

el('champBtn').addEventListener('click', ()=>{
  if(!currentCard || !found.has(currentCard.id)) return;
  setChampion(currentCard, true);
  el('dEcho').textContent=`${currentCard.name}을(를) 대표로 삼았다`;
});
el('chYes').addEventListener('click', acceptChallenge);
el('chNo').addEventListener('click', declineChallenge);

/* ═══ 서고 · 순위 ════════════════════════════ */
const drawer=el('drawer'), scrim=el('scrim');
function openDrawer(pick){
  pickMode=!!pick;
  drawer.classList.toggle('pick', pickMode);
  el('drawerTitle').textContent = pickMode ? '대표로 삼을 잔혼' : '서고';
  if(pickMode) switchTab('grid');
  drawer.classList.add('open'); scrim.classList.add('open');
}
function closeDrawer(){
  drawer.classList.remove('open'); scrim.classList.remove('open');
  pickMode=false; drawer.classList.remove('pick');
}
el('openArchive').addEventListener('click', async ()=>{
  if(busy) return;
  SFX.open();
  openDrawer(false);
  await fillThumbs();
});
el('closeArchive').addEventListener('click', ()=>{ SFX.close(); closeDrawer(); });
scrim.addEventListener('click', ()=>{ SFX.close(); closeDrawer(); });

/* 아직 안 그려진 축소판을 조금씩 채운다 */
let fillingThumbs=false;
async function fillThumbs(){
  if(fillingThumbs) return;
  const todo=[...found.keys()].filter(id=>{
    const b=slotEls.get(id);
    return b && !b.querySelector('canvas.thumb');
  });
  if(!todo.length) return;
  fillingThumbs=true;
  busyOn('서고를 정리하는 중', true);
  for(let i=0;i<todo.length;i++){
    renderSlot(CARD_BY_ID[todo[i]], true, true);
    busyStep((i+1)/todo.length);
    if(i%3===2) await new Promise(r=>requestAnimationFrame(()=>r()));
  }
  busyOff();
  fillingThumbs=false;
}
addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

function switchTab(name){
  [...el('tabs').children].forEach(b=>b.classList.toggle('sel', b.dataset.tab===name));
  el('gridPane').style.display = name==='grid'?'':'none';
  el('boardPane').classList.toggle('on', name==='board');
  el('lobbyPane').classList.toggle('on', name==='lobby');
  el('logPane').classList.toggle('on', name==='log');
  if(name==='lobby') renderLobby();
  if(name==='board') loadBoard();
  if(name==='log') loadLog();
}
/* 대전 기록 */
let lastFoe=null;
async function loadLog(){
  const pane=el('logPane');
  if(!online()){ pane.innerHTML='<div class="hint">접속 상태에서만 볼 수 있습니다.</div>'; return; }
  pane.innerHTML='<div class="hint">불러오는 중…</div>';
  busyOn('기록을 뒤지는 중');
  try{
    const { data, error } = await sb.from('matches')
      .select('id,player_a,player_b,name_a,name_b,deck_a,deck_b,winner,score,created_at')
      .or(`player_a.eq.${me},player_b.eq.${me}`)
      .order('created_at',{ascending:false}).limit(30);
    if(error) throw error;
    const rows=data||[];
    if(!rows.length){ pane.innerHTML='<div class="hint">아직 겨룬 적이 없습니다.</div>'; }
    else{
      const online_=new Set(lobbyPlayers().map(p=>p.id));
      pane.innerHTML=rows.map(r=>{
        const iAmA=r.player_a===me;
        const oppId=iAmA?r.player_b:r.player_a;
        const oppName=(iAmA?r.name_b:r.name_a)||'무명객';
        const won=r.winner===me;
        const myDeck=(iAmA?r.deck_a:r.deck_b)||'';
        const names=myDeck.split(',').map(id=>CARD_BY_ID[id]?CARD_BY_ID[id].name:'?').join(' · ');
        const when=new Date(r.created_at);
        const ago=`${when.getMonth()+1}.${when.getDate()}`;
        const can = oppId && online_.has(oppId);
        return `<div class="rec-row">`+
          `<span class="res ${won?'w':'l'}">${won?'勝':'敗'}</span>`+
          `<span class="who2">${escapeHTML(oppName)} <span style="color:var(--paper-dim)">${r.score||''}</span>`+
          `<small>${escapeHTML(names)} · ${ago}</small></span>`+
          `<button data-opp="${oppId||''}" data-name="${escapeHTML(oppName)}" ${can?'':'disabled'}>다시</button>`+
        `</div>`;
      }).join('');
    }
  }catch(e){
    pane.innerHTML='<div class="hint">기록을 불러오지 못했습니다.</div>';
  }
  busyOff();
}
el('logPane').addEventListener('click', e=>{
  const b=e.target.closest('button[data-opp]');
  if(!b || b.disabled || !b.dataset.opp) return;
  closeDrawer();
  sendChallenge(b.dataset.opp, b.dataset.name);
});
el('tabs').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  switchTab(b.dataset.tab);
});
async function loadBoard(){
  const pane=el('boardPane');
  if(!online()){ pane.innerHTML='<div class="hint">순위는 접속 상태에서만 볼 수 있습니다.</div>'; return; }
  pane.innerHTML='<div class="hint">불러오는 중…</div>';
  busyOn('순위를 세는 중');
  try{
    const { data, error } = await sb.from('profiles')
      .select('id,nickname,wins,losses').order('wins',{ascending:false}).limit(30);
    if(error) throw error;
    const rows=(data||[]).filter(p=>p.wins+p.losses>0);
    if(!rows.length){ pane.innerHTML='<div class="hint">아직 아무도 겨루지 않았습니다.</div>'; return; }
    pane.innerHTML=rows.map((p,i)=>
      `<div class="rank${p.id===me?' me':''}"><span class="no">${i+1}</span>`+
      `<span class="nm">${escapeHTML(p.nickname)}</span>`+
      `<span class="wl">${p.wins}승 ${p.losses}패</span></div>`).join('');
  }catch(e){
    pane.innerHTML='<div class="hint">순위를 불러오지 못했습니다.</div>';
  }
  busyOff();
}
function escapeHTML(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

el('battleBtn').addEventListener('click', ()=>{
  SFX.tap();
  if(busy) return;
  if(!online()){
    flashMsg('접속되지 않았다','대전은 접속 상태에서만 열린다.');
    return;
  }
  if(found.size<3){
    flashMsg('잔혼이 모자라다','대전에는 서로 다른 잔혼 3종이 필요하다.');
    return;
  }
  openLobbyView();
});

const grid=el('grid');
const slotEls=new Map();
function buildGrid(){
  const ordered=[...CARDS].sort((a,b)=>{
    const t=TIER_ORDER.indexOf(b.tier)-TIER_ORDER.indexOf(a.tier);
    return t!==0?t:a.type.localeCompare(b.type);
  });
  ordered.forEach(card=>{
    const b=document.createElement('button');
    b.className='slot'; b.type='button';
    b.style.setProperty('--tier', TYPES[card.type].color);
    b.setAttribute('aria-label','미발견 봉인');
    b.disabled=true;
    b.innerHTML='<span class="locked">封</span>';
    b.addEventListener('click',()=>{
      if(!found.has(card.id)) return;
      if(busy) return;
      SFX.tap();
      openCardSheet(card);
    });
    grid.appendChild(b);
    slotEls.set(card.id,b);
  });
  el('tallyTotal').textContent=CARDS.length;
}
function renderSlot(card,isNew,quiet){
  const b=slotEls.get(card.id);
  if(!b) return;
  const n=found.get(card.id);
  if(isNew){
    b.classList.add('found');
    b.disabled=false;
    b.setAttribute('aria-label',`${card.name} · ${TYPES[card.type].name} · ${TIERS[card.tier].name}`);
    b.innerHTML='<canvas class="thumb" width="128" height="192"></canvas>';
    paintThumb(card);
  }
  if(n>1){
    let d=b.querySelector('.dupes');
    if(!d){ d=document.createElement('span'); d.className='dupes'; b.appendChild(d); }
    d.textContent='×'+n;
  }
  const L=lv(card.id);
  let g=b.querySelector('.lvb');
  if(L>0){
    if(!g){ g=document.createElement('span'); g.className='lvb'; b.appendChild(g); }
    g.textContent='+'+L;
  }else if(g) g.remove();
  if(!quiet){ b.classList.remove('fresh'); void b.offsetWidth; b.classList.add('fresh'); }
}

/* ── 시작 ──────────────────────────────────── */
el('drawOne').addEventListener('click', ()=>{
  const b=el('drawOne');
  b.classList.remove('stamp'); void b.offsetWidth; b.classList.add('stamp');
  SFX.tap(); doDraw(false);
});
el('bulkBtn').addEventListener('click', doDraw100);
addEventListener('beforeunload', ()=>{ if(lobby) lobby.unsubscribe(); });

/* ── 더블탭 확대·핀치·길게눌러 선택 막기 ── */
(function noZoom(){
  let lastTouch=0;
  document.addEventListener('touchend', e=>{
    const now=Date.now();
    if(now-lastTouch<=320){ e.preventDefault(); }   // 더블탭 확대
    lastTouch=now;
  }, { passive:false });
  document.addEventListener('dblclick', e=>e.preventDefault(), { passive:false });
  // iOS 사파리 핀치
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>
    document.addEventListener(ev, e=>e.preventDefault(), { passive:false }));
  // 두 손가락 확대
  document.addEventListener('touchmove', e=>{
    if(e.touches.length>1) e.preventDefault();
  }, { passive:false });
  // Ctrl/⌘ + 휠 확대
  document.addEventListener('wheel', e=>{
    if(e.ctrlKey||e.metaKey) e.preventDefault();
  }, { passive:false });
  // 길게 눌러 뜨는 메뉴 (입력창은 예외)
  document.addEventListener('contextmenu', e=>{
    if(e.target.closest('input,textarea')) return;
    e.preventDefault();
  });
})();

async function boot(){
  setInterval(()=>{ if(online()) accrueSouls(); }, 60*1000);
  initGourd();
  fitSuck();
  buildGrid();
  glOK=initGL();
  if(!glOK){
    el('glError').style.display='grid';
    el('stageEmpty').style.display='none';
  }else{
    resize(); loop();
  }
  await initSupabase();
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(boot).catch(boot);
else boot();
</script>
