<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>잔혼록 殘魂錄</title>
<meta name="description" content="봉인된 잔혼을 해방하고 상극(相剋)으로 겨루는 동양 다크 판타지 온라인 카드 게임.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Brush+Script&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0908;
  --paper:#d9cdb4;
  --paper-dim:#87796a;
  --cinnabar:#9e2b20;
  --gold:#b4903a;
  --edge:rgba(217,205,180,.15);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--ink);color:var(--paper);
  font-family:"Gowun Batang",Georgia,serif;-webkit-font-smoothing:antialiased;
  position:fixed;inset:0;touch-action:manipulation}

.veil{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.veil .haze{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.veil .h1{width:70vmax;height:70vmax;left:-25vmax;top:-25vmax;
  background:radial-gradient(circle,rgba(158,43,32,.22),transparent 65%);
  animation:drift1 34s ease-in-out infinite alternate}
.veil .h2{width:60vmax;height:60vmax;right:-22vmax;top:15vmax;
  background:radial-gradient(circle,rgba(58,84,72,.18),transparent 65%);
  animation:drift2 41s ease-in-out infinite alternate}
.veil .h3{width:80vmax;height:50vmax;left:10vmax;bottom:-25vmax;
  background:radial-gradient(circle,rgba(180,144,58,.10),transparent 65%);
  animation:drift1 47s ease-in-out infinite alternate-reverse}
@keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(6vmax,4vmax,0) scale(1.15)}}
@keyframes drift2{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-7vmax,-5vmax,0) scale(1)}}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 38%,transparent 30%,rgba(5,4,3,.74) 78%,#040302 100%)}
.grain{position:fixed;inset:-50%;z-index:2;pointer-events:none;opacity:.15;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
  animation:grain 1.1s steps(3) infinite}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}

.flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;background:#fff}
.flash.hit{animation:flashHit .22s ease-out}
.flash.crit{animation:flashCrit .3s ease-out}
@keyframes flashHit{0%{opacity:.22}100%{opacity:0}}
@keyframes flashCrit{0%{opacity:.5;background:#ffd9c2}100%{opacity:0}}

.app{position:relative;z-index:3;height:100dvh;display:flex;flex-direction:column;
  padding:calc(var(--sat) + 8px) 14px calc(var(--sab) + 10px);max-width:640px;margin:0 auto}
.app.shk{animation:shakeS .28s ease-out}
.app.shkB{animation:shakeB .38s ease-out}
@keyframes shakeS{0%,100%{transform:translate(0,0)}
  20%{transform:translate(-5px,3px)}40%{transform:translate(4px,-4px)}
  60%{transform:translate(-3px,-2px)}80%{transform:translate(2px,3px)}}
@keyframes shakeB{0%,100%{transform:translate(0,0)}
  15%{transform:translate(-10px,6px) rotate(-.4deg)}30%{transform:translate(9px,-7px) rotate(.4deg)}
  45%{transform:translate(-7px,-5px)}60%{transform:translate(6px,6px)}
  75%{transform:translate(-4px,2px)}90%{transform:translate(3px,-2px)}}

header.masthead{text-align:center;flex:0 0 auto}
.masthead h1{font-family:"Nanum Brush Script",cursive;font-weight:400;
  font-size:clamp(30px,8vw,42px);letter-spacing:.1em;line-height:1;
  text-shadow:0 0 24px rgba(158,43,32,.45),0 2px 0 #000}
.who{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:3px;
  font-family:"Song Myung",serif;font-size:10.5px;letter-spacing:.14em;color:var(--paper-dim)}
.who .dot{width:6px;height:6px;border-radius:50%;background:#5a5148;flex:0 0 auto}
.who .dot.on{background:#7fbf6a;box-shadow:0 0 8px #7fbf6a}
.who button{appearance:none;background:none;border:0;color:inherit;font:inherit;
  cursor:pointer;text-decoration:underline;text-decoration-color:rgba(217,205,180,.25);
  text-underline-offset:3px;padding:2px}
.who .rec{color:var(--gold)}

.stage{position:relative;flex:1 1 auto;min-height:0;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.stage-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;
  gap:8px;pointer-events:none;transition:opacity .6s ease}
.stage-empty.gone{opacity:0}
.stage-empty p{color:var(--paper-dim);font-size:13px;letter-spacing:.12em;line-height:1.9}
.stage-empty .mark{font-family:"Song Myung",serif;font-size:44px;color:rgba(217,205,180,.12);line-height:1.2}
.gl-error{position:absolute;inset:0;display:none;place-content:center;text-align:center;
  color:var(--paper-dim);font-size:13px;line-height:2;padding:0 24px}

/* 매칭 대기 */
.seeking{position:absolute;inset:0;display:none;place-content:center;text-align:center;gap:10px}
.seeking.on{display:grid}
.seeking .sp{width:46px;height:46px;margin:0 auto;border:1px solid rgba(158,43,32,.5);
  border-top-color:var(--cinnabar);border-radius:50%;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seeking p{font-family:"Nanum Brush Script",cursive;font-size:26px;color:var(--paper)}
.seeking small{font-family:"Song Myung",serif;font-size:11px;letter-spacing:.16em;color:var(--paper-dim)}
.seeking button{margin-top:6px;appearance:none;background:none;border:1px solid var(--edge);
  color:var(--paper-dim);font:inherit;font-size:12px;padding:7px 14px;cursor:pointer}

.combat{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;
  gap:10px;padding:4px 2px;pointer-events:none;opacity:0;transition:opacity .35s ease}
.combat.on{opacity:1}
.unit{flex:1 1 0;max-width:46%}
.unit.right{text-align:right}
.uname{font-size:12.5px;font-weight:700;letter-spacing:.04em;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uname small{font-family:"Song Myung",serif;font-weight:400;color:var(--type,var(--gold));margin-left:4px;font-size:11px}
.unit.right .uname small{margin:0 4px 0 0}
.player{font-family:"Song Myung",serif;font-size:10px;letter-spacing:.1em;color:var(--paper-dim);
  margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpbar{height:6px;border:1px solid var(--edge);background:rgba(0,0,0,.5);overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;
  background:linear-gradient(90deg,var(--type,#b4903a),color-mix(in srgb,var(--type,#b4903a) 55%,#fff));
  transition:width .3s ease}
.unit.right .hpbar i{margin-left:auto}
.hpnum{font-family:"Song Myung",serif;font-size:10.5px;color:var(--paper-dim);margin-top:3px;letter-spacing:.06em}

.roundmark{position:absolute;left:50%;top:10px;transform:translateX(-50%);
  font-family:"Nanum Brush Script",cursive;font-size:30px;color:var(--cinnabar);
  text-shadow:0 0 14px rgba(158,43,32,.7);opacity:0;pointer-events:none}
.roundmark.pop{animation:roundPop .8s ease-out}
@keyframes roundPop{0%{opacity:0;transform:translateX(-50%) scale(1.8)}
  25%{opacity:1;transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}

.floater{position:absolute;font-family:"Nanum Brush Script",cursive;font-size:32px;
  pointer-events:none;transform:translate(-50%,-50%);
  text-shadow:0 0 12px currentColor,0 2px 0 #000;animation:floatUp .9s ease-out forwards}
.floater.big{font-size:46px}
.floater.small{font-size:24px;opacity:.85}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}
  18%{opacity:1;transform:translate(-50%,-55%) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}

.dossier{flex:0 0 auto;text-align:center;padding:2px 6px;min-height:100px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;transition:opacity .45s ease}
.dossier.hidden{opacity:0}
.dossier .tierline{display:inline-flex;align-items:center;gap:8px;justify-content:center;
  font-family:"Song Myung",serif;font-size:12px;letter-spacing:.3em;color:var(--tier,#87796a)}
.dossier .tierline i{width:22px;height:1px;background:currentColor;opacity:.5;display:block}
.dossier h2{font-family:"Nanum Brush Script",cursive;font-weight:400;
  font-size:clamp(25px,6.4vw,33px);letter-spacing:.06em;line-height:1.05}
.dossier .stats{font-size:11.5px;letter-spacing:.08em;color:var(--paper-dim)}
.dossier .stats b{color:var(--paper);font-weight:700}
.dossier .stats .adv{color:#96c08a}
.dossier .stats .dis{color:#cf7a6c}
.dossier .record{max-width:40ch;margin:0 auto;color:var(--paper-dim);
  font-size:12px;line-height:1.65;word-break:keep-all}
.dossier .echo{font-size:11px;letter-spacing:.14em;color:var(--gold);opacity:.95}

.bar{flex:0 0 auto;display:flex;gap:9px;align-items:stretch;padding-top:9px}
.seal-btn{position:relative;appearance:none;cursor:pointer;flex:1 1 auto;
  background:linear-gradient(180deg,#1a1410,#0f0c09);
  border:1px solid rgba(180,144,58,.45);color:var(--paper);
  font-family:"Gowun Batang",serif;font-weight:700;
  font-size:15px;letter-spacing:.22em;text-indent:.22em;padding:15px 6px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(217,205,180,.07);
  transition:border-color .3s,box-shadow .3s,transform .12s,color .3s,opacity .3s}
.seal-btn::before,.seal-btn::after{content:"";position:absolute;width:6px;height:6px;border:1px solid rgba(180,144,58,.55)}
.seal-btn::before{left:5px;top:5px;border-right:0;border-bottom:0}
.seal-btn::after{right:5px;bottom:5px;border-left:0;border-top:0}
.seal-btn:active:not(:disabled){transform:translateY(1px)}
.seal-btn:disabled{opacity:.34;cursor:default}
.side-btn{appearance:none;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(180deg,#131009,#0c0a07);
  border:1px solid var(--edge);color:var(--paper-dim);
  font-family:"Gowun Batang",serif;font-weight:700;font-size:12.5px;
  letter-spacing:.08em;padding:0 15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:color .3s,border-color .3s,opacity .3s}
.side-btn small{font-family:"Song Myung",serif;font-size:11px;letter-spacing:.1em;color:var(--gold)}
.side-btn:disabled{opacity:.34;cursor:default}
.side-btn.war{border-color:rgba(158,43,32,.55);color:var(--paper)}
.side-btn.war small{color:#cf7a6c}
.seal-btn:focus-visible,.side-btn:focus-visible,.slot:focus-visible,.drawer-close:focus-visible{
  outline:1px solid var(--gold);outline-offset:2px}
@media (hover:hover){
  .seal-btn:hover:not(:disabled){border-color:rgba(180,144,58,.95);color:#ffedc9;
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 30px rgba(180,144,58,.28),inset 0 1px 0 rgba(217,205,180,.12)}
  .side-btn:hover:not(:disabled){color:var(--paper);border-color:rgba(180,144,58,.5)}
  .side-btn.war:hover:not(:disabled){border-color:rgba(158,43,32,.95)}
}

.scrim{position:fixed;inset:0;z-index:8;background:rgba(4,3,2,.6);
  opacity:0;pointer-events:none;transition:opacity .35s ease;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:9;
  height:min(76dvh,620px);max-width:640px;margin:0 auto;
  background:linear-gradient(180deg,#151009,#0a0807 30%);
  border:1px solid var(--edge);border-bottom:0;border-radius:8px 8px 0 0;
  transform:translateY(102%);transition:transform .42s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.drawer.open{transform:translateY(0)}
.drawer.pick{border-color:rgba(158,43,32,.6)}
.drawer-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:13px 18px 10px;border-bottom:1px solid var(--edge)}
.drawer-head h3{font-family:"Nanum Brush Script",cursive;font-weight:400;
  font-size:23px;letter-spacing:.08em;white-space:nowrap;line-height:1}
.drawer-tabs{display:flex;gap:4px}
.drawer-tabs button{appearance:none;background:none;border:1px solid transparent;
  color:var(--paper-dim);font-family:"Song Myung",serif;font-size:12px;letter-spacing:.1em;
  padding:5px 10px;cursor:pointer;transition:color .25s,border-color .25s}
.drawer-tabs button.sel{color:var(--paper);border-color:var(--edge)}
.drawer-close{appearance:none;background:none;border:1px solid var(--edge);
  color:var(--paper-dim);cursor:pointer;font-family:inherit;font-size:12px;
  letter-spacing:.12em;padding:6px 11px}
.drawer-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:14px 16px calc(var(--sab) + 20px)}
.typelegend{display:flex;justify-content:center;gap:4px;align-items:center;
  font-family:"Song Myung",serif;font-size:13px;color:var(--paper-dim);
  letter-spacing:.05em;margin-bottom:14px}
.typelegend b{font-weight:400;color:var(--c)}
.typelegend span.arr{opacity:.45;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:11px}
.slot{position:relative;aspect-ratio:2/3;border:1px solid var(--edge);
  background:linear-gradient(180deg,#110e0a,#0a0806);overflow:hidden;
  cursor:default;padding:0;appearance:none;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.slot .locked{position:absolute;inset:0;display:grid;place-content:center;opacity:.32;
  color:var(--paper);font-family:"Song Myung",serif;font-size:22px}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.found{cursor:pointer;border-color:color-mix(in srgb,var(--tier) 45%,transparent);
  box-shadow:0 0 16px -6px var(--tier)}
.slot .dupes{position:absolute;right:3px;bottom:3px;font-family:"Song Myung",serif;
  font-size:10.5px;color:var(--paper);background:rgba(6,5,4,.85);
  border:1px solid var(--edge);padding:1px 5px}
.slot.fresh{animation:ignite .9s ease-out}
@keyframes ignite{0%{box-shadow:0 0 0 0 var(--tier)}40%{box-shadow:0 0 36px 4px var(--tier)}100%{box-shadow:0 0 16px -6px var(--tier)}}

.board{display:none}
.board.on{display:block}
.grid.off{display:none}
.rank{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--edge);font-size:13px}
.rank .no{font-family:"Song Myung",serif;color:var(--gold);width:26px;flex:0 0 auto;font-size:13px}
.rank .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .wl{font-family:"Song Myung",serif;font-size:12px;color:var(--paper-dim);flex:0 0 auto}
.rank.me{color:var(--gold)}
.hint{color:var(--paper-dim);font-size:12px;line-height:1.9;text-align:center;padding:22px 10px}

@media (prefers-reduced-motion:reduce){
  .grain,.veil .haze,.seeking .sp{animation:none}
  .slot.fresh{animation:none}
  .drawer,.scrim{transition:none}
  .app.shk,.app.shkB{animation:none}
  .floater{animation-duration:.5s}
}
</style>
</head>
<body>

<div class="veil" aria-hidden="true">
  <div class="haze h1"></div><div class="haze h2"></div><div class="haze h3"></div>
</div>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>

<div class="app" id="app">
  <header class="masthead">
    <h1>잔혼록</h1>
    <div class="who">
      <span class="dot" id="netDot"></span>
      <button id="nameBtn">접속 중…</button>
      <span class="rec" id="recTxt"></span>
    </div>
  </header>

  <section class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="stage-empty" id="stageEmpty">
      <div class="mark">封</div>
      <p>봉인을 해제하면<br>잔혼이 깨어납니다</p>
    </div>
    <div class="gl-error" id="glError">
      <p>3D를 불러오지 못했습니다.<br>네트워크 연결을 확인한 뒤 새로고침해 주세요.</p>
    </div>
    <div class="seeking" id="seeking">
      <div class="sp"></div>
      <p>상대를 찾는 중</p>
      <small id="seekSub">다른 술사가 들어오길 기다립니다</small>
      <div><button id="cancelSeek">물러나기</button></div>
    </div>
    <div class="combat" id="combat">
      <div class="unit left" id="unitL">
        <div class="uname"><span id="nameL"></span><small id="typeL"></small></div>
        <div class="player" id="playerL"></div>
        <div class="hpbar"><i id="hpL"></i></div>
        <div class="hpnum" id="hpnL"></div>
      </div>
      <div class="unit right" id="unitR">
        <div class="uname"><small id="typeR"></small><span id="nameR"></span></div>
        <div class="player" id="playerR"></div>
        <div class="hpbar"><i id="hpR"></i></div>
        <div class="hpnum" id="hpnR"></div>
      </div>
    </div>
    <div class="roundmark" id="roundmark"></div>
  </section>

  <section class="dossier hidden" id="dossier" aria-live="polite">
    <div class="tierline"><i></i><span id="dTierTxt">一</span><i></i></div>
    <h2 id="dName">—</h2>
    <div class="stats" id="dStats"></div>
    <p class="record" id="dRecord"></p>
    <span class="echo" id="dEcho"></span>
  </section>

  <div class="bar">
    <button class="seal-btn" id="drawOne">봉인 해제</button>
    <button class="side-btn war" id="battleBtn">대전<small>對戰</small></button>
    <button class="side-btn" id="openArchive">서고<small><span id="tallyFound">0</span>/<span id="tallyTotal">24</span></small></button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="서고">
  <div class="drawer-head">
    <h3 id="drawerTitle">서고</h3>
    <div class="drawer-tabs" id="tabs">
      <button data-tab="grid" class="sel">書庫</button>
      <button data-tab="board">榜</button>
    </div>
    <button class="drawer-close" id="closeArchive">닫기</button>
  </div>
  <div class="drawer-body">
    <div id="gridPane">
      <div class="typelegend">
        <b style="--c:#d8653a">火</b><span class="arr">▶</span>
        <b style="--c:#8ca44a">腐</b><span class="arr">▶</span>
        <b style="--c:#9aa3b0">鐵</b><span class="arr">▶</span>
        <b style="--c:#6fa8cc">氷</b><span class="arr">▶</span>
        <b style="--c:#d8653a">火</b>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="board" id="boardPane"><div class="hint">불러오는 중…</div></div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ═══════════════════════════════════════════════
   잔혼록 殘魂錄 — 동양 다크 판타지 상극 온라인 카드
   ═══════════════════════════════════════════════

   ┌─ 설정 ─────────────────────────────────────┐
   │ URL 은 이미 넣어두었습니다.                 │
   │ 아래 KEY 한 줄만 채우면 온라인이 켜집니다.  │
   │                                            │
   │ Supabase 대시보드 → Settings → API Keys    │
   │  · Publishable key (sb_publishable_...)    │
   │    없으면 Legacy API Keys 탭의 anon key    │
   │                                            │
   │ 이 키는 공개돼도 되는 값입니다 (RLS 로 보호).│

function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  const t = TIERS[c.tier];
  c.hp  = Math.round(t.hp  * (0.92 + rnd()*0.16));
  c.atk = Math.round(t.atk * (0.92 + rnd()*0.16));

async function initSupabase(){
  if(!window.supabase){ netStatus(false, '라이브러리 없음 · 오프라인'); return; }
  if(!SUPABASE_ANON_KEY){ netStatus(false, 'API 키 미입력 · 오프라인'); return; }
  if(!SUPABASE_URL){ netStatus(false, 'URL 미입력 · 오프라인'); return; }
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let { data:{ session } } = await sb.auth.getSession();
    if(!session){
      const { data, error } = await sb.auth.signInAnonymously();
      if(error) throw error;
      session = data.session;
    }
    me = session.user.id;
    await loadProfile();
    await loadCollection();
    netStatus(true);
  }catch(e){
    console.error('Supabase 연결 실패', e);
    sb=null; me=null;
    netStatus(false, '연결 실패 · 오프라인');
  }
}

  else{

function hexA(hex,a){
  const h=hex.replace('#','');
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}
function fitText(x,text,cx,cy,maxW,size,font){
  let s=size; x.font=font(s);
  while(x.measureText(text).width>maxW && s>16){ s-=1; x.font=font(s); }
  x.fillText(text,cx,cy);
}
function drawCreature(x, cx, cy, drawW, card, rnd){
  const T=TYPES[card.type], rows=SPRITES[card.sprite];
  const HALF=8, COLS=16, ROWS=rows.length;
  const cell=drawW/COLS, totalH=cell*ROWS;
  const ox=cx-drawW/2, oy=cy-totalH/2;
  const halo=x.createRadialGradient(cx,cy,4,cx,cy,drawW*0.9);
  halo.addColorStop(0,hexA(T.glow,0.30)); halo.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=halo; x.fillRect(cx-drawW,cy-drawW,drawW*2,drawW*2);
  const colOf=ch=> ch==='b'?T.body[0] : ch==='d'?T.body[1] : ch==='h'?T.body[2] : ch==='e'?T.eye : null;
  const put=(c,r,col)=>{ x.fillStyle=col; x.fillRect(ox+c*cell, oy+r*cell, cell+0.6, cell+0.6); };
  x.save(); x.shadowColor=T.glow; x.shadowBlur=12;
  for(let r=0;r<ROWS;r++){
    const line=rows[r];
    for(let c=0;c<HALF;c++){
      let ch=line[c];
      if(ch==='.'||ch===undefined) continue;
      if(ch==='b' && rnd()<0.07) ch='h';
      const col=colOf(ch);
      put(c,r,col); put(COLS-1-c,r,col);
    }
  }
  x.restore();
  x.shadowColor=T.eye; x.shadowBlur=10;
  for(let r=0;r<ROWS;r++){
    const line=rows[r];
    for(let c=0;c<HALF;c++){
      if(line[c]!=='e') continue;
      x.fillStyle=T.eye;
      x.fillRect(ox+c*cell+cell*0.12, oy+r*cell+cell*0.12, cell*0.76, cell*0.76);
      x.fillRect(ox+(COLS-1-c)*cell+cell*0.12, oy+r*cell+cell*0.12, cell*0.76, cell*0.76);
    }
  }
  x.shadowBlur=0;
}
function drawFace(card){
  const T=TYPES[card.type], G=TIERS[card.tier];

  for(let i=0;i<22;i++){
    const r=26+rnd()*90, px=rnd()*W, py=rnd()*H;

const stageEl=el('stage'), appEl=el('app'), flashEl=el('flash');

const CARD_W=2.55, CARD_H=3.82;

const cardVert = `
varying vec2 vUv; varying vec3 vView;
void main(){
  vUv = uv;
  vec4 mv = modelViewMatrix * vec4(position,1.0);
  vView = normalize(-mv.xyz);
  gl_Position = projectionMatrix * mv;
}`;
const cardFrag = `
uniform sampler2D map; uniform float uTime; uniform float uReveal;
uniform vec3 uGlow; uniform float uFoil; uniform float uHurt;
varying vec2 vUv; varying vec3 vView;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}
float fbm(vec2 p){ float v=0.0; float a=0.5; for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }
void main(){
  float n = fbm(vUv*5.5 + 3.0);
  float edge = uReveal*1.35 - 0.18;
  if(n > edge) discard;
  vec4 tex = texture2D(map, vUv);
  vec3 col = tex.rgb;
  float burn = smoothstep(edge-0.14, edge, n);
  col = mix(col, uGlow*2.6, burn*burn);
  float f = sin((vUv.x*3.0 + vUv.y*5.0)*3.4 - uTime*1.2 + vView.x*6.0)*0.5+0.5;
  col += uGlow * pow(f,3.0) * uFoil * 0.55;
  vec2 d = abs(vUv-0.5);
  float rim = smoothstep(0.44,0.5,max(d.x,d.y));
  col += uGlow * rim * 0.5;
  col = mix(col, vec3(0.95,0.2,0.12), uHurt*0.65);
  gl_FragColor = vec4(col, 1.0);
}`;

function makeCardMat(tex, glow, foil){
  return new THREE.ShaderMaterial({
    uniforms:{ map:{value:tex}, uTime:{value:0}, uReveal:{value:1},
      uGlow:{value:new THREE.Color(glow)}, uFoil:{value:foil}, uHurt:{value:0} },
    vertexShader:cardVert, fragmentShader:cardFrag, side:THREE.FrontSide

}
function makeUnit(){

  back.rotation.y=Math.PI;

  return { group:g, front, back, home:{x:0,y:0,s:1,ry:0} };
}
function setUnitCard(unit, card){

function radialTex(){

function makePoints(count,size,opacity){

function emit(sys,color,ox,oy,speed,gravity){
  sys.mat.color.set(color); sys.gravity=gravity;
  const p=sys.geo.attributes.position.array;
  for(let i=0;i<sys.count;i++){
    const a=Math.random()*Math.PI*2, r=Math.random()*0.7;
    p[i*3]=ox+Math.cos(a)*r; p[i*3+1]=oy+Math.sin(a)*r*1.2; p[i*3+2]=Math.random()*0.6;
    const sp=speed*(0.5+Math.random());
    sys.vel[i*3]=Math.cos(a)*sp;
    sys.vel[i*3+1]=Math.sin(a)*sp+0.6;
    sys.vel[i*3+2]=(Math.random()-0.5)*0.9;
    sys.life[i]=0.5+Math.random()*0.6;
  }
  sys.geo.attributes.position.needsUpdate=true;
}
function stepPoints(sys,dt){
  const p=sys.geo.attributes.position.array;
  let alive=false;
  for(let i=0;i<sys.count;i++){
    if(sys.life[i]<=0) continue;
    alive=true; sys.life[i]-=dt;
    sys.vel[i*3+1]-=(sys.gravity||2.4)*dt;
    p[i*3]+=sys.vel[i*3]*dt; p[i*3+1]+=sys.vel[i*3+1]*dt; p[i*3+2]+=sys.vel[i*3+2]*dt;
    if(sys.life[i]<=0) p[i*3+1]=999;
  }
  if(alive) sys.geo.attributes.position.needsUpdate=true;
  sys.mat.opacity = alive?0.95:0;
}
const tweens=[];
function tween(dur,step,done,ease){
  if(REDUCED){ step(1); if(done) done(); return; }
  tweens.push({ t:0, dur, step, done, ease: ease||(t=>1-Math.pow(1-t,3)) });
}
function sleep(ms){ return new Promise(r=>setTimeout(r, REDUCED? ms*0.4 : ms)); }
function shake(big){

let summonAnim=null;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn =t=>t*t*t;
function summonSolo(card, then){
  if(!glOK){ if(then) then(); return; }
  foeUnit.group.visible=false;
  setUnitCard(myUnit, card);
  const T=TYPES[card.type];
  myUnit.front.material.uniforms.uReveal.value=0;
  myUnit.back.material.uniforms.uReveal.value=1;
  myUnit.home={x:0,y:0,s:1,ry:0};
  auraMat.color.set(T.glow);
  myUnit.group.visible=true;
  if(REDUCED){
    myUnit.front.material.uniforms.uReveal.value=1;
    myUnit.group.position.set(0,0,0); myUnit.group.rotation.set(0,0,0); myUnit.group.scale.setScalar(1);
    auraMat.opacity=0.3; if(then) then(); return;
  }
  summonAnim={ t:0, dur:1.7, glow:T.glow, then, burstFired:false };
}
function loop(){
  requestAnimationFrame(loop);
  if(!glOK) return;
  const dt=Math.min(clock.getDelta(),0.05), et=clock.elapsedTime;
  myUnit.front.material.uniforms.uTime.value=et;
  foeUnit.front.material.uniforms.uTime.value=et;
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i]; tw.t+=dt;
    const p=Math.min(tw.t/tw.dur,1);
    tw.step(tw.ease(p));
    if(p>=1){ tweens.splice(i,1); if(tw.done) tw.done(); }
  }
  if(summonAnim){
    const a=summonAnim; a.t+=dt;
    const p=Math.min(a.t/a.dur,1), g=myUnit.group;
    g.position.y=-3.0+easeOut(Math.min(p/0.55,1))*3.0;
    g.rotation.y=Math.PI*(1-easeOut(Math.min(p/0.6,1)));
    g.scale.setScalar(0.55+0.45*easeOut(Math.min(p/0.5,1)));
    const rp=Math.max(0,Math.min((a.t-0.7)/0.65,1));
    myUnit.front.material.uniforms.uReveal.value=easeIn(rp)*0.35+rp*0.65;
    auraMat.opacity=Math.min(rp*0.7,0.7)*(0.55+0.45*Math.sin(et*1.6));
    if(!a.burstFired && a.t>0.75){ a.burstFired=true; emit(burst,a.glow,0,0,1.6,2.4); }
    if(p>=1){ summonAnim=null; if(a.then) a.then(); }
  } else if(!battle && myUnit.group.visible){
    const g=myUnit.group;
    g.position.y=REDUCED?0:Math.sin(et*0.85)*0.07;
    tiltX+=(tTiltX-tiltX)*0.07; tiltY+=(tTiltY-tiltY)*0.07;
    g.rotation.y=tiltY+(REDUCED?0:Math.sin(et*0.5)*0.05);
    g.rotation.x=tiltX;
    if(currentCard){
      const T=TYPES[currentCard.type], G=TIERS[currentCard.tier];
      auraMat.opacity=(0.24+0.10*Math.sin(et*1.4))*(0.6+G.foil*0.8);
      auraMat.color.set(T.glow);
    }
  } else if(battle){
    if(!REDUCED){
      myUnit.group.position.y=myUnit.home.y+Math.sin(et*1.6)*0.045;
      foeUnit.group.position.y=foeUnit.home.y+Math.sin(et*1.6+2)*0.045;
    }
    auraMat.opacity=0.10+0.05*Math.sin(et*1.2);
  }
  const dp=dust.geo.attributes.position.array;
  for(let i=0;i<dust.count;i++){
    dp[i*3+1]+=dust.vel[i*3+1]*dt;
    dp[i*3]+=Math.sin(et*0.4+i)*0.004;
    if(dp[i*3+1]>4.5){ dp[i*3+1]=-4.5; dp[i*3]=(Math.random()-0.5)*11; }
  }
  dust.geo.attributes.position.needsUpdate=true;
  stepPoints(burst,dt); stepPoints(sparks,dt);
  aura.rotation.z+=dt*0.05;
  renderer.render(scene,camera);
}

function rollTier(weights){
  const w=weights||Object.fromEntries(TIER_ORDER.map(k=>[k,TIERS[k].weight]));
  const total=TIER_ORDER.reduce((s,k)=>s+w[k],0);
  let r=Math.random()*total;
  for(const k of TIER_ORDER){ r-=w[k]; if(r<=0) return k; }
  return 'scrap';
}
function drawCard(weights){
  const tier=rollTier(weights);
  const pool=CARDS.filter(c=>c.tier===tier);
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ═══ 결정론적 전투 시뮬레이션 ═══════════════
   양쪽 클라이언트가 같은 (cardA, cardB, seed)로
   같은 결과를 계산한다. 서버 판정 불필요.       */
function calcDmg(att, def, rnd){
  const mult=multiplier(att.type,def.type);
  const statF=Math.min(1.35,Math.max(0.75, att.atk/def.atk));
  const frac=0.34*statF*mult*(0.9+rnd()*0.2);
  return { dmg:Math.max(8,Math.round(def.hp*frac)), mult };
}
function simulate(cardA, cardB, seed){
  const rnd=mulberry32(seed>>>0);
  let hpA=cardA.hp, hpB=cardB.hp;
  const rounds=[];
  for(let n=1;n<=4 && hpA>0 && hpB>0;n++){
    const dA=calcDmg(cardA,cardB,rnd);   // A → B
    const dB=calcDmg(cardB,cardA,rnd);   // B → A
    hpB-=dA.dmg; hpA-=dB.dmg;
    rounds.push({ n, dA, dB, hpA, hpB });
  }
  let winner;
  if(hpA<=0 && hpB<=0) winner=(hpA/cardA.hp >= hpB/cardB.hp)?'a':'b';
  else if(hpB<=0) winner='a';
  else if(hpA<=0) winner='b';
  else winner=(hpA/cardA.hp >= hpB/cardB.hp)?'a':'b';
  return { rounds, winner };
}

async function playRound(r, iAmA, myCard, foeCard){
  roundMark(r.n);
  const mg=myUnit.group, fg=foeUnit.group;
  const mx=myUnit.home.x, fx=foeUnit.home.x;
  await new Promise(res=>{

      mg.rotation.z=-0.10*p; fg.rotation.z=0.10*p;
    },res,t=>t*t);
  });
  const toFoe = iAmA ? r.dA : r.dB;
  const toMe  = iAmA ? r.dB : r.dA;
  const myHp  = iAmA ? r.hpA : r.hpB;
  const foeHp = iAmA ? r.hpB : r.hpA;
  const crit = toFoe.mult>1 || toMe.mult>1;
  shake(crit); flash(crit);
  emit(burst, TYPES[myCard.type].glow, 0.1, 0.2, 2.6, 3);
  emit(sparks, '#fff3d9', 0, 0, 3.6, 1.4);
  [myUnit,foeUnit].forEach(u=>{
    const hm=u.front.material.uniforms.uHurt;
    tween(0.08,p=>{hm.value=p;},()=>{ tween(0.25,p=>{hm.value=1-p;}); });
  });
  hudHp('L',myHp,myCard.hp);
  hudHp('R',foeHp,foeCard.hp);
  floater('-'+toMe.dmg, 27, toMe.mult>1?'big':(toMe.mult<1?'small':''));
  floater('-'+toFoe.dmg, 73, toFoe.mult>1?'big':(toFoe.mult<1?'small':''));
  if(toFoe.mult>1 && toMe.mult<1) showBattleMsg('상극 우위!', `${TYPES[myCard.type].hanja}이(가) ${TYPES[foeCard.type].hanja}을(를) 꿰뚫는다`);
  else if(toMe.mult>1 && toFoe.mult<1) showBattleMsg('상극 열세…', `${TYPES[foeCard.type].hanja}이(가) ${TYPES[myCard.type].hanja}을(를) 짓누른다`);

}

async function runBattle(cardA, cardB, seed, opts){
  opts=opts||{};
  const iAmA = opts.role!=='b';
  const myCard = iAmA?cardA:cardB;
  const foeCard= iAmA?cardB:cardA;
  const sim = simulate(cardA,cardB,seed);
  const won = (sim.winner==='a') === iAmA;

  battle=true; busy=true; setControls(false); summonAnim=null;
  setUnitCard(myUnit,myCard); setUnitCard(foeUnit,foeCard);
  const SC=0.74, X=1.55;
  myUnit.home={x:-X,y:0,s:SC,ry:0.24};
  foeUnit.home={x:X,y:0,s:SC,ry:-0.24};
  myUnit.front.material.uniforms.uReveal.value=1;
  foeUnit.front.material.uniforms.uReveal.value=0;
  myUnit.group.visible=true; foeUnit.group.visible=true;

  await new Promise(res=>{
    const g=myUnit.group, from={x:g.position.x, s:g.scale.x};
    tween(0.35,p=>{
      g.position.x=from.x+(myUnit.home.x-from.x)*p;
      g.position.y*=(1-p);
      g.scale.setScalar(from.s+(SC-from.s)*p);
      g.rotation.x*=(1-p); g.rotation.y=g.rotation.y*(1-p)+myUnit.home.ry*p;
    },res);
  });
  foeUnit.group.position.set(foeUnit.home.x,0,0);
  foeUnit.group.scale.setScalar(SC);
  foeUnit.group.rotation.set(0,foeUnit.home.ry,0);
  emit(burst, TYPES[foeCard.type].glow, foeUnit.home.x, 0, 1.8, 2.4);
  await new Promise(res=>{ tween(0.45,p=>{ foeUnit.front.material.uniforms.uReveal.value=p; },res); });

  hudSet('L', myCard, myCard.hp, opts.myName||'나');
  hudSet('R', foeCard, foeCard.hp, opts.foeName||'잔혼');
  combatHud.classList.add('on');
  const m=multiplier(myCard.type,foeCard.type);
  showBattleMsg(`${foeCard.name} 출현`,
    m>1?'상극이 유리하다':(m<1?'상극이 불리하다':'상극은 대등하다'),
    opts.online?`${opts.foeName} 와(과)의 대전`:'');
  await sleep(620);

  for(const r of sim.rounds){ await playRound(r, iAmA, myCard, foeCard); }

  const loser = won?foeUnit:myUnit, winner = won?myUnit:foeUnit;
  shake(true);
  emit(burst, TYPES[loser.card.type].glow, loser.home.x, 0, 3, 3);
  await new Promise(res=>{
    tween(0.5,p=>{ loser.front.material.uniforms.uReveal.value=1-p;
                   loser.back.material.uniforms.uReveal.value=1-p; },res);
  });
  loser.group.visible=false;
  combatHud.classList.remove('on');
  await new Promise(res=>{
    const g=winner.group, fx0=g.position.x, fs=g.scale.x, fr=g.rotation.y;
    tween(0.4,p=>{
      g.position.x=fx0*(1-p);
      g.scale.setScalar(fs+(1-fs)*p);
      g.rotation.y=fr*(1-p);
    },res);
  });
  winner.home={x:0,y:0,s:1,ry:0};
  battle=null;

  if(opts.online) saveResult(won);
  if(opts.online && opts.role==='a'){
    logMatch({ id:opts.matchId, player_a:opts.idA, player_b:opts.idB,
      card_a:cardA.id, card_b:cardB.id, seed, winner: sim.winner==='a'?opts.idA:opts.idB });
  }

  if(won){
    showBattleMsg('승(勝)', `${myCard.name}이(가) 어둠 속에 홀로 남았다.`, '전리품 봉인이 열린다 —');
    currentCard=myCard;
    await sleep(950);
    doDraw(true);
  }else{
    setUnitCard(myUnit, foeCard);
    myUnit.group.visible=true; foeUnit.group.visible=false;
    myUnit.front.material.uniforms.uReveal.value=1;
    myUnit.home={x:0,y:0,s:1,ry:0};
    myUnit.group.position.set(0,0,0); myUnit.group.scale.setScalar(1); myUnit.group.rotation.set(0,0,0);
    showDossier(foeCard, `${myCard.name}은(는) 어둠으로 흩어졌다 · 패(敗)`);
    busy=false; setControls(true);
  }
}

/* ═══ 온라인 매칭 (Realtime Presence) ════════ */
function showSeeking(on, sub){
  el('seeking').classList.toggle('on', on);
  if(sub) el('seekSub').textContent=sub;
  el('stageEmpty').classList.add('gone');
}
async function leaveLobby(){
  seeking=false;
  clearTimeout(seekTimer);
  showSeeking(false);
  if(lobby){ try{ await lobby.unsubscribe(); }catch(e){} lobby=null; }
}
el('cancelSeek').addEventListener('click', async ()=>{
  await leaveLobby();
  busy=false; setControls(true);
  showBattleMsg('물러났다','다음 기회에 겨루자.');
});

async function findMatch(myCard){
  busy=true; setControls(false);
  if(!online()){
    showSeeking(false);
    await runBattle(myCard, drawCard(), (Math.random()*2**31)|0, { myName:'나', foeName:'떠도는 잔혼' });
    return;
  }
  matched=false; seeking=true;
  showSeeking(true, '다른 술사가 들어오길 기다립니다');

  lobby = sb.channel('lobby:jonhonrok', {
    config:{ presence:{ key:me }, broadcast:{ self:false } }
  });

  lobby.on('presence', { event:'sync' }, tryPair);
  lobby.on('broadcast', { event:'pair' }, ({ payload })=>{
    if(matched || payload.b!==me) return;
    matched=true;
    const A=CARD_BY_ID[payload.aCard], B=CARD_BY_ID[payload.bCard];
    if(!A||!B) return;
    leaveLobby();
    runBattle(A, B, payload.seed, {
      online:true, role:'b', matchId:payload.matchId,
      idA:payload.a, idB:payload.b,
      myName:payload.bName, foeName:payload.aName
    });
  });

  await lobby.subscribe(async status=>{
    if(status==='SUBSCRIBED'){
      await lobby.track({ id:me, name:myProfile.nickname, card:myCard.id, waiting:true, ts:Date.now() });
    }
  });

  function tryPair(){
    if(matched || !lobby) return;
    const state=lobby.presenceState();
    const players=Object.values(state).flat().filter(p=>p && p.waiting && p.id && CARD_BY_ID[p.card]);
    if(players.length<2) return;
    players.sort((x,y)=> x.id<y.id?-1:1);
    if(players[0].id!==me) return;              // 가장 작은 id 만 짝을 짓는다
    const opp=players[1];
    matched=true;
    const matchId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
    const seed=(Math.random()*2**31)|0;
    lobby.send({ type:'broadcast', event:'pair', payload:{
      a:me, b:opp.id, matchId, seed,
      aCard:myCard.id, bCard:opp.card,
      aName:myProfile.nickname, bName:opp.name
    }});
    const A=CARD_BY_ID[myCard.id], B=CARD_BY_ID[opp.card];
    leaveLobby();
    runBattle(A, B, seed, {
      online:true, role:'a', matchId,
      idA:me, idB:opp.id,
      myName:myProfile.nickname, foeName:opp.name
    });
  }

  seekTimer=setTimeout(async ()=>{
    if(matched) return;
    await leaveLobby();
    showBattleMsg('상대가 없다','떠도는 잔혼이 대신 나선다.');
    await sleep(700);
    runBattle(myCard, drawCard(), (Math.random()*2**31)|0,
      { myName:myProfile.nickname, foeName:'떠도는 잔혼' });
  }, 15000);
}

/* ═══ 서고 · 순위 ════════════════════════════ */
const drawer=el('drawer'), scrim=el('scrim');
function openDrawer(pick){
  pickMode=!!pick;
  drawer.classList.toggle('pick', pickMode);
  el('drawerTitle').textContent = pickMode ? '대전할 잔혼을 고르라' : '서고';
  if(pickMode) switchTab('grid');
  drawer.classList.add('open'); scrim.classList.add('open');
}
function closeDrawer(){
  drawer.classList.remove('open'); scrim.classList.remove('open');
  pickMode=false; drawer.classList.remove('pick');
}
el('openArchive').addEventListener('click', ()=>{ if(!busy) openDrawer(false); });
el('closeArchive').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);
addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

function switchTab(name){
  [...el('tabs').children].forEach(b=>b.classList.toggle('sel', b.dataset.tab===name));
  el('gridPane').style.display = name==='grid'?'':'none';
  el('boardPane').classList.toggle('on', name==='board');
  if(name==='board') loadBoard();
}
el('tabs').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  switchTab(b.dataset.tab);
});
async function loadBoard(){
  const pane=el('boardPane');
  if(!online()){ pane.innerHTML='<div class="hint">순위는 접속 상태에서만 볼 수 있습니다.</div>'; return; }
  pane.innerHTML='<div class="hint">불러오는 중…</div>';
  try{
    const { data, error } = await sb.from('profiles')
      .select('id,nickname,wins,losses').order('wins',{ascending:false}).limit(30);
    if(error) throw error;
    const rows=(data||[]).filter(p=>p.wins+p.losses>0);
    if(!rows.length){ pane.innerHTML='<div class="hint">아직 아무도 겨루지 않았습니다.</div>'; return; }
    pane.innerHTML=rows.map((p,i)=>
      `<div class="rank${p.id===me?' me':''}"><span class="no">${i+1}</span>`+
      `<span class="nm">${escapeHTML(p.nickname)}</span>`+
      `<span class="wl">${p.wins}승 ${p.losses}패</span></div>`).join('');
  }catch(e){
    pane.innerHTML='<div class="hint">순위를 불러오지 못했습니다.</div>';
  }
}
function escapeHTML(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

el('battleBtn').addEventListener('click', ()=>{
  if(busy) return;
  if(found.size===0){
    showBattleMsg('잔혼이 없다','먼저 봉인을 해제해 대전할 잔혼을 얻으라.');
    return;
  }
  openDrawer(true);
});

const grid=el('grid');
const slotEls=new Map();
function buildGrid(){
  const ordered=[...CARDS].sort((a,b)=>{
    const t=TIER_ORDER.indexOf(b.tier)-TIER_ORDER.indexOf(a.tier);
    return t!==0?t:a.type.localeCompare(b.type);
  });
  ordered.forEach(card=>{
    const b=document.createElement('button');
    b.className='slot'; b.type='button';
    b.style.setProperty('--tier', TYPES[card.type].color);
    b.setAttribute('aria-label','미발견 봉인');
    b.disabled=true;
    b.innerHTML='<span class="locked">封</span>';
    b.addEventListener('click',()=>{
      if(!found.has(card.id)) return;
      if(pickMode){ closeDrawer(); findMatch(card); return; }
      if(busy) return;
      busy=true; setControls(false);
      closeDrawer();
      showDossier(card,'서고에서 다시 불러냈다');
      summonSolo(card, ()=>{ busy=false; setControls(true); });
      if(!glOK){ busy=false; setControls(true); }
    });
    grid.appendChild(b);
    slotEls.set(card.id,b);
  });
  el('tallyTotal').textContent=CARDS.length;
}
function renderSlot(card,isNew,quiet){
  const b=slotEls.get(card.id);
  if(!b) return;
  const n=found.get(card.id);
  if(isNew){
    b.classList.add('found');
    b.disabled=false;
    b.setAttribute('aria-label',`${card.name} · ${TYPES[card.type].name} · ${TIERS[card.tier].name}`);
    b.innerHTML=`<img alt="${card.name}" src="${thumbURL(card)}">`;
  }
  if(n>1){
    let d=b.querySelector('.dupes');
    if(!d){ d=document.createElement('span'); d.className='dupes'; b.appendChild(d); }
    d.textContent='×'+n;
  }
  if(!quiet){ b.classList.remove('fresh'); void b.offsetWidth; b.classList.add('fresh'); }
}

/* ── 시작 ──────────────────────────────────── */
el('drawOne').addEventListener('click', ()=>doDraw(false));
addEventListener('beforeunload', ()=>{ if(lobby) lobby.unsubscribe(); });

async function boot(){
  buildGrid();
  glOK=initGL();
  if(!glOK){
    el('glError').style.display='grid';
    el('stageEmpty').style.display='none';
  }else{
    resize(); loop();
  }
  await initSupabase();
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(boot).catch(boot);
else boot();
</script>
