<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>잔혼록 殘魂錄</title>
<meta name="description" content="봉인된 잔혼을 해방하고 상극(相剋)으로 겨루는 동양 다크 판타지 온라인 카드 게임.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Brush+Script&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080a09;
  --paper:#d9cdb4;
  --paper-dim:#87796a;
  --cinnabar:#8f3128;
  --gold:#a8913f;
  --moss:#6b7a56;
  --mist:#8a968f;
  --damp:#3d453c;
  --edge:rgba(217,205,180,.15);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none}
body,button,.slot,.rank,canvas{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--ink);color:var(--paper);
  font-family:"Gowun Batang",Georgia,serif;-webkit-font-smoothing:antialiased;
  position:fixed;inset:0;touch-action:manipulation;
  text-size-adjust:100%;-webkit-text-size-adjust:100%}

.veil{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.veil .haze{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.veil .h1{width:78vmax;height:78vmax;left:-28vmax;top:-30vmax;
  background:radial-gradient(circle,rgba(107,122,86,.20),transparent 64%);
  animation:drift1 58s ease-in-out infinite alternate}
.veil .h2{width:66vmax;height:66vmax;right:-24vmax;top:12vmax;
  background:radial-gradient(circle,rgba(138,150,143,.14),transparent 66%);
  animation:drift2 71s ease-in-out infinite alternate}
.veil .h3{width:90vmax;height:56vmax;left:6vmax;bottom:-28vmax;
  background:radial-gradient(circle,rgba(143,49,40,.13),transparent 66%);
  animation:drift1 83s ease-in-out infinite alternate-reverse}
/* 낮게 깔린 안개띠 */
.veil .fogband{position:absolute;left:-30%;right:-30%;height:26vh;
  background:linear-gradient(180deg,transparent,rgba(160,170,160,.055) 45%,transparent);
  filter:blur(26px)}
.veil .f1{top:26%;animation:fog 96s linear infinite}
.veil .f2{top:58%;animation:fog 132s linear infinite reverse}
@keyframes fog{from{transform:translateX(-14%)}to{transform:translateX(14%)}}
@keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(5vmax,3vmax,0) scale(1.12)}}
@keyframes drift2{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-7vmax,-5vmax,0) scale(1)}}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,transparent 32%,rgba(6,7,6,.70) 78%,#050605 100%)}
/* 광충(光蟲) — 화면 전체를 느리게 떠다닌다 */
#mushi{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.9}
.grain{position:fixed;inset:-50%;z-index:2;pointer-events:none;opacity:.15;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
  animation:grain 1.1s steps(3) infinite}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}

.flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;background:#fff}
.flash.hit{animation:flashHit .22s ease-out}
.flash.crit{animation:flashCrit .3s ease-out}
@keyframes flashHit{0%{opacity:.22}100%{opacity:0}}
@keyframes flashCrit{0%{opacity:.5;background:#ffd9c2}100%{opacity:0}}

.app{position:relative;z-index:3;height:100dvh;display:flex;flex-direction:column;
  padding:calc(var(--sat) + 8px) 14px calc(var(--sab) + 10px);max-width:640px;margin:0 auto}
.app.shk{animation:shakeS .28s ease-out}
.app.shkB{animation:shakeB .38s ease-out}
@keyframes shakeS{0%,100%{transform:translate(0,0)}
  20%{transform:translate(-5px,3px)}40%{transform:translate(4px,-4px)}
  60%{transform:translate(-3px,-2px)}80%{transform:translate(2px,3px)}}
@keyframes shakeB{0%,100%{transform:translate(0,0)}
  15%{transform:translate(-10px,6px) rotate(-.4deg)}30%{transform:translate(9px,-7px) rotate(.4deg)}
  45%{transform:translate(-7px,-5px)}60%{transform:translate(6px,6px)}
  75%{transform:translate(-4px,2px)}90%{transform:translate(3px,-2px)}}

header.masthead{text-align:center;flex:0 0 auto}
.masthead h1{font-family:"Nanum Brush Script",cursive;font-weight:400;
  font-size:clamp(30px,8vw,42px);letter-spacing:.1em;line-height:1;
  text-shadow:0 0 24px rgba(158,43,32,.45),0 2px 0 #000}
.who{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:3px;
  font-family:"Song Myung",serif;font-size:10.5px;letter-spacing:.14em;color:var(--paper-dim)}
.who .dot{width:6px;height:6px;border-radius:50%;background:#5a5148;flex:0 0 auto}
.who .dot.on{background:#7fbf6a;box-shadow:0 0 8px #7fbf6a}
.who button{appearance:none;background:none;border:0;color:inherit;font:inherit;
  cursor:pointer;text-decoration:underline;text-decoration-color:rgba(217,205,180,.25);
  text-underline-offset:3px;padding:2px}
.who .rec{color:var(--gold)}
.who .pres{color:var(--moss);letter-spacing:.1em}
.champ-btn{appearance:none;cursor:pointer;margin-top:7px;
  background:none;border:1px solid rgba(168,145,63,.45);color:var(--gold);
  font-family:"Gowun Batang",serif;font-size:12px;letter-spacing:.14em;
  padding:7px 15px;transition:border-color .25s,color .25s}
.champ-btn:hover{border-color:var(--gold);color:#f0e0b4}
.champ-tag{font-family:"Song Myung",serif;font-size:11px;letter-spacing:.08em;
  color:var(--moss);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
.slot.champ{border-color:var(--gold);box-shadow:0 0 20px -4px rgba(168,145,63,.8)}
.slot.champ::after{content:"代";position:absolute;left:3px;top:3px;
  font-family:"Song Myung",serif;font-size:11px;color:#0a0806;
  background:var(--gold);padding:1px 5px;line-height:1.4}
.side-btn{position:relative}
.side-btn.war.alive{border-color:rgba(143,49,40,.95);color:var(--paper)}
.side-btn.war.alive small{color:#e0a08c}
.side-btn.war.alive::before{content:"";position:absolute;top:5px;right:5px;
  width:6px;height:6px;border-radius:50%;background:#8fbf72;
  box-shadow:0 0 9px #8fbf72;animation:pulseDot 1.9s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:.4}50%{opacity:1}}

.stage{position:relative;flex:1 1 auto;min-height:0;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.stage-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;
  gap:8px;pointer-events:none;transition:opacity .6s ease}
.stage-empty.gone{opacity:0}
.stage-empty p{color:var(--paper-dim);font-size:13px;letter-spacing:.12em;line-height:1.9}
.stage-empty .mark{font-family:"Song Myung",serif;font-size:44px;color:rgba(217,205,180,.12);line-height:1.2}
.gl-error{position:absolute;inset:0;display:none;place-content:center;text-align:center;
  color:var(--paper-dim);font-size:13px;line-height:2;padding:0 24px}

/* 응답 대기 */
.seeking{position:absolute;inset:0;display:none;place-content:center;text-align:center;gap:10px}
.seeking.on{display:grid}
.seeking .sp{width:46px;height:46px;margin:0 auto;border:1px solid rgba(158,43,32,.5);
  border-top-color:var(--cinnabar);border-radius:50%;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seeking p{font-family:"Nanum Brush Script",cursive;font-size:26px;color:var(--paper)}
.seeking small{font-family:"Song Myung",serif;font-size:11px;letter-spacing:.16em;color:var(--paper-dim)}
.seeking button{margin-top:6px;appearance:none;background:none;border:1px solid var(--edge);
  color:var(--paper-dim);font:inherit;font-size:12px;padding:7px 14px;cursor:pointer}

/* 도전장 */
.challenge{position:fixed;inset:0;z-index:12;display:none;place-content:center;
  background:rgba(4,3,2,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:24px}
.challenge.on{display:grid}
.chbox{max-width:340px;width:100%;text-align:center;padding:26px 22px 20px;
  background:linear-gradient(180deg,#1a1310,#0c0a08);
  border:1px solid rgba(158,43,32,.6);
  box-shadow:0 0 60px rgba(158,43,32,.25),0 20px 60px rgba(0,0,0,.7);
  animation:chIn .35s cubic-bezier(.2,.9,.3,1)}
@keyframes chIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.chbox .seal{font-family:"Song Myung",serif;font-size:12px;letter-spacing:.5em;
  color:var(--cinnabar);text-indent:.5em}
.chbox h4{font-family:"Nanum Brush Script",cursive;font-weight:400;font-size:30px;
  margin:8px 0 4px;line-height:1.15}
.chbox .sub{font-size:12.5px;color:var(--paper-dim);line-height:1.8}
.chbox .sub b{color:var(--type,var(--gold));font-weight:400;font-family:"Song Myung",serif}
.chbox .timer{font-family:"Song Myung",serif;font-size:11px;letter-spacing:.2em;
  color:var(--paper-dim);margin-top:10px}
.chbtns{display:flex;gap:9px;margin-top:16px}
.chbtns button{flex:1 1 0;appearance:none;cursor:pointer;font-family:"Gowun Batang",serif;
  font-weight:700;font-size:14px;letter-spacing:.18em;padding:13px 6px;
  background:linear-gradient(180deg,#1a1410,#0f0c09);color:var(--paper);
  border:1px solid var(--edge);transition:border-color .25s,color .25s}
.chbtns .yes{border-color:rgba(158,43,32,.7)}
.chbtns .yes:hover{border-color:var(--cinnabar);color:#ffd9cf}
.chbtns .no{color:var(--paper-dim)}

/* 입문 관문 */
.gate{position:fixed;inset:0;z-index:20;display:none;place-content:center;
  padding:26px;background:radial-gradient(ellipse at 50% 40%,#0d100e,#040505 70%)}
.gate.on{display:grid}
.gatebox{width:100%;max-width:330px;text-align:center;margin:0 auto}
.gseal{font-family:"Song Myung",serif;font-size:12px;letter-spacing:.55em;
  color:var(--moss);text-indent:.55em}
.gatebox h2{font-family:"Nanum Brush Script",cursive;font-weight:400;
  font-size:52px;line-height:1.1;margin:6px 0 4px;
  text-shadow:0 0 30px rgba(107,122,86,.4)}
.ghint{font-size:12px;color:var(--paper-dim);letter-spacing:.14em;margin-bottom:20px}
.gate input{width:100%;margin-bottom:10px;padding:14px;
  background:rgba(10,12,10,.75);border:1px solid var(--edge);color:var(--paper);
  font-family:"Gowun Batang",serif;font-size:16px;letter-spacing:.06em;
  outline:none;transition:border-color .25s}
.gate input:focus{border-color:rgba(168,145,63,.7)}
.gate input::placeholder{color:#5d5a52}
.gerr{min-height:18px;font-size:12px;color:#cf7a6c;letter-spacing:.06em;margin:2px 0 10px}
.gbtns{display:flex;gap:9px}
.gbtns button{flex:1 1 0;appearance:none;cursor:pointer;
  font-family:"Gowun Batang",serif;font-weight:700;font-size:14px;letter-spacing:.16em;
  padding:14px 6px;background:linear-gradient(180deg,#1a1712,#0e0d0a);
  color:var(--paper);border:1px solid var(--edge);transition:border-color .25s,color .25s,opacity .25s}
.gbtns .gyes{border-color:rgba(168,145,63,.6)}
.gbtns .gyes:hover{border-color:var(--gold);color:#f0e0b4}
.gbtns .gno{color:var(--paper-dim)}
.gbtns button:disabled{opacity:.4;cursor:default}
.who .out{opacity:.7}
.side-btn.admin{border-color:rgba(107,122,86,.6);color:var(--paper)}
.side-btn.admin small{color:var(--moss)}

/* 등급 컷인 */
.cutin{position:fixed;inset:0;z-index:11;display:none;place-content:center;
  pointer-events:none;overflow:hidden;background:rgba(3,2,2,.92)}
.cutin.on{display:grid}
.cutin .band{position:absolute;left:-10%;right:-10%;height:2px;background:var(--cc,#9e2b20);
  box-shadow:0 0 24px var(--cc,#9e2b20);transform-origin:left center}
.cutin .b1{top:38%;animation:bandIn .5s cubic-bezier(.2,.9,.2,1) forwards}
.cutin .b2{top:62%;animation:bandIn .5s .08s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes bandIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cutin .glyph{font-family:"Song Myung",serif;font-size:clamp(120px,42vw,240px);
  line-height:1;color:var(--cc,#9e2b20);text-align:center;
  text-shadow:0 0 60px var(--cc,#9e2b20),0 0 140px rgba(0,0,0,.9);
  animation:glyphIn 1.5s cubic-bezier(.16,.9,.2,1) forwards}
@keyframes glyphIn{
  0%{opacity:0;transform:scale(2.6) rotate(-6deg);filter:blur(14px)}
  22%{opacity:1;transform:scale(1) rotate(0);filter:blur(0)}
  72%{opacity:1;transform:scale(1.04)}
  100%{opacity:0;transform:scale(1.14);filter:blur(3px)}}
.cutin .label{position:absolute;left:0;right:0;bottom:32%;text-align:center;
  font-family:"Nanum Brush Script",cursive;font-size:34px;color:var(--paper);
  letter-spacing:.3em;text-indent:.3em;
  animation:labelIn 1.5s ease-out forwards}
@keyframes labelIn{0%{opacity:0;letter-spacing:.9em}
  28%{opacity:1;letter-spacing:.3em}75%{opacity:1}100%{opacity:0}}

.combat{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;
  gap:10px;padding:4px 2px;pointer-events:none;opacity:0;transition:opacity .35s ease}
.combat.on{opacity:1}
.unit{flex:1 1 0;max-width:46%}
.unit.right{text-align:right}
.uname{font-size:12.5px;font-weight:700;letter-spacing:.04em;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uname small{font-family:"Song Myung",serif;font-weight:400;color:var(--type,var(--gold));margin-left:4px;font-size:11px}
.unit.right .uname small{margin:0 4px 0 0}
.player{font-family:"Song Myung",serif;font-size:10px;letter-spacing:.1em;color:var(--paper-dim);
  margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpbar{height:6px;border:1px solid var(--edge);background:rgba(0,0,0,.5);overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;
  background:linear-gradient(90deg,var(--type,#b4903a),color-mix(in srgb,var(--type,#b4903a) 55%,#fff));
  transition:width .3s ease}
.unit.right .hpbar i{margin-left:auto}
.hpnum{font-family:"Song Myung",serif;font-size:10.5px;color:var(--paper-dim);margin-top:3px;letter-spacing:.06em}

.roundmark{position:absolute;left:50%;top:10px;transform:translateX(-50%);
  font-family:"Nanum Brush Script",cursive;font-size:30px;color:var(--cinnabar);
  text-shadow:0 0 14px rgba(158,43,32,.7);opacity:0;pointer-events:none}
.roundmark.pop{animation:roundPop .8s ease-out}
@keyframes roundPop{0%{opacity:0;transform:translateX(-50%) scale(1.8)}
  25%{opacity:1;transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}

.floater{position:absolute;font-family:"Nanum Brush Script",cursive;font-size:32px;
  pointer-events:none;transform:translate(-50%,-50%);
  text-shadow:0 0 12px currentColor,0 2px 0 #000;animation:floatUp .9s ease-out forwards}
.floater.big{font-size:46px}
.floater.small{font-size:24px;opacity:.85}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}
  18%{opacity:1;transform:translate(-50%,-55%) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}

.dossier{flex:0 0 auto;text-align:center;padding:2px 6px;min-height:96px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;transition:opacity .45s ease}
.dossier.hidden{opacity:0}
.dossier .tierline{display:inline-flex;align-items:center;gap:8px;justify-content:center;
  font-family:"Song Myung",serif;font-size:12px;letter-spacing:.3em;color:var(--tier,#87796a)}
.dossier .tierline i{width:22px;height:1px;background:currentColor;opacity:.5;display:block}
.dossier h2{font-family:"Nanum Brush Script",cursive;font-weight:400;
  font-size:clamp(25px,6.4vw,33px);letter-spacing:.06em;line-height:1.05}
.dossier .stats{font-size:11.5px;letter-spacing:.08em;color:var(--paper-dim)}
.dossier .stats b{color:var(--paper);font-weight:700}
.dossier .stats .adv{color:#96c08a}
.dossier .stats .dis{color:#cf7a6c}
.dossier .record{max-width:40ch;margin:0 auto;color:var(--paper-dim);
  font-size:12px;line-height:1.65;word-break:keep-all}
.dossier .echo{font-size:11px;letter-spacing:.14em;color:var(--gold);opacity:.95}

.bar{flex:0 0 auto;display:flex;gap:9px;align-items:stretch;padding-top:9px}
.seal-btn{position:relative;appearance:none;cursor:pointer;flex:1 1 auto;
  background:linear-gradient(180deg,#1a1410,#0f0c09);
  border:1px solid rgba(180,144,58,.45);color:var(--paper);
  font-family:"Gowun Batang",serif;font-weight:700;
  font-size:15px;letter-spacing:.22em;text-indent:.22em;padding:15px 6px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(217,205,180,.07);
  transition:border-color .3s,box-shadow .3s,transform .12s,color .3s,opacity .3s}
.seal-btn::before,.seal-btn::after{content:"";position:absolute;width:6px;height:6px;border:1px solid rgba(180,144,58,.55)}
.seal-btn::before{left:5px;top:5px;border-right:0;border-bottom:0}
.seal-btn::after{right:5px;bottom:5px;border-left:0;border-top:0}
.seal-btn:active:not(:disabled){transform:translateY(1px)}
.seal-btn:disabled{opacity:.34;cursor:default}
.side-btn{appearance:none;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(180deg,#131009,#0c0a07);
  border:1px solid var(--edge);color:var(--paper-dim);
  font-family:"Gowun Batang",serif;font-weight:700;font-size:12.5px;
  letter-spacing:.08em;padding:0 15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:color .3s,border-color .3s,opacity .3s}
.side-btn small{font-family:"Song Myung",serif;font-size:11px;letter-spacing:.1em;color:var(--gold)}
.side-btn:disabled{opacity:.34;cursor:default}
.side-btn.war{border-color:rgba(158,43,32,.55);color:var(--paper)}
.side-btn.war small{color:#cf7a6c}
.seal-btn:focus-visible,.side-btn:focus-visible,.slot:focus-visible,.drawer-close:focus-visible{
  outline:1px solid var(--gold);outline-offset:2px}
@media (hover:hover){
  .seal-btn:hover:not(:disabled){border-color:rgba(180,144,58,.95);color:#ffedc9;
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 30px rgba(180,144,58,.28),inset 0 1px 0 rgba(217,205,180,.12)}
  .side-btn:hover:not(:disabled){color:var(--paper);border-color:rgba(180,144,58,.5)}
  .side-btn.war:hover:not(:disabled){border-color:rgba(158,43,32,.95)}
}

.scrim{position:fixed;inset:0;z-index:8;background:rgba(4,3,2,.6);
  opacity:0;pointer-events:none;transition:opacity .35s ease;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:9;
  height:min(76dvh,620px);max-width:640px;margin:0 auto;
  background:linear-gradient(180deg,#151009,#0a0807 30%);
  border:1px solid var(--edge);border-bottom:0;border-radius:8px 8px 0 0;
  transform:translateY(102%);transition:transform .42s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.drawer.open{transform:translateY(0)}
.drawer.pick{border-color:rgba(158,43,32,.6)}
.drawer-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:13px 18px 10px;border-bottom:1px solid var(--edge)}
.drawer-head h3{font-family:"Nanum Brush Script",cursive;font-weight:400;
  font-size:23px;letter-spacing:.08em;white-space:nowrap;line-height:1}
.drawer-tabs{display:flex;gap:4px}
.drawer-tabs button{appearance:none;background:none;border:1px solid transparent;
  color:var(--paper-dim);font-family:"Song Myung",serif;font-size:12px;letter-spacing:.1em;
  padding:5px 10px;cursor:pointer;transition:color .25s,border-color .25s}

.typelegend{display:flex;justify-content:center;gap:4px;align-items:center;

  letter-spacing:.05em;margin-bottom:14px}
.typelegend b{font-weight:400;color:var(--c)}
.typelegend span.arr{opacity:.45;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:11px}
.slot{position:relative;aspect-ratio:2/3;border:1px solid var(--edge);
  background:linear-gradient(180deg,#110e0a,#0a0806);overflow:hidden;
  cursor:default;padding:0;appearance:none;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.slot .locked{position:absolute;inset:0;display:grid;place-content:center;opacity:.32;
  color:var(--paper);font-family:"Song Myung",serif;font-size:22px}
.slot img,.slot canvas.thumb{width:100%;height:100%;object-fit:cover;display:block}
.slot.found{cursor:pointer;border-color:color-mix(in srgb,var(--tier) 45%,transparent);
  box-shadow:0 0 16px -6px var(--tier)}
.slot .dupes{position:absolute;right:3px;bottom:3px;font-family:"Song Myung",serif;
  font-size:10.5px;color:var(--paper);background:rgba(6,5,4,.85);
  border:1px solid var(--edge);padding:1px 5px}
.slot.fresh{animation:ignite .9s ease-out}
@keyframes ignite{0%{box-shadow:0 0 0 0 var(--tier)}40%{box-shadow:0 0 36px 4px var(--tier)}100%{box-shadow:0 0 16px -6px var(--tier)}}

.board{display:none}
.board.on{display:block}
.grid.off{display:none}
.rank{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--edge);font-size:13px}
.rank .no{font-family:"Song Myung",serif;color:var(--gold);width:26px;flex:0 0 auto;font-size:13px}
.rank .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .wl{font-family:"Song Myung",serif;font-size:12px;color:var(--paper-dim);flex:0 0 auto}
.rank.me{color:var(--gold)}
.rank .nm small{display:block;margin-top:2px}
button.chg{appearance:none;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(180deg,#241511,#140d0a);
  border:1px solid rgba(158,43,32,.6);color:var(--paper);
  font-family:"Gowun Batang",serif;font-weight:700;font-size:12.5px;
  letter-spacing:.14em;padding:9px 15px;transition:border-color .25s,color .25s}
button.chg:hover{border-color:var(--cinnabar);color:#ffd9cf}
button.chg.out{margin:18px auto 4px;border-color:var(--edge);color:var(--paper-dim);
  background:none;letter-spacing:.2em}
.hint{color:var(--paper-dim);font-size:12px;line-height:1.9;text-align:center;padding:22px 10px}

@media (prefers-reduced-motion:reduce){
  .grain,.veil .haze,.seeking .sp{animation:none}

(function mushiLayer(){
  const cv=document.getElementById('mushi');
  if(!cv) return;
  const g=cv.getContext('2d');
  const dpr=Math.min(devicePixelRatio||1,2);
  let w=0,h=0;
  function fit(){ w=innerWidth; h=innerHeight; cv.width=w*dpr; cv.height=h*dpr;
    cv.style.width=w+'px'; cv.style.height=h+'px'; g.setTransform(dpr,0,0,dpr,0,0); }
  fit(); addEventListener('resize', fit);

  // 미리 그려둔 부드러운 빛 알갱이
  const sp=document.createElement('canvas'); sp.width=sp.height=48;
  const sg=sp.getContext('2d');
  const rg=sg.createRadialGradient(24,24,0,24,24,24);
  rg.addColorStop(0,'rgba(255,255,255,.95)');
  rg.addColorStop(0.22,'rgba(214,232,196,.55)');
  rg.addColorStop(0.55,'rgba(150,178,138,.16)');
  rg.addColorStop(1,'rgba(0,0,0,0)');
  sg.fillStyle=rg; sg.fillRect(0,0,48,48);

  const N = REDUCED ? 14 : 44;
  const bugs=[];
  for(let i=0;i<N;i++){
    bugs.push({
      x:Math.random(), y:Math.random(),
      r:2.5+Math.random()*7,
      vx:(Math.random()-0.5)*0.011,
      vy:-(0.004+Math.random()*0.014),
      ph:Math.random()*6.28,
      sp:0.25+Math.random()*0.6,
      wob:0.0006+Math.random()*0.0018
    });
  }
  let t=0, last=performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min((now-last)/1000,0.05); last=now; t+=dt;
    g.clearRect(0,0,w,h);
    g.globalCompositeOperation='lighter';
    for(const b of bugs){
      b.x += (b.vx + Math.sin(t*b.sp + b.ph)*b.wob)*dt*60/60;
      b.y += b.vy*dt*60/60;
      if(b.y<-0.06){ b.y=1.06; b.x=Math.random(); }

      g.drawImage(sp, b.x*w-s, b.y*h-s, s*2, s*2);
    }
    g.globalAlpha=1;
  }
  requestAnimationFrame(frame);
})();

function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
CARDS.forEach(c=>{
  const rnd = mulberry32(hashStr('stat'+c.id));
  const t = TIERS[c.tier];
  c.hp  = Math.round(t.hp  * (0.92 + rnd()*0.16));
  c.atk = Math.round(t.atk * (0.92 + rnd()*0.16));
});

   Supabase 의 최소 길이 제한을 넘긴다 — 사용자는 짧은 비번을 그대로 쓴다. */

async function initSupabase(){
  if(!window.supabase){ netStatus(false, '라이브러리 없음 · 오프라인'); return; }
  if(!SUPABASE_ANON_KEY){ netStatus(false, 'API 키 미입력 · 오프라인'); return; }
  if(!SUPABASE_URL){ netStatus(false, 'URL 미입력 · 오프라인'); return; }
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ await afterAuth(session); }
    else{ showGate(true); netStatus(false, '들어오지 않음'); }
  }catch(e){
    console.error('Supabase 연결 실패', e);
    sb=null; me=null;
    netStatus(false, '연결 실패 · 오프라인');
  }
}
async function afterAuth(session){
  me = session.user.id;
  myLoginId = (session.user.email||'').split('@')[0];
  showGate(false);
  await loadProfile();

  netStatus(true);

}

function showGate(on){
  el('gate').classList.toggle('on', !!on);
  if(on) setTimeout(()=>el('gateId').focus(), 120);
}
function gateBusy(on){
  el('gateIn').disabled=on; el('gateUp').disabled=on;
}
function gateErr(msg){ el('gateErr').textContent=msg||''; }

async function doAuth(isSignup){
  const id=el('gateId').value.trim().toLowerCase();
  const pw=el('gatePw').value;
  gateErr('');
  if(!/^[a-z0-9_]{2,20}$/.test(id)){ gateErr('아이디는 영문·숫자 2~20자로.'); return; }
  if(pw.length<2){ gateErr('비밀번호가 너무 짧다.'); return; }
  gateBusy(true);
  try{
    if(isSignup){
      const { data, error } = await sb.auth.signUp({
        email: idToEmail(id), password: pwToSecret(pw)
      });
      if(error) throw error;
      if(!data.session){
        gateErr('가입은 됐지만 바로 들어갈 수 없다. Supabase 의 Confirm email 을 꺼라.');
        gateBusy(false); return;
      }
      await insertProfile(data.session.user.id, id);
      await afterAuth(data.session);
    }else{
      const { data, error } = await sb.auth.signInWithPassword({
        email: idToEmail(id), password: pwToSecret(pw)
      });
      if(error) throw error;
      await afterAuth(data.session);
    }
  }catch(e){
    const m=(e&&e.message)||'';
    if(/already registered|already exists/i.test(m)) gateErr('이미 있는 이름이다.');
    else if(/Invalid login/i.test(m)) gateErr('이름이나 표식이 다르다.');
    else gateErr(m||'들어갈 수 없다.');
  }
  gateBusy(false);
}

function strongest(){
  let best=null;
  for(const id of found.keys()){
    const c=CARD_BY_ID[id]; if(!c) continue;
    if(!best || TIER_ORDER.indexOf(c.tier)>TIER_ORDER.indexOf(best.tier)) best=c;
  }
  return best;
}
function resolveChampion(){
  let c = myProfile.champion && found.has(myProfile.champion) ? CARD_BY_ID[myProfile.champion] : null;
  if(!c) c = strongest();
  if(c) setChampion(c, !myProfile.champion || myProfile.champion!==c.id);
  else { champion=null; renderChampUI(); }

/* ═══ 카드 아트 ══════════════════════════════ */
const W=384, H=576;
const faceCache=new Map(), texCache=new Map();
function hexA(hex,a){
  const h=hex.replace('#','');
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}
function fitText(x,text,cx,cy,maxW,size,font){
  let s=size; x.font=font(s);
  while(x.measureText(text).width>maxW && s>16){ s-=1; x.font=font(s); }
  x.fillText(text,cx,cy);
}
function lerpHex(a,b,t){
  const pa=[1,3,5].map(i=>parseInt(a.slice(i,i+2),16));
  const pb=[1,3,5].map(i=>parseInt(b.slice(i,i+2),16));
  return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
function drawCreature(x, cx, cy, drawW, card, rnd){
  const T=TYPES[card.type], rows=SPRITES[card.sprite];
  const HALF=8, COLS=16, ROWS=rows.length;
  const cell=drawW/COLS, totalH=cell*ROWS;
  const ox=cx-drawW/2, oy=cy-totalH/2;

  // 은은한 후광 (약하게 — 형상을 먹지 않도록)
  const halo=x.createRadialGradient(cx,cy,drawW*0.10,cx,cy,drawW*0.82);
  halo.addColorStop(0,hexA(T.glow,0.18));
  halo.addColorStop(0.55,hexA(T.color,0.07));
  halo.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=halo; x.fillRect(cx-drawW,cy-drawW,drawW*2,drawW*2);

  // 발밑 그림자
  x.save();
  const sg=x.createRadialGradient(cx,oy+totalH-cell*0.6,2,cx,oy+totalH-cell*0.6,drawW*0.36);
  sg.addColorStop(0,'rgba(0,0,0,.72)'); sg.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=sg;
  x.beginPath(); x.ellipse(cx, oy+totalH-cell*0.5, drawW*0.34, cell*1.15, 0, 0, 7); x.fill();
  x.restore();

  // 행별 명암 램프 + 좌우 가장자리 림라이트
  const topCol=lerpHex(T.body[0],T.body[2],0.42);
  const botCol=lerpHex(T.body[0],T.body[1],0.62);
  const rimCol=lerpHex(T.body[2],'#ffffff',0.30);
  const put=(c,r,col)=>{ x.fillStyle=col; x.fillRect(ox+c*cell, oy+r*cell, cell+0.6, cell+0.6); };

  // 1) 외곽 어둠 — 실루엣을 배경에서 떼어낸다
  x.save();
  x.fillStyle='rgba(4,3,6,.92)';
  for(let r=0;r<ROWS;r++){
    const line=rows[r];
    for(let c=0;c<HALF;c++){
      if(line[c]==='.'||line[c]===undefined) continue;
      x.fillRect(ox+c*cell-cell*0.34, oy+r*cell-cell*0.34, cell*1.68, cell*1.68);
      x.fillRect(ox+(COLS-1-c)*cell-cell*0.34, oy+r*cell-cell*0.34, cell*1.68, cell*1.68);
    }
  }
  x.restore();

  // 2) 본체
  for(let r=0;r<ROWS;r++){
    const line=rows[r];
    const t=r/(ROWS-1);
    let rim=-1;
    for(let c=0;c<HALF;c++){ if(line[c] && line[c]!=='.'){ rim=c; break; } }
    for(let c=0;c<HALF;c++){
      const ch=line[c];
      if(ch==='.'||ch===undefined) continue;
      let col;
      if(ch==='d')      col=lerpHex(T.body[1],'#000000',0.25);
      else if(ch==='h') col=T.body[2];
      else if(ch==='e') col=T.eye;
      else{
        col=lerpHex(topCol,botCol,t);
        if(c===rim) col=lerpHex(col,rimCol,0.55);
        else if(rnd()<0.06) col=lerpHex(col,T.body[2],0.5);
      }
      put(c,r,col); put(COLS-1-c,r,col);
    }
  }

  // 3) 눈 — 여기에만 강한 발광
  x.save();
  x.shadowColor=T.eye; x.shadowBlur=14;
  for(let r=0;r<ROWS;r++){
    const line=rows[r];
    for(let c=0;c<HALF;c++){
      if(line[c]!=='e') continue;
      x.fillStyle=T.eye;
      x.fillRect(ox+c*cell+cell*0.10, oy+r*cell+cell*0.10, cell*0.80, cell*0.80);
      x.fillRect(ox+(COLS-1-c)*cell+cell*0.10, oy+r*cell+cell*0.10, cell*0.80, cell*0.80);
    }
  }
  x.restore();

  // 4) 상단 스침광 — 위에서 내려오는 빛
  x.save();
  x.globalCompositeOperation='lighter';
  const lg=x.createLinearGradient(0,oy,0,oy+totalH*0.55);
  lg.addColorStop(0,hexA(T.glow,0.16)); lg.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=lg;
  for(let r=0;r<Math.ceil(ROWS*0.55);r++){
    const line=rows[r];
    for(let c=0;c<HALF;c++){
      if(line[c]==='.'||line[c]===undefined) continue;
      x.fillRect(ox+c*cell, oy+r*cell, cell+0.6, cell+0.6);
      x.fillRect(ox+(COLS-1-c)*cell, oy+r*cell, cell+0.6, cell+0.6);
    }
  }
  x.restore();
}

function paperTexture(x, rnd, tone){
  const bg=x.createLinearGradient(0,0,W*0.6,H);
  bg.addColorStop(0,tone[0]); bg.addColorStop(0.55,tone[1]); bg.addColorStop(1,tone[2]);
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  // 먹 얼룩
  for(let i=0;i<26;i++){
    const r=26+rnd()*95, px=rnd()*W, py=rnd()*H;
    const g=x.createRadialGradient(px,py,0,px,py,r);
    g.addColorStop(0,`rgba(${18+rnd()*26|0},${15+rnd()*18|0},${11+rnd()*12|0},${0.10+rnd()*0.13})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
  }
  // 종이 섬유결 (세로 + 가로 미세선)
  x.save();
  for(let i=0;i<190;i++){
    const px=rnd()*W;
    x.strokeStyle=`rgba(217,205,180,${0.012+rnd()*0.028})`;
    x.lineWidth=rnd()<0.15?1.1:0.55;
    x.beginPath(); x.moveTo(px, rnd()*H*0.3);
    x.lineTo(px+(rnd()-0.5)*7, H*(0.55+rnd()*0.45)); x.stroke();
  }
  for(let i=0;i<70;i++){
    const py=rnd()*H;
    x.strokeStyle=`rgba(217,205,180,${0.008+rnd()*0.018})`;
    x.lineWidth=0.5;
    x.beginPath(); x.moveTo(0,py); x.lineTo(W,py+(rnd()-0.5)*5); x.stroke();
  }
  x.restore();
  // 접힌 자국
  for(let i=0;i<2;i++){
    const fy=H*(0.28+rnd()*0.45);
    const fg=x.createLinearGradient(0,fy-9,0,fy+9);
    fg.addColorStop(0,'rgba(0,0,0,0)');
    fg.addColorStop(0.45,'rgba(0,0,0,.30)');
    fg.addColorStop(0.55,'rgba(217,205,180,.055)');
    fg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=fg; x.fillRect(0,fy-9,W,18);
  }
  // 반점
  for(let i=0;i<2200;i++){ x.fillStyle=`rgba(217,205,180,${rnd()*0.042})`; x.fillRect(rnd()*W,rnd()*H,1,1); }
  // 가장자리 그을림
  const burn=x.createRadialGradient(W/2,H*0.45,W*0.30,W/2,H*0.45,W*0.86);
  burn.addColorStop(0,'rgba(0,0,0,0)');
  burn.addColorStop(0.72,'rgba(8,5,3,.42)');
  burn.addColorStop(1,'rgba(4,2,1,.88)');
  x.fillStyle=burn; x.fillRect(0,0,W,H);
}

/* ── 회문(回紋) 띠 ── */
function meander(x, rect, step, col, lw){
  x.strokeStyle=col; x.lineWidth=lw; x.lineJoin='miter';
  const [rx,ry,rw,rh]=rect, u=step, h=step*0.55;
  const run=(x0,y0,dx,dy,len)=>{
    let px=x0, py=y0, drawn=0;
    while(drawn+u<=len){
      x.beginPath();
      x.moveTo(px,py);
      x.lineTo(px+dx*u*0.62, py+dy*u*0.62);
      x.lineTo(px+dx*u*0.62 - dy*h, py+dy*u*0.62 + dx*h);
      x.lineTo(px - dy*h, py + dx*h);
      x.stroke();
      px+=dx*u; py+=dy*u; drawn+=u;
    }
  };
  run(rx,ry, 1,0, rw);
  run(rx+rw,ry, 0,1, rh);
  run(rx+rw,ry+rh, -1,0, rw);
  run(rx,ry+rh, 0,-1, rh);
}

/* ── 여의두(모서리 구름) 문양 ── */
function ruyiCorner(x, cx, cy, s, dx, dy, col, lw){
  x.strokeStyle=col; x.lineWidth=lw; x.lineCap='round';
  x.beginPath();
  x.moveTo(cx+dx*s, cy);
  x.quadraticCurveTo(cx+dx*s*0.45, cy+dy*s*0.10, cx+dx*s*0.42, cy+dy*s*0.42);
  x.quadraticCurveTo(cx+dx*s*0.10, cy+dy*s*0.45, cx, cy+dy*s);
  x.stroke();
  x.beginPath();
  x.arc(cx+dx*s*0.42, cy+dy*s*0.42, s*0.13, 0, Math.PI*2);
  x.stroke();
}

/* ── 등급별 프레임. mask=true 면 금박 마스크(흑백)를 그린다 ── */
function drawFrame(x, card, mask){
  const T=TYPES[card.type], G=TIERS[card.tier];
  const tier=card.tier;
  const ink = c => mask ? '#000' : c;
  const gild = a => mask ? `rgba(255,255,255,${a})` : null;

  if(tier==='scrap'){
    // 거친 목판: 단선 + 헤진 모서리
    if(!mask){
      x.strokeStyle='rgba(140,132,118,.55)'; x.lineWidth=3; x.strokeRect(13,13,W-26,H-26);
      x.strokeStyle='rgba(217,205,180,.10)'; x.lineWidth=1; x.strokeRect(21,21,W-42,H-42);
    }
    return;
  }

  if(tier==='relic'){
    // 청동 테두리 + 못
    if(!mask){
      const g=x.createLinearGradient(0,0,W,H);
      g.addColorStop(0,'#6d7f6a'); g.addColorStop(0.5,'#3c4a3d'); g.addColorStop(1,'#7d8f74');
      x.strokeStyle=g; x.lineWidth=5; x.strokeRect(13,13,W-26,H-26);
      x.strokeStyle='rgba(217,205,180,.14)'; x.lineWidth=1; x.strokeRect(23,23,W-46,H-46);
      [[26,26],[W-26,26],[26,H-26],[W-26,H-26]].forEach(([px,py])=>{
        const rg=x.createRadialGradient(px-2,py-2,0,px,py,6);
        rg.addColorStop(0,'#cbd3c2'); rg.addColorStop(1,'#4a5548');
        x.fillStyle=rg; x.beginPath(); x.arc(px,py,5.5,0,7); x.fill();
      });
    }else{
      x.strokeStyle='rgba(255,255,255,.55)'; x.lineWidth=5; x.strokeRect(13,13,W-26,H-26);
    }
    return;
  }

  if(tier==='omen'){
    // 이중 테두리 + 회문 띠 + 부적 문양
    if(!mask){
      x.strokeStyle=hexA(T.color,.85); x.lineWidth=4; x.strokeRect(12,12,W-24,H-24);
      meander(x,[24,24,W-48,H-48],16,hexA(T.glow,.45),1.2);
      x.strokeStyle='rgba(217,205,180,.13)'; x.lineWidth=1; x.strokeRect(34,34,W-68,H-68);
      // 세로 부적 획 (좌우)
      x.strokeStyle=hexA(T.glow,.28); x.lineWidth=2; x.lineCap='round';
      for(const px of [19, W-19]){
        x.beginPath(); x.moveTo(px,H*0.30); x.lineTo(px,H*0.70); x.stroke();
      }
    }else{
      x.strokeStyle='rgba(255,255,255,.75)'; x.lineWidth=4; x.strokeRect(12,12,W-24,H-24);
      meander(x,[24,24,W-48,H-48],16,'rgba(255,255,255,.5)',1.4);
    }
    return;
  }

  // 금기 — 금박 테두리 + 이중 회문 + 여의두 모서리
  if(!mask){
    const g=x.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#f4dd93'); g.addColorStop(0.28,'#b4903a');
    g.addColorStop(0.5,'#7a5f1e'); g.addColorStop(0.72,'#e6c86f'); g.addColorStop(1,'#8a6c26');
    x.strokeStyle=g; x.lineWidth=7; x.strokeRect(13,13,W-26,H-26);
    x.strokeStyle='rgba(255,240,200,.5)'; x.lineWidth=1; x.strokeRect(9,9,W-18,H-18);
    meander(x,[27,27,W-54,H-54],15,'rgba(244,221,147,.62)',1.4);
    meander(x,[38,38,W-76,H-76],11,'rgba(158,43,32,.42)',1);
    const cs=34;
    ruyiCorner(x,16,16,cs, 1, 1,'rgba(244,221,147,.85)',2);
    ruyiCorner(x,W-16,16,cs,-1, 1,'rgba(244,221,147,.85)',2);
    ruyiCorner(x,16,H-16,cs, 1,-1,'rgba(244,221,147,.85)',2);
    ruyiCorner(x,W-16,H-16,cs,-1,-1,'rgba(244,221,147,.85)',2);
  }else{
    x.strokeStyle='rgba(255,255,255,1)'; x.lineWidth=7; x.strokeRect(13,13,W-26,H-26);
    x.strokeStyle='rgba(255,255,255,.8)'; x.lineWidth=2; x.strokeRect(9,9,W-18,H-18);
    meander(x,[27,27,W-54,H-54],15,'rgba(255,255,255,.85)',1.8);
    const cs=34;
    ruyiCorner(x,16,16,cs, 1, 1,'rgba(255,255,255,.9)',2.5);
    ruyiCorner(x,W-16,16,cs,-1, 1,'rgba(255,255,255,.9)',2.5);
    ruyiCorner(x,16,H-16,cs, 1,-1,'rgba(255,255,255,.9)',2.5);
    ruyiCorner(x,W-16,H-16,cs,-1,-1,'rgba(255,255,255,.9)',2.5);
  }
}

/* ── 낙관 인장 ── */
function seal(x, cx, cy, ss, glyph, gold){
  x.save();
  x.fillStyle = gold ? 'rgba(122,30,22,.95)' : 'rgba(158,43,32,.92)';
  x.fillRect(cx-ss/2, cy-ss/2, ss, ss);
  if(gold){
    x.strokeStyle='rgba(244,221,147,.9)'; x.lineWidth=2;
    x.strokeRect(cx-ss/2+2, cy-ss/2+2, ss-4, ss-4);
  }else{
    x.strokeStyle='rgba(0,0,0,.45)'; x.lineWidth=1.5;
    x.strokeRect(cx-ss/2+2.5, cy-ss/2+2.5, ss-5, ss-5);
  }
  x.fillStyle = gold ? '#f6e3b4' : '#e8dcc4';
  x.textAlign='center'; x.textBaseline='middle';
  x.font=`400 ${Math.round(ss*0.58)}px "Song Myung", serif`;
  x.fillText(glyph, cx, cy+1);
  x.restore();
}

/* 일러스트를 카드에 꽉 채우고(cover) 위·아래를 어둠으로 녹인다 */
function paintArtwork(x, img, card, rnd){
  const iw=img.width||img.naturalWidth, ih=img.height||img.naturalHeight;
  const sc=Math.max(W/iw, H/ih);
  const dw=iw*sc, dh=ih*sc;
  x.save();
  x.drawImage(img, (W-dw)/2, (H-dh)/2 - dh*0.02, dw, dh);

  // 위: 스탯 줄이 읽히도록
  const tg=x.createLinearGradient(0,0,0,H*0.20);
  tg.addColorStop(0,'rgba(4,4,3,.90)'); tg.addColorStop(0.55,'rgba(4,4,3,.35)');
  tg.addColorStop(1,'rgba(4,4,3,0)');
  x.fillStyle=tg; x.fillRect(0,0,W,H*0.20);

  // 아래: 기록·명판이 앉을 자리
  const bgd=x.createLinearGradient(0,H*0.52,0,H);
  bgd.addColorStop(0,'rgba(3,3,2,0)');
  bgd.addColorStop(0.42,'rgba(3,3,2,.62)');
  bgd.addColorStop(0.70,'rgba(3,3,2,.93)');
  bgd.addColorStop(1,'rgba(3,3,2,.99)');
  x.fillStyle=bgd; x.fillRect(0,H*0.52,W,H*0.48);

  // 좌우 가장자리 어둠 — 테두리가 어둠 위에 앉도록
  const sg=x.createLinearGradient(0,0,W,0);
  sg.addColorStop(0,'rgba(3,3,2,.85)'); sg.addColorStop(0.14,'rgba(3,3,2,0)');
  sg.addColorStop(0.86,'rgba(3,3,2,0)'); sg.addColorStop(1,'rgba(3,3,2,.85)');
  x.fillStyle=sg; x.fillRect(0,0,W,H);

  // 화선지 결을 아주 옅게 얹어 프레임과 붙인다
  x.globalAlpha=0.35;
  for(let i=0;i<70;i++){
    const px=rnd()*W;
    x.strokeStyle=`rgba(217,205,180,${0.010+rnd()*0.020})`;
    x.lineWidth=rnd()<0.15?1.1:0.5;
    x.beginPath(); x.moveTo(px, rnd()*H*0.3);
    x.lineTo(px+(rnd()-0.5)*7, H*(0.55+rnd()*0.45)); x.stroke();
  }
  for(let i=0;i<900;i++){ x.fillStyle=`rgba(217,205,180,${rnd()*0.030})`; x.fillRect(rnd()*W,rnd()*H,1,1); }
  x.globalAlpha=1;
  x.restore();
}

function renderFace(card, img, target){
  const T=TYPES[card.type], G=TIERS[card.tier];
  const rnd=mulberry32(hashStr(card.id+card.name));
  const c=(target&&target.face) || document.createElement('canvas');
  c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.clearRect(0,0,W,H);

  const tone = card.tier==='taboo' ? ['#1c1510','#0e0a07','#050302']
             : card.tier==='omen'  ? ['#181320','#0d0a11','#050404']
             : ['#171310','#0d0b09','#050403'];

  if(img){
    paintArtwork(x, img, card, rnd);
  }else{
    paperTexture(x, rnd, tone);
    // 원상(圓相)
    x.save(); x.translate(W/2,H*0.385);
    x.strokeStyle=hexA(T.glow,0.30); x.shadowColor=T.glow; x.shadowBlur=9;
    x.lineWidth=5; x.lineCap='round';
    x.beginPath(); x.arc(0,0,W*0.315,-Math.PI*0.42,Math.PI*1.44); x.stroke();
    if(card.tier==='taboo'||card.tier==='omen'){
      x.lineWidth=1.2; x.globalAlpha=0.5;
      x.beginPath(); x.arc(0,0,W*0.345,-Math.PI*0.36,Math.PI*1.30); x.stroke();
      x.globalAlpha=1;
    }
    x.restore();
    drawCreature(x, W/2, H*0.385, W*0.56, card, rnd);
  }
  x.shadowBlur=0;

  drawFrame(x, card, false);

  // 상단 판: 등급 · 혈 · 공
  x.textAlign='center'; x.textBaseline='middle';
  x.fillStyle=hexA(T.glow,0.95); x.font='400 26px "Song Myung", serif';
  x.fillText(G.numeral, W/2, 50);
  x.font='400 17px "Song Myung", serif'; x.fillStyle='#d3c6ac';
  x.textAlign='left';  x.fillText('血 '+card.hp, 40, 50);
  x.textAlign='right'; x.fillText('攻 '+card.atk, W-40, 50);

  // 기록(플레이버) — 카드 위에 직접 새긴다
  const fy=H-196;
  x.save();
  x.strokeStyle=hexA(T.color,.32); x.lineWidth=1;
  x.beginPath(); x.moveTo(62,fy-16); x.lineTo(W-62,fy-16); x.stroke();
  x.textAlign='center'; x.textBaseline='middle';
  x.font='400 13px "Nanum Myeongjo","Gowun Batang",serif';
  x.fillStyle='rgba(190,178,156,.78)';
  const words=card.record.split(' ');
  let line='', ln=0;
  for(let i=0;i<words.length && ln<2;i++){
    const test=line?line+' '+words[i]:words[i];
    if(x.measureText(test).width>W-112 && line){
      x.fillText(line, W/2, fy+ln*19); ln++; line=words[i];
    } else line=test;
  }
  if(ln<2 && line) x.fillText(line, W/2, fy+ln*19);
  x.restore();

  // 명판
  const plateY=H-142;
  const pg=x.createLinearGradient(0,plateY,0,H-24);
  pg.addColorStop(0,'rgba(0,0,0,0)'); pg.addColorStop(0.35,'rgba(4,3,3,.88)'); pg.addColorStop(1,'rgba(4,3,3,.96)');
  x.fillStyle=pg; x.fillRect(24,plateY,W-48,H-plateY-24);
  x.strokeStyle=hexA(T.color,.4); x.lineWidth=1;
  x.beginPath(); x.moveTo(70,plateY+26); x.lineTo(W-70,plateY+26); x.stroke();

  x.textAlign='center'; x.fillStyle='#ead9b8';
  fitText(x, card.name, W/2, plateY+64, W-92, 44, s=>`400 ${s}px "Nanum Brush Script", cursive`);
  x.fillStyle=hexA(T.glow,0.95); x.font='400 15px "Song Myung", serif';
  x.fillText(`${T.name} · ${G.name}`, W/2, plateY+103);

  // 낙관 — 그림 영역 오른쪽 아래 (전통 낙관 위치)
  seal(x, W-62, H-252, card.tier==='taboo'?42:36, T.hanja, card.tier==='taboo');

  // 금박 마스크
  const mc=(target&&target.mask) || document.createElement('canvas');
  mc.width=W; mc.height=H;
  const mx=mc.getContext('2d');
  mx.fillStyle='#000'; mx.fillRect(0,0,W,H);
  drawFrame(mx, card, true);
  if(card.tier!=='scrap'){
    mx.save(); mx.translate(W/2,H*0.385);
    mx.strokeStyle=`rgba(255,255,255,${card.tier==='taboo'?0.8:0.45})`;
    mx.lineWidth=5; mx.lineCap='round';
    mx.beginPath(); mx.arc(0,0,W*0.315,-Math.PI*0.42,Math.PI*1.44); mx.stroke();
    mx.restore();
  }
  if(target){ target.face=c; target.mask=mc; return target; }
  return { face:c, mask:mc };
}

function drawBack(){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const rnd=mulberry32(7);
  paperTexture(x, rnd, ['#141009','#0a0806','#040303']);
  x.save(); x.translate(W/2,H/2);
  x.strokeStyle='rgba(180,144,58,.55)'; x.shadowColor='rgba(180,144,58,.5)'; x.shadowBlur=10;
  x.lineWidth=6; x.lineCap='round';
  x.beginPath(); x.arc(0,0,W*0.28,-Math.PI*0.45,Math.PI*1.42); x.stroke();
  x.restore();
  x.textAlign='center'; x.textBaseline='middle';
  x.fillStyle='rgba(217,205,180,.78)'; x.font='400 92px "Song Myung", serif';
  x.shadowColor='rgba(180,144,58,.6)'; x.shadowBlur=16;
  x.fillText('封', W/2, H/2+4); x.shadowBlur=0;
  const g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#e6c86f'); g.addColorStop(0.5,'#7a5f1e'); g.addColorStop(1,'#d8bb66');
  x.strokeStyle=g; x.lineWidth=5; x.strokeRect(13,13,W-26,H-26);
  meander(x,[27,27,W-54,H-54],15,'rgba(244,221,147,.35)',1.1);
  seal(x, W-62, H-64, 36, '魂', false);

  const mc=document.createElement('canvas'); mc.width=W; mc.height=H;
  const mx=mc.getContext('2d');
  mx.fillStyle='#000'; mx.fillRect(0,0,W,H);
  mx.strokeStyle='rgba(255,255,255,.9)'; mx.lineWidth=5; mx.strokeRect(13,13,W-26,H-26);
  meander(mx,[27,27,W-54,H-54],15,'rgba(255,255,255,.6)',1.4);
  mx.save(); mx.translate(W/2,H/2);
  mx.strokeStyle='rgba(255,255,255,.5)'; mx.lineWidth=6; mx.lineCap='round';
  mx.beginPath(); mx.arc(0,0,W*0.28,-Math.PI*0.45,Math.PI*1.42); mx.stroke();
  mx.restore();
  return { face:c, mask:mc };
}

/* 일러스트 로딩 — 도착하면 그 카드만 제자리에서 다시 그린다 */
const artImgs=new Map();      // id -> HTMLImageElement (로드 완료)
const artPending=new Set();
/* 경로 후보를 만든다 — 전체 URL 이거나 슬래시가 있으면 그대로 쓴다 */
function artCandidates(v){
  if(Array.isArray(v)) return v;
  if(/^(https?:)?\/\//.test(v) || v.includes('/')) return [v];
  return ['art/'+v, 'images/'+v, 'assets/'+v, v];
}
function ensureArt(card){
  const raw=ART[card.id];
  if(!raw || artImgs.has(card.id) || artPending.has(card.id)) return;
  const list=artCandidates(raw);
  artPending.add(card.id);
  let i=0;
  const tryNext=()=>{
    if(i>=list.length){
      artPending.delete(card.id);
      console.warn(`[${card.id}] 그림을 못 찾았다. 시도한 경로:`, list);
      return;
    }
    const url=list[i++];
    const im=new Image();
    im.crossOrigin='anonymous';
    im.onload=()=>{
      artPending.delete(card.id);
      artImgs.set(card.id, im);
      console.log(`[${card.id}] 그림 적용:`, url);
      refreshCard(card);
    };
    im.onerror=()=>{ tryNext(); };
    im.src=url;
  };
  tryNext();
}
function refreshCard(card){
  const cv=faceCache.get(card.id);
  if(!cv) return;
  renderFace(card, artImgs.get(card.id)||null, cv);   // 같은 캔버스에 덮어 그린다
  const tx=texCache.get(card.id);
  if(tx){ tx.t.needsUpdate=true; tx.m.needsUpdate=true; }
  paintThumb(card);
}
function faceCanvas(card){
  if(!faceCache.has(card.id)){
    faceCache.set(card.id, renderFace(card, artImgs.get(card.id)||null, null));
    ensureArt(card);
  }
  return faceCache.get(card.id);          // { face, mask }
}
/* 서고 축소판 — dataURL 대신 캔버스를 직접 넣어 CORS 오염을 피한다 */
function paintThumb(card){
  const b=slotEls.get(card.id);
  if(!b) return;
  const cv=b.querySelector('canvas.thumb');
  if(!cv) return;
  cv.getContext('2d').drawImage(faceCanvas(card).face,0,0,128,192);
}

/* ═══ three.js ═══════════════════════════════ */
const stageEl=el('stage'), appEl=el('app'), flashEl=el('flash');
let renderer=null, scene, camera, clock, softTex, backTex, backMask;
let myUnit=null, foeUnit=null, aura, auraMat, dust, burst, sparks, motes;
let moteType=null;
let glOK=false;
const CARD_W=2.55, CARD_H=3.82;

const cardVert = `
varying vec2 vUv; varying vec3 vView;
void main(){
  vUv = uv;
  vec4 mv = modelViewMatrix * vec4(position,1.0);
  vView = normalize(-mv.xyz);
  gl_Position = projectionMatrix * mv;
}`;
const cardFrag = `
uniform sampler2D map; uniform sampler2D uMask;
uniform float uTime; uniform float uReveal;
uniform vec3 uGlow; uniform float uFoil; uniform float uHurt;
varying vec2 vUv; varying vec3 vView;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}
float fbm(vec2 p){ float v=0.0; float a=0.5; for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }
void main(){
  float n = fbm(vUv*5.5 + 3.0);
  float edge = uReveal*1.35 - 0.18;
  if(n > edge) discard;
  vec4 tex = texture2D(map, vUv);
  vec3 col = tex.rgb;
  float burn = smoothstep(edge-0.14, edge, n);
  col = mix(col, uGlow*2.6, burn*burn);
  // 금박 홀로그램 — 마스크 영역에서만 각도에 따라 무지개가 흐른다
  float gild = texture2D(uMask, vUv).r;
  float ang = vUv.x*2.2 + vUv.y*1.4 + vView.x*3.2 + vView.y*2.0 - uTime*0.25;
  vec3 rainbow = 0.5 + 0.5*cos(6.28318*(vec3(0.0,0.33,0.67) + ang));
  float sheen = pow(0.5+0.5*sin(ang*6.2831), 2.0);
  col += rainbow * gild * (0.35 + uFoil*0.85) * (0.35 + sheen*0.65);
  col += vec3(1.0) * gild * pow(sheen,6.0) * (0.25 + uFoil*0.5);
  float f = sin((vUv.x*3.0 + vUv.y*5.0)*3.4 - uTime*1.2 + vView.x*6.0)*0.5+0.5;
  col += uGlow * pow(f,3.0) * uFoil * 0.25;
  vec2 d = abs(vUv-0.5);
  float rim = smoothstep(0.44,0.5,max(d.x,d.y));
  col += uGlow * rim * 0.5;
  col = mix(col, vec3(0.95,0.2,0.12), uHurt*0.65);
  gl_FragColor = vec4(col, 1.0);
}`;

function makeCardMat(tex, mask, glow, foil){
  return new THREE.ShaderMaterial({
    uniforms:{ map:{value:tex}, uMask:{value:mask}, uTime:{value:0}, uReveal:{value:1},
      uGlow:{value:new THREE.Color(glow)}, uFoil:{value:foil}, uHurt:{value:0} },
    vertexShader:cardVert, fragmentShader:cardFrag, side:THREE.FrontSide
  });
}
function makeUnit(){
  const g=new THREE.Group();
  const front=new THREE.Mesh(new THREE.PlaneGeometry(CARD_W,CARD_H,1,1), makeCardMat(backTex,backMask,'#b4903a',0.35));

function emit(sys,color,ox,oy,speed,gravity){
  sys.mat.color.set(color); sys.gravity=gravity;
  const p=sys.geo.attributes.position.array;
  for(let i=0;i<sys.count;i++){
    const a=Math.random()*Math.PI*2, r=Math.random()*0.7;
    p[i*3]=ox+Math.cos(a)*r; p[i*3+1]=oy+Math.sin(a)*r*1.2; p[i*3+2]=Math.random()*0.6;
    const sp=speed*(0.5+Math.random());
    sys.vel[i*3]=Math.cos(a)*sp;
    sys.vel[i*3+1]=Math.sin(a)*sp+0.6;
    sys.vel[i*3+2]=(Math.random()-0.5)*0.9;
    sys.life[i]=0.5+Math.random()*0.6;
  }
  sys.geo.attributes.position.needsUpdate=true;
}
function stepPoints(sys,dt){
  const p=sys.geo.attributes.position.array;
  let alive=false;
  for(let i=0;i<sys.count;i++){
    if(sys.life[i]<=0) continue;
    alive=true; sys.life[i]-=dt;
    sys.vel[i*3+1]-=(sys.gravity||2.4)*dt;
    p[i*3]+=sys.vel[i*3]*dt; p[i*3+1]+=sys.vel[i*3+1]*dt; p[i*3+2]+=sys.vel[i*3+2]*dt;
    if(sys.life[i]<=0) p[i*3+1]=999;
  }
  if(alive) sys.geo.attributes.position.needsUpdate=true;
  sys.mat.opacity = alive?0.95:0;
}
/* 속성별 상시 입자 — 겁화는 불티, 서리는 눈발, 부패는 포자, 강철은 쇳가루 */
const MOTE_BOX={ x:4.6, y:5.4 };
function setMotes(type){
  if(!motes) return;
  moteType=type;
  const T=TYPES[type];
  motes.mat.color.set(T.glow);
  motes.mat.size = type==='iron'?0.042 : type==='frost'?0.075 : 0.062;
  const p=motes.geo.attributes.position.array;
  for(let i=0;i<motes.count;i++){
    p[i*3]  =(Math.random()-0.5)*MOTE_BOX.x;
    p[i*3+1]=(Math.random()-0.5)*MOTE_BOX.y;
    p[i*3+2]=0.35+Math.random()*1.0;
    if(type==='ember'){ motes.vel[i*3]= (Math.random()-0.5)*0.16; motes.vel[i*3+1]= 0.32+Math.random()*0.6; }
    else if(type==='frost'){ motes.vel[i*3]=(Math.random()-0.5)*0.3; motes.vel[i*3+1]=-(0.26+Math.random()*0.4); }
    else if(type==='rot'){ motes.vel[i*3]=(Math.random()-0.5)*0.17; motes.vel[i*3+1]=(Math.random()-0.5)*0.17; }
    else { motes.vel[i*3]=(Math.random()-0.5)*0.09; motes.vel[i*3+1]=(Math.random()-0.5)*0.09; }
    motes.life[i]=Math.random()*6.28;
  }
  motes.geo.attributes.position.needsUpdate=true;
}
function stepMotes(dt, et, visible){
  if(!motes) return;
  if(!visible || !moteType){ motes.mat.opacity=0; return; }
  const base = moteType==='rot'?0.30 : moteType==='iron'?0.42 : moteType==='frost'?0.40 : 0.48;
  motes.mat.opacity = base + 0.12*Math.sin(et*2.1);
  const p=motes.geo.attributes.position.array;
  for(let i=0;i<motes.count;i++){
    p[i*3]  += (motes.vel[i*3] + Math.sin(et*0.7 + motes.life[i])*0.05)*dt;
    p[i*3+1]+= motes.vel[i*3+1]*dt;
    if(p[i*3+1] >  MOTE_BOX.y/2) p[i*3+1] = -MOTE_BOX.y/2;
    if(p[i*3+1] < -MOTE_BOX.y/2) p[i*3+1] =  MOTE_BOX.y/2;
    if(p[i*3] >  MOTE_BOX.x/2) p[i*3] = -MOTE_BOX.x/2;
    if(p[i*3] < -MOTE_BOX.x/2) p[i*3] =  MOTE_BOX.x/2;
  }
  motes.geo.attributes.position.needsUpdate=true;
}

const tweens=[];
function tween(dur,step,done,ease){
  if(REDUCED){ step(1); if(done) done(); return; }

let summonAnim=null;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn =t=>t*t*t;
function summonSolo(card, then){
  if(!glOK){ if(then) then(); return; }
  foeUnit.group.visible=false;
  setUnitCard(myUnit, card);
  const T=TYPES[card.type];
  myUnit.front.material.uniforms.uReveal.value=0;
  myUnit.back.material.uniforms.uReveal.value=1;
  myUnit.home={x:0,y:0,s:1,ry:0};
  auraMat.color.set(T.glow);
  myUnit.group.visible=true;
  if(REDUCED){
    myUnit.front.material.uniforms.uReveal.value=1;
    myUnit.group.position.set(0,0,0); myUnit.group.rotation.set(0,0,0); myUnit.group.scale.setScalar(1);
    auraMat.opacity=0.3; if(then) then(); return;
  }
  summonAnim={ t:0, dur:1.7, glow:T.glow, then, burstFired:false };
}
function loop(){
  requestAnimationFrame(loop);
  if(!glOK) return;
  const dt=Math.min(clock.getDelta(),0.05), et=clock.elapsedTime;
  myUnit.front.material.uniforms.uTime.value=et;
  foeUnit.front.material.uniforms.uTime.value=et;
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i]; tw.t+=dt;
    const p=Math.min(tw.t/tw.dur,1);
    tw.step(tw.ease(p));
    if(p>=1){ tweens.splice(i,1); if(tw.done) tw.done(); }
  }
  if(summonAnim){
    const a=summonAnim; a.t+=dt;
    const p=Math.min(a.t/a.dur,1), g=myUnit.group;
    g.position.y=-3.0+easeOut(Math.min(p/0.55,1))*3.0;
    g.rotation.y=Math.PI*(1-easeOut(Math.min(p/0.6,1)));
    g.scale.setScalar(0.55+0.45*easeOut(Math.min(p/0.5,1)));
    const rp=Math.max(0,Math.min((a.t-0.7)/0.65,1));
    myUnit.front.material.uniforms.uReveal.value=easeIn(rp)*0.35+rp*0.65;
    auraMat.opacity=Math.min(rp*0.7,0.7)*(0.55+0.45*Math.sin(et*1.6));
    if(!a.burstFired && a.t>0.75){ a.burstFired=true; emit(burst,a.glow,0,0,1.6,2.4); }
    if(p>=1){ summonAnim=null; if(a.then) a.then(); }
  } else if(!battle && myUnit.group.visible){
    const g=myUnit.group;
    g.position.y=REDUCED?0:Math.sin(et*0.85)*0.07;
    tiltX+=(tTiltX-tiltX)*0.07; tiltY+=(tTiltY-tiltY)*0.07;
    g.rotation.y=tiltY+(REDUCED?0:Math.sin(et*0.5)*0.05);
    g.rotation.x=tiltX;
    if(currentCard){
      const T=TYPES[currentCard.type], G=TIERS[currentCard.tier];
      auraMat.opacity=(0.24+0.10*Math.sin(et*1.4))*(0.6+G.foil*0.8);
      auraMat.color.set(T.glow);
    }
  } else if(battle){
    if(!REDUCED){
      myUnit.group.position.y=myUnit.home.y+Math.sin(et*1.6)*0.045;
      foeUnit.group.position.y=foeUnit.home.y+Math.sin(et*1.6+2)*0.045;
    }
    auraMat.opacity=0.10+0.05*Math.sin(et*1.2);
  }
  const dp=dust.geo.attributes.position.array;
  for(let i=0;i<dust.count;i++){
    dp[i*3+1]+=dust.vel[i*3+1]*dt;
    dp[i*3]+=Math.sin(et*0.4+i)*0.004;
    if(dp[i*3+1]>4.5){ dp[i*3+1]=-4.5; dp[i*3]=(Math.random()-0.5)*11; }
  }
  dust.geo.attributes.position.needsUpdate=true;
  stepPoints(burst,dt); stepPoints(sparks,dt);
  stepMotes(dt, et, myUnit.group.visible || (foeUnit && foeUnit.group.visible));
  aura.rotation.z+=dt*0.05;
  renderer.render(scene,camera);
}

function rollTier(weights){
  const w=weights||Object.fromEntries(TIER_ORDER.map(k=>[k,TIERS[k].weight]));
  const total=TIER_ORDER.reduce((s,k)=>s+w[k],0);
  let r=Math.random()*total;
  for(const k of TIER_ORDER){ r-=w[k]; if(r<=0) return k; }
  return 'scrap';
}
function drawCard(weights){
  const tier=rollTier(weights);
  const pool=CARDS.filter(c=>c.tier===tier);
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ═══ 결정론적 전투 시뮬레이션 ═══════════════
   양쪽 클라이언트가 같은 (cardA, cardB, seed)로
   같은 결과를 계산한다. 서버 판정 불필요.       */
function calcDmg(att, def, rnd){
  const mult=multiplier(att.type,def.type);
  const statF=Math.min(1.35,Math.max(0.75, att.atk/def.atk));
  const frac=0.34*statF*mult*(0.9+rnd()*0.2);
  return { dmg:Math.max(8,Math.round(def.hp*frac)), mult };
}
function simulate(cardA, cardB, seed){
  const rnd=mulberry32(seed>>>0);
  let hpA=cardA.hp, hpB=cardB.hp;
  const rounds=[];
  for(let n=1;n<=4 && hpA>0 && hpB>0;n++){
    const dA=calcDmg(cardA,cardB,rnd);   // A → B
    const dB=calcDmg(cardB,cardA,rnd);   // B → A
    hpB-=dA.dmg; hpA-=dB.dmg;
    rounds.push({ n, dA, dB, hpA, hpB });
  }
  let winner;
  if(hpA<=0 && hpB<=0) winner=(hpA/cardA.hp >= hpB/cardB.hp)?'a':'b';
  else if(hpB<=0) winner='a';
  else if(hpA<=0) winner='b';
  else winner=(hpA/cardA.hp >= hpB/cardB.hp)?'a':'b';
  return { rounds, winner };
}

async function playRound(r, iAmA, myCard, foeCard){

    },res,t=>t*t);
  });
  const toFoe = iAmA ? r.dA : r.dB;
  const toMe  = iAmA ? r.dB : r.dA;
  const myHp  = iAmA ? r.hpA : r.hpB;
  const foeHp = iAmA ? r.hpB : r.hpA;
  const crit = toFoe.mult>1 || toMe.mult>1;
  shake(crit); flash(crit);
  emit(burst, TYPES[myCard.type].glow, 0.1, 0.2, 2.6, 3);
  emit(sparks, '#fff3d9', 0, 0, 3.6, 1.4);
  [myUnit,foeUnit].forEach(u=>{
    const hm=u.front.material.uniforms.uHurt;
    tween(0.08,p=>{hm.value=p;},()=>{ tween(0.25,p=>{hm.value=1-p;}); });
  });
  hudHp('L',myHp,myCard.hp);
  hudHp('R',foeHp,foeCard.hp);
  floater('-'+toMe.dmg, 27, toMe.mult>1?'big':(toMe.mult<1?'small':''));
  floater('-'+toFoe.dmg, 73, toFoe.mult>1?'big':(toFoe.mult<1?'small':''));
  if(toFoe.mult>1 && toMe.mult<1) showBattleMsg('상극 우위!', `${TYPES[myCard.type].hanja}이(가) ${TYPES[foeCard.type].hanja}을(를) 꿰뚫는다`);
  else if(toMe.mult>1 && toFoe.mult<1) showBattleMsg('상극 열세…', `${TYPES[foeCard.type].hanja}이(가) ${TYPES[myCard.type].hanja}을(를) 짓누른다`);
  else showBattleMsg(`제${r.n}합`, '칼날이 맞부딪친다');
  await new Promise(res=>{
    tween(0.22,p=>{
      mg.position.x=0.32*0.82+(mx-0.32*0.82)*p;
      fg.position.x=-0.32*0.82+(fx+0.32*0.82)*p;
      mg.rotation.z=-0.10*(1-p); fg.rotation.z=0.10*(1-p);
    },res);
  });
  await sleep(340);
}

async function runBattle(cardA, cardB, seed, opts){
  opts=opts||{};
  const iAmA = opts.role!=='b';
  const myCard = iAmA?cardA:cardB;
  const foeCard= iAmA?cardB:cardA;
  const sim = simulate(cardA,cardB,seed);
  const won = (sim.winner==='a') === iAmA;

  battle=true; busy=true; setControls(false); summonAnim=null;
  setUnitCard(myUnit,myCard); setUnitCard(foeUnit,foeCard);
  const SC=0.74, X=1.55;
  myUnit.home={x:-X,y:0,s:SC,ry:0.24};
  foeUnit.home={x:X,y:0,s:SC,ry:-0.24};
  myUnit.front.material.uniforms.uReveal.value=1;
  foeUnit.front.material.uniforms.uReveal.value=0;
  myUnit.group.visible=true; foeUnit.group.visible=true;

  await new Promise(res=>{
    const g=myUnit.group, from={x:g.position.x, s:g.scale.x};
    tween(0.35,p=>{
      g.position.x=from.x+(myUnit.home.x-from.x)*p;
      g.position.y*=(1-p);
      g.scale.setScalar(from.s+(SC-from.s)*p);
      g.rotation.x*=(1-p); g.rotation.y=g.rotation.y*(1-p)+myUnit.home.ry*p;
    },res);
  });
  foeUnit.group.position.set(foeUnit.home.x,0,0);
  foeUnit.group.scale.setScalar(SC);
  foeUnit.group.rotation.set(0,foeUnit.home.ry,0);
  emit(burst, TYPES[foeCard.type].glow, foeUnit.home.x, 0, 1.8, 2.4);
  await new Promise(res=>{ tween(0.45,p=>{ foeUnit.front.material.uniforms.uReveal.value=p; },res); });

  hudSet('L', myCard, myCard.hp, opts.myName||'나');
  hudSet('R', foeCard, foeCard.hp, opts.foeName||'잔혼');
  combatHud.classList.add('on');
  const m=multiplier(myCard.type,foeCard.type);
  showBattleMsg(`${foeCard.name} 출현`,
    m>1?'상극이 유리하다':(m<1?'상극이 불리하다':'상극은 대등하다'),
    opts.online?`${opts.foeName} 와(과)의 대전`:'');
  await sleep(620);

  for(const r of sim.rounds){ await playRound(r, iAmA, myCard, foeCard); }

  const loser = won?foeUnit:myUnit, winner = won?myUnit:foeUnit;
  shake(true);
  emit(burst, TYPES[loser.card.type].glow, loser.home.x, 0, 3, 3);
  await new Promise(res=>{
    tween(0.5,p=>{ loser.front.material.uniforms.uReveal.value=1-p;
                   loser.back.material.uniforms.uReveal.value=1-p; },res);
  });
  loser.group.visible=false;
  combatHud.classList.remove('on');
  await new Promise(res=>{
    const g=winner.group, fx0=g.position.x, fs=g.scale.x, fr=g.rotation.y;
    tween(0.4,p=>{
      g.position.x=fx0*(1-p);
      g.scale.setScalar(fs+(1-fs)*p);
      g.rotation.y=fr*(1-p);
    },res);
  });
  winner.home={x:0,y:0,s:1,ry:0};
  battle=null;

  if(opts.online){ saveResult(won); trackMe('idle'); }
  if(opts.online && opts.role==='a'){
    logMatch({ id:opts.matchId, player_a:opts.idA, player_b:opts.idB,
      card_a:cardA.id, card_b:cardB.id, seed, winner: sim.winner==='a'?opts.idA:opts.idB });
  }

  if(won){
    showBattleMsg('승(勝)', `${myCard.name}이(가) 어둠 속에 홀로 남았다.`, '전리품 봉인이 열린다 —');
    currentCard=myCard;
    await sleep(950);
    doDraw(true);
  }else{
    setUnitCard(myUnit, foeCard);
    myUnit.group.visible=true; foeUnit.group.visible=false;
    myUnit.front.material.uniforms.uReveal.value=1;
    myUnit.home={x:0,y:0,s:1,ry:0};
    myUnit.group.position.set(0,0,0); myUnit.group.scale.setScalar(1); myUnit.group.rotation.set(0,0,0);
    showDossier(foeCard, `${myCard.name}은(는) 어둠으로 흩어졌다 · 패(敗)`);
    busy=false; setControls(true);
  }
}

/* ═══ 대전청 — 접속자 목록 · 도전 · 수락 ══════ */
// 대표 잔혼(champion)이 곧 대전에 나가는 카드다
let inLobby=false;            // 대전청 입장 여부
let pendingOut=null;          // 내가 보낸 도전 {to, name, at}
let pendingIn=null;           // 내가 받은 도전 {from, name, card}
let chTimerId=null, outTimerId=null;

function showSeeking(on, sub){
  el('seeking').classList.toggle('on', on);
  if(sub) el('seekSub').textContent=sub;
  if(on) el('stageEmpty').classList.add('gone');
}
el('cancelSeek').addEventListener('click', ()=>{
  cancelOutgoing();
  showBattleMsg('청을 거두었다','다시 고를 수 있다.');
  busy=false; setControls(true);
  if(inLobby) openLobbyView();
});

/* ── 채널: 접속 즉시 붙어 있는다 (대전 탭을 열지 않아도) ── */
async function connectLobby(){
  if(!online() || lobby) return;

  lobby = sb.channel('lobby:jonhonrok', {
    config:{ presence:{ key:me }, broadcast:{ self:false } }
  });

  lobby.on('presence', { event:'sync' }, ()=>{ renderLobby(); renderPresence(); });
  lobby.on('presence', { event:'leave' }, ({ leftPresences })=>{
    // 도전 상대가 나가버린 경우
    const gone=(leftPresences||[]).some(p=>p.id===(pendingOut&&pendingOut.to) || p.id===(pendingIn&&pendingIn.from));
    if(gone){ cancelOutgoing(); closeChallenge(); }
    renderLobby(); renderPresence();
  });

  lobby.on('broadcast', { event:'challenge' }, ({ payload })=>{
    if(payload.to!==me || busy) return;
    // 서로 동시에 청한 경우: id 가 작은 쪽이 도전자
    if(pendingOut && pendingOut.to===payload.from){
      if(me < payload.from) return;      // 내 청이 유효 — 상대 것은 무시
      cancelOutgoing();                  // 상대 청을 받는다
    }
    if(pendingIn) return;                // 이미 다른 청을 검토 중
    openChallenge(payload);
  });

  lobby.on('broadcast', { event:'accept' }, ({ payload })=>{
    if(payload.to!==me) return;
    if(!pendingOut || pendingOut.to!==payload.from) return;
    clearTimeout(outTimerId); pendingOut=null;
    showSeeking(false); closeDrawer();
    const A=CARD_BY_ID[payload.aCard], B=CARD_BY_ID[payload.bCard];
    if(!A||!B) return;
    trackMe('busy');
    runBattle(A, B, payload.seed, {
      online:true, role:'a', matchId:payload.matchId,
      idA:me, idB:payload.from,
      myName:myProfile.nickname, foeName:payload.fromName
    });
  });

  lobby.on('broadcast', { event:'decline' }, ({ payload })=>{
    if(payload.to!==me) return;
    if(!pendingOut || pendingOut.to!==payload.from) return;
    const nm=pendingOut.name;
    cancelOutgoing();
    showBattleMsg('거절당했다', `${nm}이(가) 청을 피했다.`);
    busy=false; setControls(true);
    openLobbyView();
  });

  await lobby.subscribe(async status=>{
    if(status==='SUBSCRIBED'){ inLobby=true; await trackMe('idle'); renderLobby(); }
  });
}
async function trackMe(status){
  if(!lobby) return;
  try{
    await lobby.track({
      id:me, name:myProfile.nickname, card:champion?champion.id:null,
      wins:myProfile.wins, losses:myProfile.losses,
      status, ts:Date.now()
    });
  }catch(e){}
}
async function leaveLobby(){
  inLobby=false;
  cancelOutgoing(); closeChallenge();
  if(lobby){ try{ await lobby.unsubscribe(); }catch(e){} lobby=null; }
}
addEventListener('beforeunload', ()=>{ if(lobby) lobby.unsubscribe(); });

/* ── 접속자 목록 ── */
function lobbyPlayers(){
  if(!lobby) return [];
  const state=lobby.presenceState();
  return Object.values(state).flat()
    .filter(p=>p && p.id)
    .sort((a,b)=>(b.wins||0)-(a.wins||0));
}
function renderPresence(){
  const others=lobbyPlayers().filter(p=>p.id!==me);
  const ready=others.filter(p=>CARD_BY_ID[p.card] && p.status!=='busy').length;
  const tag=el('warCount');
  if(tag) tag.textContent = others.length ? `${others.length}인` : '對戰';
  const btn=el('battleBtn');
  if(btn) btn.classList.toggle('alive', ready>0);
  const hdr=el('presTxt');
  if(hdr) hdr.textContent = others.length ? `· 대전청 ${others.length}인` : '';
}
function openLobbyView(){
  drawer.classList.add('open'); scrim.classList.add('open');
  pickMode=false; drawer.classList.remove('pick');
  el('drawerTitle').textContent='대전청';
  switchTab('lobby');
}
function renderLobby(){
  const pane=el('lobbyPane');
  if(!el('lobbyPane').classList.contains('on')) { /* 갱신은 계속 */ }
  if(!inLobby){ pane.innerHTML='<div class="hint">대전청에 들지 않았습니다.</div>'; return; }
  const all=lobbyPlayers();
  const others=all.filter(p=>p.id!==me);
  const mine=`<div class="rank me"><span class="no">我</span>`+
    `<span class="nm">${escapeHTML(myProfile.nickname)} <small style="color:var(--paper-dim)">· ${escapeHTML(champion?champion.name:'대표 미정')}</small></span>`+
    `<span class="wl">${myProfile.wins}승 ${myProfile.losses}패</span></div>`;
  if(!others.length){
    pane.innerHTML = mine +
      '<div class="hint">지금 이 자리에 다른 술사가 없습니다.<br>' +
      '누군가 들어오면 아래 대전 단추에 불이 들어옵니다.</div>' +
      '<div style="text-align:center"><button class="chg out" id="leaveLobbyBtn">닫기</button></div>';
  }else{
    pane.innerHTML = mine + others.map(p=>{
      const c=CARD_BY_ID[p.card];
      const T=c?TYPES[c.type]:null;
      const busyP = p.status==='busy';
      return `<div class="rank">`+
        `<span class="no" style="color:${T?T.color:'var(--paper-dim)'}">${T?T.hanja:'―'}</span>`+
        `<span class="nm">${escapeHTML(p.name||'무명객')}<br>`+
        `<small style="color:var(--paper-dim);font-size:11px">${c?escapeHTML(c.name):'대표 미정'} · ${p.wins||0}승 ${p.losses||0}패</small></span>`+
        (busyP ? `<span class="wl">대전 중</span>`
         : !c   ? `<span class="wl">준비 안 됨</span>`
         : `<button class="chg" data-id="${p.id}" data-name="${escapeHTML(p.name||'무명객')}">도전</button>`)+
      `</div>`;
    }).join('') + '<div style="text-align:center"><button class="chg out" id="leaveLobbyBtn">닫기</button></div>';
  }
}
el('lobbyPane').addEventListener('click', async e=>{
  if(e.target.id==='leaveLobbyBtn'){ closeDrawer(); return; }
  const b=e.target.closest('button.chg');
  if(!b || !b.dataset.id) return;
  sendChallenge(b.dataset.id, b.dataset.name);
});

/* ── 도전 보내기 ── */
function sendChallenge(toId, toName){
  if(!lobby || !champion || pendingOut || busy) return;
  pendingOut={ to:toId, name:toName, at:Date.now() };
  busy=true; setControls(false);
  closeDrawer();
  showSeeking(true, `${toName}의 응답을 기다립니다`);
  lobby.send({ type:'broadcast', event:'challenge', payload:{
    from:me, to:toId, fromName:myProfile.nickname, fromCard:champion.id
  }});
  outTimerId=setTimeout(()=>{
    if(!pendingOut) return;
    const nm=pendingOut.name;
    cancelOutgoing();
    showBattleMsg('응답이 없다', `${nm}이(가) 답하지 않았다.`);
    busy=false; setControls(true);
    openLobbyView();
  }, 25000);
}
function cancelOutgoing(){
  clearTimeout(outTimerId); outTimerId=null;
  pendingOut=null;
  showSeeking(false);
}

/* ── 도전 받기 ── */
function openChallenge(payload){
  const c=CARD_BY_ID[payload.fromCard];
  pendingIn={ from:payload.from, name:payload.fromName, card:payload.fromCard };
  const T=TYPES[c.type];
  el('chbox').style.setProperty('--type', T.color);
  el('chTitle').textContent=`${payload.fromName}이(가) 청한다`;
  el('chSub').innerHTML=`<b>${T.hanja} ${escapeHTML(c.name)}</b> 을(를) 앞세웠다.<br>`+
    `그대의 <b>${escapeHTML(champion?champion.name:'잔혼')}</b> 로 맞선다.`;
  el('challenge').classList.add('on');
  let left=20;
  el('chTimer').textContent=`${left}초 안에 답하라`;
  clearInterval(chTimerId);
  chTimerId=setInterval(()=>{
    left--;
    el('chTimer').textContent=`${left}초 안에 답하라`;
    if(left<=0) declineChallenge();
  },1000);
}
function closeChallenge(){
  clearInterval(chTimerId); chTimerId=null;
  pendingIn=null;
  el('challenge').classList.remove('on');
}
function declineChallenge(){
  if(!pendingIn) return;
  const from=pendingIn.from;
  closeChallenge();
  if(lobby) lobby.send({ type:'broadcast', event:'decline', payload:{ from:me, to:from }});
}
function acceptChallenge(){
  if(!pendingIn || !champion) return;
  const p=pendingIn;
  closeChallenge();
  const matchId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
  const seed=(Math.random()*2**31)|0;
  lobby.send({ type:'broadcast', event:'accept', payload:{
    from:me, to:p.from, matchId, seed,
    aCard:p.card, bCard:champion.id,
    fromName:myProfile.nickname
  }});
  closeDrawer();
  trackMe('busy');
  const A=CARD_BY_ID[p.card], B=CARD_BY_ID[champion.id];
  runBattle(A, B, seed, {
    online:true, role:'b', matchId,
    idA:p.from, idB:me,
    myName:myProfile.nickname, foeName:p.name
  });
}
el('champBtn').addEventListener('click', ()=>{
  if(!currentCard || !found.has(currentCard.id)) return;
  setChampion(currentCard, true);
  el('dEcho').textContent=`${currentCard.name}을(를) 대표로 삼았다`;
});
el('chYes').addEventListener('click', acceptChallenge);
el('chNo').addEventListener('click', declineChallenge);

/* ═══ 서고 · 순위 ════════════════════════════ */
const drawer=el('drawer'), scrim=el('scrim');
function openDrawer(pick){
  pickMode=!!pick;
  drawer.classList.toggle('pick', pickMode);
  el('drawerTitle').textContent = pickMode ? '대표로 삼을 잔혼' : '서고';
  if(pickMode) switchTab('grid');
  drawer.classList.add('open'); scrim.classList.add('open');
}
function closeDrawer(){
  drawer.classList.remove('open'); scrim.classList.remove('open');
  pickMode=false; drawer.classList.remove('pick');
}
el('openArchive').addEventListener('click', ()=>{ if(!busy) openDrawer(false); });
el('closeArchive').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);
addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

function switchTab(name){
  [...el('tabs').children].forEach(b=>b.classList.toggle('sel', b.dataset.tab===name));
  el('gridPane').style.display = name==='grid'?'':'none';
  el('boardPane').classList.toggle('on', name==='board');
  el('lobbyPane').classList.toggle('on', name==='lobby');
  if(name==='lobby') renderLobby();
  if(name==='board') loadBoard();
}
el('tabs').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  switchTab(b.dataset.tab);
});
async function loadBoard(){
  const pane=el('boardPane');
  if(!online()){ pane.innerHTML='<div class="hint">순위는 접속 상태에서만 볼 수 있습니다.</div>'; return; }
  pane.innerHTML='<div class="hint">불러오는 중…</div>';
  try{
    const { data, error } = await sb.from('profiles')
      .select('id,nickname,wins,losses').order('wins',{ascending:false}).limit(30);
    if(error) throw error;
    const rows=(data||[]).filter(p=>p.wins+p.losses>0);
    if(!rows.length){ pane.innerHTML='<div class="hint">아직 아무도 겨루지 않았습니다.</div>'; return; }
    pane.innerHTML=rows.map((p,i)=>
      `<div class="rank${p.id===me?' me':''}"><span class="no">${i+1}</span>`+
      `<span class="nm">${escapeHTML(p.nickname)}</span>`+
      `<span class="wl">${p.wins}승 ${p.losses}패</span></div>`).join('');
  }catch(e){
    pane.innerHTML='<div class="hint">순위를 불러오지 못했습니다.</div>';
  }
}
function escapeHTML(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

el('battleBtn').addEventListener('click', ()=>{
  if(busy) return;
  if(!online()){
    showBattleMsg('접속되지 않았다','대전은 접속 상태에서만 열린다.');
    return;
  }
  if(found.size===0){
    showBattleMsg('잔혼이 없다','먼저 봉인을 해제해 대전할 잔혼을 얻으라.');
    return;
  }
  if(!champion){
    showBattleMsg('대표 잔혼이 없다','서고에서 대표로 삼을 잔혼을 정하라.');
    openDrawer(true);
    return;
  }
  openLobbyView();
});

const grid=el('grid');
const slotEls=new Map();
function buildGrid(){
  const ordered=[...CARDS].sort((a,b)=>{
    const t=TIER_ORDER.indexOf(b.tier)-TIER_ORDER.indexOf(a.tier);
    return t!==0?t:a.type.localeCompare(b.type);
  });
  ordered.forEach(card=>{
    const b=document.createElement('button');
    b.className='slot'; b.type='button';
    b.style.setProperty('--tier', TYPES[card.type].color);
    b.setAttribute('aria-label','미발견 봉인');
    b.disabled=true;
    b.innerHTML='<span class="locked">封</span>';
    b.addEventListener('click',()=>{
      if(!found.has(card.id)) return;
      if(pickMode){
        setChampion(card, true);
        closeDrawer();
        busy=true; setControls(false);
        showDossier(card, `${card.name}을(를) 대표로 삼았다`);
        summonSolo(card, ()=>{ busy=false; setControls(true); });
        if(!glOK){ busy=false; setControls(true); }
        return;
      }
      if(busy) return;
      busy=true; setControls(false);
      closeDrawer();
      showDossier(card,'서고에서 다시 불러냈다');
      summonSolo(card, ()=>{ busy=false; setControls(true); });
      if(!glOK){ busy=false; setControls(true); }
    });
    grid.appendChild(b);
    slotEls.set(card.id,b);
  });
  el('tallyTotal').textContent=CARDS.length;
}
function renderSlot(card,isNew,quiet){
  const b=slotEls.get(card.id);
  if(!b) return;
  const n=found.get(card.id);
  if(isNew){
    b.classList.add('found');
    b.disabled=false;
    b.setAttribute('aria-label',`${card.name} · ${TYPES[card.type].name} · ${TIERS[card.tier].name}`);
    b.innerHTML='<canvas class="thumb" width="128" height="192"></canvas>';
    paintThumb(card);
  }
  if(n>1){
    let d=b.querySelector('.dupes');
    if(!d){ d=document.createElement('span'); d.className='dupes'; b.appendChild(d); }
    d.textContent='×'+n;
  }
  if(!quiet){ b.classList.remove('fresh'); void b.offsetWidth; b.classList.add('fresh'); }
}

/* ── 시작 ──────────────────────────────────── */
el('drawOne').addEventListener('click', ()=>doDraw(false));
el('bulkBtn').addEventListener('click', doDraw100);
addEventListener('beforeunload', ()=>{ if(lobby) lobby.unsubscribe(); });

/* ── 더블탭 확대·핀치·길게눌러 선택 막기 ── */
(function noZoom(){
  let lastTouch=0;
  document.addEventListener('touchend', e=>{
    const now=Date.now();
    if(now-lastTouch<=320){ e.preventDefault(); }   // 더블탭 확대
    lastTouch=now;
  }, { passive:false });
  document.addEventListener('dblclick', e=>e.preventDefault(), { passive:false });
  // iOS 사파리 핀치
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>
    document.addEventListener(ev, e=>e.preventDefault(), { passive:false }));
  // 두 손가락 확대
  document.addEventListener('touchmove', e=>{
    if(e.touches.length>1) e.preventDefault();
  }, { passive:false });
  // Ctrl/⌘ + 휠 확대
  document.addEventListener('wheel', e=>{
    if(e.ctrlKey||e.metaKey) e.preventDefault();
  }, { passive:false });
  // 길게 눌러 뜨는 메뉴 (입력창은 예외)
  document.addEventListener('contextmenu', e=>{
    if(e.target.closest('input,textarea')) return;
    e.preventDefault();
  });
})();

async function boot(){
  buildGrid();
  glOK=initGL();
  if(!glOK){
    el('glError').style.display='grid';
    el('stageEmpty').style.display='none';
  }else{
    resize(); loop();
  }
  await initSupabase();
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(boot).catch(boot);
else boot();
</script>
