<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chonky Plush Pigeon</title>
    <style>
        :root {
            --bg-color: #fcf9f2;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --text-color: #333;
            --accent-color: #8a7b91;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 280px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.5);
            user-select: none;
            box-sizing: border-box;
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .control-group { margin-bottom: 12px; }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 4px;
            color: #555;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--accent-color);
        }
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }
        button {
            background: #f0f0f0;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            color: #444;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        button:hover { background: #e0e0e0; transform: translateY(-1px); }
        button:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        button.primary { background: #e8d5f0; color: #5a3c6b; }
        button.primary:hover { background: #dcc3e8; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: #ccc;
            z-index: 100;
            pointer-events: none;
        }
        #hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: #999;
            z-index: 5;
            pointer-events: none;
            text-align: center;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="loading">Hatching pigeon...</div>
    <div id="hint">Click the pigeon to poke it, drag to squish it, click the floor to drop a crumb</div>

    <div id="ui-panel">
        <h1>🍞 Chonky Pigeon</h1>

        <div class="control-group">
            <label>Stuffing Firmness <span id="val-firmness">5</span></label>
            <input type="range" id="firmness" min="1" max="10" step="0.1" value="5">
        </div>
        <div class="control-group">
            <label>Fluffiness <span id="val-fluff">3</span></label>
            <input type="range" id="fluff" min="0" max="5" step="0.1" value="3">
        </div>
        <div class="control-group">
            <label>Wobble Intensity <span id="val-wobble">1</span></label>
            <input type="range" id="wobble" min="0" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Walking Speed <span id="val-speed">1</span></label>
            <input type="range" id="speed" min="0.5" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Color Palette</label>
            <select id="palette" style="width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #ccc;">
                <option value="classic">Classic Grey</option>
                <option value="albino">Albino White</option>
                <option value="brown">Brown Sugar</option>
                <option value="void">Void Chicken</option>
            </select>
        </div>

        <div class="button-grid">
            <button id="btn-feed" class="primary">🍞 Feed</button>
            <button id="btn-flap" class="primary">🪶 Flap</button>
            <button id="btn-waddle">🚶 Waddle</button>
            <button id="btn-puff">☁️ Puff Up</button>
            <button id="btn-reset">🔄 Reset</button>
            <button id="btn-wireframe">📐 Wireframe</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';

        // ------------------------------------------------------------
        // State
        // ------------------------------------------------------------
        const GROUND_Y = -1.6;       // the pigeon's body bottom is about -1.58
        const CRUMB_Y = GROUND_Y + 0.1;

        const state = {
            firmness: 5.0,
            fluff: 3.0,
            wobble: 1.0,
            speed: 1.0,
            isWaddling: false,
            isFlapping: false,
            flapTimer: 0,
            isPuffing: false,
            puffTimer: 0,
            wireframe: false,
            targetPos: new THREE.Vector3(),
            hasTarget: false,
            peckTimer: 0,
            blinkTimer: 2,
            blinkHold: 0,
            lookTimer: 0,
            lookTarget: new THREE.Vector2(0, 0)
        };

        // ------------------------------------------------------------
        // Scene (WebGLRenderer: onBeforeCompile shader injection works here)
        // ------------------------------------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfcf9f2);
        scene.fog = new THREE.Fog(0xfcf9f2, 12, 32);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 9);
        camera.lookAt(0, -0.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);
        const canvas = renderer.domElement;

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 1.5));

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 25;
        dirLight.shadow.camera.left = -6;
        dirLight.shadow.camera.right = 6;
        dirLight.shadow.camera.top = 6;
        dirLight.shadow.camera.bottom = -6;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xe8d5f0, 1.0);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // Ground (shadow catcher)
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(50, 50),
            new THREE.ShadowMaterial({ opacity: 0.15 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = GROUND_Y;
        ground.receiveShadow = true;
        scene.add(ground);

        // ------------------------------------------------------------
        // Soft-body material factory
        // Every material gets its own uniform set and its own program cache key,
        // so clones never end up with an empty shader reference.
        // ------------------------------------------------------------
        function makeUniforms() {
            return {
                uTime: { value: 0 },
                uWobble: { value: state.wobble },
                uPokePoint: { value: new THREE.Vector3() },
                uPokeStrength: { value: 0 },
                uFirmness: { value: state.firmness },
                uGrabPoint: { value: new THREE.Vector3() },
                uGrabActive: { value: 0 },
                uFluff: { value: state.fluff }
            };
        }

        let matCounter = 0;
        function makeSquishMaterial(uniforms) {
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0x888c8d,
                roughness: 0.9,
                metalness: 0.0,
                sheen: 1.0,
                sheenRoughness: 0.8,
                sheenColor: new THREE.Color(0xffffff),
                clearcoat: 0.1,
                clearcoatRoughness: 0.8
            });
            const key = 'squish-' + (matCounter++);
            mat.customProgramCacheKey = () => key;

            mat.onBeforeCompile = (shader) => {
                Object.assign(shader.uniforms, uniforms);

                shader.vertexShader = shader.vertexShader.replace(
                    '#include <common>',
                    `
                    #include <common>
                    uniform float uTime;
                    uniform float uWobble;
                    uniform vec3 uPokePoint;
                    uniform float uPokeStrength;
                    uniform float uFirmness;
                    uniform vec3 uGrabPoint;
                    uniform float uGrabActive;
                    uniform float uFluff;
                    `
                );

                shader.vertexShader = shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `
                    #include <begin_vertex>

                    // Breathing
                    float breathe = sin(uTime * 2.0) * 0.02 * uWobble;
                    transformed.y += breathe;
                    transformed.x *= 1.0 + breathe * 0.5;
                    transformed.z *= 1.0 + breathe * 0.5;

                    // Poke: push vertices inward along the surface normal
                    float distToPoke = distance(transformed, uPokePoint);
                    float pokeRadius = 0.9;
                    if (distToPoke < pokeRadius && uPokeStrength > 0.001) {
                        float influence = 1.0 - (distToPoke / pokeRadius);
                        influence = influence * influence;
                        float depth = (2.0 / uFirmness) * uPokeStrength;
                        transformed -= normalize(normal) * depth * influence;
                    }

                    // Grab: pull vertices toward the grab point
                    if (uGrabActive > 0.5) {
                        float distToGrab = distance(transformed, uGrabPoint);
                        float grabRadius = 0.7;
                        if (distToGrab < grabRadius) {
                            float influence = 1.0 - (distToGrab / grabRadius);
                            influence = influence * influence;
                            transformed += (uGrabPoint - transformed) * 0.5 * influence;
                        }
                    }

                    // Fuzz
                    float noise = fract(sin(dot(transformed.xz, vec2(12.9898, 78.233))) * 43758.5453);
                    transformed += normal * noise * 0.02 * uFluff;
                    `
                );
            };
            return mat;
        }

        const bodyU = makeUniforms();   // body: poke + grab
        const headU = makeUniforms();   // head: poke + grab
        const staticU = makeUniforms(); // wings / tail: wobble + fuzz only

        const bodyMat = makeSquishMaterial(bodyU);
        const headMat = makeSquishMaterial(headU);
        const wingMat = makeSquishMaterial(staticU);
        const tailMat = makeSquishMaterial(staticU);
        const squishMats = [bodyMat, headMat, wingMat, tailMat];

        // ------------------------------------------------------------
        // Pigeon
        // ------------------------------------------------------------
        const pigeonGroup = new THREE.Group();
        scene.add(pigeonGroup);

        // Body
        const bodyGeo = new THREE.SphereGeometry(1.2, 64, 64);
        const posAttr = bodyGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            let x = posAttr.getX(i);
            let y = posAttr.getY(i);
            let z = posAttr.getZ(i);
            y *= 1.1;
            if (y < 0) { x *= 1.15; z *= 1.15; y *= 1.2; }
            else { x *= 0.9; z *= 0.9; }
            if (z > 0) z *= 1.1;
            posAttr.setXYZ(i, x, y, z);
        }
        bodyGeo.computeVertexNormals();

        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        body.receiveShadow = true;
        pigeonGroup.add(body);

        // Belly
        const bellyMat = new THREE.MeshStandardMaterial({ color: 0xd1d6d8, roughness: 0.9, metalness: 0.0 });
        const belly = new THREE.Mesh(new THREE.SphereGeometry(1.05, 32, 32), bellyMat);
        belly.scale.set(1.1, 0.8, 1.1);
        belly.position.set(0, -0.3, 0.3);
        belly.castShadow = true;
        pigeonGroup.add(belly);

        // Head
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.75, 48, 48), headMat);
        head.position.set(0, 1.4, 0.1);
        head.castShadow = true;
        pigeonGroup.add(head);

        // Iridescent neck
        const neckMat = new THREE.MeshPhysicalMaterial({
            color: 0x2a2a2a,
            roughness: 0.3,
            metalness: 0.6,
            iridescence: 1.0,
            iridescenceIOR: 1.5,
            iridescenceThicknessRange: [100, 400]
        });
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 0.8, 32), neckMat);
        neck.position.set(0, 0.9, 0.15);
        neck.rotation.x = -0.2;
        neck.castShadow = true;
        pigeonGroup.add(neck);

        // Eyes (positions are already in head-local coordinates)
        const eyeGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const eyeMat = new THREE.MeshPhysicalMaterial({
            color: 0x000000, roughness: 0.05, metalness: 0.1, clearcoat: 1.0, clearcoatRoughness: 0.1
        });
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(-0.36, 0.15, 0.58);
        head.add(eyeL);
        const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeR.position.set(0.36, 0.15, 0.58);
        head.add(eyeR);

        const highlightGeo = new THREE.SphereGeometry(0.04, 8, 8);
        const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const hlL = new THREE.Mesh(highlightGeo, highlightMat);
        hlL.position.set(-0.05, 0.06, 0.12);
        eyeL.add(hlL);
        const hlR = new THREE.Mesh(highlightGeo, highlightMat);
        hlR.position.set(-0.05, 0.06, 0.12);
        eyeR.add(hlR);

        // Beak (head-local, tip points to +z)
        const beakMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.6 });
        const beak = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.4, 12), beakMat);
        beak.position.set(0, -0.05, 0.8);
        beak.rotation.x = Math.PI / 2;
        beak.castShadow = true;
        head.add(beak);

        // Feet (resting on the ground)
        const feetMat = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.8 });
        const footGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.3, 8);
        const FOOT_Y = GROUND_Y + 0.15;
        const footL = new THREE.Mesh(footGeo, feetMat);
        footL.position.set(-0.4, FOOT_Y, 0.2);
        footL.castShadow = true;
        pigeonGroup.add(footL);
        const footR = new THREE.Mesh(footGeo, feetMat);
        footR.position.set(0.4, FOOT_Y, 0.2);
        footR.castShadow = true;
        pigeonGroup.add(footR);

        // Wings
        const wingGeo = new THREE.SphereGeometry(0.8, 32, 32);
        const wingL = new THREE.Mesh(wingGeo, wingMat);
        wingL.scale.set(0.3, 0.8, 1.0);
        wingL.position.set(-1.1, 0.2, 0);
        wingL.rotation.z = 0.2;
        wingL.castShadow = true;
        pigeonGroup.add(wingL);
        const wingR = new THREE.Mesh(wingGeo, wingMat);
        wingR.scale.set(0.3, 0.8, 1.0);
        wingR.position.set(1.1, 0.2, 0);
        wingR.rotation.z = -0.2;
        wingR.castShadow = true;
        pigeonGroup.add(wingR);

        // Tail
        const tail = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.8, 16), tailMat);
        tail.position.set(0, -0.2, -1.1);
        tail.rotation.x = -Math.PI / 2.5;
        tail.castShadow = true;
        pigeonGroup.add(tail);

        const hitTargets = [body, head, wingL, wingR, tail];

        // ------------------------------------------------------------
        // Crumbs
        // ------------------------------------------------------------
        const crumbs = [];
        const crumbGeo = new THREE.SphereGeometry(0.1, 8, 8);
        const crumbMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.9 });

        function spawnCrumb(pos) {
            const crumb = new THREE.Mesh(crumbGeo, crumbMat);
            crumb.position.set(pos.x, CRUMB_Y, pos.z);
            crumb.castShadow = true;
            crumb.scale.set(1 + Math.random(), 1 + Math.random(), 1 + Math.random());
            scene.add(crumb);
            crumbs.push(crumb);
            if (!state.hasTarget && state.peckTimer <= 0) targetNearestCrumb();
        }

        function nearestCrumbIndex() {
            let idx = -1, min = Infinity;
            crumbs.forEach((c, i) => {
                const dx = c.position.x - pigeonGroup.position.x;
                const dz = c.position.z - pigeonGroup.position.z;
                const d = Math.hypot(dx, dz);
                if (d < min) { min = d; idx = i; }
            });
            return { idx, dist: min };
        }

        function targetNearestCrumb() {
            const { idx } = nearestCrumbIndex();
            if (idx === -1) return;
            state.targetPos.set(crumbs[idx].position.x, 0, crumbs[idx].position.z);
            state.hasTarget = true;
            state.isWaddling = true;
        }

        // ------------------------------------------------------------
        // Pointer interaction
        // ------------------------------------------------------------
        const pointer = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const tmpV = new THREE.Vector3();
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -GROUND_Y);
        const dragPlane = new THREE.Plane();

        const poke = { active: false, t: 0, world: new THREE.Vector3(), target: body };
        const grab = { active: false, world: new THREE.Vector3() };
        const hover = { mesh: null, world: new THREE.Vector3() };
        const down = { x: 0, y: 0, onPigeon: false };

        const dragIndicator = new THREE.Mesh(
            new THREE.SphereGeometry(0.1, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 })
        );
        dragIndicator.visible = false;
        scene.add(dragIndicator);

        function updatePointer(e) {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        canvas.addEventListener('pointerdown', (e) => {
            updatePointer(e);
            down.x = e.clientX;
            down.y = e.clientY;
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(hitTargets, false);
            if (hits.length > 0) {
                const hit = hits[0];
                down.onPigeon = true;
                dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()), hit.point);
                grab.active = true;
                grab.world.copy(hit.point);
                poke.active = true;
                poke.t = 0;
                poke.world.copy(hit.point);
                poke.target = (hit.object === head) ? head : body;
                dragIndicator.position.copy(hit.point);
                dragIndicator.visible = true;
            } else {
                down.onPigeon = false;
            }
        });

        window.addEventListener('pointermove', (e) => {
            updatePointer(e);
            raycaster.setFromCamera(pointer, camera);

            if (grab.active) {
                const p = raycaster.ray.intersectPlane(dragPlane, tmpV);
                if (p) {
                    grab.world.copy(p);
                    dragIndicator.position.copy(p);
                }
            } else if (e.target === canvas) {
                const hits = raycaster.intersectObjects([body, head], false);
                if (hits.length > 0) {
                    hover.mesh = hits[0].object;
                    hover.world.copy(hits[0].point);
                } else {
                    hover.mesh = null;
                }
            } else {
                hover.mesh = null;
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (grab.active) {
                grab.active = false;
                dragIndicator.visible = false;
            }
            // Click on empty floor (not a drag) -> drop a crumb
            if (!down.onPigeon && e.target === canvas) {
                const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
                if (moved < 6) {
                    updatePointer(e);
                    raycaster.setFromCamera(pointer, camera);
                    const p = raycaster.ray.intersectPlane(groundPlane, new THREE.Vector3());
                    if (p && Math.abs(p.x) < 10 && Math.abs(p.z) < 10) spawnCrumb(p);
                }
            }
            down.onPigeon = false;
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // ------------------------------------------------------------
        // UI bindings
        // ------------------------------------------------------------
        const allU = [bodyU, headU, staticU];

        document.getElementById('firmness').addEventListener('input', (e) => {
            state.firmness = parseFloat(e.target.value);
            document.getElementById('val-firmness').innerText = state.firmness;
            allU.forEach(u => u.uFirmness.value = state.firmness);
        });
        document.getElementById('fluff').addEventListener('input', (e) => {
            state.fluff = parseFloat(e.target.value);
            document.getElementById('val-fluff').innerText = state.fluff;
        });
        document.getElementById('wobble').addEventListener('input', (e) => {
            state.wobble = parseFloat(e.target.value);
            document.getElementById('val-wobble').innerText = state.wobble;
        });
        document.getElementById('speed').addEventListener('input', (e) => {
            state.speed = parseFloat(e.target.value);
            document.getElementById('val-speed').innerText = state.speed;
        });

        const palettes = {
            classic: { body: 0x888c8d, belly: 0xd1d6d8, neck: 0x2a2a2a },
            albino:  { body: 0xffffff, belly: 0xfcfcfc, neck: 0xdddddd },
            brown:   { body: 0x8b5a2b, belly: 0xd2b48c, neck: 0x5c3a21 },
            void:    { body: 0x222222, belly: 0x333333, neck: 0x111111 }
        };
        document.getElementById('palette').addEventListener('change', (e) => {
            const p = palettes[e.target.value];
            squishMats.forEach(m => m.color.setHex(p.body));
            bellyMat.color.setHex(p.belly);
            neckMat.color.setHex(p.neck);
        });

        document.getElementById('btn-feed').addEventListener('click', () => {
            spawnCrumb(new THREE.Vector3((Math.random() - 0.5) * 6, 0, 1 + Math.random() * 3));
        });
        document.getElementById('btn-flap').addEventListener('click', () => {
            state.isFlapping = true;
            state.flapTimer = 1.5;
        });
        document.getElementById('btn-waddle').addEventListener('click', () => {
            state.isWaddling = !state.isWaddling;
            if (state.isWaddling) {
                state.targetPos.set((Math.random() - 0.5) * 6, 0, (Math.random() - 0.5) * 4);
                state.hasTarget = true;
            } else {
                state.hasTarget = false;
            }
        });
        document.getElementById('btn-puff').addEventListener('click', () => {
            state.isPuffing = true;
            state.puffTimer = 1.0;
        });
        document.getElementById('btn-reset').addEventListener('click', () => {
            pigeonGroup.position.set(0, 0, 0);
            pigeonGroup.rotation.set(0, 0, 0);
            state.hasTarget = false;
            state.isWaddling = false;
            state.peckTimer = 0;
            crumbs.forEach(c => scene.remove(c));
            crumbs.length = 0;
        });
        document.getElementById('btn-wireframe').addEventListener('click', () => {
            state.wireframe = !state.wireframe;
            [...squishMats, bellyMat, neckMat].forEach(m => m.wireframe = state.wireframe);
        });

        // ------------------------------------------------------------
        // Animation loop
        // ------------------------------------------------------------
        const clock = new THREE.Clock();
        let time = 0;
        let walkCycle = 0;
        const lerp = THREE.MathUtils.lerp;

        function syncSoftBody(delta) {
            pigeonGroup.updateMatrixWorld(true);

            let clickStrength = 0;
            if (poke.active) {
                poke.t += delta * 2.5;
                if (poke.t >= 1) poke.active = false;
                else clickStrength = Math.sin(poke.t * Math.PI);
            }

            [[body, bodyU], [head, headU]].forEach(([mesh, U]) => {
                let desired = 0;
                if (poke.active && poke.target === mesh) {
                    tmpV.copy(poke.world);
                    mesh.worldToLocal(tmpV);
                    U.uPokePoint.value.copy(tmpV);
                    desired = clickStrength;
                } else if (hover.mesh === mesh && !grab.active) {
                    tmpV.copy(hover.world);
                    mesh.worldToLocal(tmpV);
                    U.uPokePoint.value.copy(tmpV);
                    desired = 0.25;
                }
                U.uPokeStrength.value = lerp(U.uPokeStrength.value, desired, 0.3);

                U.uGrabActive.value = grab.active ? 1 : 0;
                if (grab.active) {
                    tmpV.copy(grab.world);
                    mesh.worldToLocal(tmpV);
                    U.uGrabPoint.value.copy(tmpV);
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05);
            time += delta;

            // Shared uniforms
            const fluffNow = state.isPuffing ? 10.0 : state.fluff;
            bodyU.uWobble.value = state.wobble;
            headU.uWobble.value = state.wobble * 1.5;
            staticU.uWobble.value = state.wobble;
            allU.forEach(u => { u.uTime.value = time; u.uFluff.value = fluffNow; });

            // Idle bob
            pigeonGroup.position.y = Math.sin(time * 2) * 0.05;

            // Blink
            state.blinkTimer -= delta;
            if (state.blinkTimer <= 0) {
                state.blinkHold = 0.15;
                state.blinkTimer = 2 + Math.random() * 4;
            }
            if (state.blinkHold > 0) state.blinkHold -= delta;
            const eyeScale = state.blinkHold > 0 ? 0.1 : 1.0;
            eyeL.scale.y = lerp(eyeL.scale.y, eyeScale, 0.5);
            eyeR.scale.y = lerp(eyeR.scale.y, eyeScale, 0.5);

            // Look around
            state.lookTimer -= delta;
            if (state.lookTimer <= 0) {
                state.lookTarget.set((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.3);
                state.lookTimer = 1 + Math.random() * 3;
            }
            head.rotation.y = lerp(head.rotation.y, state.lookTarget.x, 0.05);
            head.rotation.x = lerp(head.rotation.x, state.lookTarget.y, 0.05);

            // Waddle toward target
            const wasPecking = state.peckTimer > 0;
            if (state.hasTarget && state.isWaddling) {
                const dir = new THREE.Vector3().subVectors(state.targetPos, pigeonGroup.position);
                dir.y = 0;
                const dist = dir.length();

                if (dist > 0.2) {
                    dir.normalize();
                    pigeonGroup.position.addScaledVector(dir, 1.5 * state.speed * delta);

                    const targetRotation = Math.atan2(dir.x, dir.z);
                    let diff = targetRotation - pigeonGroup.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    pigeonGroup.rotation.y += diff * 5 * delta;

                    // Waddle animation
                    walkCycle += delta * 15 * state.speed;
                    pigeonGroup.rotation.z = Math.sin(walkCycle) * 0.15;
                    pigeonGroup.rotation.x = Math.abs(Math.cos(walkCycle)) * 0.05;

                    footL.position.z = 0.2 + Math.sin(walkCycle) * 0.2;
                    footR.position.z = 0.2 - Math.sin(walkCycle) * 0.2;

                    if (!state.isFlapping) {
                        wingL.rotation.z = 0.2 + Math.sin(walkCycle) * 0.1;
                        wingR.rotation.z = -0.2 - Math.sin(walkCycle) * 0.1;
                    }
                } else {
                    // Arrived
                    state.hasTarget = false;
                    state.isWaddling = false;
                    const { idx, dist: d } = nearestCrumbIndex();
                    if (idx !== -1 && d < 1.2) {
                        state.peckTimer = 2.0;
                        scene.remove(crumbs[idx]);
                        crumbs.splice(idx, 1);
                    }
                }
            } else {
                pigeonGroup.rotation.z = lerp(pigeonGroup.rotation.z, 0, 0.1);
                pigeonGroup.rotation.x = lerp(pigeonGroup.rotation.x, 0, 0.1);
                footL.position.z = lerp(footL.position.z, 0.2, 0.1);
                footR.position.z = lerp(footR.position.z, 0.2, 0.1);
            }

            // Pecking
            if (state.peckTimer > 0) {
                state.peckTimer -= delta;
                const peck = Math.abs(Math.sin(time * 30));
                head.position.y = 1.4 - peck * 0.3;
                head.position.z = 0.1 + peck * 0.2;
            } else {
                head.position.y = lerp(head.position.y, 1.4, 0.1);
                head.position.z = lerp(head.position.z, 0.1, 0.1);
                // Finished pecking: go for the next crumb
                if (wasPecking && crumbs.length > 0) targetNearestCrumb();
            }

            // Flapping
            if (state.isFlapping) {
                state.flapTimer -= delta;
                if (state.flapTimer <= 0) state.isFlapping = false;
                const flapCycle = time * 20;
                wingL.rotation.z = 0.2 + Math.sin(flapCycle) * 0.8;
                wingL.rotation.x = Math.sin(flapCycle) * 0.5;
                wingR.rotation.z = -0.2 - Math.sin(flapCycle) * 0.8;
                wingR.rotation.x = Math.sin(flapCycle) * 0.5;
                pigeonGroup.position.y += Math.abs(Math.sin(flapCycle)) * 0.1;
            } else {
                if (!(state.hasTarget && state.isWaddling)) {
                    wingL.rotation.z = lerp(wingL.rotation.z, 0.2, 0.1);
                    wingR.rotation.z = lerp(wingR.rotation.z, -0.2, 0.1);
                }
                wingL.rotation.x = lerp(wingL.rotation.x, 0, 0.1);
                wingR.rotation.x = lerp(wingR.rotation.x, 0, 0.1);
            }

            // Puff up
            if (state.isPuffing) {
                state.puffTimer -= delta;
                if (state.puffTimer <= 0) state.isPuffing = false;
                const puff = 1.0 + (0.5 + 0.5 * Math.sin(time * 10)) * 0.1;
                body.scale.setScalar(puff);
                head.scale.setScalar(puff);
            } else {
                body.scale.setScalar(lerp(body.scale.x, 1, 0.2));
                head.scale.setScalar(lerp(head.scale.x, 1, 0.2));
            }

            // Floating crumbs
            crumbs.forEach((c, i) => {
                c.position.y = CRUMB_Y + Math.sin(time * 2 + i) * 0.02;
                c.rotation.y += delta;
                c.rotation.x += delta * 0.5;
            });

            syncSoftBody(delta);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('loading').style.display = 'none';
        animate();
    </script>
</body>
</html>
