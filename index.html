20y%3D%2721%27%20width%3D%272%27%20height%3D%271%27%20fill%3D%27%235B2C0E%27/%3E%3Crect%20x%3D%274%27%20y%3D%2721%27%20width%3D%2716%27%20height%3D%271%27%20fill%3D%27%23E8A05C%27/%3E%3Crect%20x%3D%2720%27%20y%3D%2721%27%20width%3D%272%27%20height%3D%271%27%20fill%3D%27%235B2C0E%27/%3E%3Crect%20x%3D%273%27%20y%3D%2722%27%20width%3D%2718%27%20height%3D%271%27%20fill%3D%27%235B2C0E%27/%3E%3Crect%20x%3D%274%27%20y%3D%2723%27%20width%3D%2716%27%20height%3D%271%27%20fill%3D%27%235B2C0E%27/%3E%3C/svg%3E") 8 fill stretch;}

  /* ===== 날짜 현판 (HUD) ===== */
  .datenav{display:flex;align-items:center;gap:8px;padding:6px 4px;}
  .datenav .day{flex:1;text-align:center;font-family:'Galmuri14','Galmuri11',monospace;font-size:17px;letter-spacing:1px;color:var(--ink);text-shadow:0 1px 0 var(--parch-hi);}
  .datenav .day small{display:block;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px;font-family:'Galmuri11';}
  .todaytag{color:var(--gold-dk);}
  .navbtn{width:42px;height:42px;flex:none;font-size:16px;color:var(--parch-hi);cursor:pointer;
    background:linear-gradient(180deg,#C17F3F,#9E5D28);border:2px solid var(--outline);
    box-shadow:inset 0 2px 0 var(--wood-hi),inset 0 -3px 0 var(--wood-sh);font-family:'Galmuri11';text-shadow:0 -1px 0 var(--outline);}
  .navbtn:disabled{opacity:.35;}
  .navbtn:not(:disabled):active{transform:translateY(2px);box-shadow:inset 0 2px 0 var(--wood-sh);}

  /* ===== 씬 ===== */
  .scene{padding:0;overflow:hidden;line-height:0;}
  /* 픽셀탭 절대 크기 고정: 208x96 가상해상도의 정확히 1.5배(312x144). 어떤 화면/CSS에서도 변형 없음 */
  .scene .cvwrap{position:relative;width:312px;height:144px;min-width:312px;max-width:312px;min-height:144px;max-height:144px;margin:0 auto;overflow:hidden;flex:none;transform:none!important;}
  .scene canvas{position:absolute;left:0;top:0;width:312px;height:144px;display:block;image-rendering:pixelated;}
  .scene .tag{position:absolute;left:6px;top:4px;font-family:'Galmuri11';font-size:8px;letter-spacing:2px;color:#ffe9c0;text-shadow:1px 1px 0 #1c1410;z-index:2;opacity:.95;}
  .scene .cap{position:absolute;right:6px;bottom:4px;font-family:'Galmuri11';font-size:7px;letter-spacing:1px;color:#ffd789;text-shadow:1px 1px 0 #1c1410;z-index:2;opacity:.85;}
  .scene .nmL,.scene .nmR{position:absolute;bottom:6px;transform:translateX(-50%);font-family:'Galmuri11';font-size:10px;letter-spacing:1px;text-shadow:1px 1px 0 #1c1410,0 0 4px rgba(0,0,0,.6);z-index:2;}
  .scene .nmL{left:23%;color:#ffb9b3;}
  .scene .nmR{left:75%;color:#a9efe6;}

  /* ===== 반반 컬럼 ===== */
  .split{display:flex;gap:12px;align-items:flex-start;}
  .col{flex:1;min-width:0;padding:8px 6px;}
  .col.jm,.col.yj{background:none;}
  .chead{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid var(--parch-sh);box-shadow:0 2px 0 rgba(255,255,255,.35);}
  .ava{width:34px;height:34px;flex:none;image-rendering:pixelated;background:var(--night2);border:2px solid var(--outline);box-shadow:inset 0 0 0 1px var(--wood-hi);}
  .cwho{min-width:0;}
  .cname{font-family:'Galmuri14','Galmuri11',monospace;font-size:15px;line-height:1;text-shadow:0 1px 0 var(--parch-hi);}
  .col.jm .cname{color:var(--red);} .col.yj .cname{color:var(--teal-dk);}
  .csub{font-size:8px;color:var(--muted);letter-spacing:1px;margin-top:3px;}
  .cbadge{margin-left:auto;text-align:right;flex:none;}
  .cbadge .b1{font-family:'Galmuri14','Galmuri11',monospace;font-size:13px;color:var(--gold-dk);}
  .cbadge .b1::before{content:'★';color:var(--gold);text-shadow:1px 1px 0 var(--outline);margin-right:2px;font-size:11px;}
  .cbadge .b2{font-size:8px;color:var(--muted);}

  /* ===== 퀘스트 노트(프로그램 배너) ===== */
  .plan{border:2px solid var(--wood);background:var(--parch-in);padding:7px 8px;margin-bottom:10px;
    box-shadow:inset 0 0 0 1px var(--parch-hi),inset 0 -2px 0 var(--parch-sh);}
  .plan .p1{font-family:'Galmuri11';font-size:9px;letter-spacing:.5px;line-height:1.35;}
  .plan .ph{font-family:'Galmuri14','Galmuri11',monospace;font-size:11px;}
  .plan.grow .ph{color:var(--red);} .plan.deload .ph{color:var(--blue);} .plan.off .ph{color:var(--muted);}
  .plan .p2{font-size:8px;color:var(--muted);margin-top:3px;line-height:1.3;}

  /* ===== 정모: 카운터/에너지바 ===== */
  .jm .total{display:flex;align-items:baseline;gap:4px;margin-bottom:6px;}
  .jm .total .n{font-family:'Galmuri14','Galmuri11',monospace;font-size:30px;line-height:1;color:var(--red);text-shadow:0 1px 0 var(--parch-hi);}
  .jm .total .g{font-size:10px;color:var(--muted);}
  .pbar{display:flex;gap:2px;height:14px;margin-bottom:10px;background:var(--outline);padding:2px;border:2px solid var(--outline);box-shadow:inset 0 2px 0 rgba(0,0,0,.4),0 1px 0 var(--parch-hi);}
  .pcell{flex:1;background:#7a5a3a;}
  .pcell.on{background:linear-gradient(180deg,#E85B50,var(--red) 55%,var(--red-dk));box-shadow:inset 0 1px 0 #F2837A;}
  .jm.done-mark{filter:drop-shadow(0 4px 0 rgba(10,5,20,.55)) drop-shadow(0 0 6px rgba(255,180,20,.65));}

  .restnote{font-size:10px;color:var(--muted);text-align:center;padding:14px 4px;line-height:1.5;}
  .setrow-log{display:flex;align-items:center;gap:5px;padding:5px 0;border-bottom:2px dotted var(--parch-sh);}
  .snum{width:20px;height:22px;flex:none;background:linear-gradient(180deg,#D8564C,var(--red-dk));border:2px solid var(--outline);font-family:'Galmuri14','Galmuri11',monospace;font-size:11px;display:flex;align-items:center;justify-content:center;color:#FFEFD9;text-shadow:0 -1px 0 var(--outline);}
  .snum.amrap{background:linear-gradient(180deg,#FFD35A,var(--gold));color:var(--outline);text-shadow:none;}
  .repsin{width:40px;flex:none;font-family:'Galmuri14','Galmuri11',monospace;font-size:16px;text-align:center;background:var(--parch-in);color:var(--red-dk);border:2px solid var(--wood-sh);box-shadow:inset 0 2px 0 rgba(142,78,32,.25);padding:3px 0;}
  .unit{font-size:9px;color:var(--muted);flex:none;}
  .restcell{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none;}
  .rt{font-family:'Galmuri14','Galmuri11',monospace;font-size:12px;color:var(--blue);min-width:38px;text-align:right;cursor:pointer;}
  .rt.run{color:var(--gold-dk);} .rt.zero{color:#B99B6B;}
  .rt input{width:42px;font-family:'Galmuri11';font-size:11px;background:var(--parch-in);color:var(--ink);border:2px solid var(--wood-sh);text-align:center;}
  .rbtn{width:26px;height:26px;flex:none;font-size:10px;color:#FFEFD9;background:linear-gradient(180deg,#4C7FB8,#33608F);border:2px solid var(--outline);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.3);text-shadow:0 -1px 0 rgba(0,0,0,.4);}
  .rbtn.on{background:linear-gradient(180deg,#FFD35A,var(--gold));color:var(--outline);text-shadow:none;}
  .rbtn:active{transform:translateY(1px);}
  .fillbtn{width:100%;height:34px;margin-top:10px;font-size:11px;color:var(--outline);cursor:pointer;font-family:'Galmuri11';letter-spacing:.5px;
    background:linear-gradient(180deg,#FFD35A,var(--gold) 60%,#E09A00);border:2px solid var(--outline);box-shadow:inset 0 2px 0 #FFE9A8,inset 0 -3px 0 #B87800;}
  .fillbtn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 #B87800;}
  .setctl{display:flex;gap:5px;margin-top:6px;}
  .setctl button{flex:1;height:30px;font-size:10px;color:#FFEFD9;background:linear-gradient(180deg,#D8564C,var(--red-dk));border:2px solid var(--outline);cursor:pointer;font-family:'Galmuri11';box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.25);text-shadow:0 -1px 0 rgba(0,0,0,.35);}
  .setctl button.sec{background:linear-gradient(180deg,#C17F3F,#9E5D28);}
  .setctl button:active{transform:translateY(2px);}
  .jm .totrest{margin-top:8px;text-align:right;font-size:9px;color:var(--muted);}
  .jm .totrest b{font-family:'Galmuri14','Galmuri11',monospace;font-size:12px;color:var(--blue);}

  /* ===== 유지: 양피지 도장판 ===== */
  .stampgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stamp{position:relative;height:66px;background:var(--parch-in);border:2px solid var(--wood);cursor:pointer;overflow:hidden;
    display:flex;align-items:center;justify-content:center;padding:4px;
    box-shadow:inset 0 0 0 1px var(--parch-hi),inset 0 -3px 0 var(--parch-sh);}
  .stamp .nm{font-family:'Galmuri11';font-size:12px;color:var(--ink);text-align:center;letter-spacing:.5px;z-index:1;}
  .stamp.done{background:#F2D9A0;box-shadow:inset 0 2px 4px rgba(91,44,14,.3);}
  .stamp.done .nm{color:#B49B6E;}
  .seal{position:absolute;width:52px;height:52px;border:3px double var(--seal);border-radius:50%;
    display:none;align-items:center;justify-content:center;flex-direction:column;color:var(--seal);transform:rotate(-14deg);
    box-shadow:0 0 0 1px rgba(192,57,47,.35),inset 0 0 6px rgba(192,57,47,.3);background:rgba(255,235,200,.35);}
  .seal .sk{font-family:'Galmuri14','Galmuri11',monospace;font-size:16px;line-height:1;}
  .seal .st{font-size:8px;letter-spacing:1px;margin-top:2px;}
  .stamp.done .seal{display:flex;}
  @keyframes stampin{0%{transform:rotate(-14deg) scale(1.9);opacity:0;}55%{transform:rotate(-14deg) scale(.85);opacity:1;}75%{transform:rotate(-14deg) scale(1.08);}100%{transform:rotate(-14deg) scale(1);}}
  .seal.just{animation:stampin .32s steps(6) forwards;}
  .yj .ycount{margin-top:10px;text-align:center;font-size:9px;color:var(--muted);}
  .yj .ycount b{font-family:'Galmuri14','Galmuri11',monospace;font-size:12px;color:var(--teal-dk);}

  /* ===== 설정 ===== */
  .settoggle{width:100%;text-align:center;color:var(--parch-hi);padding:10px;cursor:pointer;font-family:'Galmuri11';font-size:11px;letter-spacing:1px;

<script>
const KEY='workout_duo_v2', OLDS=['workout_duo_v1','dailyquest_v3'];

/* ===== Supabase 동기화 (url/key 채우면 자동 활성화) =====
   1) supabase.com 프로젝트 생성
   2) SQL Editor에서 실행:
      create table workout_sync (id text primary key, data jsonb, updated_at timestamptz default now());
      alter table workout_sync enable row level security;
      create policy "duo_rw" on workout_sync for all using (true) with check (true);
   3) 아래 url(프로젝트 URL)과 key(anon public key) 입력  */
const SUPA={ url:'https://ndhhdpuizotdxoysfpcv.supabase.co', key:'sb_publishable_qRjt0VUZaA1L4DizGSor9w_0YEklW4K', room:'momo-root-duo' };
const supaOn=()=>SUPA.url&&SUPA.key;
async function supaPull(){
  if(!supaOn())return null;
  try{
    const r=await fetch(`${SUPA.url}/rest/v1/workout_sync?id=eq.${SUPA.room}&select=data`,{
      headers:{apikey:SUPA.key}});
    if(!r.ok){console.warn('[supa] pull 실패',r.status,await r.text());return null;}
    const rows=await r.json();
    return rows.length?rows[0].data:null;
  }catch(e){console.warn('[supa] pull 에러',e);return null;}
}
let supaTimer=null;
function supaPush(){
  if(!supaOn())return;
  clearTimeout(supaTimer);
  supaTimer=setTimeout(async()=>{
    try{
      const r=await fetch(`${SUPA.url}/rest/v1/workout_sync`,{
        method:'POST',
        headers:{apikey:SUPA.key,
          'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},
        body:JSON.stringify({id:SUPA.room,data:data,updated_at:new Date().toISOString()})});
      if(!r.ok)console.warn('[supa] push 실패',r.status,await r.text());
      else console.log('[supa] push OK');
    }catch(e){console.warn('[supa] push 에러',e);}
  },1500);
}
async function readKey(k){try{if(window.storage){const r=await window.storage.get(k,false);return r?JSON.parse(r.value):null;}}catch(e){}try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){}return null;}
async function saveData(){const s=JSON.stringify(data);supaPush();try{if(window.storage){await window.storage.set(KEY,s,false);return;}}catch(e){}try{localStorage.setItem(KEY,s);return;}catch(e){}window.__mem=data;}

let data={plan:{max:20,start:null,days:[1,3,5]},exercises:['요가','러닝','스트레칭','근력','사이클','플랭크'],days:{}};
let viewDate=new Date();
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WD=['일','월','화','수','목','금','토'];
const todayKey=()=>keyOf(new Date());
const fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function parseK(k){const [Y,M,D]=k.split('-').map(Number);return new Date(Y,M-1,D);}

function day(k){if(!data.days[k])data.days[k]={jm:{sets:[]},yj:{}};const d=data.days[k];if(!d.jm)d.jm={sets:[]};if(!d.jm.sets)d.jm.sets=[];if(!d.yj)d.yj={};return d;}
const jmTotal=d=>(d.jm.sets||[]).reduce((a,s)=>a+(s.reps||0),0);
const jmRest=d=>(d.jm.sets||[]).reduce((a,s)=>a+(s.rest||0),0);
const yjCount=d=>Object.keys(d.yj||{}).length;

/* ===== 프로그램 생성기 (근거: 주3회·48~72h 회복, 4주 메소사이클, 3주 성장 + 1주 디로드, 더블 프로그레션) ===== */
function startDate(){return data.plan.start?parseK(data.plan.start):new Date();}
function programDay(k){return Math.max(1,Math.floor((parseK(k)-startDate())/86400000)+1);}
function planFor(k){
  const dt=parseK(k), wd=dt.getDay();
  const dayDiff=Math.floor((dt-startDate())/86400000);
  const wk=Math.max(0,Math.floor(dayDiff/7));
  if(!data.plan.days.includes(wd)) return {rest:true,phase:'휴식',wk,note:'회복일 · 근육 회복 48~72h'};
  const m=wk%4, B=Math.floor(wk/4), max=data.plan.max, deload=(m===3);
  let intensity,sets;
  if(deload){intensity=Math.min(0.60,0.45+0.03*B);sets=3;}
  else{intensity=Math.min(0.85,0.55+0.06*m+0.05*B);sets=5;}
  const r=Math.max(3,Math.round(max*intensity)), restSec=deload?60:75, arr=[];
  for(let i=0;i<sets;i++){let reps=r;if(!deload&&i===sets-1)reps=Math.max(r,Math.round(max*Math.min(0.95,intensity+0.15)));arr.push({reps,rest:restSec});}
  const total=arr.reduce((a,s)=>a+s.reps,0);
  return {rest:false,deload,phase:deload?'회복':'성장',wk,mesoWeek:m+1,block:B+1,sets:arr,amrap:!deload,total,restSec};
}
function lastSession(k){
  const dt=parseK(k);
  for(let i=1;i<=14;i++){const d2=new Date(dt);d2.setDate(d2.getDate()-i);const kk=keyOf(d2);
    const p=planFor(kk);if(p.rest)continue;
    const dd=data.days[kk];if(dd&&dd.jm&&jmTotal(dd)>0)return{actual:jmTotal(dd),planned:p.total};}
  return null;
}
function adaptFactor(k,plan){
  if(plan.rest||plan.deload)return 1;
  const L=lastSession(k);if(!L||!L.planned)return 1;
  return Math.max(0.8,Math.min(1.15,L.actual/L.planned));
}
function targetFor(k){
  const plan=planFor(k);if(plan.rest)return plan;
  const f=adaptFactor(k,plan);
  const sets=plan.sets.map(s=>({reps:Math.max(3,Math.round(s.reps*f)),rest:s.rest}));
  const total=sets.reduce((a,s)=>a+s.reps,0);
  return Object.assign({},plan,{sets,total,adapted:Math.abs(f-1)>=0.03,factor:f});
}
function metDay(k){const p=targetFor(k);if(p.rest)return true;return jmTotal(day(k))>=p.total;}
function jmStreak(){
  /* 훈련일만 센다. 휴식일은 끊기지도 않고 +1도 안 됨. 프로그램 시작일 이전은 안 봄 */
  let n=0,d=new Date(),guard=0;const startK=data.plan.start||'2026-07-01';
  const kNow=keyOf(d);
  if(!targetFor(kNow).rest&&jmTotal(day(kNow))<targetFor(kNow).total)d.setDate(d.getDate()-1); /* 오늘 아직 미달성이면 오늘은 판정 제외 */
  while(keyOf(d)>=startK&&guard++<999){
    const k=keyOf(d),p=targetFor(k);
    if(p.rest){d.setDate(d.getDate()-1);continue;}
    if(jmTotal(day(k))>=p.total){n++;d.setDate(d.getDate()-1);}
    else break;
  }
  return n;}
function yjStreak(){let n=0,d=new Date();const ok=x=>yjCount(day(keyOf(x)))>0;if(!ok(d))d.setDate(d.getDate()-1);while(ok(d)){n++;d.setDate(d.getDate()-1);if(n>999)break;}return n;}

function fillPcell(el,cur,goal){const N=10,on=goal>0?Math.min(N,Math.round(cur/goal*N)):0;el.innerHTML='';for(let i=0;i<N;i++){const c=document.createElement('div');c.className='pcell'+(i<on?' on':'');el.appendChild(c);}}

function renderHeader(){const k=keyOf(viewDate),isT=k===todayKey();
  document.getElementById('dtxt').textContent=`${viewDate.getFullYear()}.${pad(viewDate.getMonth()+1)}.${pad(viewDate.getDate())}`;
  const wk=`(${WD[viewDate.getDay()]})`;
  document.getElementById('dweek').innerHTML=isT?`<span class="todaytag">TODAY ${wk}</span>`:wk;
  document.getElementById('next').disabled=k>=todayKey();
  document.getElementById('prev').disabled=k<=(data.plan.start||'2026-07-01');}

/* 정모 */
function renderJM(){
  const k=keyOf(viewDate), plan=targetFor(k), d=day(k);
  // 오늘 최초 진입 시 세트 틀만 생성 (reps는 0 — 실제 한 만큼 직접 입력해야 달성으로 계산)
  if(k===todayKey()&&!d.jm.planned){d.jm.sets=plan.rest?[]:plan.sets.map(s=>({reps:0,rest:s.rest}));d.jm.planned=true;saveData();}
  // 배너
  const pb=document.getElementById('jm-plan');
  if(plan.rest){pb.className='plan off';pb.innerHTML=`<div class="p1"><span class="ph">DAY ${programDay(k)} · 회복일</span></div><div class="p2">근육 회복 (48~72h) · 오늘은 쉬어요</div>`;}
  else{pb.className='plan '+(plan.deload?'deload':'grow');
    pb.innerHTML=`<div class="p1"><span class="ph">DAY ${programDay(k)} · ${plan.deload?'디로드(회복주간)':'성장기'}</span></div>`+
      `<div class="p2">${plan.block}블록 ${plan.mesoWeek}주차 · 권장 ${plan.total}회 / ${plan.sets.length}세트${plan.adapted?(plan.factor>1?' ↑전일반영':' ↓전일반영'):''}${plan.amrap?' (마지막 최대반복)':''} · 세트휴식 ${plan.restSec}초</div>`;}
  renderJMBody(plan);
}
function renderJMBody(plan){
  const k=keyOf(viewDate),d=day(k),body=document.getElementById('jm-body');
  const pt=jmTotal(d),goal=plan.rest?0:plan.total;
  let html='';
  if(!plan.rest){
    html+=`<div class="total"><span class="n">${pt}</span><span class="g">/ ${goal}회 (권장)</span></div>`;
    html+=`<div class="pbar" id="jm-bar"></div>`;
  }
  if(d.jm.sets.length===0){
    html+=`<div class="restnote">${plan.rest?'오늘은 회복일이에요.<br>쉬는 것도 훈련의 일부!':'기록이 없어요.'}<br>운동했다면 아래로 추가</div>`;
  }else{
    d.jm.sets.forEach((s,i)=>{
      const running=sw.active&&sw.dayKey===k&&sw.idx===i, restSec=running?sw.elapsed:(s.rest||0);

/* 스톱워치 */
let sw={active:false,dayKey:null,idx:-1,start:0,elapsed:0,id:null,target:0,lastSec:-1,reached:false,lastOver:0};
const beepOn=()=>data.beep!==false;
let actx=null;
function AC(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}return actx;}
function tone(f,dur,gain){const a=AC();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(a.destination);const t=a.currentTime;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function rapidBurst(){if(!beepOn())return;for(let i=0;i<6;i++)setTimeout(()=>tone(1245,0.06,0.075),i*90);}
function beep(f){tone(f,0.12,0.05);}

function swStart(idx){
  swStop(true);
  const k=keyOf(viewDate); const d=day(k);
  const target=(d.jm.sets[idx]&&d.jm.sets[idx].rest)||(planFor(k).restSec)||60;
  sw={active:true,dayKey:k,idx:idx,start:Date.now(),elapsed:0,id:null,target:target,lastSec:-1,reached:false,lastOver:0};
  if(beepOn())tone(880,0.09,0.06); // 시작 신호
  sw.id=setInterval(()=>{
    const ms=Date.now()-sw.start; sw.elapsed=Math.round(ms/1000);
    const el=document.querySelector(`.rt[data-i="${sw.idx}"]`); if(el)el.textContent=fmt(sw.elapsed);
    if(!beepOn())return;
    const sec=Math.floor(ms/1000);
    if(sec<sw.target){
      if(sec!==sw.lastSec){ sw.lastSec=sec; const left=sw.target-sec;
        if(left<=3&&left>0) tone(1000,0.06,0.06);   // 막판 3초 카운트다운
        else tone(700,0.045,0.035);                  // 진행 틱(시간 가는 중)
      }
    } else {
      if(!sw.reached){ sw.reached=true; rapidBurst(); navigator.vibrate&&navigator.vibrate([110,55,110,55,110]); }
      if(ms-sw.lastOver>=500){ sw.lastOver=ms; tone(1320,0.05,0.055); } // 도달 후 0.5초 간격 빠른 비프
    }
  },100);
  renderJM();
}

function swStop(silent){
  if(!sw.active) return;
  clearInterval(sw.id);
  const d=day(sw.dayKey);
  if(d.jm.sets[sw.idx]) d.jm.sets[sw.idx].rest=sw.elapsed;
  sw={active:false,dayKey:null,idx:-1,start:0,elapsed:0,id:null,target:0,lastSec:-1,reached:false,lastOver:0};
  saveData();
  if(!silent){ if(beepOn())tone(880,0.1,0.06); navigator.vibrate&&navigator.vibrate(60); renderJM(); }
}
function stampSound(){try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.type='square';o.connect(g);g.connect(a.destination);const t=a.currentTime;o.frequency.setValueAtTime(160,t);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.start(t);o.stop(t+.15);}catch(e){}}

(async()=>{

 b(6,6); b(20,5); b(31,4); sh(16,FY+12,14,2);

 const x=192; sh(x+6,VH-6,8,2);
 px(x,FY+2,12,26,'#2c3554'); px(x,FY+2,12,1,'#465288');
 px(x+2,FY-9,8,12,C.cool); px(x+2,FY-9,8,2,'#d8f6ff'); px(x+8,FY-7,2,8,'#4aa8cf'); px(x+3,FY-4,2,5,'#b8ecff');

 px(x,y,22,8,'#20263f'); px(x,y,22,1,'#3d4670');

/* ===== 정모: 진짜 푸쉬업 (플랭크 업다운) ===== */
function jeongmo(t){
 const bx=48, base=86; sh(bx+8,base+1,30,3);
 px(bx-22,base-4,62,5,C.matA); px(bx-22,base,62,1,C.matAD); px(bx-22,base-4,62,1,'#5a7dc8');
 const ph=(Math.sin(t*Math.PI*2/1.6)+1)/2; const dip=Math.round(ph*5); // 0=업 5=다운
 const bodyY=base-16+dip;
 // 발 (오른쪽, 발끝)
 px(bx+30,base-7,4,4,C.legg); px(bx+31,base-9,3,3,'#1c1410');
 // 다리
 px(bx+14,bodyY+3,18,4,C.legg); px(bx+14,bodyY+3,18,1,C.leggHi);
 // 몸통 (빨간 탱크)
 px(bx-8,bodyY,24,7,C.red); px(bx-8,bodyY,24,1,C.redHi); px(bx-8,bodyY+6,24,1,C.redD);
 px(bx-9,bodyY,1,7,'#1c1410'); // 윤곽
 // 어깨→팔 (수직, dip에 따라 굽힘)
 const armX=bx-5, handY=base-1;
 px(armX,bodyY+5,5,handY-(bodyY+5),C.skin);
 px(armX,bodyY+5,1,handY-(bodyY+5),C.skinD);
 px(armX+4,bodyY+5,1,handY-(bodyY+5),C.skinHi);
 px(armX-1,handY,7,2,C.skinHi);
 // 머리 (왼쪽, 정면 아래보기)
 const hy=bodyY-8;
 px(bx-18,hy,12,11,C.skin); px(bx-18,hy,12,2,C.skinHi); px(bx-18,hy+9,12,2,C.skinD); px(bx-19,hy,1,11,'#1c1410');
 px(bx-18,hy-3,12,4,C.hair); px(bx-7,hy,2,4,C.hair2);
 // 헤드밴드 (골드, 매듭)
 px(bx-18,hy+1,12,3,C.band); px(bx-18,hy+3,12,1,'#c99417'); px(bx-21,hy+2,3,2,C.band); px(bx-21,hy+4,2,2,'#c99417');
 // 눈 (집중)
 px(bx-15,hy+5,2,2,'#1c1410'); px(bx-10,hy+5,2,2,'#1c1410');
 // 땀
 if(ph>0.7) px(bx-21,hy+6,1,2,C.sweat);
 if(ph>0.85) px(bx-6,hy-3,1,2,C.sweat);
}
/* ===== 유지: 점핑잭 ===== */
function yuji(t){
 const cx=156, base=86; sh(cx,base+1,26,3);
 px(cx-24,base-4,50,5,C.matB); px(cx-24,base,50,1,C.matBD); px(cx-24,base-4,50,1,'#c46a95');
 const J=(Math.floor(t/0.55)%2)===0; // 포즈 토글
 const hop=J?0:2; // 점프 살짝
 const by=base-hop;
 // 다리
 if(J){ px(cx-3,by-16,3,16,C.legg); px(cx+1,by-16,3,16,C.legg); px(cx-4,by-1,4,2,'#1c1410'); px(cx+1,by-1,4,2,'#1c1410'); }
 else { px(cx-8,by-15,3,15,C.legg); px(cx+6,by-15,3,15,C.legg); px(cx-10,by-1,4,2,'#1c1410'); px(cx+7,by-1,4,2,'#1c1410');
        px(cx-8,by-15,3,1,C.leggHi); px(cx+6,by-15,3,1,C.leggHi); }
 // 반바지
 px(cx-6,by-20,13,6,C.shorts); px(cx-6,by-20,13,1,'#44446a');
 // 상체 (틸 크롭탑)
 const ty=by-32;
 px(cx-6,ty,13,12,C.teal); px(cx-6,ty,13,2,C.tealHi); px(cx-6,ty+10,13,2,C.tealD); px(cx-7,ty,1,12,'#1c1410'); px(cx+7,ty,1,12,'#1c1410');
 // 배꼽 라인
 px(cx-4,by-21,9,1,C.skin);
 // 팔
 if(J){ // 위로 V
   px(cx-11,ty-9,3,10,C.skin); px(cx-13,ty-12,3,4,C.skinHi);
   px(cx+9,ty-9,3,10,C.skin); px(cx+11,ty-12,3,4,C.skinHi);
 } else { // 아래
   px(cx-10,ty+2,3,12,C.skin); px(cx+8,ty+2,3,12,C.skin);
 }
 // 머리
 const hy=ty-11;
 px(cx-5,hy,11,11,C.skin); px(cx-5,hy,11,2,C.skinHi); px(cx+4,hy,2,10,C.skinD); px(cx-6,hy,1,11,'#1c1410'); px(cx+6,hy,1,11,'#1c1410');
 px(cx-5,hy-2,11,3,C.hair); px(cx-6,hy,1,5,C.hair2);
 // 포니테일 (점프 반동)
 const pt=J?-2:2;
 px(cx+6,hy+1+pt,3,4,C.hair2); px(cx+7,hy+4+pt,3,5,C.hair);
 // 눈 + 미소
 px(cx-2,hy+5,2,2,'#1c1410'); px(cx+2,hy+5,2,2,'#1c1410'); px(cx-1,hy+8,4,1,C.skinD);
 // 반짝 이펙트
 if(J){ px(cx-16,ty-14,1,3,'#fff2b0'); px(cx-17,ty-13,3,1,'#fff2b0'); px(cx+15,ty-15,1,3,'#fff2b0'); px(cx+14,ty-14,3,1,'#fff2b0'); }
}
function vignette(){g.save();let v=g.createRadialGradient(104,60,72,104,60,150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(4,6,14,0.42)');g.fillStyle=v;g.fillRect(0,0,VW,VH);g.restore();}
function drawScene(t){g.clearRect(0,0,VW,VH);windowWall(t);neonSign(t);floor();kettlebells();waterCooler(t);boombox(t);jeongmo(t);yuji(t);vignette();}

  function resize(){
    /* 절대 크기 고정: 화면/컨테이너와 무관하게 항상 312x144 (208x96의 1.5배) */
    const w=312;
    const h=144;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.max(1,Math.round(w*dpr)); cv.height=Math.max(1,Math.round(h*dpr));
    ctx.imageSmoothingEnabled=false;
    if(reduce){ drawScene(1.3); blit(); }
  }
  function blit(){ ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(off,0,0,VW,VH,0,0,cv.width,cv.height); }
  let start=null;
  function frame(ts){ if(start==null)start=ts; const t=(ts-start)/1000; drawScene(t); blit(); if(!reduce) requestAnimationFrame(frame); }
  if(typeof ResizeObserver!=='undefined'){ try{ new ResizeObserver(resize).observe(cv); }catch(e){} }
  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',()=>setTimeout(resize,200));
  window.addEventListener('load',resize);
  resize(); setTimeout(resize,60); setTimeout(resize,300);
  if(reduce){ drawScene(1.3); blit(); } else { requestAnimationFrame(frame); }
})();
