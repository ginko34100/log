<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12110b">
<title>정모의 방</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/neodgm-webfont@1.611/neodgm/style.min.css">
<style>
  html, body {
    margin:0; padding:0; background:#12110b;
    height:100%; overflow:hidden;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  body { display:flex; align-items:center; justify-content:center; }
  canvas {
    display:block;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* ── 영수증 프리뷰 모달 ── */
  #receiptModal {
    position:fixed; inset:0; z-index:50;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(8,7,4,0.82);
    font-family:'NeoDunggeunmo','Courier New',monospace;
  }
  #receiptModal.show { display:flex; }
  #receiptImg {
    max-width:80vw; max-height:64vh;
    image-rendering:pixelated;
    transform:rotate(-1.6deg);
    filter:drop-shadow(0 10px 24px rgba(0,0,0,0.7));
    animation:drop .28s steps(5);
  }
  @keyframes drop {
    from { transform:translateY(-40px) rotate(-6deg); opacity:0; }
    to   { transform:translateY(0) rotate(-1.6deg); opacity:1; }
  }
  #receiptBtns { display:flex; gap:10px; margin-top:22px; }
  #receiptBtns button {
    font-family:inherit; font-size:15px; letter-spacing:1px;
    background:#221f14; color:#e8dfb0;
    border:2px solid #6b6248; padding:11px 26px; cursor:pointer;
    box-shadow:0 3px 0 #000a;
  }
  #receiptBtns button:active { transform:translateY(2px); box-shadow:0 1px 0 #000a; }
  #receiptBtns #btnShareR { background:#3a3524; border-color:#8a836a; }
  #receiptHint { margin-top:12px; color:#8a836a; font-size:11px; letter-spacing:1px; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="receiptModal">
  <img id="receiptImg" alt="투자 성적표">
  <div id="receiptBtns">
    <button id="btnShareR">공유하기</button>
    <button id="btnCloseR">닫기</button>
  </div>
  <div id="receiptHint">공유하기 → 카카오톡 선택</div>
</div>
<script>
// ═══════════ 버퍼 (화면 비율 적응형) ═══════════
const BW = 240;                 // 가로 픽셀 해상도 고정
let BH = 427;                   // 세로는 기기 비율에 맞춰 계산
const buf = document.createElement('canvas');
const b = buf.getContext('2d');
const screen = document.getElementById('screen');
const sctx = screen.getContext('2d');

// 세이프에어리어(다이나믹 아일랜드/홈바) 측정용 프로브
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;'
  + 'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
document.body.appendChild(probe);

// 동적 레이아웃 (fit에서 계산)
let TITLE_Y = 24;
let PANEL = { x:10, y:278, w:BW-20, h:140 };
let OY = 148;
const OX = BW/2 + 6;
// 더블탭 음소거 + 수동 갱신 플래시 + 공유카드
let muted = false;
let lastTapT = -10;
let refreshFlashUntil = -1;
let CAM = { x: 0, y: 0, w: 20, h: 15 };
let shutterUntil = -1;

let CSSW = 0, CSSH = 0;    // 캔버스 CSS 크기 (포인터 좌표 변환용)
function fit() {
  const vw = innerWidth, vh = innerHeight;
  const dpr = Math.min(3, devicePixelRatio || 1);
  const portrait = vh / vw >= 1.2;

  if (portrait) {
    // 모바일 세로: 화면 꽉 채움, 버퍼 세로를 기기 비율에 맞춤
    BH = Math.min(600, Math.max(420, Math.round(BW * vh / vw)));
    CSSW = vw; CSSH = vh;
  } else {
    // 데스크탑/가로: 세로형 캔버스를 화면 중앙에 레터박스
    BH = 480;
    CSSH = vh;
    CSSW = Math.round(vh * BW / BH);
    if (CSSW > vw) { CSSW = vw; CSSH = Math.round(vw * BH / BW); }  // 초저높이 화면 대비
  }
  buf.width = BW; buf.height = BH;
  grain.width = BW; grain.height = BH;
  screen.style.width  = CSSW + 'px';
  screen.style.height = CSSH + 'px';
  screen.width  = Math.round(CSSW * dpr);
  screen.height = Math.round(CSSH * dpr);
  sctx.imageSmoothingEnabled = false;

  // 세이프에어리어를 버퍼 좌표로 환산 (데스크탑은 0)
  const S = CSSW / BW;
  const cs = getComputedStyle(probe);
  const safeT = portrait ? (parseFloat(cs.paddingTop)    || 0) / S : 0;
  const safeB = portrait ? (parseFloat(cs.paddingBottom) || 0) / S : 0;

  // 레이아웃: 타이틀(세이프 아래) / 방(가운데) / 곳간(홈바 위)
  TITLE_Y = Math.round(safeT + 26);
  PANEL = { x:10, y: Math.round(BH - 140 - safeB - 8), w: BW-20, h: 140 };
  CAM = { x: PANEL.x + PANEL.w - 52, y: PANEL.y + 5, w: 20, h: 15 };   // 곳간 헤더 카메라 버튼
  const roomTop = TITLE_Y + 34;            // 타이틀 존 하단
  const roomBot = PANEL.y - 6;             // 패널 존 상단
  // 방 그림 세로 범위 ≈ OY-62(벽 꼭대기) ~ OY+96(앞쪽 바닥) = 158px
  OY = Math.round(roomTop + 62 + Math.max(0, (roomBot - roomTop - 158) / 2));
}
const TW = 16, TH = 8, ROOM = 11;

// ═══════════ 팔레트 ═══════════
const C = {
  bg:'#14130c',
  floorA:'#948a63', floorB:'#8c825c'.slice(0,7), floorSeam:'#6f6746',
  rug:'#5f6b52', rugDim:'#525d47', rugEdge:'#6d7a5e',
  wallL:'#b7ab72', wallR:'#a2965f', wallEdge:'#d6cb96', wallStip:'#00000018', base:'#c6bb86',
  wood:'#a08050', woodD:'#7d5f38', woodT:'#bd9e6a', woodHi:'#d0b47e',
  outline:'#241f12',
  sheet:'#c2b98a', sheetD:'#a89f70', sheetHi:'#d8d0a2', pillow:'#e4dcb2', pillowD:'#c8c090',
  blanket:'#7a8468', blanketD:'#67715a', blanketHi:'#8b957a',
  metal:'#4a4a40', metalD:'#33332b', metalHi:'#5d5d52',
  screenBg:'#0c1410', glow:'#9fe8b0',
  green:'#6fd98a', red:'#d96f5f', gridLn:'#1e3326',
  hair:'#2c2517', hairHi:'#453a26', skin:'#d8b98a', skinD:'#b8996a',
  hoodie:'#5a6b5a', hoodieD:'#465446', hoodieHi:'#6c7f6c', string:'#d8d0a8',
  glass:'#e8f4ff',
  dog:'#e8e2d0', dogD:'#cfc8b2', dogNose:'#3a3229',
  plant:'#7a9960', plantD:'#5f7a49', plantHi:'#93b078',
  night:'#0a0d14', moon:'#e8e4d0', star:'#c8c4a8',
  steam:'#c8c2a0',
  note1:'#d8c878', note2:'#a8c8a0', note3:'#d0a890',
};
C.floorB = '#8c8258';

// ═══════════ 아이소 헬퍼 ═══════════
function px(gx, gy, z=0){ return [Math.round((gx-gy)*TW/2+OX), Math.round((gx+gy)*TH/2+OY-z)]; }
function poly(pts, fill){ b.fillStyle=fill; b.beginPath(); pts.forEach((p,i)=>i?b.lineTo(p[0],p[1]):b.moveTo(p[0],p[1])); b.closePath(); b.fill(); }
function polyO(pts, col){ b.strokeStyle=col; b.lineWidth=1; b.beginPath(); pts.forEach((p,i)=>i?b.lineTo(p[0],p[1]):b.moveTo(p[0],p[1])); b.closePath(); b.stroke(); }

// z0에서 시작하는 3면 박스 + 외곽선
function box(gx,gy,w,d,z0,h,ct,cl,cr,outline){
  const A=px(gx,gy,z0+h), B=px(gx+w,gy,z0+h), Cc=px(gx+w,gy+d,z0+h), D=px(gx,gy+d,z0+h);
  const E=px(gx,gy+d,z0), F=px(gx+w,gy+d,z0), G=px(gx+w,gy,z0);
  poly([A,B,Cc,D], ct);
  poly([D,Cc,F,E], cl);
  poly([B,Cc,F,G], cr);
  if (outline) polyO([A,B,G,F,E,D], outline);
}

// 시드 고정 랜덤 (벽 스티플 등 정적 텍스처)
let seed = 7;
function rnd(){ seed = (seed*16807)%2147483647; return (seed-1)/2147483646; }

// ═══════════ 포트폴리오 & 시세 ═══════════
// ★ 시세 연결: 이 프로젝트를 Vercel에 배포하면 같이 배포되는 /api/price 프록시를 통해
//    네이버 금융 실시간 시세를 받아옴 (api/price.js 파일 참고).
//    로컬에서 파일로 그냥 열면 fetch가 실패하므로 자동으로 시뮬레이션 모드로 동작.
const PRICE_API = code => `/api/price?code=${code}`;

const HOLDINGS = [
  { name:'RISE 삼전·SK하닉 채권혼합50', code:'0162Z0', qty:205, avg:14910,  price:15145 },
  { name:'PLUS 글로벌HBM반도체',        code:'442580', qty:61,  avg:128204, price:131355 },
];
const REFRESH_MS = 10000;
let liveMode = false, lastUpdate = null, prevTotal = null;

// ═══ 장 상태 (KRX 평일 09:00~15:30 KST) ═══
// 미리보기: ?market=open|closed  ?demo=party|rain
const URLP = (typeof location !== 'undefined') ? new URLSearchParams(location.search) : new Map();
const getP = k => URLP.get ? URLP.get(k) : null;
function kstParts(){
  const d = new Date(Date.now() + 9*3600e3);
  return { day: d.getUTCDay(), mins: d.getUTCHours()*60 + d.getUTCMinutes() };
}
function isMarketOpen(){
  const o = getP('market');
  if (o === 'open') return true;
  if (o === 'closed') return false;
  const { day, mins } = kstParts();
  return day >= 1 && day <= 5 && mins >= 540 && mins < 930;   // 09:00~15:30
}
function untilOpenStr(){
  const { day, mins } = kstParts();
  let total;
  if (day >= 1 && day <= 5 && mins < 540) total = 540 - mins;
  else {
    let dd = 1;
    while ([0,6].includes((day + dd) % 7)) dd++;
    total = (1440 - mins) + (dd - 1) * 1440 + 540;
  }
  const h = Math.floor(total/60), m = total % 60;
  return h > 0 ? `${h}시간 ${m}분` : `${m}분`;
}

const totalNow = () => HOLDINGS.reduce((a,h)=>a+h.qty*h.price, 0);
const totalAvg = () => HOLDINGS.reduce((a,h)=>a+h.qty*h.avg, 0);
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const sign = n => (n>=0?'+':'');

// 응답 형태를 관대하게 파싱 (네이버 폴링/증권 API 변형 대응)
function pickPrice(j){
  if (j == null) return null;
  if (typeof j === 'number') return j;
  const direct = j.closePrice ?? j.now ?? j.price ?? j.nv ?? j.tradePrice ?? j.currentPrice;
  if (direct != null) return parseFloat(String(direct).replace(/,/g,''));
  if (j.result?.areas?.[0]?.datas?.[0]?.nv != null) return j.result.areas[0].datas[0].nv;
  if (Array.isArray(j.datas) && j.datas[0]?.nv != null) return j.datas[0].nv;
  if (Array.isArray(j) && j.length) return pickPrice(j[0]);
  return null;
}
// 왼쪽 모니터 차트 = 코스피 지수 (하락 중이면 하락 그래프가 그대로 보임)
const KOSPI = { price: 4620, changePct: null };
let kospiDayOpen = KOSPI.price * (1 + (Math.random() < 0.5 ? 1 : -1) * 0.006);
let kospiTrend = Math.random() < 0.5 ? 1 : -1;   // 시뮬레이션용 추세
let seededLive = false;

async function fetchQuote(code){
  if (!PRICE_API) return null;
  try {
    const r = await fetch(PRICE_API(code));
    if (!r.ok) return null;
    const j = await r.json();
    const p = pickPrice(j);
    if (p == null || p <= 0) return null;
    const cp = (j && j.changePct != null) ? parseFloat(j.changePct) : null;
    return { price: p, changePct: Number.isFinite(cp) ? cp : null };
  } catch(e){ return null; }
}
async function fetchPrice(code){
  const q = await fetchQuote(code);
  return q ? q.price : null;
}

// ═══════════ 차트 데이터 (코스피 지수 캔들) ═══════════
let candles=[], lastClose=kospiDayOpen;
function seedCandles(from, to){
  candles = [];
  let p = from;
  for (let i=0;i<22;i++){
    const open = p;
    const pull = (to - p) * 0.18;
    const noise = (Math.random()-0.5) * Math.max(0.5, Math.abs(to-from)) * 0.25;
    const close = p + pull + noise;
    candles.push({ open, close,
      hi: Math.max(open,close) + Math.random()*Math.abs(pull)*0.5,
      lo: Math.min(open,close) - Math.random()*Math.abs(pull)*0.5 });
    p = close;
  }
  lastClose = p;
}
seedCandles(kospiDayOpen, KOSPI.price);
// LIVE 첫 수신 시 실제 당일 등락률로 차트 방향 재구성
function reseedFromDay(){
  if (KOSPI.changePct == null) return;
  const prevClose = KOSPI.price / (1 + KOSPI.changePct/100);
  seedCandles(prevClose, KOSPI.price);
}
function pushCandle(close){
  const open = lastClose;
  candles.push({ open, close,
    hi: Math.max(open,close) + Math.abs(close-open)*0.3,
    lo: Math.min(open,close) - Math.abs(close-open)*0.3 });
  if (candles.length > 22) candles.shift();
  lastClose = close;
}

let mood=0, moodT=0;

// ═══════════ 10초 갱신 루프 ═══════════
// ═══ 손익 이벤트 (±3% 돌파) ═══
let prevPct = null, rainTarget = 0, rainLevel = 0;
const confetti = [];
function burstConfetti(){
  const cols = ['#e0705c','#d8b23e','#6fd98a','#8aa8c8','#c88a9a','#e8dfb0'];
  for (let i = 0; i < 90; i++) {
    confetti.push({
      x: 40 + Math.random()*160,
      y: OY - 75 + Math.random()*30,
      vx: (Math.random()-0.5)*1.2,
      vy: -0.5 - Math.random()*1.2,
      col: cols[Math.floor(Math.random()*cols.length)],
      life: 1, sway: Math.random()*Math.PI*2,
    });
  }
}
function firePLEvents(){
  const pct = (totalNow()/totalAvg() - 1) * 100;
  if (prevPct != null && prevPct < 3 && pct >= 3) { burstConfetti(); startDance(); }  // +3% 돌파 → 파티
  rainTarget = pct <= -3 ? 1 : 0;                                                     // -3% 이하 → 창밖 비
  prevPct = pct;
}

let didInit = false;
async function refresh(){
  // 장 마감 중엔 최초 1회(종가)만 받고 이후 갱신 스킵
  if (didInit && !isMarketOpen()) { renderVault(); return; }
  let anyLive = false;
  // ── 코스피 지수 ──
  const kq = await fetchQuote('KOSPI');
  if (kq) {
    KOSPI.price = kq.price; anyLive = true;
    if (kq.changePct != null) {
      KOSPI.changePct = kq.changePct;
      if (!seededLive) { reseedFromDay(); seededLive = true; }
    }
  } else {
    // 시뮬레이션: 추세 지속 랜덤워크 (가끔 추세 반전 → 하락장도 자연스럽게 나옴)
    if (Math.random() < 0.06) kospiTrend *= -1;
    KOSPI.price *= 1 + kospiTrend*0.0012 + (Math.random()-0.5)*0.0016;
    KOSPI.changePct = (KOSPI.price/kospiDayOpen - 1) * 100;
  }
  // ── 보유 종목 ──
  await Promise.all(HOLDINGS.map(async h => {
    const q = await fetchQuote(h.code);
    if (q) { h.price = q.price; anyLive = true; }
    else if (!PRICE_API || !anyLive) {
      h.price = Math.max(1, h.price * (1 + (Math.random()-0.5)*0.003));
    }
  }));
  liveMode = anyLive;
  lastUpdate = new Date();

  const tot = totalNow();
  if (prevTotal != null) {
    const d = tot - prevTotal;
    if (d > tot*0.0003) { mood = 1; moodT = 0; }        // 유의미한 상승 → 만세
    else if (d < -tot*0.0003) { mood = -1; moodT = 0; } // 하락 → 고개 떨굼
  }
  prevTotal = tot;
  pushCandle(KOSPI.price);                              // 차트 = 코스피
  firePLEvents();
  didInit = true;
  renderVault();
}
setInterval(refresh, REFRESH_MS);
refresh();

// ═══════════ 곳간 패널 (캔버스 내 렌더) ═══════════
// ═══ 공유 카드: 투자 성적표 영수증 ═══
function shutterSnd(){
  if(!actx || muted) return;
  [0, 60].forEach((ms,i)=> setTimeout(()=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.value = i? 1400 : 900;
    g.gain.setValueAtTime(0.03, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0005, actx.currentTime+0.03);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.03);
  }, ms));
}
function gradeOf(pct){
  if (pct >= 3)    return ['A+', '오늘 시장을 이겼습니다'];
  if (pct >= 1.5)  return ['A',  '아주 순항 중'];
  if (pct >= 0)    return ['B+', '플러스면 됐다'];
  if (pct >= -1.5) return ['C',  '버티는 중'];
  return ['F', '오늘은 눈을 감자'];
}
async function shareCard(){
  try {
    shutterSnd();
    const SC = 3;                                       // 해상도 스케일
    const CW = 240, ROWH = 26;
    const CH = 45 + HOLDINGS.length*ROWH + 152;         // 내용 기반 높이
    const card = document.createElement('canvas');
    card.width = CW*SC; card.height = CH*SC;
    const c = card.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.scale(SC, SC);
    const INK='#2a251a', GRAY='#7a7258', UPC='#b8443a', DNC='#3a58b0';
    const pl = totalNow()-totalAvg();
    const pct = (totalNow()/totalAvg()-1)*100;
    const PC = v => v>=0 ? UPC : DNC;
    const T = (s,x,y,size,col,align='left')=>{
      c.font=`${size}px NeoDunggeunmo, monospace`;
      c.fillStyle=col; c.textAlign=align; c.textBaseline='middle';
      c.fillText(s,x,y);
    };
    const dash = (y,gap=3)=>{ c.fillStyle=GRAY; for(let x=28;x<212;x+=gap*2) c.fillRect(x,y,gap,0.8); };
    const solid = y=>{ c.fillStyle=INK; c.fillRect(28,y,184,1); };

    // ── 배경 + 찢긴 감열지 ──
    c.fillStyle='#12110b'; c.fillRect(0,0,CW,CH);
    const px0=20, pw=200, py0=8, py1=CH-8, amp=3, step=8;
    const paper = (ox,oy)=>{
      c.beginPath(); c.moveTo(px0+ox, py0+amp+oy);
      for(let x=px0; x<px0+pw; x+=step){ c.lineTo(x+step/2+ox, py0+oy); c.lineTo(x+step+ox, py0+amp+oy); }
      c.lineTo(px0+pw+ox, py1-amp+oy);
      for(let x=px0+pw; x>px0; x-=step){ c.lineTo(x-step/2+ox, py1+oy); c.lineTo(x-step+ox, py1-amp+oy); }
      c.closePath();
    };
    paper(2.5,2.5); c.fillStyle='rgba(0,0,0,0.55)'; c.fill();      // 그림자
    paper(0,0); c.fillStyle='#f0ead2'; c.fill();                    // 종이
    c.save(); paper(0,0); c.clip();                                  // 감열지 스캔 줄
    c.fillStyle='rgba(0,0,0,0.025)';

let receiptBlob = null, receiptName = 'jungmo-report.png', receiptURL = null;
function closeReceipt(){
  document.getElementById('receiptModal').classList.remove('show');
}
async function doShareReceipt(){
  if (!receiptBlob) return;
  try {
    const file = new File([receiptBlob], receiptName, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });   // 이미지만 전송 (텍스트 없음)
      return;                                  // 공유시트에서 카톡 선택
    }
  } catch(e) { if (e && e.name === 'AbortError') return; /* 사용자가 시트 닫음 */ }
  // 공유 미지원(PC 등) → PNG 다운로드 폴백
  const a = document.createElement('a');
  a.href = receiptURL; a.download = receiptName;
  document.body.appendChild(a); a.click(); a.remove();
}
document.getElementById('btnShareR').onclick = doShareReceipt;
document.getElementById('btnCloseR').onclick = closeReceipt;

// 탭 판정: 더블탭(어디서든)=음소거 토글 / 곳간 패널=즉시 갱신 / 그 외=강아지 댄스
screen.addEventListener('pointerdown', e => {
  const bx = e.offsetX / (CSSW / BW), by = e.offsetY / (CSSH / BH);
  const tNow = (performance.now() - t0) / 1000;
  if (tNow - lastTapT < 0.35) {              // 더블탭 → 음소거 토글
    muted = !muted;
    if (!muted) click();
    lastTapT = -10;
    return;
  }
  lastTapT = tNow;
  if (bx >= CAM.x-4 && bx <= CAM.x+CAM.w+4 && by >= CAM.y-4 && by <= CAM.y+CAM.h+4) {
    shutterUntil = tNow + 0.22;               // 셔터 플래시
    shareCard();
  } else if (bx >= PANEL.x && bx <= PANEL.x + PANEL.w && by >= PANEL.y && by <= PANEL.y + PANEL.h) {
    refresh();                                // 즉시 갱신
    refreshFlashUntil = tNow + 0.45;
    click();
  } else {
    startDance();
  }
});
// 데스크탑 키보드: M=음소거, R=새로고침, S=공유카드, Space/D=댄스
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'm') { muted = !muted; if(!muted) click(); }
  else if (k === 'r') { refresh(); refreshFlashUntil = (performance.now()-t0)/1000 + 0.45; click(); }
  else if (k === 's') { shutterUntil = (performance.now()-t0)/1000 + 0.22; shareCard(); }
  else if (k === ' ' || k === 'd') { e.preventDefault(); startDance(); }
});

let actx=null;
onpointerdown=()=>{ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} };
function click(){
  if(!actx || muted) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='square'; o.frequency.value=700+Math.random()*500;
  g.gain.setValueAtTime(0.012,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0005,actx.currentTime+0.02);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.02);
}

// ═══════════ 벽 & 바닥 ═══════════
const H_WALL = 60;
// 벽 스티플(질감) 점 미리 생성
const stipNW=[], stipNE=[];
for(let i=0;i<160;i++){ stipNW.push([rnd()*ROOM, rnd()*H_WALL]); stipNE.push([rnd()*ROOM, rnd()*H_WALL]); }

function drawWalls(t){
  const A=px(0,0,H_WALL), Bn=px(ROOM,0,H_WALL), Cn=px(ROOM,0,0), D=px(0,0,0);
  poly([A,Bn,Cn,D], C.wallL);
  const A2=px(0,ROOM,H_WALL), C2=px(0,ROOM,0);
  poly([A,A2,C2,D], C.wallR);
  // 스티플 질감
  b.fillStyle='rgba(0,0,0,0.08)';
  stipNW.forEach(([u,v])=>{ const [sx,sy]=px(u,0,v); b.fillRect(sx,sy,1,1); });
  b.fillStyle='rgba(255,255,255,0.05)';
  stipNE.forEach(([u,v])=>{ const [sx,sy]=px(0,u,v); b.fillRect(sx,sy,1,1); });
  // 윗모서리 + 코너 음영
  b.strokeStyle=C.wallEdge; b.lineWidth=1;
  b.beginPath(); b.moveTo(A2[0],A2[1]); b.lineTo(A[0],A[1]); b.lineTo(Bn[0],Bn[1]); b.stroke();
  b.strokeStyle='rgba(0,0,0,0.18)';
  b.beginPath(); b.moveTo(A[0],A[1]); b.lineTo(D[0],D[1]); b.stroke();
  // 걸레받이 (baseboard)
  const b1=px(0,0,3), b2=px(ROOM,0,3), b3=px(0,ROOM,3);
  b.strokeStyle=C.base;
  b.beginPath(); b.moveTo(b3[0],b3[1]); b.lineTo(b1[0],b1[1]); b.lineTo(b2[0],b2[1]); b.stroke();

  drawWindowNE(5.2, 36, 3.2, 18, t);      // 침대 옆 벽 중간 높이 (z36~54)
  drawClock(2.3, 42, t);                   // 포스터 자리를 시계로 대치
  drawNotes();
}

function drawWindowNE(gy, z, w, h, t){
  const [sx, sy]=px(0,gy,z);
  b.save(); b.transform(-1,0.5,0,1,sx,sy);
  const pw=w*TW/2;
  b.fillStyle=C.woodD; b.fillRect(-3,-3,pw+6,h+6);        // 바깥 프레임
  b.fillStyle=C.woodT; b.fillRect(-2,-2,pw+4,h+4);
  b.fillStyle=C.night; b.fillRect(0,0,pw,h);
  stars.forEach(s=>{
    const a=0.4+Math.sin(t*2+s.tw)*0.35;
    b.globalAlpha=Math.max(0.1,a); b.fillStyle=C.star;
    b.fillRect(Math.floor(s.x*pw),Math.floor(s.y*h),1,1);
  });
  b.globalAlpha=1;
  b.fillStyle=C.moon; b.fillRect(4,4,5,5);
  b.fillStyle=C.night; b.fillRect(5,4,3,3);               // 초승달
  // 손익 -3% 이하: 창밖에 비
  if (rainLevel > 0.02) {
    b.fillStyle = `rgba(18,26,42,${0.45*rainLevel})`;     // 먹구름 톤
    b.fillRect(0,0,pw,h);
    b.strokeStyle = `rgba(150,170,200,${0.55*rainLevel})`; b.lineWidth = 0.6;
    for (let i = 0; i < 12; i++) {
      const rx = ((i*7.3 + t*26) % (pw+6)) - 3;
      const ry = ((i*11.7 + t*60) % (h+8)) - 4;
      b.beginPath(); b.moveTo(rx, ry); b.lineTo(rx-1.2, ry+3.5); b.stroke();
    }
  }
  b.fillStyle=C.woodT; b.fillRect(pw/2,0,1,h); b.fillRect(0,h/2,pw,1);  // 창살
  b.fillStyle=C.woodHi; b.fillRect(-2,h+2,pw+4,2);        // 창턱
  b.restore();
}
// 북동벽(gx=0 평면) 부착용 변환: u축 = +gy 방향, v축 = 수직
function neTransform(gy, z){
  const [sx, sy] = px(0, gy, z);
  b.save(); b.transform(-1, 0.5, 0, 1, sx, sy);
}
function drawClock(gy, z, t){
  neTransform(gy, z);
  b.fillStyle=C.outline; b.fillRect(-1,-1,12,12);
  b.fillStyle='#ded5a8'; b.fillRect(0,0,10,10);
  b.fillStyle=C.woodD;
  b.fillRect(4,1,1,1); b.fillRect(4,8,1,1); b.fillRect(1,4,1,1); b.fillRect(8,4,1,1);  // 12·3·6·9 눈금
  b.restore();
  const [sx,sy]=px(0,gy,z);
  const cx=sx-5, cy=sy+5+2.5;
  b.strokeStyle='#2a2418'; b.lineWidth=1;
  const a1=t*0.5, a2=t*0.05;
  b.beginPath(); b.moveTo(cx,cy); b.lineTo(cx+Math.cos(a1)*3.5, cy+Math.sin(a1)*3.5); b.stroke();
  b.beginPath(); b.moveTo(cx,cy); b.lineTo(cx+Math.cos(a2)*2.5, cy+Math.sin(a2)*2.5); b.stroke();
}
function drawNotes(){
  // 책상 위 벽에 포스트잇 3장
  [[8.7,26,C.note1],[9.15,29,C.note2],[8.9,22,C.note3]].forEach(([gx,z,col])=>{
    const [sx,sy]=px(gx,0,z);
    b.save(); b.transform(1,0.5,0,1,sx,sy);
    b.fillStyle=col; b.fillRect(0,0,4,4);
    b.fillStyle='rgba(0,0,0,0.25)'; b.fillRect(0,3,4,1);
    b.restore();
  });
}

// ═══════════ 바닥 (마루판) ═══════════
function drawFloor(){
  for(let gy=0; gy<ROOM; gy++)
    for(let gx=0; gx<ROOM; gx++){
      const [sx,sy]=px(gx,gy);
      b.beginPath();
      b.moveTo(sx,sy); b.lineTo(sx+TW/2,sy+TH/2);
      b.lineTo(sx,sy+TH); b.lineTo(sx-TW/2,sy+TH/2);
      b.closePath();
      b.fillStyle = (gy%2? C.floorA : C.floorB);           // 행 단위 = 마루 널
      b.fill();
    }
  // 널 사이 이음선 (+gx 방향)
  b.strokeStyle=C.floorSeam; b.lineWidth=0.5; b.globalAlpha=0.5;
  for(let gy=1; gy<ROOM; gy++){
    const p1=px(0,gy), p2=px(ROOM,gy);
    b.beginPath(); b.moveTo(p1[0],p1[1]); b.lineTo(p2[0],p2[1]); b.stroke();
  }
  b.globalAlpha=1;
  // 러그 (테두리 패턴)
  for(let gy=5; gy<=8; gy++)
    for(let gx=4; gx<=7; gx++){
      const [sx,sy]=px(gx,gy);
      b.beginPath();
      b.moveTo(sx,sy); b.lineTo(sx+TW/2,sy+TH/2);
      b.lineTo(sx,sy+TH); b.lineTo(sx-TW/2,sy+TH/2);
      b.closePath();
      const edge = gy===5||gy===8||gx===4||gx===7;
      b.fillStyle = edge ? C.rugEdge : ((gx+gy)%2? C.rug : C.rugDim);
      b.fill();
    }
}

function drawBed(){

function drawShelf(){
  const gx=1.1, gy=0.3, w=2.3, d=0.85, h=36;
  box(gx,gy,w,d,0,h,C.woodT,C.wood,C.woodD,C.outline);
  // 전면(SE) 인셋: 어두운 안쪽 + 선반 2개 + 책
  const [sx,sy]=px(gx,gy+d,h-2);
  b.save(); b.transform(1,0.5,0,1,sx,sy);
  const pw=w*TW/2 - 0; const ph=h-4;
  b.fillStyle='#4a3c26'; b.fillRect(1.5,0,pw-3,ph);        // 안쪽 그늘
  const shelfYs=[Math.floor(ph/3), Math.floor(ph*2/3)];
  b.fillStyle=C.woodT;
  shelfYs.forEach(y=> b.fillRect(1.5,y,pw-3,2));
  // 책 (칸마다 높이/색 다양) — 시드 고정으로 매 프레임 동일 배치
  seed = 4242;
  const cols=['#a26a4a','#6a7a5a','#b8a86a','#7a5a6a','#5a6a7a','#8a6a3a','#9a8a5a'];
  const rows=[0,...shelfYs];
  rows.forEach((ry,r)=>{
    let bx=3;
    const bottom = (r<2? shelfYs[r] : ph);
    while(bx < pw-6){
      const bw2=2+Math.floor(rnd()*2);
      const bh2=6+Math.floor(rnd()*4);
      b.fillStyle=cols[Math.floor(rnd()*cols.length)];
      b.fillRect(bx, bottom-bh2, bw2, bh2);
      b.fillStyle='rgba(0,0,0,0.25)';
      b.fillRect(bx+bw2-1, bottom-bh2, 1, bh2);            // 책등 음영
      bx += bw2+1;
      if(rnd()<0.18) bx+=3;                                // 빈 틈
    }
  });
  b.restore();
  // 책장 위 화분 하나
  box(gx+0.3, gy+0.2, 0.35, 0.35, h, 3, '#8a6a48','#6f5438','#7d5f40',C.outline);
  const tp=px(gx+0.47,gy+0.37,h+3);
  b.strokeStyle=C.plant; b.lineWidth=1;
  b.beginPath(); b.moveTo(tp[0],tp[1]); b.lineTo(tp[0]-3,tp[1]-5); b.stroke();
  b.beginPath(); b.moveTo(tp[0],tp[1]); b.lineTo(tp[0]+2,tp[1]-6); b.stroke();
  b.beginPath(); b.moveTo(tp[0],tp[1]); b.lineTo(tp[0],tp[1]-7); b.stroke();
}

function chartContent(pw,h,t){
  b.strokeStyle=C.gridLn; b.lineWidth=0.5;
  for(let i=1;i<4;i++){ b.beginPath(); b.moveTo(0,h*i/4); b.lineTo(pw,h*i/4); b.stroke(); }
  let mn=Infinity,mx=-Infinity;
  candles.forEach(c=>{mn=Math.min(mn,c.lo);mx=Math.max(mx,c.hi);});
  const pad=(mx-mn)*0.15+1; mn-=pad; mx+=pad;
  const Y=v=>h-(v-mn)/(mx-mn)*h;
  const cw=pw/23;
  candles.forEach((c,i)=>{
    const x=i*cw+1, up=c.close>=c.open;
    b.fillStyle=up?C.green:C.red;
    b.fillRect(x+cw*0.35, Y(c.hi), 0.8, Y(c.lo)-Y(c.hi));
    const bt=Y(Math.max(c.open,c.close));
    b.fillRect(x, bt, cw*0.7, Math.max(1,Math.abs(Y(c.open)-Y(c.close))));
  });
  if(Math.floor(t*2)%2===0){
    b.strokeStyle='#e8e4c0'; b.lineWidth=0.5; b.setLineDash([1,1]);
    b.beginPath(); b.moveTo(0,Y(lastClose)); b.lineTo(pw,Y(lastClose)); b.stroke();
    b.setLineDash([]);
  }
}

// 말티즈1(제일 작음, 혓바닥), 말티즈2(조금 큼), 포메(제일 큼)
const dogs=[
  { s:1.0,  phase:0,               kind:'mal', tongue:true,  hopP:0.0 },
  { s:1.15, phase:Math.PI*0.72,    kind:'mal', tongue:false, hopP:2.1 },

];
function yip(){
  if(!actx || muted || Math.random()>0.5) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='square'; o.frequency.setValueAtTime(950,actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(600,actx.currentTime+0.07);
  g.gain.setValueAtTime(0.02,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0005,actx.currentTime+0.08);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.08);
}

// ── 댄스타임: 탭하면 잠깐 두 발로 서서 춤추고 원래 놀이로 복귀 ──
let danceEnd = -1;
let chaseT = 0;                  // 추격 놀이 전용 시계 (댄스 중엔 멈춰서 복귀가 자연스러움)
function startDance(){
  const tNow = (performance.now() - t0) / 1000;
  if (tNow < danceEnd) return;   // 이미 춤추는 중
  danceEnd = tNow + 2.8;
  // 신나는 낑낑 3연타
  if (actx && !muted) [0, 140, 280].forEach(ms => setTimeout(() => {
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.setValueAtTime(880+Math.random()*220, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1200, actx.currentTime+0.06);
    g.gain.setValueAtTime(0.02, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0005, actx.currentTime+0.07);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.07);
  }, ms));
}

// 이족보행 댄스 포즈
function drawDanceDog(sx, sy, s, d, t){
  const F = v=>Math.round(v*s);
  const pom = d.kind==='pom';
  const body = C.dog, bodyD = C.dogD, cream = '#e6cd96';
  const beat = t*9 + d.phase;
  const bounce = Math.abs(Math.sin(beat)) * 3;
  const sway = Math.sin(beat) * 1.5;
  const x = sx + sway, y = sy - bounce;

  // 그림자
  b.globalAlpha=0.2; b.fillStyle='#000';
  b.beginPath(); b.ellipse(sx, sy+F(3), F(4.5), F(1.8), 0, 0, Math.PI*2); b.fill();
  b.globalAlpha=1;

  // 뒷다리 (교차 스텝)
  const stepL = Math.sin(beat)>0?1:0, stepR = 1-stepL;
  b.fillStyle=bodyD;
  b.fillRect(x-F(2.2), y+F(2)-stepL, F(1.6), F(3)+stepL);
  b.fillRect(x+F(0.6), y+F(2)-stepR, F(1.6), F(3)+stepR);

  // 몸통 (세로로 선 자세)
  b.fillStyle=C.outline;
  b.beginPath(); b.ellipse(x, y-F(1.5), F(3.8), F(5), 0, 0, Math.PI*2); b.fill();
  b.fillStyle=body;
  b.beginPath(); b.ellipse(x, y-F(1.5), F(3), F(4.2), 0, 0, Math.PI*2); b.fill();
  b.fillStyle=bodyD;                                          // 배
  b.beginPath(); b.ellipse(x, y+F(0.5), F(1.8), F(2.2), 0, 0, Math.PI*2); b.fill();
  if(pom){                                                    // 등의 누런 털 (옆으로 살짝 보임)
    b.fillStyle=cream;
    b.beginPath(); b.ellipse(x-F(2.2), y-F(3), F(1.2), F(1.8), 0.4, 0, Math.PI*2); b.fill();
  }

  // 앞발 만세 흔들기 (좌우 교대로 번쩍)
  const waveL = Math.sin(beat*1.5)*2, waveR = Math.sin(beat*1.5+Math.PI)*2;
  b.fillStyle=C.outline;
  b.fillRect(x-F(5), y-F(6)-waveL, F(2), F(3.4));
  b.fillRect(x+F(3), y-F(6)-waveR, F(2), F(3.4));
  b.fillStyle=body;
  b.fillRect(x-F(4.6), y-F(5.6)-waveL, F(1.2), F(2.6));
  b.fillRect(x+F(3.4), y-F(5.6)-waveR, F(1.2), F(2.6));

  // 꼬리 (신나서 고속 와그)
  if(pom){
    b.fillStyle=C.outline;
    b.beginPath(); b.arc(x+F(3.6), y-F(2), F(2.2), 0, Math.PI*2); b.fill();
    b.fillStyle=body;
    b.beginPath(); b.arc(x+F(3.6), y-F(2), F(1.6), 0, Math.PI*2); b.fill();
    b.fillStyle=cream;
    b.beginPath(); b.arc(x+F(3.9), y-F(2.3), F(0.8), 0, Math.PI*2); b.fill();
  } else {
    const wag = Math.sin(t*20 + d.phase) * F(2);
    b.strokeStyle=body; b.lineWidth=F(1.4);
    b.beginPath(); b.moveTo(x+F(2.6), y+F(0.5));
    b.quadraticCurveTo(x+F(5), y-F(1), x+F(4.5)+wag, y-F(3));
    b.stroke();
  }

  // 머리 (정면, 위에서 까딱까딱)
  const nod = Math.sin(beat*2)*1;
  const hx = x, hy = y - F(7) + nod;
  b.fillStyle=C.outline;
  b.beginPath(); b.arc(hx, hy, F(3.4), 0, Math.PI*2); b.fill();
  b.fillStyle=body;
  b.beginPath(); b.arc(hx, hy, F(2.7), 0, Math.PI*2); b.fill();
  if(pom){                                                    // 쫑긋 귀
    b.fillStyle=C.outline;
    b.fillRect(hx-F(3.2), hy-F(4.2), F(1.8), F(2.2));
    b.fillRect(hx+F(1.4), hy-F(4.2), F(1.8), F(2.2));
    b.fillStyle=body;
    b.fillRect(hx-F(2.8), hy-F(3.8), F(1), F(1.4));
    b.fillRect(hx+F(1.8), hy-F(3.8), F(1), F(1.4));
  } else {                                                    // 늘어진 귀 (박자 맞춰 펄럭)
    const flap = Math.abs(Math.sin(beat))*1;
    b.fillStyle=C.outline;
    b.fillRect(hx-F(4), hy-F(1.5)-flap, F(1.8), F(3.2));
    b.fillRect(hx+F(2.2), hy-F(1.5)-flap, F(1.8), F(3.2));
    b.fillStyle=body;
    b.fillRect(hx-F(3.6), hy-F(1.2)-flap, F(1), F(2.4));
    b.fillRect(hx+F(2.6), hy-F(1.2)-flap, F(1), F(2.4));
  }
  // 정면 얼굴: 눈 2 + 코 + (1번 말티즈는 혓바닥)
  b.fillStyle=C.outline;
  b.fillRect(hx-F(1.4), hy-F(0.8), F(0.9), F(0.9));
  b.fillRect(hx+F(0.6), hy-F(0.8), F(0.9), F(0.9));
  b.fillStyle=C.dogNose; b.fillRect(hx-F(0.4), hy+F(0.6), F(0.9), F(0.9));
  if(muted){
    // 음소거: 입에 빨간 X
    const mx = hx, my = hy+F(2);
    b.strokeStyle='#e0705c'; b.lineWidth=1;
    b.beginPath(); b.moveTo(mx-2,my-2); b.lineTo(mx+2,my+2); b.stroke();
    b.beginPath(); b.moveTo(mx+2,my-2); b.lineTo(mx-2,my+2); b.stroke();
  } else if(d.tongue){
    b.fillStyle='#e88a94';
    b.fillRect(hx-F(0.4), hy+F(1.6), F(1), F(1.8)+Math.round(Math.abs(Math.sin(beat))));
  }
}
function drawOneDog(sx, sy, s, d, t, flip){
  const F = v=>Math.round(v*s);
  const runP = Math.sin(t*10 + d.phase);
  const hop  = Math.max(0, Math.sin(t*3.2 + d.hopP)-0.7) * 8;   // 가끔 폴짝
  sy -= hop;
  const dir = flip? -1 : 1;
  const pom = d.kind==='pom';
  const body = C.dog;                        // 셋 다 흰 몸
  const bodyD= C.dogD;
  const cream = '#e6cd96';                   // 포메 등의 누런 털

  // 그림자
  b.globalAlpha=0.2; b.fillStyle='#000';
  b.beginPath(); b.ellipse(sx, sy+F(3)+hop, F(6), F(2), 0, 0, Math.PI*2); b.fill();
  b.globalAlpha=1;

  // 다리 4개 (달리기 교차)
  b.fillStyle=bodyD;
  const l1=runP>0?1:0, l2=runP>0?0:1;
  b.fillRect(sx-F(4), sy+F(1)-l1, F(1.4), F(3));
  b.fillRect(sx-F(1.5), sy+F(1)-l2, F(1.4), F(3));
  b.fillRect(sx+F(1), sy+F(1)-l2, F(1.4), F(3));
  b.fillRect(sx+F(3), sy+F(1)-l1, F(1.4), F(3));

  // 몸통
  b.fillStyle=C.outline;
  b.beginPath(); b.ellipse(sx, sy-F(1), F(5.5), F(3.6), 0, 0, Math.PI*2); b.fill();
  b.fillStyle=body;
  b.beginPath(); b.ellipse(sx, sy-F(1), F(4.6), F(2.8), 0, 0, Math.PI*2); b.fill();
  b.fillStyle=bodyD;
  b.beginPath(); b.ellipse(sx-dir*F(1), sy+F(0.4), F(3), F(1.4), 0, 0, Math.PI*2); b.fill();
  // 포메: 등 위에 옅은 누런 털 살짝
  if(pom){
    b.fillStyle=cream;
    b.beginPath(); b.ellipse(sx-dir*F(0.5), sy-F(3), F(2.4), F(1), 0, 0, Math.PI*2); b.fill();
  }

  // 꼬리
  if(pom){
    // 포메: 등 위로 말린 풍성한 꼬리 (흰 털 + 크림빛 안쪽)
    b.fillStyle=C.outline;
    b.beginPath(); b.arc(sx-dir*F(4.5), sy-F(3.5), F(2.6), 0, Math.PI*2); b.fill();
    b.fillStyle=body;
    b.beginPath(); b.arc(sx-dir*F(4.5), sy-F(3.5), F(2), 0, Math.PI*2); b.fill();
    b.fillStyle=cream;
    b.beginPath(); b.arc(sx-dir*F(4.8), sy-F(3.8), F(1), 0, Math.PI*2); b.fill();
  } else {
    // 말티즈: 살랑살랑 위로 선 꼬리
    const wag = Math.sin(t*14 + d.phase) * F(1.5);
    b.strokeStyle=body; b.lineWidth=F(1.6);
    b.beginPath(); b.moveTo(sx-dir*F(4.5), sy-F(2));
    b.quadraticCurveTo(sx-dir*F(6), sy-F(4), sx-dir*F(5.5)+wag, sy-F(6));
    b.stroke();
  }

  // 머리 (진행 방향 앞쪽, 살짝 위)
  const hx = sx + dir*F(4.5), hy = sy - F(3.5) + Math.sin(t*10+d.phase)*0.6;
  b.fillStyle=C.outline;
  b.beginPath(); b.arc(hx, hy, F(3.4), 0, Math.PI*2); b.fill();
  b.fillStyle=body;
  b.beginPath(); b.arc(hx, hy, F(2.7), 0, Math.PI*2); b.fill();
  if(pom){
    // 포메: 갈기 볼륨 + 쫑긋 세운 귀
    b.fillStyle=body;
    b.beginPath(); b.arc(hx-dir*F(1.5), hy+F(1), F(2.4), 0, Math.PI*2); b.fill();
    b.fillStyle=C.outline;
    b.fillRect(hx-F(3), hy-F(4.5), F(1.6), F(2));
    b.fillRect(hx+F(1.2), hy-F(4.5), F(1.6), F(2));
    b.fillStyle=body;
    b.fillRect(hx-F(2.7), hy-F(4.2), F(1), F(1.4));
    b.fillRect(hx+F(1.5), hy-F(4.2), F(1), F(1.4));
  } else {
    // 말티즈: 늘어진 귀 양옆
    b.fillStyle=C.outline;
    b.fillRect(hx-F(3.6), hy-F(1.5), F(1.6), F(3));
    b.fillRect(hx+F(2), hy-F(1.5), F(1.6), F(3));
    b.fillStyle=body;
    b.fillRect(hx-F(3.3), hy-F(1.2), F(1), F(2.4));
    b.fillRect(hx+F(2.3), hy-F(1.2), F(1), F(2.4));
  }
  // 주둥이 + 코 + 눈
  b.fillStyle=body; b.fillRect(hx+dir*F(2), hy, F(1.6), F(1.2));
  b.fillStyle=C.dogNose; b.fillRect(hx+dir*F(3), hy, F(0.9), F(0.9));
  b.fillStyle=C.outline; b.fillRect(hx+dir*F(0.5), hy-F(1.2), F(0.9), F(0.9));
  // 음소거: 입에 빨간 X
  if(muted){
    const mx = hx+dir*F(2.6), my = hy+F(1.2);
    b.strokeStyle='#e0705c'; b.lineWidth=1;
    b.beginPath(); b.moveTo(mx-2,my-2); b.lineTo(mx+2,my+2); b.stroke();
    b.beginPath(); b.moveTo(mx+2,my-2); b.lineTo(mx-2,my+2); b.stroke();
  }
  // 혓바닥 (말티즈1만, 음소거 아닐 때)
  if(d.tongue && !muted){
    const lick = Math.sin(t*6)>0? 0 : 1;
    b.fillStyle='#e88a94';
    b.fillRect(hx+dir*F(2.6), hy+F(1), F(1), F(1.6)+lick);
  }
}

const SLEEP_SPOTS = [[4.9, 6.3], [6.3, 7.2], [5.3, 7.9]];
function drawSleepDog(sx, sy, s, d, t){
  const F = v => Math.round(v*s);
  const pom = d.kind === 'pom';
  const br = Math.sin(t*1.4 + d.phase) * 0.6;
  // 웅크린 몸
  b.fillStyle = C.outline;
  b.beginPath(); b.ellipse(sx, sy, F(6.4), F(3.8)+br*0.4, 0, 0, Math.PI*2); b.fill();
  b.fillStyle = C.dog;
  b.beginPath(); b.ellipse(sx, sy, F(5.4), F(3)+br*0.4, 0, 0, Math.PI*2); b.fill();
  b.fillStyle = C.dogD;
  b.beginPath(); b.ellipse(sx-F(1), sy+F(0.8), F(3.4), F(1.6), 0, 0, Math.PI*2); b.fill();
  if (pom) {
    b.fillStyle = '#e6cd96';
    b.beginPath(); b.ellipse(sx-F(0.5), sy-F(2.2), F(2.2), F(1), 0, 0, Math.PI*2); b.fill();
  }
  // 꼬리 말고 잠
  b.strokeStyle = pom ? '#e6cd96' : C.dogD; b.lineWidth = F(1.6);
  b.beginPath(); b.arc(sx-F(4), sy-F(0.5), F(2.4), Math.PI*0.2, Math.PI*1.3); b.stroke();
  // 머리 (몸에 기댐)
  b.fillStyle = C.outline; b.fillRect(sx+F(2.4), sy-F(5), F(6.4), F(5));
  b.fillStyle = C.dog;     b.fillRect(sx+F(3.2), sy-F(4.2), F(4.8), F(3.4));
  b.fillStyle = C.dogD;
  if (pom) { b.fillRect(sx+F(3.4), sy-F(5.6), F(1.6), F(1.8)); b.fillRect(sx+F(6.2), sy-F(5.6), F(1.6), F(1.8)); }
  else     { b.fillRect(sx+F(2.8), sy-F(3.6), F(1.4), F(2.6)); b.fillRect(sx+F(7), sy-F(3.6), F(1.4), F(2.6)); }
  b.fillStyle = C.outline; b.fillRect(sx+F(5.4), sy-F(3), F(1.4), F(0.8));   // 감은 눈
  b.fillStyle = C.dogNose; b.fillRect(sx+F(7.6), sy-F(2), F(0.9), F(0.9));
  if (muted) {
    const mx = sx+F(7), my = sy-F(0.6);
    b.strokeStyle='#e0705c'; b.lineWidth=1;
    b.beginPath(); b.moveTo(mx-2,my-2); b.lineTo(mx+2,my+2); b.stroke();
    b.beginPath(); b.moveTo(mx+2,my-2); b.lineTo(mx-2,my+2); b.stroke();
  }
  if (Math.random() < 0.006) spawnZ(sx+F(8), sy-F(7));
}
function drawDogs(t, open){
  const dancing = t < danceEnd;
  if (open && !dancing) chaseT += 1/60;
  const list = dogs.map((d, i)=>{
    let gx, gy, flip = false;
    if (open) {
      const a = chaseT*1.15 + d.phase;
      gx = 5.5 + Math.cos(a)*1.25;
      gy = 6.5 + Math.sin(a)*1.05;
      flip = (-Math.sin(a)*1.25 - Math.cos(a)*1.05) < 0;
    } else {
      [gx, gy] = SLEEP_SPOTS[i];
      flip = i % 2 === 1;
    }
    const [sx, sy] = px(gx, gy, 0);
    return { d, sx, sy, flip };
  });
  list.sort((a,c)=>a.sy-c.sy);               // 깊이 정렬
  list.forEach(o=> dancing
    ? drawDanceDog(o.sx, o.sy, o.d.s, o.d, t)
    : (open ? drawOneDog(o.sx, o.sy, o.d.s, o.d, t, o.flip)
            : drawSleepDog(o.sx, o.sy, o.d.s, o.d, t)));
  if(open && !dancing && Math.random()<0.004) yip();
}

  drawPixelFlower(16,  TITLE_Y - 10, '#c88a9a');
  drawPixelFlower(224, TITLE_Y - 10, '#8aa8c8');
  drawPixelFlower(22,  TITLE_Y + 8,  C.plant);
  drawPixelFlower(218, TITLE_Y + 8,  '#d8b23e');
}
function drawPanelChrome(t){
  const {x,y,w,h}=PANEL;
  // 외곽 2중 픽셀 테두리 + 배경
  b.fillStyle='#000c'; b.fillRect(x-2,y-2,w+4,h+4);
  b.fillStyle='#221f14'; b.fillRect(x,y,w,h);
  const flashing = t < refreshFlashUntil;
  b.strokeStyle = flashing ? '#e8dfb0' : '#4a4433';
  b.lineWidth=2; b.strokeRect(x+1,y+1,w-2,h-2);
  b.strokeStyle = flashing ? '#b8ae88' : '#6b6248';
  b.lineWidth=1; b.strokeRect(x+3.5,y+3.5,w-7,h-7);
  drawMoneyBag(x+12, y+7);
  // ── 카메라 버튼 (공유 카드) ──
  {
    const c2=CAM;
    b.fillStyle='#2c2818'; b.fillRect(c2.x, c2.y, c2.w, c2.h);
    b.strokeStyle='#4a4433'; b.lineWidth=1; b.strokeRect(c2.x+0.5, c2.y+0.5, c2.w-1, c2.h-1);
    b.fillStyle='#d8d0a8';
    b.fillRect(c2.x+4, c2.y+4, c2.w-8, c2.h-7);                 // 몸통
    b.fillRect(c2.x+7, c2.y+2, 5, 2);                            // 뷰파인더 혹
    b.fillStyle='#2c2818';
    b.beginPath(); b.arc(c2.x+c2.w/2, c2.y+c2.h/2+0.5, 3, 0, Math.PI*2); b.fill();   // 렌즈
    b.fillStyle='#e0705c'; b.fillRect(c2.x+c2.w-6, c2.y+4, 1.5, 1.5);                // 셔터등
  }
  // 점선 구분선 3개
  b.strokeStyle='#4a4433'; b.setLineDash([3,3]);
  [24, 58, 92].forEach(dy=>{
    b.beginPath(); b.moveTo(x+8, y+dy); b.lineTo(x+w-8, y+dy); b.stroke();
  });
  b.setLineDash([]);
  // 갱신 진행 게이지 (10초)
  const prog = Math.min(1, (Date.now()-(lastUpdate?lastUpdate.getTime():Date.now()))/REFRESH_MS);
  b.fillStyle='#3a3524'; b.fillRect(x+8, y+h-8, w-16, 2);
  b.fillStyle='#8a836a'; b.fillRect(x+8, y+h-8, (w-16)*prog, 2);
  // 모서리 꽃
  drawPixelFlower(x+6, y+h-14, '#c88a9a');
  drawPixelFlower(x+w-6, y+14, C.plant);
}
// 고해상도 텍스트 패스 (버퍼 좌표 기준 → 스크린 좌표로 스케일)
function drawUIText(){
  const Sx = screen.width / BW, Sy = screen.height / BH;
  const T = (str, bx, by, size, color, align='left') => {
    sctx.font = `${Math.round(size*Sx)}px NeoDunggeunmo, 'Courier New', monospace`;
    sctx.fillStyle = color; sctx.textAlign = align; sctx.textBaseline = 'middle';
    sctx.fillText(str, Math.round(bx*Sx), Math.round(by*Sy));
  };
  // ── 상단 타이틀 ──
  T('정모의 방', BW/2+8+1, TITLE_Y-4+1, 13, '#000a', 'center');   // 그림자
  T('정모의 방', BW/2+8, TITLE_Y-4, 13, '#e8dfb0', 'center');
  T('투자 현황판', BW/2, TITLE_Y+12, 7, '#8a836a', 'center');
  // ── 곳간 패널 ──
  const {x,y,w,h}=PANEL;
  const pl = totalNow()-totalAvg();
  const pct = (totalNow()/totalAvg()-1)*100;
  const cls = v => v>=0 ? UP : DOWN;
  T('정모의 곳간', x+26, y+14, 9, '#e8dfb0');
  T(liveMode?'LIVE':'SIM', x+w-10, y+14, 7, liveMode?UP:'#8a836a', 'right');
  HOLDINGS.forEach((hd,i)=>{
    const ry = y+34+i*34;
    const hpl = (hd.price-hd.avg)*hd.qty;
    const hpct = (hd.price/hd.avg-1)*100;
    T(hd.name, x+10, ry, 8, '#e8dfb0');
    T(`${sign(hpl)}${fmt(hpl)}원`, x+w-10, ry, 8, cls(hpl), 'right');
    T(`${hd.qty}주·평단 ${fmt(hd.avg)} → ${fmt(hd.price)}원`, x+10, ry+13, 6.5, '#8a836a');
    T(`${sign(hpct)}${hpct.toFixed(2)}%`, x+w-10, ry+13, 6.5, cls(hpct), 'right');
  });
  T('총 손익', x+10, y+106, 9, '#e8dfb0');
  T(`${sign(pl)}${fmt(pl)}원 (${sign(pct)}${pct.toFixed(2)}%)`, x+w-10, y+106, 9, cls(pl), 'right');
  const hh = lastUpdate ? lastUpdate.toLocaleTimeString('ko-KR') : '-';
  const foot = isMarketOpen()
    ? `마지막 갱신 ${hh} · 10초 자동 갱신 · 탭=새로고침`
    : `장 마감 · 개장까지 ${untilOpenStr()} · 종가 기준`;
  T(foot, x+w/2, y+122, 5.5, '#6d6752', 'center');
}

// ═══════════ 메인 루프 ═══════════
const t0=performance.now();
let partyFired = false;
function frame(){
  const t=(performance.now()-t0)/1000;
  const open = isMarketOpen();
  if(mood!==0){ moodT+=1/60; if(moodT>2.2){mood=0;moodT=0;} }
  updateSteam(open);
  updateConfetti();
  updateZzz();
  // 데모 미리보기
  if (getP('demo')==='party' && !partyFired && t>1.5){ partyFired=true; burstConfetti(); startDance(); }
  if (getP('demo')==='rain') rainTarget = 1;
  rainLevel += (rainTarget - rainLevel) * 0.02;

  b.fillStyle=C.bg; b.fillRect(0,0,BW,BH);
  drawWalls(t);
  drawFloor();
  drawBed();
  drawShelf();
  drawDesk(t, open);
  const offScreen = (pw,h)=>{ b.fillStyle='#0b0e0b'; b.fillRect(0,0,pw,h); };
  drawMonitor(4.85,42,2.0,15, open?chartContent:offScreen, t);
  drawMonitor(7.1,40,1.5,12, open?watchContent:offScreen, t);
  if (open) {
    drawNerdLegs(t);
    drawChairBase();
    drawNerd(t);
    drawChairBack();
  } else {
    drawChairBase();
    drawChairBack();                          // 빈 의자
    drawSleepingNerd(t);                      // 침대에서 취침
  }
  drawDogs(t, open);
  drawSteam();
  drawConfetti();
  drawZzz();

  // 모니터 글로우 (장중에만) / 마감엔 창가 달빛만 은은하게
  if (open) {
    const flick=0.8+Math.random()*0.2;
    const [glx,gly]=px(6.4,2.6,26);
    const gl=b.createRadialGradient(glx,gly,4,glx,gly,55);
    const gc = (totalNow() >= totalAvg()) ? '159,232,176' : '217,111,95';
    gl.addColorStop(0,`rgba(${gc},${0.10*flick})`);
    gl.addColorStop(1,'rgba(0,0,0,0)');
    b.fillStyle=gl; b.fillRect(0,0,BW,BH);
  } else {
    const [mx2,my2]=px(0,6.8,44);
    const ml=b.createRadialGradient(mx2,my2,4,mx2,my2,50);
    ml.addColorStop(0,'rgba(200,210,235,0.07)');
    ml.addColorStop(1,'rgba(0,0,0,0)');
    b.fillStyle=ml; b.fillRect(0,0,BW,BH);
  }

  if(Math.floor(t*30)%2===0) makeGrain();
  b.drawImage(grain,0,0);
  const vg=b.createRadialGradient(BW/2,BH/2-60,BH*0.2,BW/2,BH/2-40,BH*0.55);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(8,7,3,0.55)');
  b.fillStyle=vg; b.fillRect(0,0,BW,BH);
  // 하락 비: 방 전체가 살짝 가라앉는 톤 / 마감: 취침 어둠
  if (rainLevel > 0.02) { b.fillStyle=`rgba(10,14,24,${0.14*rainLevel})`; b.fillRect(0,0,BW,BH); }
  if (!open) { b.fillStyle='rgba(6,6,10,0.22)'; b.fillRect(0,0,BW,BH); }

  // UI 크롬은 그레인/비네트 위에 (선명하게)
  drawTitleChrome();
  drawPanelChrome(t);

  sctx.drawImage(buf,0,0,screen.width,screen.height);
  drawUIText();
  // 셔터 플래시
  if (t < shutterUntil) {
    sctx.fillStyle = `rgba(255,252,235,${(shutterUntil - t) / 0.22 * 0.75})`;
    sctx.fillRect(0, 0, screen.width, screen.height);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
