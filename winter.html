<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>winter</title>
<meta name="theme-color" content="#0C1524">
<meta property="og:title" content="2025 겨울, 산속">
<meta property="og:description" content="모모 · 송이 · 열매 그리고 유지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0C1524}
  body{font-family:'Gowun Dodum',sans-serif;color:#EAF2F8}
  canvas{position:fixed;inset:0;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;display:block}

  /* 가사 — 상단 */
  #lyrics{
    position:fixed;left:0;right:0;
    top:max(34vh,calc(env(safe-area-inset-top) + 7rem));
    text-align:center;z-index:3;pointer-events:none;padding:0 1.4rem;
  }
  #lyCur{
    font-size:clamp(1.15rem,5vw,1.75rem);line-height:1.7;min-height:1.7em;
    color:#FFF3DF;text-shadow:0 2px 16px rgba(6,12,24,.95),0 0 34px rgba(255,160,70,.30);
    opacity:0;transform:translateY(-9px);
    transition:opacity .65s ease,transform .65s ease;
  }
  #lyNxt{
    font-size:clamp(.78rem,3.3vw,.98rem);margin-top:.6rem;min-height:1.5em;
    color:rgba(234,242,248,.3);text-shadow:0 1px 10px rgba(6,12,24,.95);
    opacity:0;transition:opacity .65s ease;
  }
  #lyCur.on,#lyNxt.on{opacity:1;transform:none}

  #load{
    width:min(62vw,260px);margin-top:2.8rem;
    transition:opacity .7s ease;
  }
  #load.gone{opacity:0}
  #load.out{display:none}
  #loadTrack{
    height:2px;background:rgba(200,220,240,.16);border-radius:2px;overflow:hidden;
  }
  #loadBar{
    height:100%;width:0%;border-radius:2px;
    background:linear-gradient(90deg,#E8A33D,#FFD79A);
    box-shadow:0 0 14px rgba(255,180,110,.6);
    transition:width .18s linear;
  }
  #loadPct{
    font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.28em;
    color:rgba(234,242,248,.42);margin-top:.9rem;
  }
  #dedi{
    margin-top:2.4rem;display:none;
  }
  #dedi.show{display:block}
  #dedi p{
    font-size:clamp(.95rem,4vw,1.15rem);line-height:2.1;
    color:rgba(255,243,223,.9);
    opacity:0;transform:translateY(8px);
    transition:opacity 1.1s ease,transform 1.1s ease;
  }
  #dedi.on p{opacity:1;transform:none}
  #dedi.on p:nth-child(2){transition-delay:.75s}
  #dedi.on p:nth-child(3){transition-delay:1.5s}
  #dedi p.last{color:#FFE9C4;letter-spacing:.1em;margin-top:.5rem}

  /* ---- 엔딩 폴라로이드 ---- */
  #outro{
    position:fixed;inset:0;z-index:15;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    padding:2rem 1.4rem;text-align:center;
    background:radial-gradient(ellipse at 50% 50%,rgba(8,16,30,.72),rgba(5,10,20,.94));
    opacity:0;transition:opacity 1.6s ease;
  }
  #outro.show{display:flex}
  #outro.on{opacity:1}
  .polaroid{
    background:#F6F2E8;padding:12px 12px 0;
    box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 90px rgba(255,170,90,.16);
    transform:rotate(-1.6deg) scale(.9);
    opacity:0;
    transition:transform 1.6s cubic-bezier(.2,.9,.25,1),opacity 1.6s ease;
    max-width:min(78vw,380px);
  }
  #outro.on .polaroid{transform:rotate(-1.6deg) scale(1);opacity:1}
  .polaroid img{
    display:block;width:100%;height:auto;
    background:#DDD6C8;
  }
  .polaroid .cap{
    font-family:'Gowun Dodum',sans-serif;
    color:#3A342C;font-size:.86rem;letter-spacing:.06em;
    padding:.95rem 0 1.15rem;
  }
  #outro .line{
    margin-top:2.2rem;font-size:clamp(.9rem,3.8vw,1.05rem);line-height:2;
    color:rgba(255,243,223,.8);
    opacity:0;transition:opacity 1.4s ease 1.2s;
  }
  #outro.on .line{opacity:1}
  #replay{
    margin-top:1.8rem;opacity:0;transition:opacity 1.2s ease 2.4s;
  }
  #outro.on #replay{opacity:1}

  /* ---- 사진 갤러리 ---- */
  #gallery{
    position:fixed;inset:0;z-index:8;display:none;
    align-items:center;justify-content:center;
    background:rgba(6,12,22,.62);
    opacity:0;transition:opacity 1.4s ease;
  }
  #gallery.show{display:flex}
  #gallery.on{opacity:1}
  #gallery img{
    position:absolute;
    max-width:82vw;max-height:68vh;
    border:7px solid rgba(246,242,232,.94);
    box-shadow:0 20px 54px rgba(0,0,0,.6);
    opacity:0;transform:scale(1.06) rotate(var(--r,0deg));
    transition:opacity 1.4s ease;
  }
  #gallery img.on{
    opacity:1;transform:scale(1) rotate(var(--r,0deg));
    transition:opacity 1.4s ease,transform 7s linear;
  }

  #bar{
    position:fixed;right:0;z-index:5;
    bottom:max(1rem,calc(env(safe-area-inset-bottom) + .4rem));
    padding:0 1rem;opacity:1;transition:opacity .6s;
  }
  #bar.idle{opacity:.14}
  .btn{
    font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.16em;
    background:rgba(12,21,36,.6);color:#D8E4EF;
    border:1px solid rgba(200,220,240,.22);border-radius:999px;
    padding:.5rem 1rem;cursor:pointer;backdrop-filter:blur(6px);
  }
  .btn:hover{background:rgba(255,160,70,.2);border-color:rgba(255,180,110,.45)}
  .btn:focus-visible{outline:2px solid #FFC07A;outline-offset:3px}

  #gate{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem;cursor:pointer;
    background:radial-gradient(ellipse at 50% 55%,rgba(8,16,30,.55),rgba(6,12,22,.88));
    transition:opacity .9s ease;
  }
  #gate.gone{opacity:0;pointer-events:none}
  #gate .t{font-size:clamp(1.6rem,7vw,2.4rem);letter-spacing:.14em;
    text-shadow:0 0 40px rgba(255,160,70,.35)}
  #gate .s{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.34em;
    color:#E8A33D;margin-bottom:1.4rem}
  #gate .h{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.28em;
    color:rgba(234,242,248,.4);margin-top:2.4rem;opacity:0;transition:opacity 1s ease}
  #gate .h.on{animation:pulse 2.6s ease-in-out infinite;opacity:1}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}

  @media (prefers-reduced-motion:reduce){
    #lyCur,#lyNxt{transition:none}
    #gate .h{animation:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="lyrics">
  <div id="lyCur"></div>
  <div id="lyNxt"></div>
</div>
<div id="bar"><button class="btn" id="soundBtn">❚❚</button></div>

<div id="gate">
  <div id="load">
    <div id="loadTrack"><div id="loadBar"></div></div>
    <div id="loadPct">LOADING 0%</div>
  </div>

  <div id="dedi">
    <p>나의 강아지 모모, 송이, 열매</p>
    <p class="last">그리고 나의 전부 유지에게</p>
  </div>

  <div class="h" id="hint">TAP TO PLAY</div>
</div>

<div id="gallery"></div>

<div id="outro">
  <div class="polaroid">
    <img src="f46762f8599d89345e9c93eb60e9c394e716afff.jpeg" alt="가족 사진">
    <div class="cap">나의 전부</div>
  </div>
  <button class="btn" id="replay">다시 보기</button>
</div>

<script>
(function(){
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== 설정 ===== */
const FIRST_LINE_OFFSET = -1.0;   // 첫 가사만 1초 먼저
const EPISODE_EVERY     = 10;     // 초마다 새 에피소드

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

const P={
  skyTop:'#0E1A2E', skyMid:'#1B2C46', skyLow:'#2E4262',
  star:'#E9F2FF', moon:'#F4EBCF',
  ridge:'#22344F', ridgeSnow:'#4A6183',
  ridge2:'#1A283D', ridge2Snow:'#35486A',
  pine:'#16283A', pineSnow:'#9FB8CE',
  snow:'#DCE8F4', snowSh:'#B7C9DD', snowDk:'#8FA6BE',
  tent:'#C4553F', tentSh:'#933E2F', tentLit:'#E88A5E', tentPole:'#6B5B4A',
  log:'#5A4030', logSh:'#432E22', ember:'#FF8A3C',
  flame1:'#FFE9A8', flame2:'#FFB84C', flame3:'#F2702A', flame4:'#C8341A',
  smoke:'#3A4A60',
  skin:'#F0C9A8', beanie:'#D8536B', coat:'#3E6E8C', coatSh:'#2E5468',
  blanket:'#C98F4E', boot:'#3A332C',
  dog:'#F6F0E6', dogSh:'#D5C9B8', cream:'#E8CFA2', nose:'#2E2825',
  potato:'#8B5A3C', potatoLt:'#A56B48', foil:'#C9CFD6', steam:'#B7C9DD',
  squirrel:'#9A6640', squirrelLt:'#B9855C',
  mark:'#FFE9A8'
};

let SC=3,W=0,H=0,GY=0,K=1;
function resize(){
  const vw=innerWidth, vh=innerHeight;
  SC=Math.max(2,Math.min(6,Math.round(vw/360)));
  W=Math.ceil(vw/SC); H=Math.ceil(vh/SC);
  cv.width=W; cv.height=H;
  cv.style.width=vw+'px'; cv.style.height=vh+'px';
  ctx.imageSmoothingEnabled=false;
  GY=Math.round(H*0.74); K=Math.min(1,W/230);
}
resize(); addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,120));

const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const rnd=s=>{const x=Math.sin(s*127.1)*43758.5453;return x-Math.floor(x);};
const lerp=(a,b,p)=>a+(b-a)*p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function mirror(x,fn){ ctx.save(); ctx.translate(x,0); ctx.scale(-1,1); ctx.translate(-x,0); fn(); ctx.restore(); }

/* ===== 배경 ===== */
function sky(t){
  const g=ctx.createLinearGradient(0,0,0,GY);
  g.addColorStop(0,P.skyTop); g.addColorStop(.6,P.skyMid); g.addColorStop(1,P.skyLow);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,GY+2);
  for(let i=0;i<70;i++){
    const x=Math.floor(rnd(i*1.7)*W), y=Math.floor(rnd(i*3.3)*GY*0.8);
    ctx.globalAlpha=(0.35+0.65*(0.5+0.5*Math.sin(t*1.6+i)))*0.9; px(x,y,1,1,P.star);
  }
  ctx.globalAlpha=1;
  const mx=Math.round(W*0.80), my=Math.round(GY*0.20), r=Math.max(6,Math.round(H*0.028));
  ctx.fillStyle=P.moon; ctx.beginPath(); ctx.arc(mx,my,r,0,7); ctx.fill();
  ctx.fillStyle=P.skyTop; ctx.beginPath(); ctx.arc(mx-r*0.45,my-r*0.35,r*0.92,0,7); ctx.fill();
  ctx.globalAlpha=.10; ctx.fillStyle=P.moon;
  ctx.beginPath(); ctx.arc(mx,my,r*2.6,0,7); ctx.fill(); ctx.globalAlpha=1;
}
function ridge(baseY,amp,period,phase,col,snowCol){
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,H);
  const pts=[];
  for(let x=0;x<=W+1;x++){
    const u=(x+phase)/period;
    const y=baseY-(Math.sin(u*6.283)*0.5+0.5)*amp-(Math.sin(u*17.2+2.1)*0.5+0.5)*amp*0.4;
    pts.push(y); ctx.lineTo(x,Math.round(y));
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle=snowCol;
  for(let x=0;x<W;x++) ctx.fillRect(x,Math.round(pts[x]),1,2);
}
function pine(x,y,s){
  px(x-1,y-s*1.2,2,s*1.2,'#3A2A1E');
  for(let i=0;i<4;i++){
    const w=s*(0.95-i*0.20), yy=y-s*1.0-i*s*0.55;
    px(x-w/2,yy,w,s*0.62,P.pine);
    ctx.globalAlpha=.55; px(x-w/2,yy,w,1,P.pineSnow); ctx.globalAlpha=1;
  }
}
function forest(){
  for(let i=0;i<26;i++) pine(Math.floor(rnd(i*5.1)*(W+40))-20, GY-2+rnd(i*8.8)*3, 7+rnd(i*2.6)*7);
}
function ground(){
  px(0,GY,W,H-GY,P.snow);
  ctx.fillStyle=P.snowSh;
  for(let i=0;i<14;i++){
    const x=rnd(i*4.4)*W, w=14+rnd(i*7.7)*30, y=GY+4+rnd(i*3.1)*(H-GY-6);
    ctx.beginPath(); ctx.ellipse(x,y,w/2,2,0,0,7); ctx.fill();
  }
  ctx.globalAlpha=.5; px(0,GY,W,1,P.snowDk); ctx.globalAlpha=1;
}
function tent(x,y,flick,extraLit){
  const w=44,h=26;
  ctx.globalAlpha=.35; ctx.fillStyle=P.snowDk;
  ctx.beginPath(); ctx.ellipse(x,y+1,w*0.55,3,0,0,7); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle=P.tent; ctx.beginPath();
  ctx.moveTo(x-w/2,y); ctx.lineTo(x,y-h); ctx.lineTo(x+w/2,y); ctx.closePath(); ctx.fill();
  ctx.fillStyle=P.tentSh; ctx.beginPath();
  ctx.moveTo(x,y-h); ctx.lineTo(x+w/2,y); ctx.lineTo(x+w*0.16,y); ctx.closePath(); ctx.fill();
  ctx.fillStyle=P.tentLit; ctx.globalAlpha=Math.min(1,.75+flick*.25+extraLit*.5); ctx.beginPath();
  ctx.moveTo(x-9,y); ctx.lineTo(x-1,y-15); ctx.lineTo(x+7,y); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1; px(x-1,y-h-3,1,4,P.tentPole);
  ctx.globalAlpha=.6; ctx.fillStyle=P.snow; ctx.beginPath();
  ctx.moveTo(x-w/2,y); ctx.lineTo(x,y-h); ctx.lineTo(x-w/2+7,y); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(200,215,230,.5)'; ctx.lineWidth=1; ctx.beginPath();
  ctx.moveTo(x-w/2,y-1); ctx.lineTo(x-w/2-9,y+3);
  ctx.moveTo(x+w/2,y-1); ctx.lineTo(x+w/2+9,y+3); ctx.stroke();
}
function fire(x,y,t,boost){
  const hgt=(13+(Math.sin(t*9.1)*0.5+Math.sin(t*13.7+1.2)*0.3+Math.sin(t*6.3+2.4)*0.2)*4)*(1+boost*0.35);
  px(x-11,y-3,22,3,P.log); px(x-11,y-1,22,2,P.logSh);
  ctx.save(); ctx.translate(x,y-2); ctx.rotate(-0.25); px(-10,-2,20,3,P.log); ctx.restore();
  ctx.save(); ctx.translate(x,y-2); ctx.rotate(0.25); px(-10,-2,20,3,P.logSh); ctx.restore();
  for(let i=0;i<6;i++){
    ctx.globalAlpha=0.4+0.6*(0.5+0.5*Math.sin(t*5+i*1.7));
    px(x-8+i*3.2,y-3,2,2,P.ember); ctx.globalAlpha=1;
  }
  const layers=[[P.flame4,1,1],[P.flame3,.74,.86],[P.flame2,.48,.66],[P.flame1,.24,.42]];
  for(const [col,wr,hr] of layers){
    ctx.fillStyle=col;
    const lh=hgt*hr, lw=9*wr*(1+boost*0.2);
    ctx.beginPath(); ctx.moveTo(x-lw,y-3);
    for(let i=0;i<=10;i++){
      const p=i/10, wob=Math.sin(t*11+p*5+wr*3)*1.6*p;
      ctx.lineTo(x-lw+(lw*2)*p+wob, y-3-Math.sin(p*Math.PI)*lh-(1-Math.abs(p-0.5)*2)*2);
    }
    ctx.lineTo(x+lw,y-3); ctx.closePath(); ctx.fill();
  }
}
const sparks=[];
function updateSparks(x,y,dt,t,boost){
  if(sparks.length<40 && Math.random()<dt*(26+boost*40)){
    sparks.push({x:x+(Math.random()-.5)*10,y:y-6,vx:(Math.random()-.5)*7,
                 vy:-(12+Math.random()*20),life:1+Math.random()*0.9});
  }
  for(const s of sparks){ s.x+=s.vx*dt+Math.sin(t*4+s.y)*0.25; s.y+=s.vy*dt; s.vy*=0.985; s.life-=dt*0.5; }
  for(let i=sparks.length-1;i>=0;i--) if(sparks[i].life<=0) sparks.splice(i,1);
}
function drawSparks(){
  for(const s of sparks){ ctx.globalAlpha=Math.max(0,Math.min(1,s.life));
    px(s.x,s.y,1,1,s.life>0.6?P.flame1:P.flame3); }
  ctx.globalAlpha=1;
}
function smoke(x,y,t){
  ctx.globalAlpha=.10; ctx.fillStyle=P.smoke;
  for(let i=0;i<7;i++){
    const p=(t*0.22+i/7)%1;
    ctx.beginPath(); ctx.arc(x+Math.sin(t*0.9+i*1.4)*6*p, y-18-p*46, 2+p*7, 0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function glow(x,y,flick,boost){
  const r=Math.max(60,H*0.42)*(0.94+flick*0.10+boost*0.18);
  const g=ctx.createRadialGradient(x,y-6,0,x,y-6,r);
  g.addColorStop(0,`rgba(255,170,80,${.30+boost*.14})`);
  g.addColorStop(.45,'rgba(255,140,60,.13)');
  g.addColorStop(1,'rgba(255,120,40,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function potatoPile(x,y,t,hidden){
  if(hidden) return;
  px(x-4,y+1,6,3,P.foil); px(x-4,y+1,6,1,'#E4E9EE');
  px(x+3,y+2,5,3,P.potato); px(x+3,y+2,5,1,P.potatoLt);
  ctx.globalAlpha=.28;
  for(let i=0;i<3;i++){ const p=(t*0.5+i/3)%1; px(x+5+Math.sin(t*2+i)*2, y-1-p*12,1,2,P.steam); }
  ctx.globalAlpha=1;
}

/* ===== 캐릭터 ===== */
function sitter(x,y,t,o){
  o=o||{};
  const nod = o.nod ? Math.sin(t*1.1)*1.2 : 0;
  const yy=y+Math.sin(t*1.5)*0.5+(o.dy||0);
  px(x-2,yy-1,16,5,P.log); px(x-2,yy+2,16,2,P.logSh);
  px(x-5,yy-3,8,3,P.coatSh); px(x-7,yy-1,4,3,P.boot);
  px(x-2,yy-15,12,13,P.blanket); px(x-2,yy-5,12,3,'#B07C40');
  px(x-3,yy-14,3,11,P.coat);
  const armY = o.armUp ? -17 : -11;
  const armX = -6;
  px(x+armX,yy+armY,4,3,P.coat);
  px(x+armX-2,yy+armY,2,2,P.skin);
  if(o.holdPotato){ px(x+armX-6,yy+armY-1,4,3,P.potato); px(x+armX-6,yy+armY-1,4,1,P.potatoLt); }
  if(o.holdBall){ px(x+armX-6,yy+armY-2,4,4,'#F2F8FF'); }
  px(x+1,yy-22+nod,7,7,P.skin);
  px(x,yy-24+nod,9,4,P.beanie); px(x,yy-21+nod,2,3,P.beanie); px(x+3,yy-26+nod,3,2,P.beanie);
  if(o.eyesClosed){ px(x+2,yy-19+nod,2,1,P.nose); px(x+6,yy-19+nod,2,1,P.nose); }
  else { px(x+2,yy-19+nod,1,1,P.nose); px(x+6,yy-19+nod,1,1,P.nose); }
  ctx.globalAlpha=.22; const p=(t*0.4)%1; px(x-2-p*7, yy-19-p*4,2,2,P.steam); ctx.globalAlpha=1;
}

function dogSit(x,y,t,seed,type,patch,o){
  o=o||{};
  const yy=y+Math.sin(t*2.1+seed)*0.5+(o.dy||0);
  const tail=Math.sin(t*(o.wag?10:3.4)+seed)*(o.wag?2.4:1.4);
  if(type===2){
    px(x,yy-4,13,4,P.dog); px(x,yy-1,13,1,P.dogSh);
    px(x+10,yy-8,6,5,P.dog); px(x+9,yy-7,2,3,P.dog); px(x+15,yy-7,2,3,P.dog);

function snowman(x,y,g){
  if(g<=0.02) return;
  const S='#F4F9FF', D='#C9D9E8';
  const rB=7*Math.min(1,g/0.45);
  ctx.fillStyle=S; ctx.beginPath(); ctx.arc(x,y-rB,rB,0,7); ctx.fill();
  ctx.fillStyle=D; ctx.fillRect(x-rB,y-2,rB*2,2);
  if(g>0.45){
    const rM=5*Math.min(1,(g-0.45)/0.3);
    ctx.fillStyle=S; ctx.beginPath(); ctx.arc(x,y-rB*2-rM+2,rM,0,7); ctx.fill();
  }
  if(g>0.75){
    const rH=4*Math.min(1,(g-0.75)/0.25);
    const hy=y-rB*2-10-rH+3;
    ctx.fillStyle=S; ctx.beginPath(); ctx.arc(x,hy,rH,0,7); ctx.fill();
    if(g>0.93){
      px(x-2,hy-1,1,1,'#2E2825'); px(x+1,hy-1,1,1,'#2E2825');
      px(x,hy+1,2,1,'#E8722A');
      px(x-5,hy-5,10,2,'#3A2A22');
      px(x-3,hy-8,6,3,'#3A2A22');
      px(x-9,y-rB*2-4,5,1,'#6B4A2F');
      px(x+5,y-rB*2-6,5,1,'#6B4A2F');
    }
  }
}

function dogRoll(x,y,t,seed,type,patch){

  for(let i=0;i<4;i++){

  px(x+12, y-9, 1,1, P.nose); px(x+14, y-9, 1,1, P.nose);

function marshmallow(x,y,t,brown){

function constellation(cxp,cyp,a,t){
  const pts=[[0,0],[9,-4],[18,-2],[24,-9],[30,-3],[26,6],[16,8],[6,7],[2,3]];
  ctx.globalAlpha=a*0.55; ctx.strokeStyle='#CDE8FF'; ctx.lineWidth=1;
  ctx.beginPath();
  pts.forEach((q,i)=>{ const X=cxp+q[0]*1.8, Y=cyp+q[1]*1.8;
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
  ctx.stroke();
  ctx.globalAlpha=1;
  pts.forEach((q,i)=>{
    const tw=0.6+0.4*Math.sin(t*3+i);
    ctx.globalAlpha=a*tw;
    px(cxp+q[0]*1.8-1, cyp+q[1]*1.8-1, 2,2, '#F2FAFF');
  });
  ctx.globalAlpha=1;
}

function mark(x,y,kind,alpha){
  ctx.globalAlpha=clamp(alpha,0,1);
  if(kind==='!'){ px(x,y,1,4,P.mark); px(x,y+5,1,1,P.mark); }
  if(kind==='z'){ px(x,y,4,1,P.mark); px(x+2,y+1,1,1,P.mark); px(x+1,y+2,1,1,P.mark); px(x,y+3,4,1,P.mark); }
  if(kind==='*'){ px(x,y-2,1,5,P.mark); px(x-2,y,5,1,P.mark); }
  if(kind==='h'){ px(x,y,1,1,'#E86A80'); px(x+2,y,1,1,'#E86A80'); px(x-1,y+1,5,1,'#E86A80'); px(x,y+2,3,1,'#E86A80'); px(x+1,y+3,1,1,'#E86A80'); }
  ctx.globalAlpha=1;
}

let flakes=[];
function initFlakes(){
  flakes=[];
  for(let i=0;i<120;i++) flakes.push({x:Math.random()*W,y:Math.random()*H,
    s:0.4+Math.random()*1.0, sw:Math.random()*6.283});
}
initFlakes(); addEventListener('resize',initFlakes);
function snowfall(dt,t){
  for(const f of flakes){
    f.y+=(7+f.s*16)*dt; f.x+=Math.sin(t*0.8+f.sw)*0.25+3*dt;
    if(f.y>H){f.y=-2;f.x=Math.random()*W;}
    if(f.x>W) f.x=0;
    ctx.globalAlpha=0.35+f.s*0.45;
    px(f.x,f.y,f.s>1?2:1,f.s>1?2:1,'#F2F8FF');
  }
  ctx.globalAlpha=1;
}
const puffs=[];
function puff(x,y,n,col){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=8+Math.random()*26;
    puffs.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-14,life:1,col:col||'#F2F8FF'});
  }
}
function updatePuffs(dt){
  for(const p of puffs){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=40*dt; p.life-=dt*1.3; }
  for(let i=puffs.length-1;i>=0;i--) if(puffs[i].life<=0) puffs.splice(i,1);
}
function drawPuffs(){
  for(const p of puffs){ ctx.globalAlpha=Math.max(0,p.life); px(p.x,p.y,2,2,p.col); }
  ctx.globalAlpha=1;
}

function hookAnalyser(){
  if(actx) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const src=actx.createMediaElementSource(audio);
    analyser=actx.createAnalyser();
    analyser.fftSize=64; analyser.smoothingTimeConstant=0.8;
    src.connect(analyser); analyser.connect(actx.destination);
    freq=new Uint8Array(analyser.frequencyBinCount);
  }catch(e){ analyser=null; }
}
function level(){
  if(!analyser) return 0;
  analyser.getByteFrequencyData(freq);
  let s=0; for(let i=0;i<6;i++) s+=freq[i];
  return Math.min(1,(s/6)/210);
}

let cues=[];
const lyCur=document.getElementById('lyCur'), lyNxt=document.getElementById('lyNxt');
let shown=-2;
const TIME=/^\s*\[(\d{1,2}):(\d{1,2}(?:\.\d{1,3})?)\]\s*(.*)$/;
const JUNK=/^-{2,}|LRCgenerator/i;

function parseLRC(raw){
  const out=[];
  raw.split(/\r?\n/).forEach(l=>{
    const m=l.match(TIME); if(!m) return;
    const t=parseInt(m[1],10)*60+parseFloat(m[2]);
    let text=m[3].trim();
    if(JUNK.test(text)) text='';
    out.push({t,text});
  });
  out.sort((a,b)=>a.t-b.t);
  const first=out.findIndex(c=>c.text);
  if(first>=0) out[first].t=Math.max(0,out[first].t+FIRST_LINE_OFFSET);
  out.forEach((c,i)=>{
    const nx=out[i+1];
    // 간격이 15초 이내면 다음 줄까지 그대로 유지 (중간에 사라지지 않음)
    // 그보다 길면 진짜 간주로 보고 8초 뒤 페이드아웃
    c.end = nx ? (nx.t - c.t <= 15 ? nx.t : c.t + 8) : c.t + 8;
  });
  return out;
}

function nextText(i){ for(let k=i+1;k<cues.length;k++) if(cues[k].text) return cues[k].text; return ''; }
function updateLyric(){
  if(!cues.length) return;
  const now=audio.currentTime;
  let idx=-1;
  for(let i=0;i<cues.length;i++){ if(cues[i].t<=now+0.04) idx=i; else break; }
  if(idx>=0 && now>cues[idx].end) idx=-1;
  if(idx===shown) return;
  shown=idx;
  lyCur.classList.remove('on'); lyNxt.classList.remove('on');
  if(idx<0 || !cues[idx].text) return;
  const cur=cues[idx].text, nx=nextText(idx);
  setTimeout(()=>{
    if(shown!==idx) return;
    lyCur.textContent=cur; lyNxt.textContent=nx;
    lyCur.classList.add('on'); if(nx) lyNxt.classList.add('on');
  },300);
}

const gate=document.getElementById('gate'), soundBtn=document.getElementById('soundBtn'), bar=document.getElementById('bar');

      loadPct=document.getElementById('loadPct'), dedi=document.getElementById('dedi'),
      hint=document.getElementById('hint');

let imgTotal=0, imgDone=0, imgForce=false;
let bufPct=0, ready=false, shownPct=0, revealed=false;
function readBuffered(){
  try{
    if(audio.duration && audio.buffered.length){
      bufPct=Math.max(bufPct, audio.buffered.end(audio.buffered.length-1)/audio.duration*100);
    }
  }catch(e){}
}
audio.addEventListener('progress', readBuffered);
audio.addEventListener('loadedmetadata', readBuffered);
audio.addEventListener('canplaythrough', ()=>{ ready=true; });
audio.addEventListener('error', ()=>{ ready=true; });   // 파일이 없어도 페이지는 열리게
setTimeout(()=>{ ready=true; imgForce=true; }, 12000);   // 안전장치
audio.load();

function reveal(){
  if(revealed) return; revealed=true;
  loadEl.classList.add('gone');
  setTimeout(()=>loadEl.classList.add('out'), 700);
  setTimeout(()=>{
    dedi.classList.add('show');
    requestAnimationFrame(()=>dedi.classList.add('on'));
  }, 900);
  setTimeout(()=>hint.classList.add('on'), 3800);
}
(function tickLoad(){
  if(!revealed){
    readBuffered();
    const aFrac = ready ? 1 : Math.min(bufPct/100, 0.94);
    const iFrac = imgTotal ? imgDone/imgTotal : 0;
    const allReady = ready && (imgForce || (imgTotal>0 && imgDone>=imgTotal));
    const target = allReady ? 100 : Math.min(96, (aFrac*0.55 + iFrac*0.45)*100);
    shownPct += (target-shownPct)*0.10;
    if(target===100 && shownPct>99.2) shownPct=100;
    loadBar.style.width=shownPct.toFixed(1)+'%';
    loadPct.textContent='LOADING '+Math.round(shownPct)+'%';
    if(shownPct>=100) reveal();
  }
  requestAnimationFrame(tickLoad);
})();

async function start(){
  if(!revealed) return;
  hookAnalyser();
  if(actx && actx.state==='suspended'){ try{ await actx.resume(); }catch(e){} }
  try{ await audio.play(); }catch(e){}
  gate.classList.add('gone'); soundBtn.textContent='❚❚';
  setTimeout(()=>{ if(gate.parentNode) gate.remove(); },1000);
}
gate.addEventListener('click', start);
async function toggle(){
  if(audio.paused){ try{ await audio.play(); }catch(e){} soundBtn.textContent='❚❚'; }
  else { audio.pause(); soundBtn.textContent='▶'; }
}
soundBtn.onclick=toggle;

/* ===== 사진 갤러리 (마지막 가사 이후) ===== */
/* winter.html 과 같은 폴더에 있는 사진들. 순서를 바꾸려면 이 배열 순서를 바꾸세요. */
const GALLERY_FILES = [
  'IMG_0009.jpeg','IMG_0014.jpeg','IMG_0103.jpeg','IMG_0329.jpeg',
  'IMG_0778.jpeg','IMG_1905.jpeg','IMG_1984.jpeg','IMG_1985.jpeg',
  'IMG_1986.jpeg','IMG_2586.jpeg','IMG_3624.jpeg','IMG_3687.jpeg',
  'IMG_3770.jpeg','IMG_3829.jpeg','IMG_4485.jpeg','IMG_4892.jpeg',
  'IMG_5429.jpeg','IMG_5766.jpeg'
];
const FINAL_PHOTO = 'f46762f8599d89345e9c93eb60e9c394e716afff.jpeg';

const galEl=document.getElementById('gallery');
let gallery=[], galleryStarted=false, galTimer=null;

function buildGallery(){
  galEl.innerHTML='';
  gallery.forEach((url,i)=>{
    const im=document.createElement('img');
    im.src=url; im.alt='';
    im.style.setProperty('--r', ((i%2?1:-1)*(1+(i%3)*0.6)).toFixed(1)+'deg');
    galEl.appendChild(im);
  });
}

/* 사진도 미리 받아두고, 로딩바에 진행률을 함께 반영 */
(function preloadPhotos(){
  const all=GALLERY_FILES.concat([FINAL_PHOTO]);
  imgTotal=all.length;
  const ok=[];
  all.forEach(url=>{
    const im=new Image();
    const done=(good)=>{
      imgDone++;
      if(good && url!==FINAL_PHOTO) ok.push(url);
      if(imgDone>=imgTotal){
        gallery=GALLERY_FILES.filter(f=>ok.indexOf(f)>=0);
        buildGallery();
      }
    };
    im.onload=()=>done(true);
    im.onerror=()=>done(false);
    im.src=url;
  });
})();

function startGallery(){
  if(galleryStarted || !gallery.length) return;
  galleryStarted=true;
  galEl.classList.add('show');
  requestAnimationFrame(()=>galEl.classList.add('on'));
  const remain=Math.max(6,(audio.duration||0)-audio.currentTime-1.5);
  const per=Math.max(2.4, Math.min(6, remain/gallery.length));
  const imgs=galEl.querySelectorAll('img');
  let gi=0;
  const show=()=>{
    imgs.forEach((im,k)=>im.classList.toggle('on', k===gi));
  };
  show();
  galTimer=setInterval(()=>{
    gi++;
    if(gi>=imgs.length){ clearInterval(galTimer); galTimer=null; return; }
    show();
  }, per*1000);
}
function resetGallery(){
  if(galTimer){ clearInterval(galTimer); galTimer=null; }
  galleryStarted=false;
  galEl.classList.remove('on');
  setTimeout(()=>{ galEl.classList.remove('show');
    galEl.querySelectorAll('img').forEach(im=>im.classList.remove('on')); },1400);
}
function lyricsEndTime(){
  let last=0;
  cues.forEach(c=>{ if(c.text) last=Math.max(last,c.end); });
  return last;
}

/* ===== 엔딩 ===== */
const outro=document.getElementById('outro'), replayBtn=document.getElementById('replay');
audio.addEventListener('ended', ()=>{
  document.getElementById('lyrics').style.opacity=0;
  bar.style.opacity=0; bar.style.pointerEvents='none';
  galEl.classList.remove('on');
  setTimeout(()=>galEl.classList.remove('show'),1400);
  outro.classList.add('show');
  requestAnimationFrame(()=>outro.classList.add('on'));
});
replayBtn.addEventListener('click', async ()=>{
  outro.classList.remove('on');
  setTimeout(()=>outro.classList.remove('show'), 1600);
  document.getElementById('lyrics').style.opacity='';
  bar.style.opacity=''; bar.style.pointerEvents='';
  shown=-2;
  resetGallery();
  audio.currentTime=0;
  try{ await audio.play(); }catch(e){}
  soundBtn.textContent='❚❚';
});
addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault();
    if(gate.parentNode) start(); else toggle(); }
});
let idleT;
function wake(){ bar.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>bar.classList.add('idle'),3200); }
['pointermove','pointerdown','keydown'].forEach(ev=>addEventListener(ev,wake));
wake();

/* ===== 루프 ===== */
let t=0,last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  if(!reduce) t+=dt;

  boost += ((audio.paused?0:level())-boost)*Math.min(1,dt*8);

  const cx=Math.round(W*0.5);
  const S={
    fx:cx, fy:GY+Math.round((H-GY)*0.30),
    momoX:cx-Math.round(40*K), songiX:cx+Math.round(46*K),
    yeolmaeX:cx-Math.round(22*K), yujiX:cx+Math.round(24*K),
    tentX:cx-Math.round(74*K), boomed
  };
  const flick=0.5+0.5*Math.sin(t*9.1)*0.6+0.4*Math.sin(t*13.7+1.2)*0.4;

  if(!reduce){
    cycleT+=dt;
    if(!epOn && cycleT>=EPISODE_EVERY){
      cycleT=0; epIdx=(epIdx+1)%EPISODES.length; epT=0; epOn=true; boomed[0]=boomed[1]=boomed[2]=false;
    }
    if(epOn){ epT+=dt; if(epT>=EPISODES[epIdx].dur) epOn=false; }
  }
  const ov={momo:{},songi:{},yeolmae:{},yuji:{},extras:[],marks:[],hidePotato:false,tentLit:0,fireBoost:0};
  if(epOn) EPISODES[epIdx].fn(epT/EPISODES[epIdx].dur, ov, epT, S);

  sky(t);
  ridge(GY-Math.max(14,H*0.10), Math.max(9,H*0.09), 210, 40, P.ridge2, P.ridge2Snow);
  ridge(GY-Math.max(6,H*0.04),  Math.max(7,H*0.06), 130, 90, P.ridge,  P.ridgeSnow);
  forest(); ground();
  tent(S.tentX, S.fy-2, flick, ov.tentLit);
  smoke(S.fx,S.fy,t);
  fire(S.fx,S.fy,t,boost+(ov.fireBoost||0));
  potatoPile(S.fx+Math.round(15*K), S.fy-2, t, ov.hidePotato);

  if(ov.rollAll){
    dogRoll(S.momoX, S.fy+2, t, 1.0, 0, false);
    dogRoll(S.yeolmaeX, S.fy+5, t, 3.7, 0, false);
    dogRoll(S.songiX, S.fy+3, t, 2.3, 1, true);
  } else {
  // 모모 (말티)
  if(ov.momo.run) dogRun(ov.momo.x, S.fy+2+(ov.momo.dy||0), t, 0, false, ov.momo.flip, false);
  else dogSit(ov.momo.x!==undefined?ov.momo.x:S.momoX, S.fy+2, t, 1.0, 0, false, ov.momo);
  // 열매 (말티)
  if(!ov.yeolmae.hidden){
    if(ov.yeolmae.run) dogRun(ov.yeolmae.x, S.fy+3+(ov.yeolmae.dy||0), t, 0, false, ov.yeolmae.flip, ov.yeolmae.carry);
    else dogSit(ov.yeolmae.x!==undefined?ov.yeolmae.x:S.yeolmaeX, S.fy+5, t, 3.7,
                ov.yeolmae.x!==undefined?0:2, false, ov.yeolmae);
  }
  // 송이 (포메)
  if(ov.songi.run) dogRun(ov.songi.x, S.fy+3+(ov.songi.dy||0), t, 1, true, ov.songi.flip, ov.songi.carry);
  else dogSit(ov.songi.x!==undefined?ov.songi.x:S.songiX, S.fy+3, t, 2.3, 1, true, ov.songi);
  }
  // 유지
  sitter(S.yujiX, S.fy-1, t, ov.yuji);

  ov.extras.forEach(fn=>fn());
  ov.marks.forEach(m=>mark(m[0],m[1],m[2],m[3]));

  updateSparks(S.fx,S.fy,dt,t,boost); drawSparks();
  updatePuffs(dt); drawPuffs();
  glow(S.fx,S.fy,flick,boost+(ov.fireBoost||0)*0.6);
  snowfall(reduce?0:dt,t);

  const v=ctx.createRadialGradient(W/2,H*0.55,Math.min(W,H)*0.25,W/2,H*0.55,Math.max(W,H)*0.75);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(6,12,24,.55)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  updateLyric();
  if(!galleryStarted && cues.length && !audio.paused){
    const le=lyricsEndTime();
    if(le>0 && audio.currentTime > le + 0.8) startGallery();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
